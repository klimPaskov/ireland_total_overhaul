ireland_events.438.t: "The Claimants' Credentials"
ireland_events.438.desc: "The board must decide whether the household record can stand without a sponsor."
ireland_events.438.a: "Audit the record independently"
ireland_events.438.a.effects: "Royal Legitimacy rises by 5 and the sponsor record remains outside the household."
ireland_events.438.b: "Admit the record conditionally"
ireland_events.438.b.effects: "Household Reach rises by 5 pending a later account."
ireland_events.438.c: "Reject the claim publicly"
ireland_events.438.c.effects: "Royal Legitimacy falls by 5."
ireland_events.438.d: "Let the sponsor settle the question"
ireland_events.438.d.effects: "A foreign claimant sponsor gains influence and Household Reach rises by 10."
ireland_events.439.t: "Royal Household Accounts"
ireland_events.439.desc: "The household books reveal appointments, obligations, and patronage."
ireland_events.439.a: "Publish and narrow the household"
ireland_events.439.a.effects: "Household Reach falls by 5 and Royal Legitimacy rises by 5."
ireland_events.439.b: "Fund the office transparently"
ireland_events.439.b.effects: "Royal obligation burden rises by 5."
ireland_events.439.c: "Hide the patronage"
ireland_events.439.c.effects: "Household Reach rises by 10 and Royal Legitimacy falls by 5."
ireland_events.439.d: "Empower a court party"
ireland_events.439.d.effects: "National Settlement moves 5 points toward concentrated authority."
ireland_events.440.t: "The Stone Gives Its Answer"
ireland_events.440.desc: "Witnesses agree that the result cannot be reduced to an ordinary record."
ireland_events.440.a: "Accept the witnessed obligation"
ireland_events.440.a.effects: "A named geis becomes due, one obligation is recorded, and Settlement moves 10 points toward sacral authority."
ireland_events.440.b: "Demand wider verification"
ireland_events.440.b.effects: "Verification is delayed and Royal obligation burden rises by 5."
ireland_events.440.c: "Seal the evidence"
ireland_events.440.c.effects: "Settlement moves 5 points toward constitutional restraint."
ireland_events.440.d: "Fabricate a confirming record"
ireland_events.440.d.effects: "Fabricated evidence permanently disqualifies convergence and Royal Legitimacy falls by 15."
ireland_events.441.t: "Crown under Party Direction"
ireland_events.441.desc: "The household can become a ceremony for its sponsor or retain a legal remnant."
ireland_events.441.a: "Accept controlled pageantry"
ireland_events.441.a.effects: "The crown is captured; Household Reach rises by 10."
ireland_events.441.b: "Protect a legal household"
ireland_events.441.b.effects: "A legal household is protected and Royal Legitimacy rises by 5."
ireland_events.441.c: "Call opposition witnesses"
ireland_events.441.c.effects: "Opposition witnesses raise Social Consent by 5."
ireland_events.441.d: "Abolish the project"
ireland_events.441.d.effects: "The captive path is closed without purging its history."
ireland_events.442.t: "Palace Break"
ireland_events.442.desc: "A rescue can restore law, put the crown before a convention, or end the project."
ireland_events.442.a: "Set an independent succession"
ireland_events.442.a.effects: "Sponsor control ends and Household Reach falls by 10."
ireland_events.442.b: "Call a public convention"
ireland_events.442.b.effects: "Social Consent rises by 5."
ireland_events.442.c: "Abolish the crown lawfully"
ireland_events.442.c.effects: "The captive path closes without an automatic replacement."
ireland_events.442.d: "The seizure fails"
ireland_events.442.d.effects: "The break mission fails and Household Reach remains exposed."
ireland_events.443.t: "The First Geis"
ireland_events.443.desc: "The office is offered three affordable duties; refusal offers no benefit."
ireland_events.443.a: "Protect a named site"
ireland_events.443.a.effects: "A site duty becomes due."
ireland_events.443.b: "Answer public petitions"
ireland_events.443.b.effects: "A petition duty becomes due."
ireland_events.443.c: "Complete the circuit"
ireland_events.443.c.effects: "A circuit duty becomes due."
ireland_events.443.d: "Refuse the duty"
ireland_events.443.d.effects: "Royal Legitimacy falls by 10."
ireland_events.444.t: "Provincial Powers Convention"
ireland_events.444.desc: "The provinces can bind a common budget, a confederal council, or separate orders."
ireland_events.444.a: "Draft a federal budget"
ireland_events.444.a.effects: "Federal Cohesion rises by 5."
ireland_events.444.b: "Convene a confederal council"
ireland_events.444.b.effects: "Middle Balance rises by 5."
ireland_events.444.c: "Recognise sovereign orders"
ireland_events.444.c.effects: "Federal Cohesion falls by 10; no states or armies are created."
ireland_events.444.d: "Adjourn the convention"
ireland_events.444.d.effects: "Federal Cohesion falls by 5."
ireland_events.445.t: "The Ulster Seat"
ireland_events.445.desc: "A Northern voice needs lawful access and consent; possession is not a mandate."
ireland_events.445.a: "Record lawful participation"
ireland_events.445.a.effects: "A lawful Northern route sets the Ulster mandate to 55."
ireland_events.445.b: "Reserve an empty chair"
ireland_events.445.b.effects: "A protected chair is recorded without a mandate, claim, core, or ownership."
ireland_events.445.c: "Agree a special status"
ireland_events.445.c.effects: "A lawful special-status route is recorded."
ireland_events.445.d: "Invent a mandate"
ireland_events.445.d.effects: "A fabricated Northern mandate permanently disqualifies convergence."
ireland_events.446.t: "Five Budgets"
ireland_events.446.desc: "The contribution schedule tests whether five voices can finance a common order."
ireland_events.446.a: "Make equal contributions"
ireland_events.446.a.effects: "The common federal budget is funded and Federal Cohesion rises by 10."
ireland_events.446.b: "Weight contributions by capacity"
ireland_events.446.b.effects: "A confederal budget is funded and Middle Balance rises by 5."
ireland_events.446.c: "Allow one conditional exemption"
ireland_events.446.c.effects: "Federal Cohesion falls by 5."
ireland_events.446.d: "Split the fiscal schedule"
ireland_events.446.d.effects: "A fiscal failure is recorded and Federal Cohesion falls by 10."
ireland_events.447.t: "Ratification"
ireland_events.447.desc: "Ratification can bind common law, reserve a looser compact, or create a visible failure."
ireland_events.447.a: "Ratify common law"
ireland_events.447.a.effects: "Provincial rights and common law are recorded."
ireland_events.447.b: "Ratify a looser compact"
ireland_events.447.b.effects: "Provincial rights and confederal law are recorded."
ireland_events.447.c: "Defer for mandates"
ireland_events.447.c.effects: "Federal Cohesion falls by 5."
ireland_events.447.d: "Impose a settlement"
ireland_events.447.d.effects: "Federal Cohesion falls by 15."
ireland_events.448.t: "The Middle Decides"
ireland_events.448.desc: "The centre can arbitrate a meeting place, remain symbolic, or become a disputed claim."
ireland_events.448.a: "Arbitrate at the meeting place"
ireland_events.448.a.effects: "Middle Balance rises by 10."
ireland_events.448.b: "Use federal-district symbolism"
ireland_events.448.b.effects: "Middle Balance rises by 5."
ireland_events.448.c: "Advance a sovereign fifth claim"
ireland_events.448.c.effects: "Middle Balance falls by 5; no state or core is created."
ireland_events.448.d: "Reject the middle"
ireland_events.448.d.effects: "Federal Cohesion falls by 5."

ireland_events.449.t: "Rival Irelands"
ireland_events.449.desc: "A provincial order can be disarmed and reconvened, renegotiated, accepted, or exposed to a patron."
ireland_events.449.a: "Disarm and reconvene"
ireland_events.449.a.effects: "Disarmament opens and Federal Cohesion rises by 10."
ireland_events.449.b: "Negotiate a confederation"
ireland_events.449.b.effects: "A confederal recovery is opened."
ireland_events.449.c: "Accept rivalry"
ireland_events.449.c.effects: "The Rival Irelands conclusion is recorded; convergence closes."
ireland_events.449.d: "Request foreign help"
ireland_events.449.d.effects: "Foreign patron exposure rises by 15."
ireland_events.450.t: "Terms of Contact"
ireland_events.450.desc: "The verified transition already occurred; this decision determines its administration without reopening the reveal."
ireland_events.450.a: "Seek a compact"
ireland_events.450.a.effects: "The compact posture is selected."
ireland_events.450.b: "Contain the evidence"
ireland_events.450.b.effects: "The containment posture is selected."
ireland_events.450.c: "Turn contact into power"
ireland_events.450.c.effects: "The exploitation posture is selected and Compact Trust falls by 10."
ireland_events.450.d: "Keep a human inquiry"
ireland_events.450.d.effects: "Archival Record rises by 5."
ireland_events.451.t: "Courts beneath the Hills"
ireland_events.451.desc: "The claim can receive bounded standing, limited site jurisdiction, submission, or a recorded grievance."
ireland_events.451.a: "Set a rights-bounded standing"
ireland_events.451.a.effects: "A human-rights floor is recorded and Compact Trust rises by 5."
ireland_events.451.b: "Recognise limited site jurisdiction"
ireland_events.451.b.effects: "A site duty is recorded."
ireland_events.451.c: "Submit the government"
ireland_events.451.c.effects: "National Settlement moves 10 points toward mound sovereignty."
ireland_events.451.d: "Refuse the claim"
ireland_events.451.d.effects: "Compact Trust falls by 10."
ireland_events.452.t: "Fian Muster"
ireland_events.452.desc: "A service order can only be certified after material delivery and ordinary training."
ireland_events.452.a: "Equip the service"
ireland_events.452.a.effects: "A material service commitment begins; no unit or equipment is created."
ireland_events.452.b: "Keep a civilian service corps"
ireland_events.452.b.effects: "A civilian service record is kept without a military claim."
ireland_events.452.c: "Postpone the muster"
ireland_events.452.c.effects: "The muster is postponed."
ireland_events.452.d: "Proclaim readiness without a company"
ireland_events.452.d.effects: "Route fraud permanently disqualifies convergence."
ireland_events.453.t: "A Province Makes Its Own Compact"
ireland_events.453.desc: "A local court can ratify terms, join a framework, renegotiate, or be coerced at a real cost."
ireland_events.453.a: "Ratify locally"
ireland_events.453.a.effects: "One regional compact is recorded and Compact Trust rises by 5."
ireland_events.453.b: "Place it under a federal framework"
ireland_events.453.b.effects: "One regional compact and a reconciliation framework are recorded."
ireland_events.453.c: "Renegotiate"
ireland_events.453.c.effects: "The local record remains open for negotiation."
ireland_events.453.d: "Coerce an answer"
ireland_events.453.d.effects: "Compact Trust falls by 10 and the local consent is compromised."
ireland_events.454.t: "The State Seizes a Mound"
ireland_events.454.desc: "Administrative custody may remain reversible; seizure never grants a state, a resource deposit, or ownership beyond ordinary law."
ireland_events.454.a: "Take administrative custody"
ireland_events.454.a.effects: "Site Stewardship falls by 5."
ireland_events.454.b: "Permit reversible extraction"
ireland_events.454.b.effects: "A restitution obligation is due."
ireland_events.454.c: "Seize it completely"
ireland_events.454.c.effects: "Compact Trust falls by 15 and Site Stewardship falls by 10."
ireland_events.454.d: "Open restitution"
ireland_events.454.d.effects: "A restitution route is opened."
ireland_events.455.t: "Breach by Design"
ireland_events.455.desc: "Damage can be contained, repaired, compounded toward dominion, or concealed at greater cost."
ireland_events.455.a: "Contain the damage"
ireland_events.455.a.effects: "Veil Stability rises by 5."
ireland_events.455.b: "Pay restitution"
ireland_events.455.b.effects: "Compact Trust rises by 5."
ireland_events.455.c: "Double down"
ireland_events.455.c.effects: "A deliberate breach is recorded, the dominion posture is selected, and Veil Stability falls by 10."
ireland_events.455.d: "Conceal the breach"
ireland_events.455.d.effects: "Veil Stability falls by 15."
ireland_events.456.t: "Sealed-Site Emergency Review"
ireland_events.456.desc: "Civil release, a narrower perimeter, permanent sealing, and uncontrolled release all leave different duties behind."
ireland_events.456.a: "Release under civil safeguards"
ireland_events.456.a.effects: "A civil release is recorded; Veil Stability falls by 5."
ireland_events.456.b: "Narrow the perimeter"
ireland_events.456.b.effects: "Social Consent rises by 5."
ireland_events.456.c: "Seal the site permanently"
ireland_events.456.c.effects: "The Sealed State conclusion is recorded and balanced convergence closes."
ireland_events.456.d: "Release without safeguards"
ireland_events.456.d.effects: "Veil Stability falls by 15."
ireland_events.457.t: "Crown and Provinces Convention"
ireland_events.457.desc: "The convention must define succession, veto, finance, and command without granting automatic territorial authority."
ireland_events.457.a: "Define succession"
ireland_events.457.a.effects: "A succession rule is recorded."
ireland_events.457.b: "Define provincial veto"
ireland_events.457.b.effects: "A provincial-veto rule is recorded."
ireland_events.457.c: "Define common finance"
ireland_events.457.c.effects: "A common-finance rule is recorded."
ireland_events.457.d: "Define civilian command"
ireland_events.457.d.effects: "A civilian-command rule is recorded."
ireland_events.458.t: "High King of Two Irelands"
ireland_events.458.desc: "The crown can bind itself to human law and geasa, submit, defer, or fail upon a broken duty."
ireland_events.458.a: "Bind crown to human law and geasa"
ireland_events.458.a.effects: "A human-law safeguard is recorded."
ireland_events.458.b: "Submit to mound sovereignty"
ireland_events.458.b.effects: "Settlement moves 5 points toward mound sovereignty."
ireland_events.458.c: "Defer the decision"
ireland_events.458.c.effects: "The conclusion remains deferred."
ireland_events.458.d: "Break the obligation"
ireland_events.458.d.effects: "A geis is broken and one broken obligation is recorded."
ireland_events.459.t: "Five Courts Arbitration"
ireland_events.459.desc: "The courts can maintain a rights floor, preserve autonomy, leave a contradiction unresolved, or compel a harmful answer."
ireland_events.459.a: "Set a common rights floor"
ireland_events.459.a.effects: "A Five Courts rights floor is recorded."
ireland_events.459.b: "Preserve provincial autonomy"
ireland_events.459.b.effects: "A provincial-autonomy rule is recorded."
ireland_events.459.c: "Leave the contradiction open"
ireland_events.459.c.effects: "A contradiction remains for later arbitration."
ireland_events.459.d: "Coerce central conformity"
ireland_events.459.d.effects: "Central coercion permanently disqualifies convergence."
ireland_events.460.t: "Three Orders Review"
ireland_events.460.desc: "The three conclusions must survive a complete public review before a Fivefold settlement can stand."
ireland_events.460.a: "Begin the full review"
ireland_events.460.a.effects: "The 180-day convergence review is unlocked."
