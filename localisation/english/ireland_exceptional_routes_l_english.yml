l_english:
ireland_exceptional_dynamic_pp_cost: "15–25 political power, set by current route pressure"
ireland_exceptional_party_crown_cost: "25 political power and 20 command power"
ireland_exceptional_dynamic_pp_factory_cost: "15–25 political power and a civilian-factory commitment"
ireland_exceptional_dynamic_pp_material_cost: "15–25 political power and the named duty"
ireland_exceptional_status_open: "The exceptional settlement remains open."
ireland_exceptional_status_geis_due: "A named obligation is due."
ireland_exceptional_status_broken_compact: "The compact is broken and requires restitution."
ireland_exceptional_status_rival_irelands: "Provincial rivalry has displaced common authority."
ireland_exceptional_status_concluded: "The Three Orders review has concluded."

ireland_action_audit_the_royal_household: "Audit the Royal Household"
ireland_action_audit_the_royal_household_desc: "Remove a captured appointment through a public examination of the household accounts."
ireland_action_audit_the_royal_household_requirements_tt: "The crown must remain under captured direction. Only two household audits may be completed before the palace break, and sufficient political authority is required for the current Household Reach."
ireland_action_break_the_party_crown: "Break the Party Crown"
ireland_action_break_the_party_crown_desc: "Put sponsor control before a lawful, neutral security review."
ireland_action_break_the_party_crown_requirements_tt: "Requires two clean household audits, social consent of 55, a neutral security command, 25 political power, and 20 command power."
ireland_action_accept_a_royal_geis: "Accept a Royal Geis"
ireland_action_accept_a_royal_geis_desc: "Accept one named duty before seeking a sacral settlement."
ireland_action_accept_a_royal_geis_requirements_tt: "Requires a sacral crown, political authority, and access to a lawful Irish centre."
ireland_mission_complete_the_royal_circuit: "Complete the Royal Circuit"
ireland_mission_complete_the_royal_circuit_desc: "Keep four lawful provincial centres and a protected royal site supplied and secure for 120 days."
ireland_mission_break_the_party_crown: "Break the Party Crown"
ireland_mission_break_the_party_crown_desc: "Hold Household Reach below 60, Social Consent at 55, and retain a neutral security command for 120 days."
ireland_action_negotiate_a_provincial_budget: "Negotiate a Provincial Budget"
ireland_action_negotiate_a_provincial_budget_desc: "Fund a named provincial contribution without converting consent into territorial authority."
ireland_action_negotiate_a_provincial_budget_requirements_tt: "Requires the Five Provinces route, political authority, and a working Dublin civilian factory."
ireland_action_reserve_the_ulster_chair: "Reserve the Ulster Chair"
ireland_action_reserve_the_ulster_chair_desc: "Protect a place for lawful participation without inventing a mandate."
ireland_action_reserve_the_ulster_chair_requirements_tt: "Requires 20 political power, Minority Confidence of 60, and no coercive Northern campaign."
ireland_action_call_a_confederal_council: "Call a Confederal Council"
ireland_action_call_a_confederal_council_desc: "Settle a contribution or veto among four participating voices."
ireland_action_call_a_confederal_council_requirements_tt: "Requires 20 political power and lawful mandates for Leinster, Munster, Connacht, and Mide."
ireland_action_arbitrate_a_provincial_veto: "Arbitrate a Provincial Veto"
ireland_action_arbitrate_a_provincial_veto_desc: "Offer a negotiated ruling instead of imposing a provincial settlement."
ireland_action_arbitrate_a_provincial_veto_requirements_tt: "Requires 20 political power and an unresolved middle-place imbalance."
ireland_mission_fund_the_common_compact: "Fund the Common Compact"
ireland_mission_fund_the_common_compact_desc: "Deliver a common budget, transport contribution, and funded command within 120 days."
ireland_mission_keep_the_fifth_seat_open: "Keep the Fifth Seat Open"
ireland_mission_keep_the_fifth_seat_open_desc: "Preserve Northern contacts and rights for 180 days without coercion or a fabricated mandate."
ireland_mission_prevent_rival_irelands: "Prevent Rival Irelands"
ireland_mission_prevent_rival_irelands_desc: "Restore cohesion, settle budgets, and return guards to common law within 120 days."

ireland_action_record_an_otherworld_obligation: "Record an Otherworld Obligation"
ireland_action_record_an_otherworld_obligation_desc: "Accept a named material or policy commitment before seeking any compact benefit."
ireland_action_record_an_otherworld_obligation_requirements_tt: "Requires compact authority, a named steward, a real local force, cultural capacity, and political authority."
ireland_action_hear_a_regional_court: "Hear a Regional Court"
ireland_action_hear_a_regional_court_desc: "Record locally negotiated terms for one lawful voice and its site."
ireland_action_hear_a_regional_court_requirements_tt: "Requires 20 political power, regional participation of 60, and access to a lawful Irish site."
ireland_action_restitute_a_seized_site: "Restitute a Seized Site"
ireland_action_restitute_a_seized_site_desc: "Withdraw security and surrender extracted benefit in exchange for monitored repair."
ireland_action_restitute_a_seized_site_requirements_tt: "Requires 25 political power and a security command willing to withdraw."
ireland_action_narrow_the_containment_perimeter: "Narrow the Containment Perimeter"
ireland_action_narrow_the_containment_perimeter_desc: "Return a site to civil safeguards without pretending the evidence vanished."
ireland_action_narrow_the_containment_perimeter_requirements_tt: "Requires 20 political power, Social Consent of 55, and an active human inquiry."
ireland_mission_equip_a_fian_company: "Equip a Fian Company"
ireland_mission_equip_a_fian_company_desc: "Certify a service formation only after it is on duty, has the required manpower and equipment, and receives a command commitment."
ireland_mission_equip_a_fian_company_requirements_tt: "Requires a player-built division deployed in Dublin, Cork, or Donegal at §Y90% strength§! and §Y80% organisation§!, plus 500 available manpower, 500 infantry equipment, 20 support equipment, and 20 command power."
ireland_mission_equip_a_fian_company_cost_tt: "Commit 500 manpower, 500 infantry equipment, 20 support equipment, and 20 command power to the Fian service company."
ireland_mission_keep_the_veil_at_five_sites: "Keep the Veil at Five Sites"
ireland_mission_keep_the_veil_at_five_sites_desc: "Fulfil five lawful site duties for 180 days; hostile occupation cannot substitute for stewardship."
ireland_mission_repair_the_broken_compact: "Repair the Broken Compact"
ireland_mission_repair_the_broken_compact_desc: "Complete restitution, public admission, witness protection, and two fulfilled duties within 120 days."
ireland_mission_reconcile_regional_compacts: "Reconcile Regional Compacts"
ireland_mission_reconcile_regional_compacts_desc: "Bring five local records under a common rights floor and settle contradictory duties within 150 days."
ireland_mission_extract_from_a_protected_site: "Extract from a Protected Site"
ireland_mission_extract_from_a_protected_site_desc: "Commit security and industry at one protected site for 90 days; any gain remains timed and creates immediate restitution."
ireland_mission_survive_the_first_convergence_review: "Survive the First Convergence Review"
ireland_mission_survive_the_first_convergence_review_desc: "Maintain every three-order threshold, fulfil duties, settle a veto, and protect a site for 180 days."

ireland_spirit_governing_five_provinces_confederation: "Irish Confederation"
ireland_spirit_governing_five_provinces_confederation_desc: "A negotiated contribution schedule and withdrawal arbitration bind the provincial voices."
ireland_spirit_governing_five_provinces_empty_chair: "The Empty Chair"
ireland_spirit_governing_five_provinces_empty_chair_desc: "A protected place for lawful Northern participation is held open without a fabricated mandate."
ireland_spirit_governing_five_provinces_fifth_province: "The Fifth Province"
ireland_spirit_governing_five_provinces_fifth_province_desc: "A symbolic central forum carries burdens of mediation rather than territorial privilege."
ireland_spirit_governing_high_king_unbounded: "Unbounded Sacred Rule"
ireland_spirit_governing_high_king_unbounded_desc: "An office released from its duties weakens law, consent, and foreign confidence."
ireland_spirit_governing_otherworld_tuatha: "Sovereignty of the Mounds"
ireland_spirit_governing_otherworld_tuatha_desc: "Bounded site jurisdiction persists beneath unconditional human criminal and minority rights."
ireland_spirit_security_otherworld_fianna: "Fianna Guardianship"
ireland_spirit_security_otherworld_fianna_desc: "A materially equipped service order carries permanent supply and service duties."
ireland_spirit_society_otherworld_regional_courts: "Regional Otherworld Courts"
ireland_spirit_society_otherworld_regional_courts_desc: "Local terms remain distinct beneath a shared rights floor."

