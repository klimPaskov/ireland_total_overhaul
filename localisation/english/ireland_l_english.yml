ireland_events.foreign_celtic_cultural_delegation.accept: "Accept the offer under Irish conditions."
ireland_events.foreign_celtic_cultural_delegation.refuse: "Refuse the offer and preserve room to manoeuvre."
ireland_events.foreign_celtic_federal_overclaim.title: "Celtic Federal Overclaim"
ireland_events.foreign_celtic_federal_overclaim.desc: "Celtic Federal Overclaim has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.foreign_celtic_federal_overclaim.accept: "Accept the offer under Irish conditions."
ireland_events.foreign_celtic_federal_overclaim.refuse: "Refuse the offer and preserve room to manoeuvre."
ireland_events.foreign_reaction_digest.title: "Foreign Reaction Digest"
ireland_events.foreign_reaction_digest.desc: "Foreign Reaction Digest has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.foreign_reaction_digest.accept: "Accept the offer under Irish conditions."
ireland_events.foreign_reaction_digest.defer: "Defer the reply until the ledger is complete."
ireland_events.member_contribution_selection.title: "The Member Contribution Schedule"
ireland_events.member_contribution_selection.desc: "The ratified regional order will accept one contribution under its command and sovereignty safeguards. The payload is paid now, and the 180-day schedule will judge whether the organisation can turn that commitment into a functioning shared project. Choose the capacity the league needs most: troops, ships, finance, intelligence, or infrastructure."
ireland_events.member_contribution_selection.troops: "Place troops under the agreed command — 750 manpower, 100 Infantry Equipment, 20 Support Equipment"
ireland_events.member_contribution_selection.ships: "Place ships under the agreed command — 5 Convoys, 250 manpower, 250 fuel"
ireland_events.member_contribution_selection.finance: "Underwrite the shared budget — 30 Political Power"
ireland_events.member_contribution_selection.intelligence: "Open an intelligence liaison — 10 Command Power, 5 Intelligence Readiness"
ireland_events.member_contribution_selection.infrastructure: "Commit the transport works — 5 Trains, 5 Trucks"
# EVENT_FLAVOUR_SECTION
ireland_flavour_events.f01_cabinet_routine.title: "Cabinet Routine"
ireland_flavour_events.f01_cabinet_routine.desc: "Cabinet minutes have become a test of whether de Valera's authority is exercised through the Dáil or through private assurances. County letters are being entered beside the settlement ledger, now [?ireland_settlement_bop_value|0]."
ireland_flavour_events.f01_language_ceremony.title: "Language Ceremony"
ireland_flavour_events.f01_language_ceremony.desc: "A language ceremony has drawn school inspectors, teachers, and parish organisers into the same room. The government can make Irish a lived service or leave the symbolism to the next speech; the settlement ledger reads [?ireland_settlement_bop_value|0]."
ireland_flavour_events.f01_neutrality_speeches.title: "Neutrality Speeches"
ireland_flavour_events.f01_neutrality_speeches.desc: "The Taoiseach's neutrality speeches are being copied into parish halls and foreign dispatches alike. Each careful phrase must reassure the public without surrendering the state's right to enforce its policy; Neutrality Integrity is [?ireland_neutrality_integrity|0]."
ireland_flavour_events.f01_local_patronage.title: "Local Patronage"
ireland_flavour_events.f01_local_patronage.desc: "Fianna Fáil organisers want the county committees rewarded for carrying the government through the last contest. A controlled appointment can bind the local machine to the cabinet, but an unrecorded favour will make the constitutional promise look hollow."
ireland_flavour_events.f01_border_memory.title: "Border Memory"
ireland_flavour_events.f01_border_memory.desc: "Letters from border counties remember raids, customs posts, and families divided by a line that government speeches cannot erase. Dublin must decide whether remembrance becomes lawful contact or another invitation to private reprisals."
ireland_flavour_events.f01_censorship_discomfort.title: "Censorship Discomfort"
ireland_flavour_events.f01_censorship_discomfort.desc: "The censorship office has withheld a column that criticises both the government and its enemies. De Valera can defend restraint as a temporary constitutional instrument, or admit that silence is already costing the cabinet social consent."
ireland_flavour_events.f01_parish_county_administration.title: "Parish County Administration"
ireland_flavour_events.f01_parish_county_administration.desc: "County officers and parish providers are disputing who should sign for relief, schooling, and road work. The cabinet's republican settlement will be judged in these small offices long before it is judged in a constitutional debate."
ireland_flavour_events.f01_emergency_restraint.title: "Emergency Restraint"
ireland_flavour_events.f01_emergency_restraint.desc: "Officials have asked for an emergency power broad enough to silence every possible threat. The republican cabinet can narrow the order, publish its review date, and keep exceptional authority a trust rather than a permanent habit."
ireland_flavour_events.f01_international_perception.title: "International Perception"
ireland_flavour_events.f01_international_perception.desc: "Foreign missions are reading the new constitutional language for signs of either accommodation or concealed belligerence. Ireland's answer must be legible abroad while leaving the Dáil free to change policy by law."
ireland_flavour_events.f01_succession_shadow.title: "Succession Shadow"
ireland_flavour_events.f01_succession_shadow.desc: "A question about the Taoiseach's successor has escaped the private room and reached the parliamentary benches. De Valera's answer must distinguish personal loyalty from a lawful transfer of executive authority."
ireland_flavour_events.f02_factory_licences.title: "Factory Licences"
ireland_flavour_events.f02_factory_licences.desc: "A factory licence in Dublin has become a referendum on Lemass's developmental promise. The applicant offers jobs, but the board wants a timetable, local procurement, and a public account of what Provision can actually sustain: [?ireland_provision_display|0]."
ireland_flavour_events.f02_supply_files.title: "Supply Files"
ireland_flavour_events.f02_supply_files.desc: "Supply files from the ports show that an ambitious industrial order can fail before the first machine arrives. Officials must choose whether to publish the shortfall or protect the programme's political momentum while Provision stands at [?ireland_provision_display|0]."
ireland_flavour_events.f02_engineers.title: "Engineers"
ireland_flavour_events.f02_engineers.desc: "Engineers in Shannon and Dublin have submitted competing plans for electrification, each claiming that its sequence will unlock the next stage of industrial growth. The cabinet must select a practicable order, not merely a persuasive diagram."
ireland_flavour_events.f02_imported_machines.title: "Imported Machines"
ireland_flavour_events.f02_imported_machines.desc: "The first imported machines have reached the quay, but customs, replacement parts, and trained operators are still unresolved. Lemass can make the delivery a disciplined industrial beginning or let a photograph stand in for production."
ireland_flavour_events.f02_urban_labour.title: "Urban Labour"
ireland_flavour_events.f02_urban_labour.desc: "Urban workers want the industrial programme to answer the housing and wage question as well as the export question. A boardroom timetable will not hold if Dublin labour sees development as another promise made over its head."
ireland_flavour_events.f02_rural_displacement.title: "Rural Displacement"
ireland_flavour_events.f02_rural_displacement.desc: "A proposed plant would pull young people from a rural district and redraw its roads, farms, and parish life. The developmental state must decide what compensation and local control make displacement a bargain rather than an erasure."
ireland_flavour_events.f02_power_planning.title: "Power Planning"
ireland_flavour_events.f02_power_planning.desc: "Power planners have placed the national grid on the same table as the rural electrification promise. The sequence chosen today will determine whether the state can show a working network by 1938 or only defend a set of targets."
ireland_flavour_events.f02_board_politics.title: "Board Politics"
ireland_flavour_events.f02_board_politics.desc: "The development board is split between engineers, exporters, and party men. Lemass can give the technical members a protected mandate, or make every approval answerable to the cabinet's electoral calendar."
ireland_flavour_events.f02_procurement_failure.title: "Procurement Failure"
ireland_flavour_events.f02_procurement_failure.desc: "A procurement contract has collapsed after the supplier missed its first delivery and the board concealed the warning. The recovery choice will set the tone for industrial administration: honest delay, or a rushed substitute that consumes tomorrow's capacity."
ireland_flavour_events.f02_postwar_programme.title: "Postwar Programme"
ireland_flavour_events.f02_postwar_programme.desc: "The postwar programme is being drafted before the emergency has ended. Its authors must decide whether the developmental state serves a narrow export ledger or a broader social settlement that can survive when wartime excuses disappear."
ireland_flavour_events.f03_civil_war_memory.title: "Civil War Memory"
ireland_flavour_events.f03_civil_war_memory.desc: "Civil War memories still shape every Fine Gael meeting, even when the agenda is a bill about roads or schools. Deputies must oppose the government without turning the Dáil into another battlefield."
ireland_flavour_events.f03_party_branches.title: "Party Branches"
ireland_flavour_events.f03_party_branches.desc: "Fine Gael branches are asking whether a national opposition can be built from local rooms that still remember the split. The answer will decide whether Costello's constitutional language reaches beyond the parliamentary front bench."
ireland_flavour_events.f03_legal_challenge.title: "Legal Challenge"
ireland_flavour_events.f03_legal_challenge.desc: "A legal challenge to an emergency order has reached the courts. Fine Gael can make the case a public defence of due process, but it must also show that opposition can accept a lawful verdict."
ireland_flavour_events.f03_military_reputation.title: "Military Reputation"
ireland_flavour_events.f03_military_reputation.desc: "Former officers in Fine Gael argue that the army's reputation cannot be separated from civilian control. The party's statement must reassure veterans without inviting the barracks back into cabinet politics."
ireland_flavour_events.f03_coalition_courtesies.title: "Coalition Courtesies"
ireland_flavour_events.f03_coalition_courtesies.desc: "Coalition arithmetic has made old enemies exchange courtesies across the aisle. Costello's supporters must decide how much compromise preserves parliamentary government and how much merely hides an unspoken veto."
ireland_flavour_events.f03_local_government.title: "Local Government"
ireland_flavour_events.f03_local_government.desc: "A dispute over local government appointments has given the opposition a concrete test. Fine Gael can demand an independent county process, or use the same patronage language it condemns in Dublin."
ireland_flavour_events.f03_emergency_criticism.title: "Emergency Criticism"
ireland_flavour_events.f03_emergency_criticism.desc: "Fine Gael deputies have criticised emergency powers while their own constituents ask for protection from intimidation. The party must draw a line that defends civil liberty without making fear a campaign instrument."
ireland_flavour_events.f03_business_support.title: "Business Support"
ireland_flavour_events.f03_business_support.desc: "Business supporters want Fine Gael to oppose Fianna Fáil's economic direction without appearing to defend every old privilege. A credible platform needs both enterprise and a public reason for the rules it would preserve."
ireland_flavour_events.f03_reconciliation.title: "Reconciliation"
ireland_flavour_events.f03_reconciliation.desc: "A local reconciliation meeting has brought veterans from both sides into the same parish hall. The gesture cannot erase the Civil War, but it can establish a code for arguing over the republic without reopening it."
ireland_flavour_events.f03_leadership_transition.title: "Leadership Transition"
ireland_flavour_events.f03_leadership_transition.desc: "Fine Gael is preparing for a change of leadership while Costello's supporters argue over the party's public voice. The transition will reveal whether constitutional opposition is an institution or one man's reputation."
ireland_flavour_events.f04_agricultural_tours.title: "Agricultural Tours"
ireland_flavour_events.f04_agricultural_tours.desc: "Agricultural tours have brought reports of shortages and military requisitioning back to Dublin. The cabinet must decide whether witness is enough, or whether intervention requires a formal mandate."
ireland_flavour_events.f04_moral_argument.title: "Moral Argument"
ireland_flavour_events.f04_moral_argument.desc: "The moral case for intervention is being made by families who have seen the war at close range. Their testimony matters, but neutrality cannot be replaced by sympathy alone."
ireland_flavour_events.f04_party_isolation.title: "Party Isolation"
ireland_flavour_events.f04_party_isolation.desc: "Party isolation is growing as foreign governments ask Ireland to choose a side. The government can endure the silence or build a narrow contact policy that does not become alignment."
ireland_flavour_events.f04_army_doubts.title: "Army Doubts"
ireland_flavour_events.f04_army_doubts.desc: "Army officers are warning that any intervention would outrun the state's readiness. A public debate over capability may preserve sovereignty, but it will also expose how little force the country can spare."
ireland_flavour_events.f04_allied_emissaries.title: "Allied Emissaries"
ireland_flavour_events.f04_allied_emissaries.desc: "Allied emissaries have arrived with assurances that assistance would be limited and temporary. The cabinet must ask what temporary means when a foreign war has no clear end."
ireland_flavour_events.f04_sovereignty_clauses.title: "Sovereignty Clauses"
ireland_flavour_events.f04_sovereignty_clauses.desc: "A proposed agreement contains clauses that sound protective until the small print is read. Ireland can reserve its right to act, or reserve the right to refuse."
ireland_flavour_events.f04_war_families.title: "War Families"
ireland_flavour_events.f04_war_families.desc: "War families want news, relief, and a government that does not reduce their loss to a diplomatic phrase. Their claims are entering the same ledger as the neutrality policy."
ireland_flavour_events.f04_failed_mandate.title: "Failed Mandate"
ireland_flavour_events.f04_failed_mandate.desc: "The first mandate for action has failed to command either parliamentary or public support. Recovery will require a narrower promise, not a louder one."
ireland_flavour_events.f05_union_halls.title: "Union Halls"
ireland_flavour_events.f05_union_halls.desc: "Union halls are demanding a seat in the industrial settlement before another wage order is issued. Employers will accept negotiation only if the state can keep essential work moving."
ireland_flavour_events.f05_wage_controls.title: "Wage Controls"
ireland_flavour_events.f05_wage_controls.desc: "Wage controls have reached the workshops where a national percentage means little beside rent and food. The government must choose a rule workers can see as fair."
ireland_flavour_events.f05_transport_workers.title: "Transport Workers"
ireland_flavour_events.f05_transport_workers.desc: "Transport workers can halt the programme without firing a shot. A bargain with the unions may protect supply, but it will cost the cabinet political room elsewhere."
ireland_flavour_events.f05_women_workers.title: "Women Workers"
ireland_flavour_events.f05_women_workers.desc: "Women workers are carrying production and household provision together while the official labour language still treats them as temporary. The settlement must decide whether that work is recognised."
ireland_flavour_events.f05_rural_labour.title: "Rural Labour"
ireland_flavour_events.f05_rural_labour.desc: "Rural labour is leaving farms for factories and public works. County organisers want wages that retain workers without making small producers carry the whole cost."
ireland_flavour_events.f05_housing.title: "Housing"
ireland_flavour_events.f05_housing.desc: "Housing has become the industrial question that every wage conference tries to postpone. The cabinet can build through the employers or give local labour a direct claim on the plan."
ireland_flavour_events.f05_strike_votes.title: "Strike Votes"
ireland_flavour_events.f05_strike_votes.desc: "Strike votes are being counted in workplaces that cannot easily be replaced. A public settlement needs both a lawful right to stop and a plan for essential services."
ireland_flavour_events.f05_church_pressure.title: "Church Pressure"
ireland_flavour_events.f05_church_pressure.desc: "Church representatives are pressing for social peace while employers ask them to condemn labour demands. Their influence can mediate the dispute only if the state keeps the decision civic."
ireland_flavour_events.f05_coalition_compromise.title: "Coalition Compromise"
ireland_flavour_events.f05_coalition_compromise.desc: "Coalition partners have agreed on a wage formula that satisfies no one. The compromise will hold only if its costs are named alongside its promise of continuity."
ireland_flavour_events.f05_movement_unity.title: "Movement Unity"
ireland_flavour_events.f05_movement_unity.desc: "The labour movement is trying to turn separate disputes into a common platform. Unity can give workers leverage, but it can also make every local failure a national crisis."
ireland_flavour_events.f06_athenry_organisers.title: "Athenry Organisers"
ireland_flavour_events.f06_athenry_organisers.desc: "Athenry organisers have turned a crowded parish meeting into a test of Dillon's rural politics. Their compact names the rates, the road, and the market office that must answer to farmers rather than merely speak for them."
ireland_flavour_events.f06_rates.title: "Rates"
ireland_flavour_events.f06_rates.desc: "County rates are rising just as small holders face a poor season. Dillon's local allies can ask Dublin for relief, but the ledger will show whether the county accepts scrutiny in return for the money."
ireland_flavour_events.f06_roads.title: "Roads"
ireland_flavour_events.f06_roads.desc: "A road crew has reached the end of the surveyed route and found that the last bridge was never budgeted. The rural programme must choose between opening the market sooner and proving that its promises survive contact with a county map."
ireland_flavour_events.f06_small_farms.title: "Small Farms"
ireland_flavour_events.f06_small_farms.desc: "Small farms are asking for credit and a fair hearing against larger buyers. The answer will decide whether Fine Gael's rural language describes independent producers or simply a new set of county intermediaries."
ireland_flavour_events.f06_cattle_crops.title: "Cattle Crops"
ireland_flavour_events.f06_cattle_crops.desc: "Cattle and crop prices have moved in opposite directions, leaving the farm gate exposed to both markets. The rural caucus can protect the immediate sale or use the moment to build a more deliberate cooperative chain."
ireland_flavour_events.f06_merger_tension.title: "Merger Tension"
ireland_flavour_events.f06_merger_tension.desc: "Two rural organisations want to merge, but each fears losing its county voice. Dillon's organisers must decide whether unity is built by a single office or by a pact that leaves both local networks visible."
ireland_flavour_events.f06_donnellan_cogan_wings.title: "Donnellan Cogan Wings"
ireland_flavour_events.f06_donnellan_cogan_wings.desc: "The Donnellan and Cogan wings have arrived with different answers to the rural question: county pressure or national discipline. Their arguments are no longer private, and the next selection will reveal which method owns the movement."
ireland_flavour_events.f06_blowick_succession.title: "Blowick Succession"
ireland_flavour_events.f06_blowick_succession.desc: "Blowick's succession has exposed how much the rural route depends on one organiser's ability to hold its factions together. A successor can inherit the office, but not automatically the trust of the counties."
ireland_flavour_events.f07_schools.title: "Schools"
ireland_flavour_events.f07_schools.desc: "School inspectors are comparing parish provision with the national curriculum. A service network can keep classrooms open, but the state still needs a public standard."
ireland_flavour_events.f07_hospitals.title: "Hospitals"
ireland_flavour_events.f07_hospitals.desc: "Hospitals are relying on religious and county providers to cover gaps in the national system. The dispute is over who pays, who decides, and who answers when a ward fails."
ireland_flavour_events.f07_parish_relief.title: "Parish Relief"
ireland_flavour_events.f07_parish_relief.desc: "Parish relief is reaching families faster than central offices, but its records are uneven. The cabinet can value the network without allowing need to become a test of belief."
ireland_flavour_events.f07_censorship.title: "Censorship"
ireland_flavour_events.f07_censorship.desc: "Censorship has reached the service notices as well as the newspapers. Officials want one rule; providers want room to keep local confidence."
ireland_flavour_events.f07_minority_access.title: "Minority Access"
ireland_flavour_events.f07_minority_access.desc: "Minority families are asking whether access to schools and relief depends on which parish administers it. The state must make the guarantee visible rather than merely implied."
ireland_flavour_events.f07_producer_councils.title: "Producer Councils"
ireland_flavour_events.f07_producer_councils.desc: "Producer councils want to administer services for their own members. That can add expertise, but it can also make citizenship conditional on belonging to an estate."
ireland_flavour_events.f07_clerical_disagreement.title: "Clerical Disagreement"
ireland_flavour_events.f07_clerical_disagreement.desc: "Clerical disagreement has split providers who otherwise share the same hospitals and schools. A public audit may calm the dispute, or turn every local disagreement into a political trial."
ireland_flavour_events.f07_lay_organisations.title: "Lay Organisations"
ireland_flavour_events.f07_lay_organisations.desc: "Lay organisations are taking on more work as officials stretch the budget. Their voluntary authority is valuable, but it must not become an unreviewed office."
ireland_flavour_events.f07_service_dependency.title: "Service Dependency"
ireland_flavour_events.f07_service_dependency.desc: "The state has become dependent on providers it cannot fully direct. The next contract will decide whether dependency is a partnership or an abdication."
ireland_flavour_events.f07_vatican_distance.title: "Vatican Distance"
ireland_flavour_events.f07_vatican_distance.desc: "The Vatican question is being felt through ordinary contracts and appointments. Dublin must keep diplomatic distance from administrative dependence."
ireland_flavour_events.f08_arms_caches.title: "Arms Caches"
ireland_flavour_events.f08_arms_caches.desc: "Arms caches are being found in places where the civil war was never fully forgotten. The IRA route must decide whether disarmament is a public process or a private bargain."
ireland_flavour_events.f08_local_commands.title: "Local Commands"
ireland_flavour_events.f08_local_commands.desc: "Local commands want discretion over contacts and safe houses. A central republican authority can coordinate them, but coordination also creates a record that the security services can read."
ireland_flavour_events.f08_prisoners.title: "Prisoners"
ireland_flavour_events.f08_prisoners.desc: "Prisoners are asking whether amnesty means release, trial, or merely a new name for detention. The government cannot restore public authority by leaving the legal question undefined."
ireland_flavour_events.f08_veterans.title: "Veterans"
ireland_flavour_events.f08_veterans.desc: "Veterans of the struggle are divided between those who want politics and those who want proof that the army still matters. Their status will shape the route's relationship with the state."
ireland_flavour_events.f08_ghq_messages.title: "Ghq Messages"
ireland_flavour_events.f08_ghq_messages.desc: "GHQ messages have crossed the line between historical memory and current instruction. Officials must decide which documents belong in the archive and which require an immediate response."
ireland_flavour_events.f08_s_plan_consequences.title: "S Plan Consequences"
ireland_flavour_events.f08_s_plan_consequences.desc: "The S-Plan's consequences have returned in security files and foreign protests. The IRA route cannot claim republican legitimacy while ignoring the civilians who paid for the campaign."
ireland_flavour_events.f08_german_promises.title: "German Promises"
ireland_flavour_events.f08_german_promises.desc: "German promises to Irish intermediaries have become part of the argument for a more active republican policy. Any contact must be weighed against neutrality and the risk of foreign direction."
ireland_flavour_events.f08_civil_courts.title: "Civil Courts"
ireland_flavour_events.f08_civil_courts.desc: "Civil courts are being asked to handle cases that the movement once treated as political. The choice will decide whether the route can live under law after victory."
ireland_flavour_events.f08_northern_units.title: "Northern Units"
ireland_flavour_events.f08_northern_units.desc: "Northern units are asking for recognition while Dublin has not yet earned control over the territory they claim to represent. Integration must remain a staged political process."
ireland_flavour_events.f08_family_pressure.title: "Family Pressure"
ireland_flavour_events.f08_family_pressure.desc: "Families of prisoners and activists are carrying the cost of the route in letters and visits. Their testimony can force a recovery, but it can also expose the movement's internal discipline."
ireland_flavour_events.f08_security_penetration.title: "Security Penetration"
ireland_flavour_events.f08_security_penetration.desc: "Security penetration has reached a local command. The leadership must choose between a public inquiry that risks the network and a quiet purge that risks the republic."
ireland_flavour_events.f08_amnesty.title: "Amnesty"
ireland_flavour_events.f08_amnesty.desc: "An amnesty draft is on the table with conditions that divide the movement. A lawful recovery must specify who qualifies, what is surrendered, and what happens when the conditions fail."
ireland_flavour_events.f09_union_republican_meetings.title: "Union Republican Meetings"
ireland_flavour_events.f09_union_republican_meetings.desc: "Republican, labour, and smallholder organisers have met in a room where the old labels are less useful than the work they need to share. The first question is whether the alliance can publish a programme."
ireland_flavour_events.f09_anti_sectarian_work.title: "Anti Sectarian Work"
ireland_flavour_events.f09_anti_sectarian_work.desc: "Anti-sectarian organisers are asking the alliance to prove itself in housing, schools, and the workplace. A common programme can make the promise public, but it will also invite every faction to test it."
ireland_flavour_events.f09_smallholders.title: "Smallholders"
ireland_flavour_events.f09_smallholders.desc: "Smallholders want a republican alliance that understands land and credit as much as speeches. Their support will depend on whether the programme offers a remedy with a county address."
ireland_flavour_events.f09_housing_committees.title: "Housing Committees"
ireland_flavour_events.f09_housing_committees.desc: "Housing committees are bringing labour and republican organisers into the same dispute. The alliance can coordinate the demand, or leave the committees to bargain with separate patrons."
ireland_flavour_events.f09_party_hostility.title: "Party Hostility"
ireland_flavour_events.f09_party_hostility.desc: "Party hostility has returned as soon as the alliance looks electorally useful. The organisers must decide whether unity is a public commitment or a temporary truce against a common enemy."
ireland_flavour_events.f09_clergy.title: "Clergy"
ireland_flavour_events.f09_clergy.desc: "Clergy are watching the republican-labour alliance for signs of social discipline or revolutionary intent. The organisers can answer with a civic programme, not a promise of clerical approval."
ireland_flavour_events.f09_armed_wing.title: "Armed Wing"
ireland_flavour_events.f09_armed_wing.desc: "The armed wing wants a place in the alliance's future and argues that political work needs a credible threat behind it. The organisers must set a boundary before the programme becomes a front for command."
ireland_flavour_events.f09_women_organisers.title: "Women Organisers"
ireland_flavour_events.f09_women_organisers.desc: "Women organisers are carrying the practical work of relief, meetings, and household politics. The alliance will reveal its character by whether their work becomes a vote and a voice, not merely a service."
ireland_flavour_events.f09_workplace_councils.title: "Workplace Councils"
ireland_flavour_events.f09_workplace_councils.desc: "Workplace councils want the common programme to reach the factory floor. Their participation can make the alliance consequential, but it will bring production disputes into its national leadership."
ireland_flavour_events.f09_northern_labour.title: "Northern Labour"
ireland_flavour_events.f09_northern_labour.desc: "Northern labour contacts are asking whether the alliance means a republic for workers or a republic for one tradition. A credible answer must protect labour organising across the boundary."
ireland_flavour_events.f09_common_programme.title: "Common Programme"
ireland_flavour_events.f09_common_programme.desc: "The common programme is finally written, and every clause exposes a different alliance. Its publication will make the route legible to voters and vulnerable to every disagreement."
ireland_flavour_events.f09_constituent_dispute.title: "Constituent Dispute"
ireland_flavour_events.f09_constituent_dispute.desc: "A constituent dispute has tested whether the alliance can survive a local defeat. Recovery requires a rule for disagreement before the next candidate is chosen."
ireland_flavour_events.f10_spanish_veterans.title: "Spanish Veterans"
ireland_flavour_events.f10_spanish_veterans.desc: "Veterans returning from Spain are giving O'Duffy's movement a language of discipline and sacrifice. The army council must decide whether experience abroad is a qualification or a warning."
ireland_flavour_events.f10_uniforms.title: "Uniforms"
ireland_flavour_events.f10_uniforms.desc: "Uniforms have made a political movement visible in every town it enters. The state can restrict the spectacle or insist that public order is judged by conduct, not cloth."
ireland_flavour_events.f10_employer_patrons.title: "Employer Patrons"
ireland_flavour_events.f10_employer_patrons.desc: "Employers are offering rooms, money, and protection to the movement while workers ask what its order would mean for them. Patronage has made the route more than a parade."
ireland_flavour_events.f10_church_distance.title: "Church Distance"
ireland_flavour_events.f10_church_distance.desc: "Church distance has become an awkward measure of the movement's respectability. O'Duffy's organisers want blessing by implication; officials want the church to remain outside command."
ireland_flavour_events.f10_army_refusal.title: "Army Refusal"
ireland_flavour_events.f10_army_refusal.desc: "The army has refused a request that would have blurred civilian and military authority. The refusal can close the route or force it to demonstrate that its politics are genuinely civilian."
ireland_flavour_events.f10_marches.title: "Marches"
ireland_flavour_events.f10_marches.desc: "Marches are drawing crowds and counter-demonstrations into the same streets. The government must protect assembly without allowing organised intimidation to become a second police power."
ireland_flavour_events.f10_compulsory_estates.title: "Compulsory Estates"
ireland_flavour_events.f10_compulsory_estates.desc: "The producer-state draft assigns citizens to estates with compulsory obligations. It promises efficiency, but the first question is who can leave an estate once the state names it."
ireland_flavour_events.f10_foreign_emissaries.title: "Foreign Emissaries"
ireland_flavour_events.f10_foreign_emissaries.desc: "Foreign emissaries are offering models and money to a movement already searching for a state. The route can borrow rhetoric, but not let an outside power write its command structure."
ireland_flavour_events.f10_personal_health.title: "Personal Health"
ireland_flavour_events.f10_personal_health.desc: "O'Duffy's health has made succession a political question before the movement has settled its institutions. A personal command cannot be the only durable part of the route."
ireland_flavour_events.f10_succession.title: "Succession"
ireland_flavour_events.f10_succession.desc: "The movement now has to choose between an office and a loyal circle. The army, employers, and civilians are all watching whether producer politics can survive its founder."
ireland_flavour_events.f11_printing_cells.title: "Printing Cells"
ireland_flavour_events.f11_printing_cells.desc: "Printing cells are distributing material that turns racial hatred into an organising tool. The state must name the propaganda and protect its targets without making the printers martyrs by spectacle."
ireland_flavour_events.f11_youth_recruitment.title: "Youth Recruitment"
ireland_flavour_events.f11_youth_recruitment.desc: "Youth recruitment is carrying the movement's language into schools and sports clubs. The government must protect young people without confusing cultural education with political indoctrination."
ireland_flavour_events.f11_irish_language_ideology.title: "Irish Language Ideology"
ireland_flavour_events.f11_irish_language_ideology.desc: "The Irish language is being used by some organisers as proof of racial belonging rather than a public culture open to all citizens. The distinction must be made plainly."
ireland_flavour_events.f11_regional_organisers.title: "Regional Organisers"
ireland_flavour_events.f11_regional_organisers.desc: "Regional organisers are turning pamphlets into a network that can survive a ban. The response must reach the counties where the work is happening, not only the Dublin office."
ireland_flavour_events.f11_surveillance.title: "Surveillance"
ireland_flavour_events.f11_surveillance.desc: "Surveillance files now contain both genuine threats and the names of people who merely attended a meeting. A responsible state must decide what evidence is enough for action."
ireland_flavour_events.f11_antisemitic_propaganda.title: "Antisemitic Propaganda"
ireland_flavour_events.f11_antisemitic_propaganda.desc: "Antisemitic propaganda has been placed before the public as a political programme. Ireland's response must protect Jewish residents and make clear that foreign models do not excuse domestic hatred."
ireland_flavour_events.f11_church_criticism.title: "Church Criticism"
ireland_flavour_events.f11_church_criticism.desc: "The movement is attacking church figures who refuse to endorse its racial language. Opposition must defend the freedom to criticise without allowing intimidation to become a campaign method."
ireland_flavour_events.f11_foreign_model.title: "Foreign Model"
ireland_flavour_events.f11_foreign_model.desc: "Foreign models are being presented as a cure for parliamentary weakness. The Irish response should examine the import honestly while refusing the racism and coercion that make the model dangerous."
ireland_flavour_events.f11_public_launch.title: "Public Launch"
ireland_flavour_events.f11_public_launch.desc: "The public launch has forced Ailtirí to choose whether it is a cultural association, a political party, or an antisemitic movement seeking the state. Its first declaration will be read as a promise."
ireland_flavour_events.f11_bureaucracy.title: "Bureaucracy"
ireland_flavour_events.f11_bureaucracy.desc: "The proposed bureaucracy would register language, loyalty, and access through the same office. That is efficient only until a hostile official receives the keys."
ireland_flavour_events.f11_split_1945.title: "Split 1945"
ireland_flavour_events.f11_split_1945.desc: "The 1945 split has turned old ideological compromises into open accusations. The movement must decide whether to disown the racist wing or preserve unity at the cost of public legitimacy."
ireland_flavour_events.f11_underground_legacy.title: "Underground Legacy"
ireland_flavour_events.f11_underground_legacy.desc: "An underground legacy remains after the public organisation has lost its name. The state can preserve the record and protect targets, or let silence make the network easier to mythologise."
ireland_flavour_events.f12_candidate_genealogy.title: "Candidate Genealogy"
ireland_flavour_events.f12_candidate_genealogy.desc: "The genealogists have produced a plausible royal line, but a plausible line is not a mandate. The convention's first duty is to separate evidence from enthusiasm before the claim acquires a crown of its own."
ireland_flavour_events.f12_provincial_assent.title: "Provincial Assent"
ireland_flavour_events.f12_provincial_assent.desc: "Delegates from the provinces have asked what assent would mean in practice. A High Kingship that cannot name its provincial obligations would be pageantry, not a constitutional settlement."
ireland_flavour_events.f12_civil_list.title: "Civil List"
ireland_flavour_events.f12_civil_list.desc: "The proposed civil list has made the ancient claim painfully modern. Its sponsors must publish the cost, the audit, and the limit that keeps sacral office from becoming a private treasury."
ireland_flavour_events.f12_president.title: "President"
ireland_flavour_events.f12_president.desc: "The President's office has asked whether the proposed crown would serve the Constitution or compete with it. The answer must preserve an elected source of law even if the symbolism becomes older than the state."
ireland_flavour_events.f12_church_ritual.title: "Church Ritual"
ireland_flavour_events.f12_church_ritual.desc: "Church ritualists can supply ceremony, but they cannot supply consent. The convention must decide which rites belong to public culture and which would turn a constitutional office into a confessional command."
ireland_flavour_events.f12_minority_concern.title: "Minority Concern"
ireland_flavour_events.f12_minority_concern.desc: "Minority delegates have asked whether a High King would protect their homes and churches when the old language of sovereignty becomes newly potent. Their concern is not a footnote; it is the test of the proposed office."
ireland_flavour_events.f12_household_appointments.title: "Household Appointments"
ireland_flavour_events.f12_household_appointments.desc: "The first household appointments are already being discussed as though the office exists. The convention can stop a court from becoming a patronage machine by making every role public, limited, and answerable to law."
ireland_flavour_events.f12_geasa.title: "Geasa"
ireland_flavour_events.f12_geasa.desc: "The language of geasa has entered the constitutional debate as a promise of duty rather than a power of compulsion. The delegates must decide whether the old obligation can be translated without pretending that it is ordinary statute."
ireland_flavour_events.f12_public_works.title: "Public Works"
ireland_flavour_events.f12_public_works.desc: "Supporters of the crown want public works to give the claim a visible social purpose. Roads and schools can build consent, but they cannot be counted as constitutional proof or granted as a reward for political loyalty."
ireland_flavour_events.f12_crown_guard.title: "Crown Guard"
ireland_flavour_events.f12_crown_guard.desc: "A proposed crown guard has appeared on a memorandum before any crown has been authorised. The army council wants a clear chain of command, while civil delegates fear that sacred language will hide a second security service."
ireland_flavour_events.f12_succession.title: "Succession"
ireland_flavour_events.f12_succession.desc: "The succession question has forced the convention to choose between hereditary suggestion and elective discipline. A rare office can survive only if the rules for its failure are clearer than the stories that created it."
ireland_flavour_events.f12_captive_crown.title: "Captive Crown"
ireland_flavour_events.f12_captive_crown.desc: "The final draft risks making the crown a captive of whichever faction first controls the household. The delegates must either bind it to public review or admit that the claim has outgrown its constitutional cage."
ireland_flavour_events.f13_provincial_capitals.title: "Provincial Capitals"
ireland_flavour_events.f13_provincial_capitals.desc: "The proposed provincial capitals have become more than pins on a map. Each city wants authority, funds, and recognition, while the federal draft must show that a capital serves a province rather than consumes it."
ireland_flavour_events.f13_boundary_hearings.title: "Boundary Hearings"
ireland_flavour_events.f13_boundary_hearings.desc: "Boundary hearings have brought old county memories into a new constitutional room. The delegates must distinguish a workable administrative line from a historical grievance that no map can settle by itself."
ireland_flavour_events.f13_county_rivalry.title: "County Rivalry"
ireland_flavour_events.f13_county_rivalry.desc: "County rivals are competing for the same provincial office and the same first works contract. A federal compact can make the competition productive, but it cannot pretend that every county receives the same role."
ireland_flavour_events.f13_budget_equalisation.title: "Budget Equalisation"
ireland_flavour_events.f13_budget_equalisation.desc: "The equalisation formula has exposed the difference between formal provincial power and the money needed to use it. The treasury can buy quiet with a central grant or build a rule that poorer regions can rely on."
ireland_flavour_events.f13_ulster_problem.title: "Ulster Problem"
ireland_flavour_events.f13_ulster_problem.desc: "Ulster remains the province that can disprove the whole design. Any federal promise must account for control, representation, and security without treating integration as a free core or a single ceremonial act."
ireland_flavour_events.f13_middle_province.title: "Middle Province"
ireland_flavour_events.f13_middle_province.desc: "The middle province has no single economic story: canals, market towns, and the peat districts want different priorities. Its delegates are asking whether federalism can coordinate them without flattening them."
ireland_flavour_events.f13_cultural_congress.title: "Cultural Congress"
ireland_flavour_events.f13_cultural_congress.desc: "A cultural congress has assembled poets, teachers, and provincial officials around the same draft. The Five Provinces can be a serious civic culture only if the congress produces obligations that offices can carry out."
ireland_flavour_events.f13_guard_loyalty.title: "Guard Loyalty"
ireland_flavour_events.f13_guard_loyalty.desc: "The guard wants to know which authority it serves when provincial and central orders conflict. Loyalty must be settled by a chain of command and civilian review, not by a speech about ancient unity."
ireland_flavour_events.f13_veto.title: "Veto"
ireland_flavour_events.f13_veto.desc: "The proposed provincial veto could protect a minority or freeze the state at every disagreement. The convention must define its subject, duration, and override before the instrument is placed in any province's hands."
ireland_flavour_events.f13_works.title: "Works"
ireland_flavour_events.f13_works.desc: "The first provincial works list is deliberately ordinary: roads, schools, ports, and water. Its politics are not. The order chosen now will tell every region whether the compact is a service or a hierarchy."
ireland_flavour_events.f13_federal_court.title: "Federal Court"
ireland_flavour_events.f13_federal_court.desc: "The federal court has been asked to settle a dispute that the convention avoided. Its first judgment will decide whether provincial authority is real law or merely delegated administration under a new name."
ireland_flavour_events.f13_compact_renewal.title: "Compact Renewal"
ireland_flavour_events.f13_compact_renewal.desc: "Renewal of the compact is approaching before every province has received what it was promised. The guardians can extend the experiment with a measured review or lock a fragile bargain into permanent constitutional language."
ireland_flavour_events.f14_site_custodians.title: "Site Custodians"
ireland_flavour_events.f14_site_custodians.desc: "The custodians have sealed the site and produced the first careful report. It records an anomaly without naming an Otherworld, leaving the cabinet to decide whether stewardship begins with silence or with witnesses."
ireland_flavour_events.f14_seasonal_obligations.title: "Seasonal Obligations"
ireland_flavour_events.f14_seasonal_obligations.desc: "The calendar of local obligations has been disturbed by a season that does not match the records. The investigators can follow the old observances as evidence, but only if they keep the public claim narrower than the rumour."
ireland_flavour_events.f14_local_fear.title: "Local Fear"
ireland_flavour_events.f14_local_fear.desc: "Fear has spread through the nearest town faster than the sealed report. The state must protect residents and the site without turning an unverified story into a police doctrine."
ireland_flavour_events.f14_folklore_records.title: "Folklore Records"
ireland_flavour_events.f14_folklore_records.desc: "Folklore records from several counties describe the same boundary in different names. A Fairymount Schools' Collection entry preserves the witness line 'There is a fort at the back of our garden in Fairymount.' Scholars can compare the accounts as cultural evidence, but the file still needs dates, witnesses, and a chain of custody; testimony is not a supernatural conclusion."
ireland_flavour_events.f14_scholars.title: "Scholars"
ireland_flavour_events.f14_scholars.desc: "The scholars have asked for access to the site, the oral records, and the instruments that recorded the breach. Their work can turn wonder into a serious cultural archive, or expose the evidence to a contest for prestige."
ireland_flavour_events.f14_clergy.title: "Clergy"
ireland_flavour_events.f14_clergy.desc: "Clergy from the surrounding parishes are offering counsel while insisting that no supernatural conclusion be announced from the pulpit. The custodians must decide whether a religious witness strengthens restraint or claims the site for a single tradition."
ireland_flavour_events.f14_soldiers.title: "Soldiers"
ireland_flavour_events.f14_soldiers.desc: "Soldiers have been asked to guard a site they cannot classify. The command wants a perimeter and a reportable chain of incidents; the scholars warn that force may destroy the very evidence the state came to preserve."
ireland_flavour_events.f14_impossible_harvest.title: "Impossible Harvest"
ireland_flavour_events.f14_impossible_harvest.desc: "A harvest has appeared outside the expected season and under conditions the agricultural files cannot explain. The cabinet can protect the growers and record the anomaly, but it cannot call the impossible a policy success."
ireland_flavour_events.f14_impossible_weather.title: "Impossible Weather"
ireland_flavour_events.f14_impossible_weather.desc: "Weather instruments have recorded a local pattern that should not exist. The report is being compared with coastguard logs, farm diaries, and the site ledger before anyone is allowed to use the word Otherworld in public."
ireland_flavour_events.f14_breach.title: "Breach"
ireland_flavour_events.f14_breach.desc: "The sealed boundary has been crossed, and the breach left marks that are neither ordinary damage nor a clean natural event. The investigators must preserve the site before panic or ambition edits the record."
ireland_flavour_events.f14_human_law.title: "Human Law"
ireland_flavour_events.f14_human_law.desc: "Whatever the evidence means, the people near the site remain under human law. The custodians are drafting rules for access, property, and harm that do not depend on proving a realm beyond this one."
ireland_flavour_events.f14_stewardship.title: "Stewardship"
ireland_flavour_events.f14_stewardship.desc: "The stewardship accord is taking shape around records, consent, and a duty not to exploit what cannot yet be understood. It is the first serious culture institution the Otherworld investigation has produced."
ireland_flavour_events.f14_containment.title: "Containment"
ireland_flavour_events.f14_containment.desc: "Containment officers want the report hidden until every contradiction is resolved. That may protect the public, but it may also bury a useful record and make later disclosure look like a deliberate deception."
ireland_flavour_events.f14_dominion.title: "Dominion"
ireland_flavour_events.f14_dominion.desc: "A faction has begun to speak of dominion over the breach, as if discovery were ownership. The final decision must prevent the impossible from becoming an excuse for a new unaccountable office."
ireland_flavour_events.f15_shift_fatigue.title: "Shift Fatigue"
ireland_flavour_events.f15_shift_fatigue.desc: "Shift fatigue is appearing in watch stations that have carried warnings through long nights. Neutrality depends on people who can keep a log when the sea and the radios are both unreliable."
ireland_flavour_events.f15_recognition_cards.title: "Recognition Cards"
ireland_flavour_events.f15_recognition_cards.desc: "Recognition cards are being issued to rescue crews, pilots, and port officers. Each card can speed help, but it can also become a privilege that exposes the neutral service."
ireland_flavour_events.f15_ship_sightings.title: "Ship Sightings"
ireland_flavour_events.f15_ship_sightings.desc: "Ship sightings are bringing foreign vessels and uncertain intentions into the same report. The coastguard must separate observation from accusation."
ireland_flavour_events.f15_rescue.title: "Rescue"
ireland_flavour_events.f15_rescue.desc: "A rescue has brought combatants and civilians into an Irish harbour. Humane rescue is compatible with neutrality only if disembarkation, internment, and release are treated as separate decisions."
ireland_flavour_events.f15_family_news.title: "Family News"
ireland_flavour_events.f15_family_news.desc: "Families are waiting for news from ships that may never send another signal. The government can publish verified notices or preserve quiet until the sea gives up more evidence."
ireland_flavour_events.f15_neutral_markings.title: "Neutral Markings"
ireland_flavour_events.f15_neutral_markings.desc: "Neutral markings on a vessel are being questioned after a near miss. The rule must be visible enough to protect a ship and strict enough not to become a disguise."
ireland_flavour_events.f15_port_labour.title: "Port Labour"
ireland_flavour_events.f15_port_labour.desc: "Port labour is keeping the rescue and shipping systems moving while foreign cargoes compete for berth space. A neutral port still needs a fair order of work."
ireland_flavour_events.f15_missing_ships.title: "Missing Ships"
ireland_flavour_events.f15_missing_ships.desc: "Missing ships have created a gap between weather reports and family memory. The inquiry must not turn absence into evidence of a foreign act without proof."
ireland_flavour_events.f15_mine_reports.title: "Mine Reports"
ireland_flavour_events.f15_mine_reports.desc: "Mine reports are arriving from fishermen who know the coast better than the instruments. Neutrality requires taking local knowledge seriously without declaring a maritime incident on hearsay."
ireland_flavour_events.f15_radio_failure.title: "Radio Failure"
ireland_flavour_events.f15_radio_failure.desc: "A radio failure has left a rescue crew without the normal chain of instruction. The fallback must preserve life and the record rather than improvise a foreign access agreement."
ireland_flavour_events.f15_weather.title: "Weather"
ireland_flavour_events.f15_weather.desc: "Weather has closed a route just as a foreign vessel requests assistance. Ireland can refuse access on safety grounds, but refusal must not become an excuse to abandon rescue."
ireland_flavour_events.f15_smugglers.title: "Smugglers"
ireland_flavour_events.f15_smugglers.desc: "Smugglers are using the confusion of war to move people and goods through coastal inlets. The government must distinguish criminal profit from humanitarian passage."
ireland_flavour_events.f15_foreign_crews.title: "Foreign Crews"
ireland_flavour_events.f15_foreign_crews.desc: "Foreign crews are asking for care, information, and permission to leave. The neutral response must record nationality and conduct without treating every sailor as an intelligence asset."
ireland_flavour_events.f15_post_closure.title: "Post Closure"
ireland_flavour_events.f15_post_closure.desc: "A port closure has ended the immediate incident but not its political cost. The cabinet must show that access, shipping, and rescue remain separate levers of neutrality."
ireland_flavour_events.f15_veterans.title: "Veterans"
ireland_flavour_events.f15_veterans.desc: "Veteran rescue volunteers want recognition for work that official honours overlooked. The state can record their service without giving a political group control of the coast."
ireland_flavour_events.f15_archives.title: "Archives"
ireland_flavour_events.f15_archives.desc: "The archives contain weather logs, rescue reports, and rumours that were never reconciled. A serious neutrality policy needs an archive that can be audited after the crisis."
ireland_flavour_events.f16_tea_substitutes.title: "Tea Substitutes"
ireland_flavour_events.f16_tea_substitutes.desc: "Tea substitutes have become a household measure of the controlled market. Shopkeepers can explain the rule, but they cannot make an inferior cup feel like a fair allocation."
ireland_flavour_events.f16_fuel_substitutes.title: "Fuel Substitutes"
ireland_flavour_events.f16_fuel_substitutes.desc: "Fuel substitutes are reaching homes that cannot afford a second source of heat. The provision office must decide whether need or administrative order comes first."
ireland_flavour_events.f16_clothing_repair.title: "Clothing Repair"
ireland_flavour_events.f16_clothing_repair.desc: "Clothing repair queues are revealing how much the emergency is being carried by families rather than factories. A public service can reduce waste without pretending repair is free."
ireland_flavour_events.f16_queues.title: "Queues"
ireland_flavour_events.f16_queues.desc: "Queues outside food offices are becoming a daily political education. People are comparing treatment as closely as they compare rations."
ireland_flavour_events.f16_rural_barter.title: "Rural Barter"
ireland_flavour_events.f16_rural_barter.desc: "Rural barter is filling gaps the controlled market cannot reach. Officials must tolerate local exchange without allowing it to become a hidden tax on people without goods to trade."
ireland_flavour_events.f16_urban_prices.title: "Urban Prices"
ireland_flavour_events.f16_urban_prices.desc: "Urban prices are rising faster than official notices. The provision ledger needs a response that keeps shops open without rewarding hoarding."
ireland_flavour_events.f16_parish_help.title: "Parish Help"
ireland_flavour_events.f16_parish_help.desc: "Parish help is supplementing ration books in districts where the state arrives late. The arrangement can be useful, but every recipient still deserves the same civic standing."
ireland_flavour_events.f16_black_market.title: "Black Market"
ireland_flavour_events.f16_black_market.desc: "The black market is selling what the official system cannot. Suppression may protect fairness, but a blind crackdown can remove the only supply some districts have."
ireland_flavour_events.f16_inspectors.title: "Inspectors"
ireland_flavour_events.f16_inspectors.desc: "Inspectors are being asked to enforce rules that change faster than their manuals. A fair system needs discretion recorded, not arbitrary power hidden in an office."
ireland_flavour_events.f16_children.title: "Children"
ireland_flavour_events.f16_children.desc: "Children are feeling shortages through school meals and household substitutions. Provision is now a measure of whether neutrality protects ordinary life."
ireland_flavour_events.f16_transport.title: "Transport"
ireland_flavour_events.f16_transport.desc: "Transport limits are turning a national allocation into a county lottery. The cabinet must decide whether to spend scarce fuel on fairness or on the shortest route."
ireland_flavour_events.f16_cooking.title: "Cooking"
ireland_flavour_events.f16_cooking.desc: "Cooking advice is circulating faster than official notices, some of it useful and some dangerous. The state can publish practical guidance without making the household a department."
ireland_flavour_events.f16_seasonal_shortages.title: "Seasonal Shortages"
ireland_flavour_events.f16_seasonal_shortages.desc: "Seasonal shortages are exposing which promises were built for a normal harvest. The provision office needs a recovery plan with a date and a named responsibility."
ireland_flavour_events.f16_factory_canteens.title: "Factory Canteens"
ireland_flavour_events.f16_factory_canteens.desc: "Factory canteens are keeping industrial labour fed while households face the same shortages. Their priority will be judged by whether the factories return something to the communities around them."
ireland_flavour_events.f16_fairness.title: "Fairness"
ireland_flavour_events.f16_fairness.desc: "Fairness is being argued in every shop: equal shares, equal need, or equal contribution. The rule chosen will shape public legitimacy more than the next speech."
ireland_flavour_events.f16_postwar_continuation.title: "Postwar Continuation"
ireland_flavour_events.f16_postwar_continuation.desc: "The emergency market is approaching the point where continuation becomes a political choice. A controlled system can protect recovery, but only if it says what peace is supposed to release."
ireland_flavour_events.f17_dublin_housing.title: "Dublin Housing"
ireland_flavour_events.f17_dublin_housing.desc: "Dublin's housing file has become the first test of the regional portfolio. The capital's demand for workers must be weighed against county capacity, not allowed to consume the national settlement by default."
ireland_flavour_events.f17_cork_ports.title: "Cork Ports"
ireland_flavour_events.f17_cork_ports.desc: "Cork's port administrators want investment that serves Atlantic trade as well as the capital. The portfolio must name the quay, the road, and the county office responsible when delivery slips."
ireland_flavour_events.f17_shannon_power.title: "Shannon Power"
ireland_flavour_events.f17_shannon_power.desc: "Shannon power planning has placed the western grid beside the industrial programme. Clare and Limerick can share the benefit only if the engineers publish which substations and roads come first."
ireland_flavour_events.f17_midlands_turf.title: "Midlands Turf"
ireland_flavour_events.f17_midlands_turf.desc: "The Midlands turf districts are asking whether their fuel will support the whole island while their own roads remain poor. A regional portfolio must return a measured share of work and services to the cuttings."
ireland_flavour_events.f17_western_roads.title: "Western Roads"
ireland_flavour_events.f17_western_roads.desc: "Western roads are the visible edge of the regional promise. Galway and Mayo organisers have marked the routes that open markets and services, but the order will decide whether the west receives a road or another survey."
ireland_flavour_events.f17_gaeltacht_services.title: "Gaeltacht Services"
ireland_flavour_events.f17_gaeltacht_services.desc: "Gaeltacht services cannot be counted by a slogan in Dublin. Schools, clinics, and forms must work in Irish in the districts that use them, or the cultural promise will remain an administrative performance."
ireland_flavour_events.f17_island_supply.title: "Island Supply"
ireland_flavour_events.f17_island_supply.desc: "Island supply officers are calculating how much weather can interrupt a coastal promise. The regional plan must reserve boats, stores, and a named harbour rather than assume that the mainland is always one crossing away."
ireland_flavour_events.f17_donegal_border.title: "Donegal Border"
ireland_flavour_events.f17_donegal_border.desc: "Donegal's border districts need roads and lawful contact without turning every trader into a security suspect. The portfolio has to separate the border service from the intelligence file."
ireland_flavour_events.f17_wexford_tillage.title: "Wexford Tillage"
ireland_flavour_events.f17_wexford_tillage.desc: "Wexford tillage organisers are asking for storage and predictable markets rather than another emergency purchase. The county plan will show whether regional administration understands a harvest as a cycle."
ireland_flavour_events.f17_limerick_rail.title: "Limerick Rail"
ireland_flavour_events.f17_limerick_rail.desc: "Limerick rail is the missing link between western power, the Shannon works, and inland markets. Engineers want a trunk line; counties want stations that actually serve them."
ireland_flavour_events.f17_galway_fisheries.title: "Galway Fisheries"
ireland_flavour_events.f17_galway_fisheries.desc: "Galway fisheries are caught between weather, harbour capacity, and a market that rewards the middleman. A serious regional plan must name the boats and the landing office, not only the catch."
ireland_flavour_events.f17_mayo_weather.title: "Mayo Weather"
ireland_flavour_events.f17_mayo_weather.desc: "Mayo weather has interrupted the western timetable again. The county can request emergency relief, but the regional portfolio will be judged by whether it builds a service that anticipates the next storm."
ireland_flavour_events.f17_cavan_rates.title: "Cavan Rates"
ireland_flavour_events.f17_cavan_rates.desc: "Cavan rates are being collected under a border economy that does not fit a clean county ledger. The regional office must make enforcement predictable without making local trade impossible."
ireland_flavour_events.f17_clare_housing.title: "Clare Housing"
ireland_flavour_events.f17_clare_housing.desc: "Clare housing is being pulled by Shannon's power and industrial work. The portfolio must give the county a voice over the settlement instead of treating homes as a side effect of the grid."
ireland_flavour_events.f17_kerry_coastal_families.title: "Kerry Coastal Families"
ireland_flavour_events.f17_kerry_coastal_families.desc: "Kerry coastal families have asked for rescue, transport, and a school calendar that respects the sea. The regional office can make the coast legible to Dublin without making it dependent on a single emergency boat."
ireland_flavour_events.f17_kildare_market_gardens.title: "Kildare Market Gardens"
ireland_flavour_events.f17_kildare_market_gardens.desc: "Kildare market gardens sit close to the Dublin demand that could either sustain them or absorb them. The portfolio must protect land, transport, and the growers' bargaining position together."
ireland_flavour_events.f17_kilkenny_workshops.title: "Kilkenny Workshops"
ireland_flavour_events.f17_kilkenny_workshops.desc: "Kilkenny workshops want contracts that keep skilled work in the county. A regional portfolio can give them a place in the industrial order, but only if procurement is measured rather than promised."
ireland_flavour_events.f17_laois_peat_cutters.title: "Laois Peat Cutters"
ireland_flavour_events.f17_laois_peat_cutters.desc: "Laois peat cutters are carrying the fuel burden of the emergency. Their county plan must include safety, transport, and a way to leave the cuttings without leaving the workers behind."
ireland_flavour_events.f17_leitrim_roads.title: "Leitrim Roads"
ireland_flavour_events.f17_leitrim_roads.desc: "Leitrim roads are short on traffic but long on consequence: they connect farms, border families, and public offices. The regional portfolio must justify the route by service, not by population alone."
ireland_flavour_events.f17_longford_migration.title: "Longford Migration"
ireland_flavour_events.f17_longford_migration.desc: "Longford migration has emptied some villages while swelling the towns that receive work. The county wants a portfolio that treats movement as a policy question rather than a statistic in a report."
ireland_flavour_events.f17_louth_border_trade.title: "Louth Border Trade"
ireland_flavour_events.f17_louth_border_trade.desc: "Louth border trade is keeping shops open while customs officers try to keep the rules visible. A named contact office can reduce incidents, but it must not become a private channel for political favour."
ireland_flavour_events.f17_meath_cattle_auctions.title: "Meath Cattle Auctions"
ireland_flavour_events.f17_meath_cattle_auctions.desc: "Meath cattle auctions are where the rural portfolio meets its price. Buyers, farmers, and county officials want different protections; the plan must decide which information becomes public before the next sale."
ireland_flavour_events.f17_monaghan_farm_security.title: "Monaghan Farm Security"
ireland_flavour_events.f17_monaghan_farm_security.desc: "Monaghan farmers want security that protects their fields without creating a private militia on the border. The county office must put patrols, reporting, and civil review on the same page."
ireland_flavour_events.f17_roscommon_dairy_cooperatives.title: "Roscommon Dairy Cooperatives"
ireland_flavour_events.f17_roscommon_dairy_cooperatives.desc: "Roscommon dairy cooperatives are offering a regional answer to transport and price pressure. Their portfolio will work only if the state helps them reach the market without taking the cooperative's own ledger away."
ireland_flavour_events.f18_shipyards.title: "Shipyards"
ireland_flavour_events.f18_shipyards.desc: "Belfast shipyards are working under wartime pressure while families on both sides of the border ask who will protect the yards and the workers. Any Northern settlement must account for labour, security, and the limits of Irish readiness."
ireland_flavour_events.f18_aircraft_works.title: "Aircraft Works"
ireland_flavour_events.f18_aircraft_works.desc: "Aircraft production around Belfast has turned a technical partnership into a constitutional question. Access to the works can save lives and build trust, but it can also be read as a military concession."
ireland_flavour_events.f18_linen.title: "Linen"
ireland_flavour_events.f18_linen.desc: "The linen trade is carrying uniforms, civilian work, and old commercial rivalries through the same warehouses. A practical settlement must help the industry without pretending that prosperity has dissolved the Northern question."
ireland_flavour_events.f18_unions.title: "Unions"
ireland_flavour_events.f18_unions.desc: "Trade union organisers want guarantees that a political bargain will not be paid for with insecure work. Dublin can invite labour into the settlement, but only if the talks distinguish collective rights from party control."
ireland_flavour_events.f18_housing.title: "Housing"
ireland_flavour_events.f18_housing.desc: "Housing shortages are exposing the civic cost of industrial mobilisation in the North. Relief that reaches only loyal districts will deepen the division; relief with no security plan will be captured by whoever arrives first."
ireland_flavour_events.f18_policing.title: "Policing"
ireland_flavour_events.f18_policing.desc: "Policing is the first Northern institution to be tested by a cross-border promise. The cabinet must demand civilian accountability while recognising that a rushed transfer of authority could turn a settlement into a fresh emergency."
ireland_flavour_events.f18_local_government.title: "Local Government"
ireland_flavour_events.f18_local_government.desc: "Northern local government is asking what a new relationship would mean for rates, schools, and public works. An agreement written in Dublin will fail unless councils can see their own signatures in it."
ireland_flavour_events.f18_schools.title: "Schools"
ireland_flavour_events.f18_schools.desc: "Schools have become the quietest and sharpest part of the Northern negotiation. A shared curriculum could build contact, but only a credible guarantee for denominational and minority access will make it legitimate."
ireland_flavour_events.f18_churches.title: "Churches"
ireland_flavour_events.f18_churches.desc: "Church leaders are offering relief networks while warning that any constitutional bargain must protect worship and conscience. Their cooperation is useful, but it cannot become a substitute for a public civic settlement."
ireland_flavour_events.f18_nationalist_districts.title: "Nationalist Districts"
ireland_flavour_events.f18_nationalist_districts.desc: "Nationalist districts expect the southern government to remember them without turning them into a pretext for war. Relief, representation, and policing must be separated so that one failure does not discredit all three."
ireland_flavour_events.f18_unionist_institutions.title: "Unionist Institutions"
ireland_flavour_events.f18_unionist_institutions.desc: "Unionist institutions are demanding proof that a Northern arrangement will not be a disguised seizure of office. Dublin can offer guarantees and inspection, but recognition must be earned through an institution that both communities can test."
ireland_flavour_events.f18_us_troops.title: "Us Troops"
ireland_flavour_events.f18_us_troops.desc: "The arrival of American troops has made the Northern question part of a wider Allied calculation. Ireland can provide rescue and humanitarian contact without allowing a foreign presence to decide the constitutional boundary."
ireland_flavour_events.f18_blitz_relief.title: "Blitz Relief"
ireland_flavour_events.f18_blitz_relief.desc: "Blitz relief is crossing the border in carts, trains, and church collections. The government must decide whether to make the aid visible as a civic promise or keep it quiet so that security officers cannot turn compassion into an incident."
ireland_flavour_events.f18_refugees.title: "Refugees"
ireland_flavour_events.f18_refugees.desc: "Refugees from Northern air raids have reached southern reception centres. Registration, housing, and return arrangements will show whether neutrality has a humane edge or stops at the customs post."
ireland_flavour_events.f18_reconstruction.title: "Reconstruction"
ireland_flavour_events.f18_reconstruction.desc: "Reconstruction offers a chance to build practical contact, but its first contracts will be watched for political capture. A Northern programme must name the work, the administrators, and the remedy when one side is excluded."
ireland_flavour_events.f18_border_families.title: "Border Families"
ireland_flavour_events.f18_border_families.desc: "Border families are already running their own diplomacy through funerals, markets, and school visits. A formal contact office can protect those ties, but only if it does not turn relatives into informers."
ireland_flavour_events.f18_plebiscite_fears.title: "Plebiscite Fears"
ireland_flavour_events.f18_plebiscite_fears.desc: "Talk of a plebiscite has revived fears that a vote would measure intimidation more accurately than consent. The cabinet must decide whether to prepare lawful safeguards or postpone the question until public life is less brittle."
ireland_flavour_events.f18_integration.title: "Integration"
ireland_flavour_events.f18_integration.desc: "Integration is being discussed as a sequence of services, offices, and guarantees rather than a single flag-raising. The Northern ledger can advance only when control, occupation, settlement, and civic trust remain separate tests."
ireland_flavour_events.f19_demobilised_soldiers.title: "Demobilised Soldiers"
ireland_flavour_events.f19_demobilised_soldiers.desc: "Demobilised soldiers are returning to counties that have learned to ration work as carefully as food. The postwar cabinet must offer a civilian place for service without turning every veteran into a permanent political constituency."
ireland_flavour_events.f19_merchant_crews.title: "Merchant Crews"
ireland_flavour_events.f19_merchant_crews.desc: "Merchant crews have carried neutrality through dangerous waters and now want their wartime registry recognised in peace. Reconstruction can restore shipping, but it must also settle who carries the risk when the next crisis comes."
ireland_flavour_events.f19_emergency_controls.title: "Emergency Controls"
ireland_flavour_events.f19_emergency_controls.desc: "Emergency controls have outlived the moment that justified them. The coalition can convert them into ordinary law with a review date, or admit that the wartime state has become more comfortable with exception than with consent."
ireland_flavour_events.f19_housing.title: "Housing"
ireland_flavour_events.f19_housing.desc: "Families who endured wartime shortages are measuring peace by the number of houses actually occupied. A reconstruction promise that produces offices before homes will make the coalition's settlement look like another ledger without a roof."
ireland_flavour_events.f19_rural_electrification.title: "Rural Electrification"
ireland_flavour_events.f19_rural_electrification.desc: "Rural electrification is being carried from emergency engineering into the postwar budget. The cabinet must decide whether the grid is a national service with a long horizon or a project that ends when the headlines do."
ireland_flavour_events.f19_peat.title: "Peat"
ireland_flavour_events.f19_peat.desc: "Peat workers ask whether the fuel that kept the state moving will be treated as a temporary expedient or a permanent regional industry. A fair transition must name both the energy need and the communities that cut it."
ireland_flavour_events.f19_coalition_politics.title: "Coalition Politics"
ireland_flavour_events.f19_coalition_politics.desc: "Coalition politics has survived the emergency, but survival is not yet a programme. Each party wants credit for recovery and distance from its costs; a durable government must make the compromises visible."
ireland_flavour_events.f19_republic_status.title: "Republic Status"
ireland_flavour_events.f19_republic_status.desc: "The republic's status is being discussed alongside trade, diplomacy, and the ordinary business of recognition. The conclusion must be a lawful act of the Irish state, not a reward that quietly grants equipment, offices, or influence."
ireland_flavour_events.f19_commonwealth_law.title: "Commonwealth Law"
ireland_flavour_events.f19_commonwealth_law.desc: "The Commonwealth legal question has returned to the desk after years of emergency correspondence. Ministers must decide whether clarity comes from a public statute or from another carefully worded exchange with London."
ireland_flavour_events.f19_un_campaign.title: "Un Campaign"
ireland_flavour_events.f19_un_campaign.desc: "A United Nations campaign will test whether Ireland can seek recognition while preserving neutrality's limits. The diplomats want a seat, but the cabinet must define what it will not trade for one."
ireland_flavour_events.f19_emigrants.title: "Emigrants"
ireland_flavour_events.f19_emigrants.desc: "Emigrants are sending money, letters, and political expectations home. Reconstruction officials can invite the diaspora into a practical partnership without treating departure as a failure that needs to be punished."
ireland_flavour_events.f19_veterans.title: "Veterans"
ireland_flavour_events.f19_veterans.desc: "Veterans' organisations have asked what the state owes people who guarded it and then returned to uncertain work. A civilian conclusion must honour service while closing the emergency offices that kept politics in uniform."

