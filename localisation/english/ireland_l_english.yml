# IDEAS_ACHIEVEMENTS_SECTION
ireland_spirit_governing_de_valera_reconciliation: "Governing Order — Constitutional Reconciliation"
ireland_spirit_governing_de_valera_reconciliation_desc: "Cabinet, Dáil, and Garda review bind amnesty to republican compliance, preserving a lawful republic without treating pardon as surrender. The settlement steadies the state and sustains limited national resolve, but every breach tests whether reconciliation can remain constitutional."
ireland_spirit_governing_de_valera_emergency: "Governing Order — Emergency Administration"
ireland_spirit_governing_de_valera_emergency_desc: "Emergency statutes place swift decisions in a reviewed cabinet administration while invasion danger and shortages endure. Concentrated authority improves political direction and wartime resolve, but its modest civic settlement depends on dated scrutiny and a lawful end to exceptional power."
ireland_spirit_governing_lemass_developmental: "Governing Order — Developmental Government"
ireland_spirit_governing_lemass_developmental_desc: "A development cabinet coordinates contracts, power, transport, and regional delivery through accountable planning offices. It accelerates industrial construction and gives ministers greater room to act, provided bottlenecks and coalition obligations are met rather than hidden."
ireland_spirit_governing_cosgrave_institutional: "Governing Order — Institutional Fine Gael"
ireland_spirit_governing_cosgrave_institutional_desc: "Fine Gael governs through the Dáil, courts, elections, and a settled chain of civil office rather than emergency improvisation. Constitutional continuity reinforces stability and political authority, while fiscal limits and coalition duty constrain what the ministry can promise."
ireland_spirit_governing_mulcahy_civil_defence: "Governing Order — Civil Defence Command"
ireland_spirit_governing_mulcahy_civil_defence_desc: "A professional command structure answers to elected ministers, civilian review, and an explicit public-order settlement. This arrangement strengthens national defence and lends some confidence to government, but army initiative remains legitimate only while civil authority can inspect it."
ireland_spirit_governing_costello_coalition: "Governing Order — Coalition Legalism"
ireland_spirit_governing_costello_coalition_desc: "A written coalition charter divides offices, legal review, and programme duties among partners who must continue to command the Dáil. The bargain stabilises government and releases civilian capacity, but no partner may evade the clauses that keep the ministry together."
ireland_spirit_governing_dillon_intervention: "Governing Order — Intervention Mandate"
ireland_spirit_governing_dillon_intervention_desc: "Intervention rests on a recorded Dáil vote, a protected home reserve, and safeguards for Irish command and sovereignty. The mandate creates political momentum and public willingness to fight, but moral urgency does not excuse an unfunded contribution or surrendered authority."
ireland_spirit_governing_norton_parliamentary: "Governing Order — Parliamentary Labour"
ireland_spirit_governing_norton_parliamentary_desc: "Labour governs through parliamentary procedure, affiliate mandates, and a social charter covering work, housing, wages, food, and services. Delivery strengthens public confidence and lightens the civilian economic burden, while a divided movement can still withdraw the authority on which the ministry relies."
ireland_spirit_governing_clann_agrarian_broker: "Governing Order — Agrarian Brokerage"
ireland_spirit_governing_clann_agrarian_broker_desc: "Clann brokers county interests, smallholder prices, roads, rural power, and coalition clauses through a dated parliamentary mandate. The arrangement steadies government and improves access to domestic resources, but regional support lasts only while practical rural commitments are delivered."
ireland_spirit_governing_constitutional_vocational: "Governing Order — Vocational Constitution"
ireland_spirit_governing_constitutional_vocational_desc: "Elected government remains sovereign while recognised labour, employer, rural, professional, and service councils advise on national policy. Legitimate delegates make administration steadier and more effective; coerced associations or closed review would strip the councils of their constitutional purpose."
ireland_spirit_governing_ira_republican: "Governing Order — Civil Republican Authority"
ireland_spirit_governing_ira_republican_desc: "A civil republican executive, county committees, and constituent law place the armed wing beneath publicly accountable authority. The compact improves defence and restores a measure of civic confidence, but command compliance and disarmament decide whether government remains civilian."
ireland_spirit_governing_congress: "Governing Order — Republican Congress"
ireland_spirit_governing_congress_desc: "Unions, smallholders, local committees, and republican delegates govern through a common programme and recorded mandates. Their congress generates political energy and a stable plural settlement, so long as no directorate or armed faction converts coordination into one-party command."
ireland_spirit_governing_oduffy: "Governing Order — Corporate Personalism"
ireland_spirit_governing_oduffy_desc: "O'Duffy's movement binds veterans, patrons, estate delegates, and state office to a personal chain of command. Martial hierarchy sharply raises mobilisation, but coercive representation, leader dependence, and excluded opponents leave the governing order less stable."
ireland_spirit_governing_clerical_producer: "Governing Order — Clerical Producer State"
ireland_spirit_governing_clerical_producer_desc: "A guardianship administration joins producer councils with Church, lay, professional, and service institutions under a defined public law. Coordinated provision supports stability and civilian capacity, but compulsory membership, clerical veto, or minority exclusion would expose the settlement as capture."
ireland_spirit_governing_ailtiri_total_state: "Governing Order — Ailtirí Total State"
ireland_spirit_governing_ailtiri_total_state_desc: "Ailtirí na hAiséirghe subordinates elections, administration, culture, and succession to a total Gaelic party-state. Central command produces political power and militant resolve, while coercion, antisemitic exclusion, and the destruction of independent institutions make the country markedly less stable."
ireland_spirit_governing_high_king: "Governing Order — Crown in Council"
ireland_spirit_governing_high_king_desc: "A crowned council links succession, provincial assent, public finance, and civil office within one royal settlement. The crown lends legitimacy and political coherence, but its authority remains contested between elective constitutional limits and the obligations accepted with kingship."
ireland_spirit_governing_five_provinces: "Governing Order — Fivefold Settlement"
ireland_spirit_governing_five_provinces_desc: "Provincial mandates meet in a common authority that assigns finance, rights, executive powers, and the duties of a fivefold compact. Shared institutions stabilise government and widen political capacity, while vetoes and unfunded powers can still pull sovereignty back toward the provinces."
ireland_spirit_governing_otherworld: "Governing Order — The Compact of Two Irelands"
ireland_spirit_governing_otherworld_desc: "Verified contact has forced human offices, local guardians, and impossible claimants into a recorded order between two Irelands. The settlement restores political coherence, but every gain remains contingent on human law, controlled access, adequate supply, and obligations that can be named and judged."
ireland_spirit_society_de_valera_reconciliation: "Organised Society — Constitutional Reconciliation"
ireland_spirit_society_de_valera_reconciliation_desc: "Veterans, county organisations, lawful republican associations, and public services are brought into a monitored reconciliation rather than absorbed by decree. Their cooperation strengthens social confidence and government reach, but pardon remains distinct from impunity and compliance from political surrender."
ireland_spirit_society_de_valera_emergency: "Organised Society — Emergency Administration"
ireland_spirit_society_de_valera_emergency_desc: "Rationing offices, local authorities, churches, farmers, and labour bodies carry emergency orders into daily life. The apparatus keeps essential administration functioning, yet compulsory allocation increases the civilian burden and erodes stability when review and consent fall behind."
ireland_spirit_society_lemass_developmental: "Organised Society — Developmental Government"
ireland_spirit_society_lemass_developmental_desc: "Development boards align labour agreements, rural suppliers, transport, power, and regional contracts around measurable delivery. The partnership accelerates industrial construction while reducing pressure on civilian production, but idle plant, debt, or broken contracts quickly expose non-delivery."
ireland_spirit_society_cosgrave_institutional: "Organised Society — Institutional Fine Gael"
ireland_spirit_society_cosgrave_institutional_desc: "Audited public services, rural relief, producer agreements, and minority safeguards place social provision under ordinary law. Predictable institutions improve stability and leave more industry available to the state, though every programme remains answerable to revenue and parliamentary authority."
ireland_spirit_society_mulcahy_civil_defence: "Organised Society — Civil Defence Command"
ireland_spirit_society_mulcahy_civil_defence_desc: "Local defence committees, trained reserves, depots, and civic services connect military preparedness to communities under civilian supervision. The network improves defensive resilience and social confidence, but it must not let emergency command displace elected or local institutions."
ireland_spirit_society_costello_coalition: "Organised Society — Coalition Legalism"
ireland_spirit_society_costello_coalition_desc: "Coalition partners bind housing, services, labour relations, minority protection, and public finance into enforceable charter clauses. The compact stabilises society and reduces civilian economic drag, but a broken clause names both the responsible partner and the service placed at risk."
ireland_spirit_society_dillon_intervention: "Organised Society — Intervention Mandate"
ireland_spirit_society_dillon_intervention_desc: "Unions, ports, farms, manufacturers, and relief bodies support a defined overseas contribution while a protected home reserve remains supplied. This shared effort raises willingness to fight and modestly eases industrial allocation, but intervention loses legitimacy if domestic services or Irish safeguards are sacrificed."
ireland_spirit_society_norton_parliamentary: "Organised Society — Parliamentary Labour"
ireland_spirit_society_norton_parliamentary_desc: "Trade unions, housing boards, wage agreements, food distribution, and local services form a parliamentary social settlement. Strong delivery gives this route exceptional stability and civilian capacity, while affiliate division or failed essential services can unravel the mandate from below."
ireland_spirit_society_clann_agrarian_broker: "Organised Society — Agrarian Brokerage"
ireland_spirit_society_clann_agrarian_broker_desc: "Smallholders, cooperatives, county organisations, processors, and rural utilities bargain through a practical agrarian network. Better roads, prices, and local coordination increase usable resources and social confidence, but the compact cannot survive on parliamentary brokerage without county delivery."
ireland_spirit_society_constitutional_vocational: "Organised Society — Vocational Constitution"
ireland_spirit_society_constitutional_vocational_desc: "Freely organised labour, employer, rural, professional, Church, lay, and minority delegates negotiate sector compacts under Dáil review. Their agreements stabilise society and improve civilian allocation, provided membership remains voluntary and every council can be challenged through law."
ireland_spirit_society_ira_republican: "Organised Society — Civil Republican Authority"
ireland_spirit_society_ira_republican_desc: "County boards, republican relief networks, families, cooperatives, and reconstruction committees answer to a civil executive rather than an armed headquarters. Their organisation supports defence and limited social stability, but requisition and local command must remain subordinate to public law."
ireland_spirit_society_congress: "Organised Society — Republican Congress"
ireland_spirit_society_congress_desc: "Union affiliates, tenant groups, smallholders, cooperatives, and local committees deliver the common programme through plural mandates. Shared provision strengthens stability and frees civilian industry, while vanguard capture or an abandoned rural bargain would break the coalition's social basis."
ireland_spirit_society_oduffy: "Organised Society — Corporate Personalism"
ireland_spirit_society_oduffy_desc: "Compulsory estates, veterans' bodies, patrons, and movement organisations distribute work and representation through a hierarchy loyal to the leader. The structure encourages mobilisation, but coerced membership, excluded groups, and patronage raise the civilian burden while yielding little genuine stability."
ireland_spirit_society_clerical_producer: "Organised Society — Clerical Producer State"
ireland_spirit_society_clerical_producer_desc: "Hospitals, schools, welfare bodies, producer councils, bishops, and lay administrators operate through a guardianship service network. Coordination improves stability and civilian capacity, but labour freedom, minority access, and the boundary between Irish institutions and Vatican diplomacy remain decisive."
ireland_spirit_society_ailtiri_total_state: "Organised Society — Ailtirí Total State"
ireland_spirit_society_ailtiri_total_state_desc: "Party cells, youth organisations, compulsory cultural bodies, and corporate institutions mobilise society for Ailtirí's total-state programme. The campaign heightens militant commitment, but censorship, antisemitic exclusion, coercion, and forced allocation increase civilian burdens and fracture stability."
ireland_spirit_society_high_king: "Organised Society — Crown in Council"
ireland_spirit_society_high_king_desc: "Royal household offices, provincial petitions, chartered services, and local councils connect the crown to organised public life. Their compact strengthens legitimacy and eases civilian administration, but civil-list costs, minority rights, and provincial assent remain matters of accountable law."
ireland_spirit_society_five_provinces: "Organised Society — Fivefold Settlement"
ireland_spirit_society_five_provinces_desc: "Provincial assemblies, county services, equalisation funds, and regional producer bodies give the fivefold settlement a material foundation. Local participation improves stability and resource use, while disputed mandates, boundaries, or an invalid Ulster settlement can withhold cooperation."
ireland_spirit_society_otherworld: "Organised Society — The Compact of Two Irelands"
ireland_spirit_society_otherworld_desc: "Archivists, witnesses, site guardians, regional courts, and joint councils administer the verified compact in ordinary communities. Careful stewardship supports stability and reduces civilian disruption, but trust depends on restitution, protected testimony, lawful access, and obligations fulfilled in full."
ireland_spirit_security_de_valera_reconciliation: "Security and External Position — Constitutional Reconciliation"
ireland_spirit_security_de_valera_reconciliation_desc: "Garda oversight, reviewed amnesty, discreet liaison, and defensive neutrality place republican compliance inside ordinary security law. The arrangement improves home defence and public confidence, but a renewed armed breach ends accommodation without converting Ireland into a foreign client's security state."
ireland_spirit_security_de_valera_emergency: "Security and External Position — Emergency Administration"
ireland_spirit_security_de_valera_emergency_desc: "Coastwatch, air warning, mobilisation, internment, and guarded liaison form an emergency neutral defence under Irish command. It substantially improves defensive readiness and wartime resolve, but cooperation short of co-belligerency still requires legal review and eventual demobilisation."
ireland_spirit_security_lemass_developmental: "Security and External Position — Developmental Government"
ireland_spirit_security_lemass_developmental_desc: "Defence planning is tied to arms factories, transport capacity, technical contracts, and a supply system that can actually equip formations. The programme strengthens defence and military construction together, while import exposure and foreign leverage remain practical limits on expansion."
ireland_spirit_security_cosgrave_institutional: "Security and External Position — Institutional Fine Gael"
ireland_spirit_security_cosgrave_institutional_desc: "The Dáil, courts, cabinet, and professional command define lawful cooperation with Britain and the Allies under explicit sovereignty safeguards. This settlement improves defence and political direction, but neither foreign access nor war can bypass ordinary constitutional authority."
ireland_spirit_security_mulcahy_civil_defence: "Security and External Position — Civil Defence Command"
ireland_spirit_security_mulcahy_civil_defence_desc: "A professional army, trained reserves, coast defence, depots, and local civil protection operate beneath elected command. The system strongly improves land and invasion defence, though every mobilisation must remain supplied, reviewed, and separate from an army veto over government."
ireland_spirit_security_costello_coalition: "Security and External Position — Coalition Legalism"
ireland_spirit_security_costello_coalition_desc: "Coalition partners authorise coastal defence, intelligence liaison, and foreign agreements through named charter clauses and cabinet offices. The compromise protects the approaches and steadies public confidence, but military commitments proceed only with partner consent and legal safeguards."
ireland_spirit_security_dillon_intervention: "Security and External Position — Intervention Mandate"
ireland_spirit_security_dillon_intervention_desc: "A voted contribution places Irish formations, shipping, and access arrangements in the war under retained Irish command. The mandate improves both offensive and defensive effectiveness, but home defence, supply, and independence from sponsor leverage remain binding conditions."
ireland_spirit_security_norton_parliamentary: "Security and External Position — Parliamentary Labour"
ireland_spirit_security_norton_parliamentary_desc: "Parliament, unions, local authorities, and civil-defence services organise a citizen defence compatible with democratic neutrality. It supports national defence and social stability, while any Allied cooperation must preserve civil liberties, essential services, and elected command."
ireland_spirit_security_clann_agrarian_broker: "Security and External Position — Agrarian Brokerage"
ireland_spirit_security_clann_agrarian_broker_desc: "County networks protect roads, depots, farms, resource sites, and local supply while bargaining over the burdens imposed on rural Ireland. Their cooperation improves defence and domestic resource use, but mobilisation without necessity or delivery will lose the smallholders' mandate."
ireland_spirit_security_constitutional_vocational: "Security and External Position — Vocational Constitution"
ireland_spirit_security_constitutional_vocational_desc: "Sector councils advise on production, labour, services, and mobilisation, while the elected government alone commands the armed forces. This division supports defence and stability, but no profession, estate, Church body, or foreign contact receives a security veto."
ireland_spirit_security_ira_republican: "Security and External Position — Civil Republican Authority"
ireland_spirit_security_ira_republican_desc: "Republican formations and arms networks have been assembled into a war state whose civil executive still contests Army Council command. Offensive capacity rises sharply and defence improves, but militarised authority depresses stability until command compliance, public protection, and constituent law are secured."
ireland_spirit_security_congress: "Security and External Position — Republican Congress"
ireland_spirit_security_congress_desc: "Workers' defence bodies, local committees, and republican formations serve a congress mandate rather than a closed military directorate. Their coordinated defence reinforces both readiness and civic stability, provided affiliates retain representation and the armed safeguard remains subordinate."
ireland_spirit_security_oduffy: "Security and External Position — Corporate Personalism"
ireland_spirit_security_oduffy_desc: "Veteran formations, corporate delegates, and army officers are driven through O'Duffy's martial command and its foreign contacts. Aggressive power increases and formations retain some defensive strength, but sponsor exposure and a destabilising personal hierarchy make every campaign and succession dangerous."
ireland_spirit_security_clerical_producer: "Security and External Position — Clerical Producer State"
ireland_spirit_security_clerical_producer_desc: "A regular army and emergency commission draw supply and local cooperation from producer councils and the guardianship service network. Defence and stability improve together, but bishops, estates, and Vatican diplomacy remain outside the national chain of military command."
ireland_spirit_security_ailtiri_total_state: "Security and External Position — Ailtirí Total State"
ireland_spirit_security_ailtiri_total_state_desc: "Party cadres, political police, and a subordinated army enforce Ailtirí's external alignment and internal programme. The party army gains exceptional offensive force and stronger defence, while purges, coercion, exclusion, and sponsor dependence inflict severe instability."
ireland_spirit_security_high_king: "Security and External Position — Crown in Council"
ireland_spirit_security_high_king_desc: "The crown, general staff, provincial assent, and recognised public offices share responsibility for defence and external recognition. Royal authority strengthens home defence and political direction, but neither sacral obligation nor household command may erase supply, succession, or lawful civilian limits."
ireland_spirit_security_five_provinces: "Security and External Position — Fivefold Settlement"
ireland_spirit_security_five_provinces_desc: "Provincial guards, coastal commands, and a funded common staff form the defence compact of the fivefold settlement. The arrangement improves land and invasion defence, but disputed mandates, provincial vetoes, and unfunded hosts can still prevent a coherent response."
ireland_spirit_security_otherworld: "Security and External Position — The Compact of Two Irelands"
ireland_spirit_security_otherworld_desc: "Human forces, site guardians, access law, and compact obligations define what each Ireland may defend and what outsiders may approach. The order strengthens land and coastal security, but human supply, rights, restitution, and recorded consent remain separate duties that impossible authority cannot waive."
ireland_spirit_governing_historical_de_valera: "Governing Order — Constitutional Stewardship"
ireland_spirit_governing_historical_de_valera_desc: "De Valera's ministry treats the Dáil, cabinet, courts, and presidency as a continuous constitutional chain whose authority is strengthened through restraint. Stability and administrative direction improve, but stewardship must still answer elections, ordinary law, and the promised review of emergency powers."
ireland_spirit_society_historical_de_valera: "Organised Society — Protected Rural Settlement"
ireland_spirit_society_historical_de_valera_desc: "County government, farmers, labour bodies, churches, and public services cooperate through a cautious rural settlement rather than a compulsory national corporation. The arrangement steadies society and modestly eases civilian allocation, while shortages and unequal regional delivery remain visible obligations."
ireland_spirit_security_historical_de_valera: "Security and External Position — Armed Neutrality"
ireland_spirit_security_historical_de_valera_desc: "Coastwatch, ports, air warning, intelligence review, and a limited army defend neutrality under Irish civil command. Land and coastal defence improve without granting a foreign power access, alignment, or control over Irish decisions."
ireland_spirit_governing_ira_ghq_command: "Governing Order — General Headquarters Command"
ireland_spirit_governing_ira_ghq_command_desc: "The reassembled GHQ and Army Council issue state direction through an armed command whose civilian institutions remain subordinate. Political and military urgency rise, but secrecy, coercion, and the absence of an independent public mandate impose a severe stability cost."
ireland_spirit_society_ira_ghq_command: "Organised Society — Mobilised Command Society"
ireland_spirit_society_ira_ghq_command_desc: "District commands, requisition officers, relief networks, and veterans organise society around an underground mobilisation record. Resolve grows, but forced allocation and weak civilian review increase both the everyday burden and distrust of the command."
ireland_spirit_security_ira_ghq_command: "Security and External Position — Republican War State"
ireland_spirit_security_ira_ghq_command_desc: "Armed columns, intelligence cells, border commands, and foreign channels are concentrated beneath GHQ for a republican war state. Offensive capacity rises sharply, while public legitimacy and defensive cohesion remain vulnerable to command abuse and sponsor exposure."
ireland_spirit_governing_congress_vanguard: "Governing Order — One-Party Directorate"
ireland_spirit_governing_congress_vanguard_desc: "A disciplined directorate replaces the Congress coalition's plural mandates with a closed transition command. It can act quickly and accumulate political authority, but purges, secrecy, and the exclusion of dissent impose an explicit stability cost."
ireland_spirit_society_congress_vanguard: "Organised Society — Captured Common Programme"
ireland_spirit_society_congress_vanguard_desc: "Union, tenant, smallholder, and cooperative bodies are compelled to deliver a programme written by the vanguard rather than negotiated among affiliates. Mobilisation improves, but coerced allocation and narrowed representation raise civilian burdens and weaken social consent."
ireland_spirit_security_congress_vanguard: "Security and External Position — Vanguard Defence Directorate"
ireland_spirit_security_congress_vanguard_desc: "Party cells and workers' formations share a central security command designed to defend the transition from internal and foreign enemies. The directorate gains combat capacity, but political policing and factional command reduce the stability that a citizen defence settlement requires."
ireland_spirit_governing_oduffy_corporate: "Governing Order — Corporate Estate Order"
ireland_spirit_governing_oduffy_corporate_desc: "A statutory estate constitution distributes authority among corporate councils, ministers, and military offices instead of relying solely on O'Duffy's person. The institutional order improves direction and limited stability, though compulsory representation and excluded opponents remain coercive foundations."
ireland_spirit_society_oduffy_corporate: "Organised Society — Corporate Estates"
ireland_spirit_society_oduffy_corporate_desc: "Employer, labour, rural, professional, and veterans' estates administer production and services through compulsory bargaining structures. Coordination releases some civilian capacity, but workers and minorities cannot treat managed representation as freely organised consent."
ireland_spirit_security_oduffy_corporate: "Security and External Position — Corporate Military Order"
ireland_spirit_security_oduffy_corporate_desc: "A regular staff, estate levies, veterans' formations, and controlled foreign contacts form an institutional military order. Attack and defence improve together, while supply, succession, and national command remain tests the estate system cannot answer by ceremony."
ireland_spirit_governing_producer_council: "Governing Order — Producer Council State"
ireland_spirit_governing_producer_council_desc: "Producer councils exercise executive authority through a written settlement that binds finance, services, representation, and review. The councils strengthen administration and stability, but their legitimacy depends on real delegates and a route back from emergency direction."
ireland_spirit_society_producer_council: "Organised Society — Audited Producer Compact"
ireland_spirit_society_producer_council_desc: "Farm, labour, industrial, professional, and service councils coordinate resources through audited production obligations. The compact expands usable domestic capacity and reduces civilian drag, provided compulsory membership and clerical veto do not capture its benefits."
ireland_spirit_security_producer_council: "Security and External Position — Producer Defence Compact"
ireland_spirit_security_producer_council_desc: "Civil councils fund supply, transport, reserve service, and local protection while a lawful command retains military authority. Defence and social confidence improve modestly, but no producer body acquires an independent armed wing or foreign veto."
ireland_spirit_governing_high_king_sacral: "Governing Order — Sacral High Kingship"
ireland_spirit_governing_high_king_sacral_desc: "The High King accepts verified obligations that bind sovereignty to place, custom, provincial assent, and impossible sanction. The crown gains resolve and public legitimacy, but ritual duty consumes political freedom and cannot excuse a broken civil law."
ireland_spirit_society_high_king_sacral: "Organised Society — Society Under Geis"
ireland_spirit_society_high_king_sacral_desc: "Household officers, local guardians, provincial petitioners, and public services organise around obligations attached to the sacral crown. The settlement steadies communities, while costly observance and disputed duties increase the civilian burden whenever consent is assumed rather than recorded."
ireland_spirit_security_high_king_sacral: "Security and External Position — Crown and Obligation"
ireland_spirit_security_high_king_sacral_desc: "The general staff, provincial hosts, site guardians, and royal household defend both the state and the crown's verified obligations. Defence and resolve improve, but no geis supplies formations, replaces civil command, or grants recognition from abroad."
ireland_spirit_governing_five_provinces_pentarchy: "Governing Order — Pentarchic Sovereignty"
ireland_spirit_governing_five_provinces_pentarchy_desc: "Five sovereign provincial chairs govern through a pentarchic compact whose common authority depends on unanimous mandates and funded obligations. The order retains limited stability and direction, but every veto exposes the risk of rival sovereignties."
ireland_spirit_society_five_provinces_pentarchy: "Organised Society — Five Provincial Orders"
ireland_spirit_society_five_provinces_pentarchy_desc: "Provincial services, producers, cultural bodies, and equalisation offices operate through five distinct constitutional orders. Local resource use and participation improve, while unequal rights or an invalid Ulster mandate can fracture the entire settlement."
ireland_spirit_security_five_provinces_pentarchy: "Security and External Position — Pentarchic Hosts"
ireland_spirit_security_five_provinces_pentarchy_desc: "Provincial guards and coastal commands answer to a common defence compact without surrendering their separate mandates. The arrangement strengthens defence, but uncommanded hosts, vetoed supply, and competing external claims remain explicit failure states."
ireland_spirit_governing_otherworld_dominion: "Governing Order — Otherworld Dominion"
ireland_spirit_governing_otherworld_dominion_desc: "Impossible authority has displaced the compact's human stewardship and treats civil institutions as instruments of dominion. Command becomes formidable, but political legitimacy and stability collapse because no verified power can erase human rights, supply, or consent."
ireland_spirit_society_otherworld_dominion: "Organised Society — Subjects of the Dominion"
ireland_spirit_society_otherworld_dominion_desc: "Communities, guardians, archives, and services are compelled to meet obligations defined by an inhuman sovereign order. The resulting allocation burden and fear damage stability, while restitution and public law remain the only credible route back to stewardship."
ireland_spirit_security_otherworld_dominion: "Security and External Position — Dominion Host"
ireland_spirit_security_otherworld_dominion_desc: "A powerful host and controlled sites give the dominion exceptional military force against its chosen enemies. Its strength is offset by unstable command, human supply limits, and the danger that every foreign incident becomes a compact breach."
ireland_spirit_governing_otherworld_containment: "Governing Order — Lawful Containment"
ireland_spirit_governing_otherworld_containment_desc: "Civil authorities maintain warrants, site boundaries, evidence review, and emergency limits around a verified impossible danger. Containment preserves a measure of stability, but the constant legal and administrative burden reduces ordinary political capacity."
ireland_spirit_society_otherworld_containment: "Organised Society — Guarded Communities"
ireland_spirit_society_otherworld_containment_desc: "Local guardians, public services, witnesses, and regional authorities maintain protected routes and controlled sites under civil law. Confidence survives, though disrupted access, staffing, and restitution impose a continuing civilian burden."
ireland_spirit_security_otherworld_containment: "Security and External Position — Containment Protocol"
ireland_spirit_security_otherworld_containment_desc: "Layered site security, coastal watch, intelligence screening, and reserve formations enforce a lawful containment protocol. Defence is exceptionally strong, but every deployment remains constrained by evidence, supply, rights, and civilian review."
ireland_spirit_governing_convergence_order: "Governing Order — Fivefold High Kingdom of Two Irelands"
ireland_spirit_governing_convergence_order_desc: "A successful final review has merged crown, provinces, human stewardship, and the compact into one bounded constitutional order. Its authority and stability are substantial because every component conclusion remains named, funded, reviewable, and separately reversible."
ireland_spirit_society_convergence_order: "Organised Society — The Converged Settlement"
ireland_spirit_society_convergence_order_desc: "Provincial institutions, chartered services, guardians, producers, and joint councils share a reviewed social settlement across two Irelands. Cooperation strengthens stability, resources, and civilian capacity without dissolving regional rights or converting impossible aid into free industry."
ireland_spirit_security_convergence_order: "Security and External Position — Defence of Two Irelands"
ireland_spirit_security_convergence_order_desc: "The common staff, provincial commands, human forces, guardians, and access law form a reviewed defence compact after convergence. Land and coastal security improve greatly, while supply, command, foreign obligations, and the rights of both Irelands remain binding."
ireland_spirit_governing_clerical_veto: "Governing Order — Clerical Veto"
ireland_spirit_governing_clerical_veto_desc: "Episcopal objections and confessional tests can halt measures after cabinet and Dáil have accepted them. Authority remains formally civil, but repeated vetoes weaken public confidence and consume the government's room to govern."
ireland_spirit_governing_captive_crown: "Governing Order — The Captive Crown"
ireland_spirit_governing_captive_crown_desc: "The chosen crown has become the instrument of a court faction that treats review as disloyalty. Commands still carry force, but the settlement loses legitimacy whenever obedience is demanded without lawful consent."
ireland_spirit_governing_rival_provincial_sovereignties: "Governing Order — Rival Provincial Sovereignties"
ireland_spirit_governing_rival_provincial_sovereignties_desc: "Provincial authorities claim final competence over the same offices, levies, and guarantees. The pentarchy survives on paper while disputes over command and jurisdiction weaken both the common government and national defence."
ireland_spirit_society_emergency_shortage_order: "Organised Society — Emergency Shortage Order"
ireland_spirit_society_emergency_shortage_order_desc: "Ration boards and local distributors are allocating scarcity under emergency rules after ordinary provision failed. The system averts complete breakdown, but households carry a heavier burden and confidence falls with every missing delivery."
ireland_spirit_society_captured_estates: "Organised Society — Captured Estates"
ireland_spirit_society_captured_estates_desc: "Producer and vocational bodies have been seized by entrenched patrons who distribute access through loyalty. Their control raises civilian costs and turns public representation into a source of instability."
ireland_spirit_society_sectarian_administration: "Organised Society — Sectarian Administration"
ireland_spirit_society_sectarian_administration_desc: "Police, services, and local appointments are being judged by confession rather than public duty. Communities withdraw cooperation as unequal administration drains both stability and political capacity."
ireland_spirit_society_forced_mobilisation: "Organised Society — Forced Mobilisation"
ireland_spirit_society_forced_mobilisation_desc: "Labour, land, and food are being requisitioned after voluntary bargains failed. The state gains a brittle appearance of resolve while civilian demand and resentment undermine the society expected to sustain it."
ireland_spirit_security_neutrality_breakdown: "Security and External Position — Neutrality Breakdown"
ireland_spirit_security_neutrality_breakdown_desc: "Repeated failures over airspace, shipping, rescue, internment, intelligence, access, and public law have emptied neutrality of credibility. Ireland's defences weaken as foreign penetration grows behind claims the state can no longer enforce."
ireland_spirit_security_client_state: "Security and External Position — Client State"
ireland_spirit_security_client_state_desc: "Foreign access and sponsor dependence now determine choices that should belong to Irish institutions. External backing has become a veto, weakening lawful command and opening the state to deeper subversion."
ireland_spirit_security_occupied_order: "Security and External Position — Occupied Order"
ireland_spirit_security_occupied_order_desc: "Military administration and emergency control have displaced ordinary authority in occupied territory. Coercion may hold roads and offices, but it damages stability and leaves the wider defensive order dangerously brittle."
ireland_spirit_security_fragmented_armed_wings: "Security and External Position — Fragmented Armed Wings"
ireland_spirit_security_fragmented_armed_wings_desc: "Army, movement, guard, and militia commands no longer answer to one lawful staff. Their competing chains of command reduce both offensive coordination and the ability to defend the country."
ireland_spirit_security_uncommanded_provincial_guards: "Security and External Position — Uncommanded Provincial Guards"
ireland_spirit_security_uncommanded_provincial_guards_desc: "Provincial formations retain men and local strongpoints but lack an accepted common command. The resulting gaps weaken land defence and leave the coast exposed where jurisdictions meet."
ireland_spirit_security_compact_breach: "Security and External Position — Compact Breach"
ireland_spirit_security_compact_breach_desc: "Obligations at the five sites have been broken and neither human nor Otherworld command accepts the other's account. Defensive cohesion and public confidence deteriorate while hostile influence exploits the disputed compact."
ireland_spirit_governing_corrupted: "Corrupted Governing Order"
ireland_spirit_governing_corrupted_desc: "Emergency offices and factional commanders still mobilise fear, but ordinary review no longer directs their authority. Wartime resolve persists while stability and political capacity decay; recovery requires a public legal settlement rather than another exceptional decree."
ireland_spirit_governing_collapse: "Collapsed Governing Order"
ireland_spirit_governing_collapse_desc: "Cabinet, Dáil, courts, and office succession no longer recognise a workable constitutional centre. The resulting crisis damages both stability and national defence until a lawful authority can be constituted and obeyed."
ireland_spirit_society_patronage: "Patronage Society"
ireland_spirit_society_patronage_desc: "Captured parties, patrons, estates, or clerical networks distribute social provision in return for obedience rather than public entitlement. Favouritism raises the civilian economic burden and weakens stability because access depends on connection instead of accountable service."
ireland_spirit_society_broken_services: "Broken Services"
ireland_spirit_society_broken_services_desc: "Housing, health, food, transport, and local administration have failed together after the country's social bargains ceased to deliver. Civilian demands rise as stability falls; recovery must rebuild staff, supply, trust, and local capacity rather than announce another compact."
ireland_spirit_security_compromised: "Compromised Security"
ireland_spirit_security_compromised_desc: "Foreign dependency, factional penetration, or uncontrolled command has broken the link between security policy and lawful Irish authority. Defensive effectiveness falls while hostile subversion finds easier access through the institutions meant to resist it."
ireland_spirit_security_disarmed: "Disarmed Position"
ireland_spirit_security_disarmed_desc: "Formations, coastal posts, supply, and command safeguards have fallen below what an independent state can sustain. Ireland is markedly weaker against both land attack and invasion until real forces and a lawful defensive order are restored."
ireland_spirit_governing_order: "Governing Order"
ireland_spirit_governing_order_desc: "Cabinet, Dáil, courts, and reviewed emergency offices form one governing order. Shared confidence steadies the state and gives ministers more room to act, but exceptional authority remains legitimate only while it can return to ordinary law."
ireland_spirit_organised_society: "Organised Society"
ireland_spirit_organised_society_desc: "Labour, farmers, churches, educators, and local organisations turn social consent into services and coordinated civilian supply. Their bargains steady the country and reduce the industrial share lost to household demand, but government can ask no more than those institutions can deliver."
ireland_spirit_security_external_position: "Security and External Position"
ireland_spirit_security_external_position_desc: "The army, coastwatch, ports, intelligence services, and neutrality authorities treat readiness, foreign leverage, and Northern security as one defensive problem. Their coordination strengthens land and coastal defence, but Ireland must protect its choices without surrendering command to another power."
ireland_constitution_with_confidence_NAME: "Constitution with confidence"
ireland_constitution_with_confidence_DESC: "Pass the Constitution with strong approval and minority confidence while keeping the constitutional state intact."
ireland_emergency_with_an_end_NAME: "An Emergency with an end"
ireland_emergency_with_an_end_DESC: "End the Emergency through the constitutional route before exceptional government becomes permanent."
ireland_neutrality_under_fire_NAME: "Neutrality under fire"
ireland_neutrality_under_fire_DESC: "Close repeated neutrality incidents without entering the war or surrendering Irish control."
ireland_watchers_on_every_coast_NAME: "Watchers on every coast"
ireland_watchers_on_every_coast_DESC: "Keep the Coastwatch service warning Ireland for the required period without abandoning its sectors."
ireland_neutral_merchant_service_NAME: "The neutral merchant service"
ireland_neutral_merchant_service_DESC: "Preserve a neutral merchant service through the war and recover when ships are lost."
ireland_defence_without_hunger_NAME: "Defence without hunger"
ireland_defence_without_hunger_DESC: "Maintain defence and the four Provision components at the required levels together."
ireland_no_client_of_any_capital_NAME: "No client of any capital"
ireland_no_client_of_any_capital_DESC: "Keep foreign leverage below dependency while refusing a client government."
ireland_generation_of_industry_NAME: "A generation of industry"
ireland_generation_of_industry_DESC: "Build a generation of industry without turning development into party seizure or state monopoly."
ireland_civil_war_memory_settled_NAME: "Civil War memory settled"
ireland_civil_war_memory_settled_DESC: "Settle Civil War memory through lawful institutions without a corporate rupture, purge, or army shadow."
ireland_party_leader_and_taoiseach_NAME: "Party leader and Taoiseach"
ireland_party_leader_and_taoiseach_DESC: "Keep the party leader and Taoiseach in office through the parliamentary process with a cohesive coalition."

