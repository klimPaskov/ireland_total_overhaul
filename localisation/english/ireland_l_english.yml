ireland_action_dissolve_the_failed_underground_requirements_tt: "Requirements: Dissolve the Failed Underground. Category: Radical and Underground Politics. Operate in Dublin Metropolitan Region after a radical route failure or an accepted constitutional recovery is recorded; the action's direct ledger outcome must be admissible, the category must have room, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_set_county_tillage_quotas_requirements_tt: "Requirements: Set County Tillage Quotas. Category: National Provision. Operate in Midlands and Central Plain; commit 250 manpower and 5 Trucks, and launch the linked Meet the County Tillage Schedule mission; the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. If the mission is cancelled, up to 175 manpower and 3 Trucks are recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_distribute_seed_and_fertiliser_requirements_tt: "Requirements: Distribute Seed and Fertiliser. Category: National Provision. Operate in Midlands and Central Plain; commit 500 manpower, 25 Support Equipment, 2 Trains, and 5 Trucks for the named county distribution; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_repair_mills_and_storage_requirements_tt: "Requirements: Repair Mills and Storage. Category: National Provision. Operate in Munster; reserve 1 civilian factory for 90 days, commit 20 Support Equipment and 150 Fuel, the linked mission, Bring the Harvest to Market, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 14 Support Equipment and 105 Fuel. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_purchase_emergency_livestock_requirements_tt: "Requirements: Purchase Emergency Livestock. Category: National Provision. Operate in Dublin Metropolitan Region; commit 250 manpower and 5 Trucks for the controlled movement and cold-chain detail; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_license_protected_workshops_requirements_tt: "Requirements: License Protected Workshops. Category: National Provision. Operate in Dublin Metropolitan Region; reserve 1 civilian factory for 180 days, the linked mission, Commission the Protected Workshop Network, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_commission_a_developmental_plant_requirements_tt: "Requirements: Commission a Developmental Plant. Category: National Provision. Operate in Shannon and Mid-West; reserve 2 civilian factories for 240 days; commit 50 Support Equipment and 5 Convoys for imported machinery. The linked mission, Complete a Developmental Plant, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_issue_ration_books_requirements_tt: "Requirements: Issue Ration Books. Category: National Provision. Operate in Dublin Metropolitan Region; commit 500 manpower for the linked Supply the Capital Through Winter mission; the mission must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. If the mission is cancelled, up to 350 manpower is recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_rebalance_fuel_allocation_requirements_tt: "Requirements: Rebalance Fuel Allocation. Category: National Provision. Operate in Midlands and Central Plain; have at least 500 fuel available for the allocation, the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_mobilise_emergency_turf_requirements_tt: "Requirements: Mobilise Emergency Turf. Category: National Provision. Operate in Midlands and Central Plain; commit 750 manpower and 5 Trucks, and launch the linked Cut and Dry the Turf mission; the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. If the mission is cancelled, up to 525 manpower and 3 Trucks are recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_repair_a_named_rail_corridor_requirements_tt: "Requirements: Repair a Named Rail Corridor. Category: National Provision. Control Leinster and Munster with infrastructure at both endpoints; reserve 1 civilian factory for 180 days and commit 5 Trains, 250 manpower, and 200 Fuel. The linked mission, Restore the Dublin to Cork Corridor, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 3 Trains, 175 manpower, and 140 Fuel. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_establish_a_strategic_depot_requirements_tt: "Requirements: Establish a Strategic Depot. Category: National Provision. Operate in Midlands and Central Plain under full Irish control; reserve 1 civilian factory for 120 days and commit 100 Infantry Equipment, 50 Trucks, 2 Trains, 300 Fuel, and 500 manpower as depot guards and maintenance crews. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_charter_foreign_tonnage_requirements_tt: "Requirements: Charter Foreign Tonnage. Category: National Provision. Operate in Cork and Southwest under full Irish control with a controlled naval base; launch the linked Essential Cargo Route mission; commit 10 Convoys and 250 manpower as crew; maintain a protected Finance, Rural Credit, or Access safeguard and a valid British, American, German, Vatican, or neutral channel. The first valid channel is selected in that order; sponsor channels add 5 source-specific leverage and neutral tonnage opens a reaction window without sponsor leverage. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_purchase_a_merchant_vessel_requirements_tt: "Requirements: Purchase a Merchant Vessel. Category: National Provision. Operate in Cork and Southwest under full Irish control with an industrial complex and at least 1 working dockyard; an Irish Shipping, neutral-shipping, domestic, British, American, German, or neutral market authority must be valid, a protected Finance, Rural Credit, or domestic manufacturing route must be open, and the linked mission, Replace a Lost Merchant Vessel, must be launchable. Commit 5 Convoys and 500 manpower as crew; the 270-day programme reserves dockyard capacity, records 5 source-specific leverage for foreign supply, and opens a reaction window. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_reroute_an_essential_cargo_requirements_tt: "Requirements: Reroute an Essential Cargo. Category: National Provision. Control Munster's receiving port with an industrial complex, a live merchant route, and the Dublin-to-Cork railway connection; the naval base must have level 1 capacity with neither named maritime mission active, level 2 with one active, or level 3 with both active. Commit 5 Convoys, 2 Trains, and 200 Fuel; the linked mission, Keep an Essential Cargo Route Open, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 3 Convoys, 1 Train, and 140 Fuel. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_launch_an_emergency_housing_scheme_requirements_tt: "Requirements: Launch an Emergency Housing Scheme. Category: National Provision. Operate in Dublin Metropolitan Region; reserve 2 civilian factories for 120 days and commit 500 manpower, the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_fund_a_western_regional_portfolio_requirements_tt: "Requirements: Fund a Western Regional Portfolio. Category: National Provision. Operate in Connacht and Western Seaboard; provide 5 Trucks for regional delivery and reserve 1 civilian factory for 240 days, the linked mission, Deliver a Western Regional Portfolio, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 3 Trucks. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_run_a_command_district_exercise_requirements_tt: "Requirements: Run a Command District Exercise. Category: National Readiness. Control Leinster with an arms factory and infrastructure, keep Supply Readiness at 20 or higher, and commit 50 Infantry Equipment and 250 Fuel. At least one division is required to launch and two are required for full success; the linked mission, Prove the Command District, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Full success requires Command 50 and Supply 35; partial success requires Command 35 and Supply 20. A cancelled launch returns up to 35 Infantry Equipment and 175 Fuel. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_standardise_infantry_equipment_requirements_tt: "Requirements: Standardise Infantry Equipment. Category: National Readiness. Operate in Dublin Metropolitan Region; reserve 1 civilian factory for 120 days and commit 25 Support Equipment, the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_procure_rifles_and_support_equipment_requirements_tt: "Requirements: Procure Rifles and Support Equipment. Category: National Readiness. Operate in Cork and Southwest under full Irish control; reserve 2 civilian factories for 180 days and commit 5 Convoys. A protected credit route must exist through Finance Safeguards, Rural Credit, or domestic manufacturing. Domestic delivery uses the domestic record; British delivery additionally requires a named Provision shortage plus Finance and sovereignty/access safeguards; American delivery requires the creditor route plus legal and finance/manufacturing authority; German delivery requires a prior German Emissary promise plus independence safeguards; neutral delivery requires its own live route mission. Only the first valid channel is selected in this order, foreign delivery records 6 points of source-specific leverage and opens a reaction window, and Equipment Sufficiency rises only on full or partial delivery. The action's direct ledger outcome must be admissible, the category must have room, route, law, office, Political Power, Command Power, and dynamic-cost gates must pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_activate_a_cadre_reserve_requirements_tt: "Requirements: Activate a Cadre Reserve. Category: National Readiness. Operate in Dublin Metropolitan Region; commit 1,000 manpower, 100 Infantry Equipment, and 25 Support Equipment, and launch the linked Equip a Reserve Brigade mission; the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. If the mission is cancelled, up to 700 manpower, 70 Infantry Equipment, and 17 Support Equipment are recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_expand_the_local_security_force_requirements_tt: "Requirements: Expand the Local Security Force. Category: National Readiness. Operate in Border Belt; commit 750 manpower and 50 Infantry Equipment for the civil security detail; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_expand_the_local_defence_force_requirements_tt: "Requirements: Expand the Local Defence Force. Category: National Readiness. Operate in Donegal and Northwest; commit 1,000 manpower, 100 Infantry Equipment, and 25 Support Equipment for the static defence network; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_motorise_a_strategic_route_requirements_tt: "Requirements: Motorise a Strategic Route. Category: National Readiness. Operate in Dublin to Belfast Corridor; control a supplied division in the named corridor, commit 50 Trucks and 300 Fuel, the linked mission, Secure the Dublin to Belfast Corridor, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_build_a_coastwatch_sector_network_requirements_tt: "Requirements: Build a Coastwatch Sector Network. Category: National Readiness. The Marine and Coast Watching Service must be active; operate in the next unfilled named sector with its full-control and infrastructure platform, including the border-observation record for the Northern interface; commit 20 Support Equipment and 250 manpower for the posts and watch crews; the linked mission, Complete a Coastwatch Sector, must be launchable; the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 14 Support Equipment and 175 manpower. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_install_harbour_defences_requirements_tt: "Requirements: Install Harbour Defences. Category: National Readiness. Operate in Cork and Southwest with full control of the transferred harbour; a valid port-defence authority must be active; reserve 1 civilian factory for 180 days; commit 50 Artillery, 25 Support Equipment, and 500 manpower; the linked mission, Defend a Treaty Port, must be launchable; the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_organise_marine_patrols_requirements_tt: "Requirements: Organise Marine Patrols. Category: National Readiness. Operate in Cork and Southwest with full control of a port containing an industrial complex and naval base for repair and dispatch; the Marine Service or an active Irish, chartered, purchased, or renewed shipping route must provide patrol authority; commit 3 Convoys as one dedicated coastal patrol-craft coverage allocation, not ordinary merchant shipping, plus 250 Fuel, 250 manpower, and 10 Naval Experience; the linked mission, Patrol the Neutral Approaches, must be launchable, and no other patrol-craft commitment may be live. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_open_a_g2_liaison_channel_requirements_tt: "Requirements: Open a G2 Liaison Channel. Category: National Readiness. Operate in Dublin Metropolitan Region; a valid British, American, German, Vatican, or neutral-states channel or the Northern war plan must exist; Irish sovereignty and review safeguards or Security Under Law must define the legal chain; and commit 20 Support Equipment for secure communications. Opening the liaison adds 5 Foreign Exposure and 3 leverage to the named foreign channel when one is used, while a Northern plan carries the exposure without a sponsor leverage shift. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_turn_or_intern_a_foreign_agent_requirements_tt: "Requirements: Turn or Intern a Foreign Agent. Category: National Readiness. Operate in Dublin Metropolitan Region; an identified intelligence incident must be active, Security Under Law or National Emergency must provide legal authority, and commit 250 manpower for security staff. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_protect_an_operational_plan_requirements_tt: "Requirements: Protect an Operational Plan. Category: National Readiness. Operate in Border Belt with an authored Plan W, Northern, invasion, or occupation plan; for Plan W, the G2 liaison, British channel, and British partner must remain valid, while Northern or occupation plans require their authored local authority. Keep a division in the Dublin–Belfast operational belt and a completed Strategic Depot. Protect Plan W must be launchable; the category, route, law, office, and dynamic Political Power/Command Power gates must also pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_demobilise_a_force_tier_requirements_tt: "Requirements: Demobilise a Force Tier. Category: National Readiness. Operate in Dublin Metropolitan Region after wartime danger falls or the postwar review opens, with no active war or spillover. A completed cadre, Local Security Force, or Local Defence Force tier must have a deployed formation in the named regions, a completed Strategic Depot, and a command record; command readiness must remain above 5 and mobilisation readiness above 0. Demobilise Without Losing the Cadre must be launchable; the category, route, law, office, and dynamic Political Power/Command Power gates must also pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_intercept_an_airspace_violation_requirements_tt: "Requirements: Intercept an Airspace Violation. Category: Neutrality Incidents. An active airspace incident must be recorded in South and Southeast, and an operational air-warning network or command authority with an air base in Dublin must be available; commit 5 Fighters and 100 Fuel for the Air Corps response. The action records a possible forced landing, improves Readiness Intelligence, and opens a foreign-reaction window. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_intern_a_belligerent_crew_requirements_tt: "Requirements: Intern a Belligerent Crew. Category: Neutrality Incidents. Operate in Cork and Southwest; an internment incident or an intercepted forced landing must be active under the internment law, provide 250 manpower for guards, and launch Resolve an Aircrew Internment Case. The category must have room, any route or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 175 manpower. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_release_or_exchange_internees_requirements_tt: "Requirements: Release or Exchange Internees. Category: Neutrality Incidents. Operate in Dublin Metropolitan Region; an internment incident must be active under the internment law, and a live British, American, German, Vatican, or neutral-states channel with a valid partner must support the legal or diplomatic disposition. Completion closes the incident, records 5 Foreign Exposure, and adds 3 leverage to the live named state channel; a neutral-states channel records exposure without sponsor leverage. The category must have room, any route or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_investigate_a_neutral_shipping_loss_requirements_tt: "Requirements: Investigate a Neutral Shipping Loss. Category: Neutrality Incidents. A neutral-shipping incident must be active under the trade and shipping law; control Munster with an industrial complex there and keep a naval base in Leinster. Marine Service and Intelligence readiness must each be above 5, the linked mission, Investigate a Merchant Sinking, must be launchable, the category must have room, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_mark_and_publicise_neutral_shipping_requirements_tt: "Requirements: Mark and Publicise Neutral Shipping. Category: Neutrality Incidents. An Irish, chartered, purchased, or renewed merchant route must be active; operate in Dublin Metropolitan Region; commit 10 Support Equipment and launch the linked Maintain Equal Belligerent Rules mission. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. If the mission is cancelled, up to 7 Support Equipment is recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_share_a_controlled_weather_report_requirements_tt: "Requirements: Share a Controlled Weather Report. Category: Neutrality Incidents. Operate in Connacht and Western Seaboard; a current weather incident, G2 cooperation record, or valid diplomatic channel must provide cooperation depth, and Coastal and Air Warning must meet its service threshold. Provide 250 manpower for station staff and 10 Support Equipment for maintenance, the linked mission, Keep the Blacksod Station Reporting, must be launchable, and completion records 5 Foreign Exposure plus 3 leverage to the live named channel when one carries the report. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 175 manpower and 7 Support Equipment. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_answer_a_foreign_access_request_requirements_tt: "Requirements: Answer a Foreign Access Request. Category: Neutrality Incidents. Operate in Treaty Port Complexes; a source in the named five-node access chain must be active, a live British, American, German, Vatican, or neutral channel (or the recorded N07 foreign reaction subject) must identify the requesting partner, and the sovereignty-mandate or sovereignty-safeguard record must be in force. The foreign-access law must be active, the category must have room, and the current Political Power and Command Power costs must be payable before the response deadline. Completion records 5 Foreign Exposure and 3 leverage to the live named state channel; a neutral-states answer records exposure without sponsor leverage. This action records a bounded refusal or access answer only; it grants no alignment, territory, core, industry, equipment, unit, fuel, shipping, administration, office, or free supply. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_tighten_or_narrow_censorship_requirements_tt: "Requirements: Tighten or Narrow Censorship. Category: Neutrality Incidents. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_open_a_border_corridor_requirements_tt: "Requirements: Open a Border Corridor. Category: Neutrality Incidents. A named border incident, war spillover, relief, Plan W, trade, or Northern-settlement pressure must be active; Border Belt must be controlled; at least one division must be present in the named Border Belt force area; and a local security force, local defence force, or rebuilt policing preparation must exist. Commit 250 manpower and 5 Trucks; the operation improves Northern Security Stability and Neutrality Integrity but raises British Leverage. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_restore_neutrality_integrity_requirements_tt: "Requirements: Restore Neutrality Integrity. Category: Neutrality Incidents. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_renegotiate_a_british_supply_contract_requirements_tt: "Requirements: Renegotiate a British Supply Contract. Category: Foreign Channels. Operate in the Dublin-to-Belfast Corridor with a live British channel and valid partner; one named Provision component must be in the shortage band (Food [?ireland_provision_food|0], Energy [?ireland_provision_energy|0], Transport [?ireland_provision_transport|0], Maritime [?ireland_provision_maritime|0]), Finance Safeguards or Rural Credit must support the contract, and sovereignty or access safeguards must constrain the bargain. Commit 5 Convoys for the contracted cargo; the linked mission, Deliver a British Supply Agreement, must be launchable, the category must have room, and route, law, office, Political Power, Command Power, and dynamic-cost gates must pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_formalise_plan_w_liaison_requirements_tt: "Requirements: Formalise Plan W Liaison. Category: Foreign Channels. Invasion danger or war must be active; British channel and partner must be valid; Provision must be at least 40; Readiness at least 35 with Command 30, Intelligence 30, and Supply 25; the foreign-access law and Irish sovereignty safeguards must be active; and Border Belt must be controlled. Completion records +5 Foreign Exposure alongside the existing British-Leverage bargain. The category must have room, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_send_an_american_procurement_mission_requirements_tt: "Requirements: Send an American Procurement Mission. Category: Foreign Channels. Operate in Dublin Metropolitan Region with a live American channel and valid partner, a current Atlantic creditor route, and 5 Convoys for the acquisition route. Finance Safeguards, Rural Credit, or Domestic Manufacturing must support the credit or standards work; the Foreign Access law, sovereignty safeguards, or access safeguard must provide legal authority. The linked mission, Complete an American Procurement Mission, must be launchable, the category must have room, and route, law, office, Political Power, Command Power, and dynamic-cost gates must pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_mobilise_diaspora_relief_requirements_tt: "Requirements: Mobilise Diaspora Relief. Category: Foreign Channels. Operate in Dublin Metropolitan Region; commit 3 Convoys for the relief movement; completion records +3 American Leverage and +5 Foreign Exposure; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_receive_a_german_emissary_requirements_tt: "Requirements: Receive a German Emissary. Category: Foreign Channels. Operate in Dublin Metropolitan Region; completion records +5 Foreign Exposure alongside the existing German-Leverage bargain; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_demand_proof_of_german_delivery_requirements_tt: "Requirements: Demand Proof of German Delivery. Category: Foreign Channels. Operate in Shannon and the Western Port Network with a live German channel and valid partner; Receive a German Emissary must have recorded an active promise, and sovereignty safeguards or Security Under Law must protect Irish independence. The linked mission, Test a German Arms Promise, must be launchable, the category must have room, and route, law, office, Political Power, Command Power, exposure, and dynamic-cost gates must pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_seek_vatican_humanitarian_mediation_requirements_tt: "Requirements: Seek Vatican Humanitarian Mediation. Category: Foreign Channels. Operate in Dublin Metropolitan Region with a live Vatican channel and valid partner; war, an active neutrality incident, diaspora relief, Church service dependency, or the postwar foreign review must provide a named humanitarian or isolation cause. Completion records +3 Vatican Leverage and +5 Foreign Exposure before the case is opened. The action records the case before launching Conclude a Vatican Relief Mediation; the category must have room, route, law, office, Social Consent, Political Power, Command Power, and dynamic-cost gates must pass. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_convene_a_neutral_states_consultation_requirements_tt: "Requirements: Convene a Neutral States Consultation. Category: Foreign Channels. Operate in Dublin Metropolitan Region; two separate small-state or neutral partners must be valid: the Holy See channel must be open with its named partner alive, and the neutral-state forum channel must be open. Completion records +5 Foreign Exposure without creating sponsor leverage. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. No conference grants alignment, recognition, territory, cores, industry, equipment, units, fuel, shipping, administration, offices, or free supply. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_write_anti_dependency_clauses_requirements_tt: "Requirements: Write Anti-Dependency Clauses. Category: Foreign Channels. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_terminate_a_failed_sponsor_agreement_requirements_tt: "Requirements: Terminate a Failed Sponsor Agreement. Category: Foreign Channels. Operate in Dublin Metropolitan Region; at least one authored British Supply, American Procurement, German Arms Promise, or Vatican Relief agreement must have been recorded, and that agreement must show channel invalidation, delivery failure, sponsor collapse, dependency failure, or the named German sponsor-collapse refusal record. The foreign-reaction window, category capacity, control of Dublin Metropolitan Region, and current Political Power and Command Power costs must remain admissible. Completion closes only the evidenced sponsor channels, lowers their source leverage, applies a short-term Transport/Maritime Provision and Supply/Equipment Readiness loss, and opens replacement diplomacy; it grants no replacement aid, equipment, unit, fuel, shipping, territory, core, alignment, office, or recognition for free. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_open_cross_border_confidence_measures_requirements_tt: "Requirements: Open Cross-Border Confidence Measures. Category: Northern Settlement. A named Northern contact, local-authority mandate, IRA local mandate, trade-corridor record, or open negotiation must exist; operate in Border Belt; commit 250 manpower as the local staff pool; the linked mission, Open the Cross-Border Health Service, must be launchable; and retain a controlled Dublin state, category capacity, and payable dynamic Political Power and Command Power costs. A cancelled launch returns 175 manpower. The local-partner record does not change claims, control, occupation, settlement, integration, or cores. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_invite_northern_delegations_requirements_tt: "Requirements: Invite Northern Delegations. Category: Northern Settlement. A named Northern contact, local-authority mandate, IRA local mandate, trade-corridor record, or open negotiation must exist; operate in Belfast Urban and Harbour; the linked mission, Secure a Representative Northern Convention, must be launchable; and retain controlled access, category capacity, and payable dynamic Political Power and Command Power costs. Delegations create a representation record and do not grant Northern control, settlement, integration, or cores. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_negotiate_british_flexibility_requirements_tt: "Requirements: Negotiate British Flexibility. Category: Northern Settlement. Operate in Dublin to Belfast Corridor with a valid British partner; commit 250 manpower and 5 Trucks for the negotiating and transport staff; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Completion adds 5 British Flexibility, 3 Foreign Exposure, and 4 British Leverage; British agreement alone never changes Unionist Consent. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_protect_northern_campaign_freedom_requirements_tt: "Requirements: Protect Northern Campaign Freedom. Category: Northern Settlement. Operate in Armagh and Newry Border; commit 100 Infantry Equipment, the linked mission, Conduct a Supervised Plebiscite, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_convene_a_federal_powers_conference_requirements_tt: "Requirements: Convene a Federal Powers Conference. Category: Northern Settlement. Operate in Belfast Urban and Harbour; the linked mission, Ratify the Federal Settlement, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_draft_a_unitary_safeguards_charter_requirements_tt: "Requirements: Draft a Unitary Safeguards Charter. Category: Northern Settlement. Operate in Belfast Urban and Harbour; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_build_a_labour_industrial_settlement_requirements_tt: "Requirements: Build a Labour Industrial Settlement. Category: Northern Settlement. Operate in Belfast Urban and Harbour; commit 50 Support Equipment and 10 Trucks, the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_prepare_a_wartime_unity_bargain_requirements_tt: "Requirements: Prepare a Wartime Unity Bargain once. Category: Northern Settlement. The June 1940 crisis or a comparable war state must be active; operate in Dublin to Belfast Corridor; complete the defence estimates and command audit, maintain a ready Irish command structure and open British channel with a valid British partner, and meet Readiness [?ireland_readiness_display|0] / 35, British Flexibility [?ireland_northern_british_flexibility|0] / 45, Nationalist Consent [?ireland_northern_nationalist_consent|0] / 50, and Unionist Consent [?ireland_northern_unionist_consent|0] / 20 or enforceable guarantees. Commit 50 Infantry Equipment and 25 Trucks; the dated H14 proposal chain must resolve into a postwar pledge, federal transition, or negotiated unitary transition before the Northern focus handoff can be consumed. Defence cooperation without unity, Stormont refusal, Irish unpreparedness, rejection, sponsor collapse, and deadline expiry are recorded separately. No branch grants Northern control, settlement, integration, or cores. The category must have room and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_plan_a_coercive_northern_campaign_requirements_tt: "Requirements: Plan a Coercive Northern Campaign. Category: Northern Settlement. National Readiness [?ireland_readiness_display|0] / 60, Supply and Mobility [?ireland_supply_mobility|0] / 45, and National Provision [?ireland_provision_display|0] / 55 are required, along with route-valid command authority, border support, and a recorded cause: a Northern war plan, a wartime bargain, a failed settlement requiring recovery, or a wider war state. Stage at least one division in Dublin, the Western Seaboard, or Cork/Munster; Belfast control is earned through the linked Take and Hold Belfast map objective. Commit 200 Infantry Equipment, 2,000 manpower, 5 Trains, and 500 Fuel, keep the linked mission launchable, and preserve room in the category. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_defer_the_constitutional_claim_lawfully_requirements_tt: "Requirements: Defer the Constitutional Claim Lawfully. Category: Northern Settlement. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_establish_a_transitional_authority_requirements_tt: "Requirements: Establish a Transitional Authority. Category: Occupation and Integration. Operate in Belfast Urban and Harbour; commit 1,000 manpower for administrators and guards, the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_vet_and_rebuild_policing_requirements_tt: "Requirements: Vet and Rebuild Policing. Category: Occupation and Integration. Operate in Lower Lagan and Lisburn; commit 25 Support Equipment and 5 Trucks, the linked mission, Restore Ordinary Policing, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_disarm_paramilitary_organisations_requirements_tt: "Requirements: Disarm Paramilitary Organisations. Category: Occupation and Integration. Control Northern Ireland and deploy at least one Irish division in Derry and Foyle; Intelligence Readiness must be above 5; Public Order, Security Under Law, or Vet and Rebuild Policing must provide the legal authority; commit 1,000 manpower. Security Loyalty must remain below 95, the category must have room, and the current Political Power and Command Power costs must be payable. The action changes the security ledger and opens no free territory or core. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_maintain_welfare_and_pensions_requirements_tt: "Requirements: Maintain Welfare and Pensions. Category: Occupation and Integration. Operate in Belfast Urban and Harbour; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_restore_belfast_industrial_contracts_requirements_tt: "Requirements: Restore Belfast Industrial Contracts. Category: Occupation and Integration. Control Northern Ireland with an industrial complex and infrastructure, maintain Northern Labour Cooperation at 30 or higher, reserve 2 civilian factories for 300 days, and commit 100 Support Equipment, 50 Trucks, and 250 Fuel for repair and delivery work. Full success requires Labour Cooperation 45 and Industrial Capacity 55; partial success requires Labour Cooperation 30 and Industrial Capacity 40. The linked mission, Reopen Belfast Industry, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. A cancelled launch returns 70 Support Equipment, 35 Trucks, and 175 Fuel; factories are released, not refunded. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_settle_education_and_religious_safeguards_requirements_tt: "Requirements: Settle Education and Religious Safeguards. Category: Occupation and Integration. Operate in Belfast Urban and Harbour; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_merge_tax_and_debt_administration_requirements_tt: "Requirements: Merge Tax and Debt Administration. Category: Occupation and Integration. Operate in Lower Lagan and Lisburn; control Northern Ireland, keep a live British, American, or neutral-states creditor channel with a valid route for external obligations, and commit 5 Convoys for the audited debt and customs transfer. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_integrate_or_devolve_military_command_requirements_tt: "Requirements: Integrate or Devolve Military Command. Category: Occupation and Integration. Control Northern Ireland and deploy at least one Irish division in Belfast Urban and Harbour; commit 25 Support Equipment and 10 Army Experience for the joint command and records office; Command Readiness must remain below 95, the action's direct ledger outcome must be admissible, the category must have room, and the current Political Power and Command Power costs must be payable. No unit, territory, or core is created by the action. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_review_foreign_guarantees_requirements_tt: "Requirements: Review Foreign Guarantees. Category: Occupation and Integration. Operate in Dublin to Belfast Corridor; an active foreign-guarantee law, a valid British partner, and an integration or occupation review must all be present. The action's direct ledger outcome must be admissible, the category must have room, any route or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_conduct_the_core_eligibility_review_requirements_tt: "Requirements: Conduct the Core Eligibility Review. Category: Occupation and Integration. Operate in Belfast Urban and Harbour; the linked mission, Complete the Stage Five Integration Review, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_invite_a_celtic_cultural_partner_requirements_tt: "Requirements: Invite a Celtic Cultural Partner. Category: Regional and External Projects. Operate in Dublin Metropolitan Region; the linked mission, Ratify a Regional Charter, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_draft_an_atlantic_consultation_charter_requirements_tt: "Requirements: Draft an Atlantic Consultation Charter. Category: Regional and External Projects. Operate in Dublin Metropolitan Region; two separate willing state channels must be valid, using any pair of live British, American, German, Vatican, or neutral-state channels. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. The charter grants no faction entry, alignment, recognition, territory, cores, industry, equipment, units, fuel, shipping, administration, offices, or free supply. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_propose_a_regional_defence_league_requirements_tt: "Requirements: Propose a Regional Defence League. Category: Regional and External Projects. Readiness 75+, Provision 65+, Warning, Maritime Protection, Command, and Intelligence each 45+, a fully ratified regional charter with valid members, defined military contribution, sovereignty safeguards, a division in Dublin, the Western Seaboard, or Cork, and a common threat (war, invasion danger, or active neutrality incident). Operate in Dublin Metropolitan Region; the category and current Political Power and Command Power costs must remain admissible. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_recognise_a_liberated_authority_requirements_tt: "Requirements: Recognise a Liberated Authority. Category: Regional and External Projects. A war, war spillover, foreign-sponsor collapse, Northern local-authority mandate, or Northern wartime bargain must provide the concrete cause; operate in Dublin Metropolitan Region; own Ireland; commit 50 Infantry Equipment and 5 Convoys for the bounded initial aid package; the action's direct ledger outcome must be admissible, the category must have room, and the current Political Power and Command Power costs must be payable. Completion adds 4 Diplomatic Recognition and 5 Foreign Exposure, plus 3 leverage to a live named state channel when one carries the aid; a neutral-states or local-authority opening records exposure without sponsor leverage. Recognition opens aid and legitimacy missions but grants no puppet, territory, core, industry, unit, or free diplomatic status. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_offer_a_protectorate_treaty_requirements_tt: "Requirements: Offer a Protectorate Treaty. Category: Regional and External Projects. Open a regional, Celtic, Atlantic, Five Provinces, or Otherworld route; have a recognised liberated authority, a Northern war plan, the coercive Northern campaign completed, or a Northern wartime bargain; own Ireland; keep British Flexibility below 95; and pay the current Political Power and Command Power costs. The action opens foreign reaction and records treaty obligations; it does not grant a subject, territory, core, industry, equipment, unit, fuel, shipping, administration, alignment, office, or recognition for free. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_convene_a_crown_association_requirements_tt: "Requirements: Convene a Crown Association. Category: Regional and External Projects. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_renew_the_fivefold_compact_requirements_tt: "Requirements: Renew the Fivefold Compact. Category: Regional and External Projects. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_fulfil_a_compact_obligation_requirements_tt: "Requirements: Fulfil a Compact Obligation. Category: Regional and External Projects. The Otherworld compact path and Compact Steward must be active; Language Service must be at least 45, Archival Record 75, Regional Participation 60, and Site Stewardship 70; and a real Irish division must already stand in the Gaeltacht or Atlantic-island districts of Connaught or Munster. Operate under the named five-site map objective; commit 500 manpower and 20 Support Equipment and launch the linked Fulfil the Compact at Five Sites mission. If the mission is cancelled, up to 350 manpower and 14 Support Equipment are recoverable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_dissolve_a_failed_regional_order_requirements_tt: "Requirements: Dissolve a Failed Regional Order. Category: Regional and External Projects. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_integrate_a_voluntary_member_contribution_requirements_tt: "Requirements: Integrate a Voluntary Member Contribution. Category: Regional and External Projects. A defence league proposal and fully ratified regional charter must exist; command and sovereignty safeguards and the military contribution must be defined; a division must stand in Dublin, the Western Seaboard, or Cork; and at least one admissible payload must be payable after the action's current Political Power and Command Power surcharge. The selection event accepts one of five named commitments: troops (750 manpower, 100 Infantry Equipment, 20 Support Equipment), ships (5 Convoys, 250 manpower, 250 fuel), finance (30 Political Power), intelligence (10 Command Power and 5 Intelligence Readiness), or infrastructure (5 Trains and 5 Trucks). Cancellation returns only the selected class's recoverable inputs. The linked mission must be launchable and the category must have room. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_review_the_emergency_declaration_requirements_tt: "Requirements: Review the Emergency Declaration. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_replace_emergency_supply_orders_requirements_tt: "Requirements: Replace Emergency Supply Orders. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region; the linked mission, End Wartime Rationing Safely, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_demobilise_and_settle_veterans_requirements_tt: "Requirements: Demobilise and Settle Veterans. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region; Administrative Reach must be at least 60 and Labour Organisation at least 35, with a completed housing, reconstruction, or veteran-employer capacity; reserve two civilian factories for 300 days, commit 100 Infantry Equipment and 1,000 manpower, and launch the linked Settle the Demobilised Forces mission. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Cancellation returns up to 70 Infantry Equipment and 700 manpower. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_veteran_settlement_material_tt: "Veteran settlement commitment: reserve two civilian factories for 300 days and commit 100 Infantry Equipment and 1,000 manpower to housing, employment, training, and equipment recovery. Cancellation returns up to 70 Infantry Equipment and 700 manpower; no free units or equipment are created."
ireland_action_renew_the_merchant_fleet_requirements_tt: "Requirements: Renew the Merchant Fleet. Category: Postwar Statecraft. Operate in Cork and Southwest with a surviving Irish Shipping, merchant-purchase, or neutral-shipping institution; retain full control of Cork and at least 1 working dockyard. Commit 5 Convoys, 500 manpower as crews, and a protected capital or credit route through Finance Safeguards, Rural Credit, or domestic manufacturing. The 240-day dockyard programme reserves 1 dockyard's productive time; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_launch_a_reconstruction_portfolio_requirements_tt: "Requirements: Launch a Reconstruction Portfolio. Category: Postwar Statecraft. Operate in Dublin to Galway Corridor; reserve 3 civilian factories for 365 days and commit 50 Support Equipment and 25 Trucks for the first reconstruction works. The linked mission, Complete National Reconstruction, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_settle_the_republic_question_requirements_tt: "Requirements: Settle the Republic Question. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region; the linked mission, Bring the Republic Settlement into Force, must be launchable, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_review_commonwealth_relations_requirements_tt: "Requirements: Review Commonwealth Relations. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region after a constitutional or republican status transition has been recorded; keep a valid British partner and British Leverage below 95, and maintain an enforceable Finance Safeguard, Rural Credit record, or Access Safeguard before the economic terms are reviewed. The action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_apply_for_united_nations_membership_requirements_tt: "Requirements: Apply for United Nations Membership. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region after the postwar foreign review has opened; record a resolved FR11 admission position or the dated H17 United Nations chain, keep Diplomatic Recognition at least 50 (current: [?ireland_diplomatic_recognition|0]), and launch the linked Build Support for United Nations Admission mission. The category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. This action does not grant recognition, territory, cores, alignment, industry, equipment, units, fuel, shipping, offices, or membership for free. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_accept_or_refuse_reconstruction_aid_requirements_tt: "Requirements: Accept or Refuse Reconstruction Aid. Category: Postwar Statecraft. Operate in Dublin to Galway Corridor after a named foreign or multilateral reconstruction programme has made an offer and its terms are live or recorded; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_action_complete_the_route_conclusion_review_requirements_tt: "Requirements: Complete the Route Conclusion Review. Category: Postwar Statecraft. Operate in Dublin Metropolitan Region; the action's direct ledger outcome must be admissible, the category must have room, any route, law, or office gates must be open, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
ireland_mission_full_success_tt: "Full success recorded. Active missions remaining: [?ireland_active_mission_count|0]."
ireland_mission_partial_success_tt: "Partial success recorded. The ledger keeps the remaining shortfall visible. Active missions remaining: [?ireland_active_mission_count|0]."
ireland_mission_failure_tt: "The mission failed and the unresolved pressure remains in the ledger. Active missions remaining: [?ireland_active_mission_count|0]."
ireland_mission_escalation_tt: "The mission failed under active pressure and the unresolved problem escalated. Active missions remaining: [?ireland_active_mission_count|0]."
ireland_mission_cancelled_material_refund_tt: "Cancellation returns up to 70% of recoverable committed material inputs; consumed work, lost equipment, and damage are not restored."
ireland_map_objective_assemble_seventy_routine_votes_tt: "Map objective — Assemble Seventy Routine Votes. Control Leinster, keep infrastructure there, and bring the Dáil mandate above 60 (current: [?ireland_dail_mandate|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_keep_essential_services_running_parish_audit_tt: "Map objective — Parish Audit Mode for Keep Essential Services Running. Control Munster, keep an industrial complex there, and raise transport provision above 25 (current: [?ireland_provision_transport|0]). The merged mission resolves at its 120-day audit deadline with full, partial, failure, or escalation results."
ireland_map_objective_consolidate_the_movement_network_tt: "Map objective — Consolidate The Movement Network. The active mode names the required regional platform: IRA mode needs full control of Leinster and infrastructure there plus Republican Network Strength above 40; Republican Congress mode needs an industrial complex in Leinster plus Congress Coalition Cohesion above 40; corporate mode needs Leinster infrastructure plus Corporate Network Strength above 40; Ailtirí mode needs Western Seaboard infrastructure plus Ailtirí Cell Strength above 40. Current ledgers: Republican Network [?ireland_republican_network_strength|0], Congress Cohesion [?ireland_congress_coalition_cohesion|0], Corporate Network [?ireland_corporate_network_strength|0], Ailtirí Cells [?ireland_ailtiri_cell_strength|0]. The 150-day mission resolves with full success at 60, partial success at 45, or failure/escalation below those route thresholds."
ireland_map_objective_secure_constituent_authority_tt: "Map objective — Secure Constituent Authority. The active mode names the required constituent test: IRA mode needs Leinster infrastructure plus Army Council Cohesion above 45; Republican Congress mode needs an industrial complex in Leinster plus Social Consent above 45; corporate mode needs Leinster infrastructure plus Corporate Network Strength above 45; Ailtirí mode needs an industrial complex in Leinster plus National Settlement above 45. Current ledgers: Army Council Cohesion [?ireland_army_council_cohesion|0], Social Consent [?ireland_social_consent|0], Corporate Network [?ireland_corporate_network_strength|0], National Settlement [?ireland_national_settlement|0]. The 180-day mission resolves with full success at 65, partial success at 50, or failure/escalation below those route thresholds."
ireland_map_objective_bring_the_harvest_to_market_tt: "Map objective — Bring The Harvest To Market. Control Munster, keep an industrial complex there, and raise transport provision above 20 (current: [?ireland_provision_transport|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_bring_the_republic_settlement_into_force_tt: "Map objective — Bring The Republic Settlement Into Force. Control Leinster, keep a naval base there, complete the sovereignty mandate, and bring the Dáil mandate above 60 (current: [?ireland_dail_mandate|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_build_support_for_united_nations_admission_tt: "Map objective — Build Support For United Nations Admission. Control Leinster, keep a naval base there, select a foreign posture, record a resolved FR11 or H17 admission position, and keep Diplomatic Recognition at least 50 and Neutrality Integrity above 50 (current values: [?ireland_diplomatic_recognition|0] and [?ireland_neutrality_integrity|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_collect_a_national_folklore_cycle_tt: "Map objective — Collect A National Folklore Cycle. Keep full control of Connacht with infrastructure, the active collection action and mission, a schools/language network, archival groundwork, historic-site custody, and at least one concealed-evidence region (current: [?ireland_concealed_evidence_region_count|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_commission_the_protected_workshop_network_tt: "Map objective — Commission The Protected Workshop Network. Control Leinster and Munster, with an industrial complex in each. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_complete_a_coastwatch_sector_tt: "Map objective — Complete [GetIrelandCoastwatchActiveSector]. Hold the named regional platform, keep its infrastructure and border-observation requirements valid where applicable, and raise warning readiness above 5 (current: [?ireland_readiness_warning|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_coastwatch_sector_1: "Northwest and Donegal"
ireland_coastwatch_sector_2: "Galway and the Western Islands"
ireland_coastwatch_sector_3: "Southwest and Berehaven Approaches"
ireland_coastwatch_sector_4: "Cork and the South Coast"
ireland_coastwatch_sector_5: "East Coast and Dublin Approaches"
ireland_coastwatch_sector_6: "Border Loughs and Northern Interface"
ireland_coastwatch_sector_pending: "Next Unfilled Coastwatch Sector"
ireland_map_objective_complete_a_developmental_plant_tt: "Map objective — Complete A Developmental Plant. Control Connaught, keep infrastructure there, raise energy provision above 15 (current: [?ireland_provision_energy|0]), and keep transport provision above 0 (current: [?ireland_provision_transport|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_complete_an_american_procurement_mission_tt: "Map objective — Complete An American Procurement Mission. Control Leinster, keep an industrial complex and naval base there, keep the American procurement mission and source record active, retain a valid American partner and Atlantic creditor route, and preserve the finance/manufacturing and legal safeguards. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_complete_national_reconstruction_tt: "Map objective — Complete National Reconstruction. Control Leinster and Munster, keep an industrial complex in each, and maintain a railway connection between them. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_complete_six_month_settlement_review_tt: "Map objective — Complete Six-Month Settlement Review. Control Leinster, keep a naval base there, and bring the National Settlement above -30 (current: [?ireland_national_settlement|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_complete_the_stage_five_integration_review_tt: "Map objective — Complete The Stage Five Integration Review. Control Northern Ireland, keep infrastructure there, keep integration capacity above 35 (current: [?ireland_northern_integration_capacity|0]), and leave the current integration stage below 4 (current: [?ireland_northern_integration_stage|0]) while the review is prepared. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_conclude_a_vatican_relief_mediation_tt: "Map objective — Conclude A Vatican Relief Mediation. Control Leinster, keep an industrial complex there, keep the Vatican mission and recorded humanitarian case active, retain a valid Vatican partner, and raise Social Consent above 35 (current: [?ireland_social_consent|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_conduct_a_free_general_election_tt: "Map objective — Conduct A Free General Election. Control Leinster, keep infrastructure there, and bring the Dáil mandate above 50 (current: [?ireland_dail_mandate|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_conduct_a_supervised_plebiscite_tt: "Map objective — Conduct A Supervised Plebiscite. Control Leinster, keep infrastructure there, open the Northern negotiation, and raise Northern security stability above 30 (current: [?ireland_northern_security_stability|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_cut_and_dry_the_turf_tt: "Map objective — Cut And Dry The Turf. Control Connaught, keep infrastructure there, raise energy provision above 15 (current: [?ireland_provision_energy|0]), and keep food provision above 0 (current: [?ireland_provision_food|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_defend_a_treaty_port_tt: "Map objective — Defend A Treaty Port. Keep full control of the Munster treaty-port state with an industrial complex and naval base; maintain a live port-defence project, warning network, harbour-defence action, and mission. Command readiness: [?ireland_readiness_command|0]. Warning readiness: [?ireland_readiness_warning|0]. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_deliver_a_british_supply_agreement_tt: "Map objective — Deliver A British Supply Agreement. Control Leinster, keep a naval base and infrastructure there, keep the British contract mission and source record active, retain a valid British partner, and preserve the finance and sovereignty/access safeguards used to bargain over cargo and route terms. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_deliver_a_western_regional_portfolio_tt: "Map objective — Deliver A Western Regional Portfolio. Control Connaught, keep infrastructure there, and raise transport provision above 20 (current: [?ireland_provision_transport|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_deliver_the_education_settlement_tt: "Map objective — Deliver The Education Settlement. Control Connaught, keep infrastructure there, and raise Social Consent above 35 (current: [?ireland_social_consent|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_demobilise_without_losing_the_cadre_tt: "Map objective — Demobilise Without Losing The Cadre. Control Leinster, keep an arms factory there, and operate after wartime danger falls or the postwar review opens. A selected cadre, Local Security Force, or Local Defence Force tier must have a deployed formation, a Strategic Depot, and a command record; command readiness must remain above 5 (current: [?ireland_readiness_command|0]) and mobilisation readiness above 0 (current: [?ireland_readiness_mobilisation|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_end_wartime_rationing_safely_tt: "Map objective — End Wartime Rationing Safely. Control Leinster, keep an industrial complex there, raise food provision above 35 (current: [?ireland_provision_food|0]), and raise energy provision above 15 (current: [?ireland_provision_energy|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_equip_a_reserve_brigade_tt: "Map objective — Equip A Reserve Brigade. Control Leinster, keep an arms factory and industrial complex there, and raise equipment readiness above 5 (current: [?ireland_readiness_equipment|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_form_a_government_after_the_poll_tt: "Map objective — Form A Government After The Poll. Control Leinster, keep an industrial complex there, and bring the Dáil mandate above 60 (current: [?ireland_dail_mandate|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_fulfil_the_compact_at_five_sites_tt: "Map objective — Fulfil The Compact At Five Sites. Control Leinster, Connaught, and Munster; keep the required infrastructure and industrial complex at those sites; and raise Social Consent above 35 (current: [?ireland_social_consent|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_hold_a_five_region_cultural_congress_tt: "Map objective — Hold A Five-Region Cultural Congress. Keep full control of Leinster, Connaught, and Munster with the required industrial and infrastructure sites; maintain the active congress action and mission, regional participation, and a rights-bearing constituency; and record more than one concealed-evidence region (current: [?ireland_concealed_evidence_region_count|0]). Regional participation: [?ireland_cultural_regional_participation|0]. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_investigate_a_merchant_sinking_tt: "Map objective — Investigate A Merchant Sinking. Control Munster, keep an industrial complex there and a naval base in Leinster, and raise Marine Service and Intelligence readiness above 5 (current: [?ireland_readiness_maritime_protection|0] / [?ireland_readiness_intelligence|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_keep_an_essential_cargo_route_open_tt: "Map objective — Keep An Essential Cargo Route Open. Control Munster's receiving port with an industrial complex, a live merchant route, and the Dublin-to-Cork railway connection; reserve the naval-base capacity required by the active patrol and lost-merchant missions. Full success requires Maritime Access 50; partial success requires Maritime Access 35 with a valid route or railway (current: [?ireland_provision_maritime|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_keep_essential_services_running_tt: "Map objective — Keep Essential Services Running. Control Leinster, keep infrastructure and an air base there, and maintain the capital service network. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_keep_the_blacksod_station_reporting_tt: "Map objective — Keep The Blacksod Station Reporting. Control Connaught, keep infrastructure there, raise warning readiness above 5 (current: [?ireland_readiness_warning|0]), and raise intelligence readiness above 5 (current: [?ireland_readiness_intelligence|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_maintain_cabinet_discipline_tt: "Map objective — Maintain Cabinet Discipline. Control Leinster, keep an industrial complex there, and raise Social Consent above 45 (current: [?ireland_social_consent|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_maintain_equal_belligerent_rules_tt: "Map objective — Maintain Equal Belligerent Rules. Control Leinster, keep an industrial complex there, and raise Neutrality Integrity above 50 (current: [?ireland_neutrality_integrity|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_meet_the_county_tillage_schedule_tt: "Map objective — Meet The County Tillage Schedule. Control Munster, keep infrastructure there, and raise food provision above 25 (current: [?ireland_provision_food|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_meet_the_member_contribution_schedule_tt: "Map objective — Meet The Member Contribution Schedule. Control Leinster and Munster, keep an arms factory in Leinster and an industrial complex in Munster, keep the ratified charter and sovereignty safeguards active, and place a division in Dublin, the Western Seaboard, or Cork. Equipment readiness must remain above 5 (current: [?ireland_readiness_equipment|0]). The selected payload is a paid commitment: troops, ships, finance, intelligence, or infrastructure. Full and partial standards follow that selection; current Readiness, Provision, Dáil mandate, and Social Consent remain visible in the ledgers. The mission resolves at its 180-day deadline with full, partial, failure, or escalation results, and cancellation refunds only the selected class's recoverable inputs."
ireland_map_objective_open_the_cross_border_health_service_tt: "Map objective — Open The Cross-Border Health Service. Control Connaught, keep infrastructure there, and open either the Northern contact or Northern trade corridor while meeting the partial health-service proof. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_patrol_the_neutral_approaches_tt: "Map objective — Patrol The Neutral Approaches. Keep full control of the Munster coastal port and Leinster naval base, an industrial complex in Munster, an Irish or chartered shipping route, a warning/rescue service, the dedicated patrol-craft coverage commitment, and the Marine Patrol action and mission. The craft commitment is the charged Convoy-equivalent patrol allocation and is rechecked independently of the merchant stockpile. Neutrality Integrity: [?ireland_neutrality_integrity|0]. Maritime protection readiness: [?ireland_readiness_maritime_protection|0]. The mission resolves at its deadline with full, partial, failure, or escalation results and releases the craft commitment on cleanup."
ireland_map_objective_conduct_a_free_general_election_by_election_tt: "Map objective — By-Election Mode for Conduct a Free General Election. Control Munster, keep infrastructure there, and bring the Dáil mandate above 35 (current: [?ireland_dail_mandate|0]). The merged mission resolves at its 100-day by-election deadline with full, partial, failure, or escalation results."
ireland_map_objective_protect_plan_w_tt: "Map objective — Protect Plan W. Control Leinster, keep an arms factory and air base there, and maintain an authored Plan W, Northern, invasion, or occupation authority with the required G2/British or local record. Keep a division in the Dublin–Belfast operational belt and a completed Strategic Depot; warning readiness must remain above 5 (current: [?ireland_readiness_warning|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_prove_the_command_district_tt: "Map objective — Prove The Command District. Control Leinster with an arms factory and infrastructure, preserve the active exercise provenance, and keep at least one division in the district. Full success requires two divisions, Command 50, and Supply 35; partial success requires one division, Command 35, and Supply 20 (current: [?ireland_readiness_command|0] / [?ireland_readiness_supply|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_ratify_a_regional_charter_tt: "Map objective — Ratify A Regional Charter. Control Leinster, Connaught, and Munster; keep the required industrial and infrastructure sites; and bring the Dáil mandate above 0 (current: [?ireland_dail_mandate|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_ratify_the_federal_settlement_tt: "Map objective — Ratify The Federal Settlement. Control Leinster, keep an industrial complex there, complete federal preparation, and raise Northern integration capacity above 20 (current: [?ireland_northern_integration_capacity|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_reopen_belfast_industry_tt: "Map objective — Reopen Belfast Industry. Control Northern Ireland with infrastructure and an industrial complex, reserve two civilian factories for the 300-day contract, and raise Northern Labour Cooperation to 30. Full success requires Labour Cooperation 45 and Industrial Capacity 55; partial success requires Labour Cooperation 30 and Industrial Capacity 40 (current: [?ireland_northern_labour_cooperation|0] / [?ireland_industrial_capacity|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_replace_a_lost_merchant_vessel_tt: "Map objective — Replace A Lost Merchant Vessel. Control Munster, keep an industrial complex there, and raise maritime readiness above 0 (current: [?ireland_readiness_maritime|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_resolve_an_aircrew_internment_case_tt: "Map objective — Resolve An Aircrew Internment Case. Keep the internment law active, preserve either the named internment incident or an intercepted forced landing, control Leinster, keep an air base and naval base there, and raise Neutrality Integrity above 25 (current: [?ireland_neutrality_integrity|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_restore_ordinary_policing_tt: "Map objective — Restore Ordinary Policing. Control Northern Ireland, keep infrastructure there, and raise Northern security stability above 35 (current: [?ireland_northern_security_stability|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_restore_the_dublin_to_cork_corridor_tt: "Map objective — Restore The Dublin-To-Cork Corridor. Control Leinster and Munster with infrastructure at both endpoints, restore a railway connection between them, and maintain railway level 1 in both states. Full success requires Transport Serviceability 50; partial success requires Transport Serviceability 35 with the connection or both endpoint levels (current: [?ireland_provision_transport|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_secure_a_representative_northern_convention_tt: "Map objective — Secure A Representative Northern Convention. Control Leinster, keep an industrial complex there, and open either Northern negotiation or the Northern stage review. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_secure_the_dublin_to_belfast_corridor_tt: "Map objective — Secure The Dublin-To-Belfast Corridor. Control Leinster and Northern Ireland, restore a railway connection between them, and maintain railway level 1 in both states. Keep a supplied division in the named corridor, a completed Strategic Depot, and Supply and Mobility at least 20 (current: [?ireland_readiness_supply|0]); a border-corridor, Northern trade-corridor, or wartime-bargain record must preserve civilian passage. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_settle_the_demobilised_forces_tt: "Map objective — Settle The Demobilised Forces. Control Leinster, keep an arms factory and industrial complex there, and keep mobilisation readiness above 0 (current: [?ireland_readiness_mobilisation|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_supply_the_capital_through_winter_tt: "Map objective — Supply The Capital Through Winter. Control Leinster, keep a naval base there, and raise food provision above 25 (current: [?ireland_provision_food|0]). The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_take_and_hold_belfast_tt: "Map objective — Take And Hold Belfast. Control Leinster and Northern Ireland, restore the Dublin–Belfast railway and level 1 service in both states, and keep a supplied formation, Strategic Depot, and authored coercive campaign plan. Belfast must retain its naval base and arms factory, while Northern Security Stability remains at least 20 (current: [?ireland_northern_security_stability|0]) to limit civilian-harm and occupation-zone failure. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_test_a_german_arms_promise_tt: "Map objective — Test A German Arms Promise. Control Connaught and Leinster, keep infrastructure in Connaught and an arms factory in Leinster, keep the German proof mission active, retain a valid German partner, preserve the prior emissary promise, and maintain sovereignty or Security Under Law safeguards. The mission resolves at its deadline with full, partial, failure, or escalation results."
ireland_map_objective_verify_the_restoration_evidence_tt: "Map objective — Verify The Restoration Evidence. Control Leinster, keep an industrial complex and naval base there, maintain the active claim and mission, and satisfy named archive provenance, independent review, site custody, evidence-class, and unusual-campaign conditions. Concealed-evidence regions recorded: [?ireland_concealed_evidence_region_count|0]. The mission resolves at its deadline with full, partial, failure, or escalation results."
# EVENT_MAIN_SECTION
ireland_events.constitution_cabinet_draft.t: "Constitution Cabinet Draft"
ireland_events.constitution_cabinet_draft.d: "The cabinet draft must decide how much authority the 1937 settlement places in ministers, the Dáil, and the President. The National Settlement is [?ireland_settlement_bop_value|0], while Social Consent is [?ireland_social_consent|0]; a hurried text can bind the state before the public has seen its limits."
ireland_events.constitution_cabinet_draft.a: "Table the draft before the Dáil and bind the ministers."
ireland_events.constitution_cabinet_draft.b: "Return it to committee and spend momentum on safeguards."
ireland_events.constitution_public_consultation.t: "Constitution Public Consultation"
ireland_events.constitution_public_consultation.d: "Delegates have brought language, conscience, labour, and minority questions into the constitutional consultation. Social Consent is [?ireland_social_consent|0]; the text gains legitimacy only if its protections can be read outside the government benches."
ireland_events.constitution_public_consultation.a: "Publish the guarantees and invite objections in public."
ireland_events.constitution_public_consultation.b: "Keep the conference private until the clauses are settled."
ireland_events.constitution_plebiscite_and_election.t: "Constitution Plebiscite and Election"
ireland_events.constitution_plebiscite_and_election.d: "The constitution now faces both a popular test and a parliamentary contest. The government must protect the count, opposition access, and the Dáil's formal authority while the Settlement stands at [?ireland_settlement_bop_value|0]."
ireland_events.constitution_plebiscite_and_election.a: "Protect the poll, publish the count, and accept the verdict."
ireland_events.constitution_plebiscite_and_election.b: "Delay the vote until the register and safeguards are credible."
ireland_events.constitution_commencement.t: "Constitution Commencement"
ireland_events.constitution_commencement.d: "The new constitutional order is ready to leave paper and enter offices, courts, schools, and elections. Its authority still depends on a counted mandate and on the public believing that emergency powers will not become permanent."
ireland_events.constitution_commencement.a: "Bring the constitution into force with a public register."
ireland_events.constitution_commencement.b: "Commence only the ordinary clauses and retain the review."
ireland_events.presidency_hyde_consensus.t: "Presidency Hyde Consensus"
ireland_events.presidency_hyde_consensus.d: "Douglas Hyde's nomination has to define the first presidency without turning the office into a second cabinet. The Council of State and the Dáil are watching a settlement currently measured at [?ireland_settlement_bop_value|0]."
ireland_events.presidency_hyde_consensus.a: "Confirm the ceremonial office and publish its limits."
ireland_events.presidency_hyde_consensus.b: "Leave the nomination under civic review until the limits are agreed."
ireland_events.presidency_inauguration.t: "Presidency Inauguration"
ireland_events.presidency_inauguration.d: "The inauguration must make the president's oath, the Taoiseach's responsibility, and the Council of State's advisory role intelligible to the public. Social Consent is [?ireland_social_consent|0]; ceremony cannot repair an undefined chain of authority."
ireland_events.presidency_inauguration.a: "Swear the office under a clear parliamentary division of labour."
ireland_events.presidency_inauguration.b: "Delay the ceremony and reopen the constitutional wording."
ireland_events.presidency_dissolution_case.t: "Presidency Dissolution Case"
ireland_events.presidency_dissolution_case.d: "A request for dissolution tests whether the president can protect constitutional procedure without becoming an alternate government. The cabinet must defend its advice before the Dáil, with the National Settlement at [?ireland_settlement_bop_value|0]."
ireland_events.presidency_dissolution_case.a: "Ask for dissolution on written cabinet advice and face the electorate."
ireland_events.presidency_dissolution_case.b: "Keep the Dáil sitting and settle the dispute inside the coalition."
ireland_events.presidency_succession.t: "Presidency Succession"
ireland_events.presidency_succession.d: "The first presidential succession will establish whether the office belongs to one personality or to a repeatable constitutional practice. The Dáil must choose a successor while Social Consent stands at [?ireland_social_consent|0]."
ireland_events.presidency_succession.a: "Name a successor through the public constitutional procedure."
ireland_events.presidency_succession.b: "Keep the office vacant until the parties can agree a mandate."
ireland_events.trade_annuity_terms.t: "Trade Annuity Terms"
ireland_events.trade_annuity_terms.d: "The annuity question is the price of closing the economic war: Dublin can settle the debt and recover the treaty ports, but the agreement will bind the 1938 budget and future trade. National Provision is [?ireland_provision_display|0]."
ireland_events.trade_annuity_terms.a: "Settle the annuities and reclaim the ports under the written agreement."
ireland_events.trade_annuity_terms.b: "Refuse the package and preserve room for a harder bargain."
ireland_events.trade_dail_approval.t: "Trade Dáil Approval"
ireland_events.trade_dail_approval.d: "The 1938 trade settlement reaches the Dáil as a choice between recovering the ports and accepting the financial and diplomatic terms attached to them. National Provision is [?ireland_provision_display|0], so sovereignty has a material ledger."
ireland_events.trade_dail_approval.a: "Ratify the agreement and take the ports back under Irish authority."
ireland_events.trade_dail_approval.b: "Send the agreement back for a narrower financial settlement."
ireland_events.trade_cobh_inventory.t: "Trade Cobh Inventory"
ireland_events.trade_cobh_inventory.d: "The Cobh handover requires an inventory of stores, leases, harbour works, and the authority that will maintain them after British withdrawal. A symbolic flag cannot replace a staffed port or a recorded chain of responsibility."
ireland_events.trade_cobh_inventory.a: "Take custody of the harbour with a complete stores and works ledger."
ireland_events.trade_cobh_inventory.b: "Delay the handover until the departments can staff and supply it."
ireland_events.trade_berehaven_lough_swilly.t: "Trade Berehaven Lough Swilly"
ireland_events.trade_berehaven_lough_swilly.d: "Berehaven and Lough Swilly return to Irish administration only if pilots, coastal signals, stores, and patrol rules are ready. The Navy can claim sovereignty, but the coast will judge it by service and safety."
ireland_events.trade_berehaven_lough_swilly.a: "Open both harbours under Irish pilotage and a published patrol rule."
ireland_events.trade_berehaven_lough_swilly.b: "Keep the transfer provisional until coastal services are funded."
ireland_events.emergency_war_news.t: "Emergency War News"
ireland_events.emergency_war_news.d: "The outbreak of war reaches Ireland as a test of information discipline. The government must announce neutrality, explain the emergency law, and keep public confidence without pretending that the Atlantic is distant. Neutrality Integrity is [?ireland_neutrality_integrity|0]."
ireland_events.emergency_war_news.a: "Declare neutrality publicly and explain the emergency's legal limits."
ireland_events.emergency_war_news.b: "Issue only a short warning and keep the cabinet's options private."
ireland_events.emergency_first_amendment.t: "Emergency First Amendment"
ireland_events.emergency_first_amendment.d: "The first emergency amendment decides how far the executive may act before the Dáil has reviewed the order. Its text must cover censorship, internment, shipping, and judicial remedy rather than grant an unbounded power."
ireland_events.emergency_first_amendment.a: "Pass a dated amendment with Dáil review and judicial remedy."
ireland_events.emergency_first_amendment.b: "Retain the narrower constitutional text and postpone the wider powers."
ireland_events.emergency_powers_act.t: "Emergency Powers Act"
ireland_events.emergency_powers_act.d: "The Emergency Powers Act gives the cabinet tools for shipping control, intelligence, requisition, and public order. Its legitimacy depends on named offices, recorded orders, and a review path that can end the exceptional authority."
ireland_events.emergency_powers_act.a: "Name the offices, warrants, and review committee in the Act."
ireland_events.emergency_powers_act.b: "Keep the Act narrow and make departments request each exceptional order."
ireland_events.emergency_six_month_review.t: "Emergency Six Month Review"
ireland_events.emergency_six_month_review.d: "Six months of emergency administration have left a ledger of censorship orders, internments, requisitions, and appeals. The Dáil must decide what remains necessary, what must be released, and who answers for the remainder."
ireland_events.emergency_six_month_review.a: "Release powers whose necessity is no longer demonstrated."
ireland_events.emergency_six_month_review.b: "Renew only the orders that carry a named operational case."
ireland_events.tillage_quota_design.t: "Tillage Quota Design"
ireland_events.tillage_quota_design.d: "The compulsory tillage quota begins with a national acreage target and ends with a county officer asking a farmer to change what can be grown. National Provision is [?ireland_provision_display|0]; the quota must carry both food security and a price promise."
ireland_events.tillage_quota_design.a: "Set the quota by soil, transport, and a guaranteed producer price."
ireland_events.tillage_quota_design.b: "Let counties negotiate the acreage and accept a less uniform harvest."
ireland_events.tillage_seed_and_fertiliser.t: "Tillage Seed and Fertiliser"
ireland_events.tillage_seed_and_fertiliser.d: "Seed and fertiliser are the hidden limit on the tillage programme. Imports, rail wagons, and county stores must be assigned before the state can claim that a higher target is anything more than paper."
ireland_events.tillage_seed_and_fertiliser.a: "Reserve seed and fertiliser for the highest-yielding districts first."
ireland_events.tillage_seed_and_fertiliser.b: "Distribute the stores evenly and accept lower yields in the best districts."
ireland_events.tillage_inspector_dispute.t: "Tillage Inspector Dispute"
ireland_events.tillage_inspector_dispute.d: "Inspectors are reporting land that cannot meet the paper quota, while county officials accuse them of protecting large farms. The dispute will decide whether the programme is enforced by evidence or by political pressure."
ireland_events.tillage_inspector_dispute.a: "Publish the inspection standard and hear appeals in each county."
ireland_events.tillage_inspector_dispute.b: "Trust the county boards and remove the most intrusive inspectors."
ireland_events.tillage_harvest_storage.t: "Tillage Harvest Storage"
ireland_events.tillage_harvest_storage.d: "The harvest exists, but storage, milling, and transport will decide whether it reaches households before spoilage or black-market diversion. Provision is [?ireland_provision_display|0], and the county storehouses are already competing for wagons."
ireland_events.tillage_harvest_storage.a: "Fill the county stores and protect the transport route to the mills."
ireland_events.tillage_harvest_storage.b: "Leave farms to sell locally and accept uneven regional reserves."
ireland_events.ration_fuel_and_goods.t: "Ration Fuel and Goods"
ireland_events.ration_fuel_and_goods.d: "Fuel, soap, coal, and imported goods are being rationed through the same strained transport system. The government must decide which services receive a guaranteed allocation while National Provision stands at [?ireland_provision_display|0]."
ireland_events.ration_fuel_and_goods.a: "Protect hospitals, farms, fishing, and essential transport in that order."
ireland_events.ration_fuel_and_goods.b: "Give counties a flexible quota and let local boards set priorities."
ireland_events.ration_book_distribution.t: "Ration Book Distribution"
ireland_events.ration_book_distribution.d: "Ration books are reaching urban households first, while rural families and seasonal workers fear that the register will miss them. Distribution is an administrative test of whether the state can see the people it claims to protect."
ireland_events.ration_book_distribution.a: "Use a national register with county appeals and mobile issue offices."
ireland_events.ration_book_distribution.b: "Keep distribution local and trust parish and county knowledge."
ireland_events.ration_price_dispute.t: "Ration Price Dispute"
ireland_events.ration_price_dispute.d: "The controlled price has protected one household and bankrupted another supplier. The price board must decide whether a subsidy, a new ceiling, or a smaller ration will keep food moving without rewarding hoarding."
ireland_events.ration_price_dispute.a: "Subsidise the essential ration and audit the supplier margin."
ireland_events.ration_price_dispute.b: "Lower the ration and let the price reflect the scarce import."
ireland_events.ration_black_market_review.t: "Ration Black Market Review"
ireland_events.ration_black_market_review.d: "The black market review finds both profiteers and households buying what the official ration cannot deliver. Enforcement can recover stock, but only supply and a credible price can make the market disappear."
ireland_events.ration_black_market_review.a: "Target hoarding and release verified stock through the ration system."
ireland_events.ration_black_market_review.b: "Reduce enforcement and let households trade the shortfall locally."
ireland_events.shipping_commercial_withdrawal.t: "Shipping Commercial Withdrawal"
ireland_events.shipping_commercial_withdrawal.d: "Shipping Commercial Withdrawal has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.shipping_commercial_withdrawal.a: "Keep the commercial route open with insurance and a named cargo priority."
ireland_events.shipping_commercial_withdrawal.b: "Withdraw the exposed service and protect the crews from an impossible schedule."
ireland_events.shipping_incorporation.t: "Shipping Incorporation"
ireland_events.shipping_incorporation.d: "Irish Shipping is being asked to carry the neutral lifeline as a public service while owners, crews, insurers, and ministries argue over risk. National Provision is [?ireland_provision_display|0]; incorporation must name who pays for the voyages."
ireland_events.shipping_incorporation.a: "Incorporate the service with public insurance and a published cargo priority."
ireland_events.shipping_incorporation.b: "Keep private operators independent and charter only essential voyages."
ireland_events.shipping_vessel_charters.t: "Shipping Vessel Charters"
ireland_events.shipping_vessel_charters.d: "Shipping Vessel Charters has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.shipping_vessel_charters.a: "Charter the vessel under Irish papers and an audited neutral manifest."
ireland_events.shipping_vessel_charters.b: "Refuse the charter until the owner accepts Irish rescue and inspection rules."
ireland_events.shipping_losses_and_claims.t: "Shipping Losses and Claims"
ireland_events.shipping_losses_and_claims.d: "Shipping Losses and Claims has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.shipping_losses_and_claims.a: "Compensate the verified loss and demand a formal foreign answer."
ireland_events.shipping_losses_and_claims.b: "Close the route until the claim and the neutral conduct are proven."
ireland_events.coastwatch_service_creation.t: "Coastwatch Service Creation"
ireland_events.coastwatch_service_creation.d: "The first Coastwatch posts will depend on fishermen, LDF volunteers, signal lamps, and a reporting book that can be checked after the incident. National Readiness is [?ireland_readiness_display|0]; a service without a chain of relief is only a promise."
ireland_events.coastwatch_service_creation.a: "Create the service from local crews and publish the coastal reporting rule."
ireland_events.coastwatch_service_creation.b: "Keep a few pilot posts and wait for regular staffing."
ireland_events.coastwatch_six_sector_posts.t: "Coastwatch Six Sector Posts"
ireland_events.coastwatch_six_sector_posts.d: "Six sector posts would connect Donegal, the west coast, the south, and the eastern approaches to one Coastwatch ledger. The choice is whether local knowledge receives a real relay network or remains an isolated warning."
ireland_events.coastwatch_six_sector_posts.a: "Fund the six-sector relay and train a reserve for every post."
ireland_events.coastwatch_six_sector_posts.b: "Cover the most exposed sectors and accept gaps elsewhere."
ireland_events.coastwatch_ship_to_shore_reports.t: "Coastwatch Ship to Shore Reports"
ireland_events.coastwatch_ship_to_shore_reports.d: "A ship-to-shore report must carry position, course, flag, weather, and the time of observation. It is useful only when the Garda, Navy, and Coastwatch can compare the report without rewriting it for a political audience."
ireland_events.coastwatch_ship_to_shore_reports.a: "Standardise the report and give every service access to the same record."
ireland_events.coastwatch_ship_to_shore_reports.b: "Keep reports within the naval office until the security procedure is tested."
ireland_events.coastwatch_disbandment.t: "Coastwatch Disbandment"
ireland_events.coastwatch_disbandment.d: "The Coastwatch is expensive to keep after the immediate scare, but disbandment would erase trained observers and local trust. The cabinet must decide whether a smaller service can preserve the neutral record."
ireland_events.coastwatch_disbandment.a: "Retain a permanent coastwatch cadre under civilian oversight."
ireland_events.coastwatch_disbandment.b: "Stand down the posts and keep only a naval emergency reserve."
ireland_events.mobilisation_regular_army.t: "Mobilisation Regular Army"
ireland_events.mobilisation_regular_army.d: "The regular Army can expand only through officers, barracks, transport, and a written command relationship with the civil government. National Readiness is [?ireland_readiness_display|0]; numbers alone do not make a usable force."
ireland_events.mobilisation_regular_army.a: "Call the regular units under a recorded civil-military mobilisation order."
ireland_events.mobilisation_regular_army.b: "Keep the standing force intact and train for a later call-up."
ireland_events.mobilisation_reserves_and_lsf.t: "Mobilisation Reserves and LSF"
ireland_events.mobilisation_reserves_and_lsf.d: "Reservists and the Local Security Force are being asked to share the burden of defence, but their employers and families need a timetable. The state must decide whether the reserve is a real formation or a list on paper."
ireland_events.mobilisation_reserves_and_lsf.a: "Mobilise the reserve with employer protection and a named training cycle."
ireland_events.mobilisation_reserves_and_lsf.b: "Keep the LSF local and avoid a national call that cannot be supplied."
ireland_events.mobilisation_ldf_shortages.t: "Mobilisation LDF Shortages"
ireland_events.mobilisation_ldf_shortages.d: "The LDF has volunteers but not enough rifles, boots, radios, or instructors. The shortage is now visible in the readiness ledger; a public promise to defend every coast would exceed the stockpile."
ireland_events.mobilisation_ldf_shortages.a: "Issue equipment to the exposed districts and publish the remaining gap."
ireland_events.mobilisation_ldf_shortages.b: "Reduce the task and preserve the limited stores for the regular Army."
ireland_events.mobilisation_demobilisation.t: "Mobilisation Demobilisation"
ireland_events.mobilisation_demobilisation.d: "Demobilisation must return workers to farms and workshops without dissolving the command, reserve, and coastal warning systems built during the emergency. Readiness is [?ireland_readiness_display|0], not a switch that can be turned off."
ireland_events.mobilisation_demobilisation.a: "Release men in stages while retaining trained cadres and equipment records."
ireland_events.mobilisation_demobilisation.b: "Demobilise quickly and trust ordinary administration to rebuild the reserve."
ireland_events.internment_foreign_crews.t: "Internment Foreign Crews"
ireland_events.internment_foreign_crews.d: "The foreign crew has entered Irish custody after a neutral incident. Justice must record nationality, cause, health, and the legal basis for internment before the camp becomes a diplomatic accusation."
ireland_events.internment_foreign_crews.a: "Intern the crew under equal rules and notify the consular channel."
ireland_events.internment_foreign_crews.b: "Use supervised parole where the incident record does not justify a camp."
ireland_events.internment_camps_and_parole.t: "Internment Camps and Parole"
ireland_events.internment_camps_and_parole.d: "Camp rules now determine whether internment is a lawful safeguard or an unreviewed punishment. Parole can reduce the burden, but only with reporting, a destination, and a clear consequence for breach."
ireland_events.internment_camps_and_parole.a: "Fund the camp and create a supervised parole board."
ireland_events.internment_camps_and_parole.b: "Keep the camp small and refuse parole until the security file is complete."
ireland_events.internment_escape_and_hunger_strike.t: "Internment Escape and Hunger Strike"
ireland_events.internment_escape_and_hunger_strike.d: "An escape and hunger strike have made the camp's conditions a public question. A crackdown may restore the perimeter while destroying the evidence that the internment is being administered lawfully."
ireland_events.internment_escape_and_hunger_strike.a: "Open an independent inspection and negotiate medical supervision."
ireland_events.internment_escape_and_hunger_strike.b: "Restore the perimeter first and leave the complaint to the department."
ireland_events.internment_equal_treatment_review.t: "Internment Equal Treatment Review"
ireland_events.internment_equal_treatment_review.d: "The review compares food, medical care, correspondence, and release rules across nationalities. Neutrality Integrity is [?ireland_neutrality_integrity|0]; unequal treatment would spend it faster than any foreign protest."
ireland_events.internment_equal_treatment_review.a: "Apply one camp standard and publish the findings to the Dáil."
ireland_events.internment_equal_treatment_review.b: "Keep the review confidential while the Garda corrects the worst disparities."
ireland_events.intelligence_agent_landings.t: "Intelligence Agent Landings"
ireland_events.intelligence_agent_landings.d: "An agent landing turns the shoreline into an intelligence and legal problem. G2 and the Garda must identify the network, protect local witnesses, and decide whether the arrest serves Irish security or a foreign narrative."
ireland_events.intelligence_agent_landings.a: "Admit the case to G2 under written authority and preserve the landing evidence."
ireland_events.intelligence_agent_landings.b: "Keep the investigation with the Garda and close the foreign liaison channel."
ireland_events.intelligence_surveillance_liaison.t: "Intelligence Surveillance Liaison"
ireland_events.intelligence_surveillance_liaison.d: "The surveillance liaison asks what Ireland may share with a foreign service while remaining neutral. The answer needs a named Irish case officer, a legal purpose, and a rule against turning intelligence into an invitation to operate freely."
ireland_events.intelligence_surveillance_liaison.a: "Open a limited liaison file with Irish control of every tasking."
ireland_events.intelligence_surveillance_liaison.b: "Share only public reports and keep foreign officers outside the casework."
ireland_events.intelligence_plan_w_files.t: "Intelligence Plan W Files"
ireland_events.intelligence_plan_w_files.d: "Plan W files describe an emergency relationship with Britain, but the papers cannot erase Irish command or decide the Northern question by themselves. The liaison must be admitted as a contingency record with a public constitutional boundary."
ireland_events.intelligence_plan_w_files.a: "Register Plan W as a controlled defence file with Irish command preserved."
ireland_events.intelligence_plan_w_files.b: "Seal the papers and keep contingency planning outside the political record."
ireland_events.intelligence_document_exposure.t: "Intelligence Document Exposure"
ireland_events.intelligence_document_exposure.d: "A leaked intelligence document exposes both Irish precautions and a foreign assumption about access. The government must protect sources without hiding the fact that neutrality is being tested by the documents it holds."
ireland_events.intelligence_document_exposure.a: "Publish the narrow fact pattern and protect the operational names."
ireland_events.intelligence_document_exposure.b: "Deny the report publicly and keep the entire file classified."
ireland_events.blacksod_station_staffing.t: "Blacksod Station Staffing"
ireland_events.blacksod_station_staffing.d: "Blacksod's station needs observers, instruments, fuel, and a safe line to the forecasting office. Weather intelligence is a neutrality instrument only when the people collecting it can keep the record independent."
ireland_events.blacksod_station_staffing.a: "Staff the station and protect the observation chain from military pressure."
ireland_events.blacksod_station_staffing.b: "Run a reduced watch until equipment and pay can be guaranteed."
ireland_events.blacksod_deteriorating_report.t: "Blacksod Deteriorating Report"
ireland_events.blacksod_deteriorating_report.d: "Blacksod's observations show weather deteriorating across the Atlantic approaches. Allied planners want the report quickly, while Irish officials must decide whether controlled transmission can remain equal, recorded, and independent of operational command."
ireland_events.blacksod_deteriorating_report.a: "Transmit the warning under the standing neutral weather protocol."
ireland_events.blacksod_deteriorating_report.b: "Hold the detailed report until the receiving channels are verified."
ireland_events.blacksod_controlled_transmission.t: "Blacksod Controlled Transmission"
ireland_events.blacksod_controlled_transmission.d: "A controlled Blacksod transmission can warn shipping and air crews without becoming a gift to one belligerent. The report must name what is shared, what is withheld, and who records every request."
ireland_events.blacksod_controlled_transmission.a: "Share the weather warning under equal neutral rules."
ireland_events.blacksod_controlled_transmission.b: "Keep the report domestic until a public disclosure rule is agreed."
ireland_events.blacksod_recognition_or_exposure.t: "Blacksod Recognition Or Exposure"
ireland_events.blacksod_recognition_or_exposure.d: "Blacksod Recognition Or Exposure asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.blacksod_recognition_or_exposure.a: "Recognise the station's record and publish the neutral weather protocol."
ireland_events.blacksod_recognition_or_exposure.b: "Keep the station's role quiet until the foreign requests are verified."
ireland_events.belfast_dockside_warning.t: "Belfast Dockside Warning"
ireland_events.belfast_dockside_warning.d: "The docks turn the Northern question into a question of wages, food, and armed order. Integration capacity is [?ireland_northern_integration_capacity|0] and security stability is [?ireland_northern_security_stability|0]; any relief or security contact will be judged in Belfast, not only in Dublin."
ireland_events.belfast_dockside_warning.a: "Send relief through a witnessed local dock compact."
ireland_events.belfast_dockside_warning.b: "Keep the border posture closed until the harbour is secure."
ireland_events.belfast_easter_tuesday_raid.t: "Belfast Easter Tuesday Raid"
ireland_events.belfast_easter_tuesday_raid.d: "The raid has made rumours, police powers, and communal fear immediate. Security stability is [?ireland_northern_security_stability|0], and the government must decide whether investigation and relief can proceed without turning a Northern incident into a Southern mandate."
ireland_events.belfast_easter_tuesday_raid.a: "Open an inquiry with local witnesses and equal protection."
ireland_events.belfast_easter_tuesday_raid.b: "Seal the route and let the security services contain the damage."
ireland_events.belfast_relief_request.t: "Belfast Relief Request"
ireland_events.belfast_relief_request.d: "Belfast's request is for food, medicine, and municipal continuity rather than a constitutional surrender. Integration capacity is [?ireland_northern_integration_capacity|0]; assistance can build trust only if its distribution is visible to both communities."
ireland_events.belfast_relief_request.a: "Answer through councils, churches, and a published relief ledger."
ireland_events.belfast_relief_request.b: "Refuse the request and preserve the separation of jurisdictions."
ireland_events.belfast_reconstruction_memory.t: "Belfast Reconstruction Memory"
ireland_events.belfast_reconstruction_memory.d: "The memory of Belfast's damage now competes with the demands of reconstruction. National Provision is [?ireland_provision_display|0]; a visible repair programme may strengthen a future settlement, but it cannot substitute for consent or control."
ireland_events.belfast_reconstruction_memory.a: "Fund a witnessed repair programme without claiming sovereignty."
ireland_events.belfast_reconstruction_memory.b: "Archive the damage and reserve scarce materials for the South."
ireland_events.unity_fall_of_france.t: "Unity Fall Of France"
ireland_events.unity_fall_of_france.d: "The fall of France changes the strategic map and makes every British approach more urgent. Ireland must decide whether the crisis opens a safeguarded conversation or tightens the neutral refusal."
ireland_events.unity_fall_of_france.a: "Open talks on defence cooperation without surrendering Irish command."
ireland_events.unity_fall_of_france.b: "Reaffirm neutrality and refuse to bargain under immediate fear."
ireland_events.unity_macdonald_talks.t: "Unity Macdonald Talks"
ireland_events.unity_macdonald_talks.d: "Malcolm MacDonald's channel can discuss ports, airspace, supply, and a Northern settlement, but only a written bargain can survive a change of cabinet. British Flexibility is [?ireland_northern_british_flexibility|0]."
ireland_events.unity_macdonald_talks.a: "Put defence cooperation and Northern guarantees into a dated draft."
ireland_events.unity_macdonald_talks.b: "Keep the channel exploratory and refuse an undefined commitment."
ireland_events.unity_neutral_counterproposal.t: "Unity Neutral Counterproposal"
ireland_events.unity_neutral_counterproposal.d: "The neutral counterproposal must distinguish access from alliance: Irish command, withdrawal terms, finance, policing, and public ratification are separate clauses. It offers a path to cooperation without granting free ports or free alignment."
ireland_events.unity_neutral_counterproposal.a: "Answer with a complete safeguard schedule and a ratification plan."
ireland_events.unity_neutral_counterproposal.b: "Answer with neutrality preserved and only humanitarian access offered."
ireland_events.unity_final_cabinet_decision.t: "Unity Final Cabinet Decision"
ireland_events.unity_final_cabinet_decision.d: "The final cabinet paper must name the defence scope, Irish command, British implementation authority, transition timetable, policing, ports and bases, finance, labour, minority safeguards, foreign guarantees, and the public ratification method. Readiness is [?ireland_readiness_display|0], British Flexibility is [?ireland_northern_british_flexibility|0], Nationalist Consent is [?ireland_northern_nationalist_consent|0], and Unionist Consent is [?ireland_northern_unionist_consent|0]. A recorded result may be cooperation without unity, a pledge, a federal or unitary transition, refusal, delay, rejection, or collapse; none grants Northern control or cores."
ireland_events.unity_final_cabinet_decision.federal: "Choose the federal transition with written safeguards and ratification."
ireland_events.unity_final_cabinet_decision.unitary: "Choose the negotiated unitary transition with local guarantees."
ireland_events.unity_final_cabinet_decision.postwar: "Accept a postwar unity pledge with interim guarantees."
ireland_events.unity_final_cabinet_decision.defence: "Accept defence cooperation without pretending unity is settled."
ireland_events.unity_final_cabinet_decision.rejected: "Reject the proposal and preserve the constitutional boundary."
ireland_events.controls_supplies_and_services.t: "Controls Supplies and Services"
ireland_events.controls_supplies_and_services.d: "The control office has to keep coal, food, fuel, and transport moving without letting emergency requisition become an unreviewable command economy. National Provision is [?ireland_provision_display|0], and each order will be tied to a named service."
ireland_events.controls_supplies_and_services.a: "Publish the supply schedules and audit every requisition."
ireland_events.controls_supplies_and_services.b: "Leave departments with local discretion and accept uneven provision."
ireland_events.controls_demobilisation_pressure.t: "Controls Demobilisation Pressure"
ireland_events.controls_demobilisation_pressure.d: "Postwar shortages are pressing the government to release controls before the transport and supply offices are ready. The choice is between household relief now and a slower expiry that protects the administrative reserve."
ireland_events.controls_demobilisation_pressure.a: "Release the least harmful controls and protect essential supply by schedule."
ireland_events.controls_demobilisation_pressure.b: "Keep the controls until the transport and ration ledgers are balanced."
ireland_events.controls_price_review.t: "Controls Price Review"
ireland_events.controls_price_review.d: "The price board's figures no longer match the cost of transport and imported fuel. A national ceiling can protect households, but only if the state can supply the goods it promises and hear the counties that carry the shortage."
ireland_events.controls_price_review.a: "Rebase the ceiling on audited costs and protect essential households."
ireland_events.controls_price_review.b: "Keep the ceiling provisional and let county boards negotiate exceptions."
ireland_events.controls_staged_expiry.t: "Controls Staged Expiry"
ireland_events.controls_staged_expiry.d: "The emergency controls now have an expiry schedule. Ending them too quickly risks fuel, ration, and shipping failures; keeping them without a review would make temporary authority ordinary."
ireland_events.controls_staged_expiry.a: "Release the controls in stages with a public supply test at each step."
ireland_events.controls_staged_expiry.b: "Extend the order and require a new Dáil vote before each release."
ireland_events.republic_interparty_mandate.t: "Republic Interparty Mandate"
ireland_events.republic_interparty_mandate.d: "The republic's inter-party mandate must say what changes in the external relationship and what remains ordinary law. The Dáil can ratify a republic, but it cannot ratify an undefined foreign policy by implication."
ireland_events.republic_interparty_mandate.a: "Agree the republican clauses across the parties and publish the foreign terms."
ireland_events.republic_interparty_mandate.b: "Proceed with the domestic declaration and defer the external question."
ireland_events.republic_act_and_commencement.t: "Republic Act and Commencement"
ireland_events.republic_act_and_commencement.d: "The Republic of Ireland Act will take effect through offices, diplomatic notes, seals, and public notice. Its commencement must preserve contracts and administration while making the new constitutional form unmistakable."
ireland_events.republic_act_and_commencement.a: "Commence the Act with a complete office and diplomatic transition schedule."
ireland_events.republic_act_and_commencement.b: "Announce the Act but phase the external changes through a later review."
ireland_events.republic_external_relations.t: "Republic External Relations"
ireland_events.republic_external_relations.d: "Foreign governments are asking what the republic means for treaties, missions, shipping, and neutrality. Ireland must answer in its own name without turning recognition into a reward for political theatre."
ireland_events.republic_external_relations.a: "Send a consistent republican note through every diplomatic channel."
ireland_events.republic_external_relations.b: "Keep the old channels temporarily and negotiate recognition case by case."
ireland_events.republic_northern_guarantees.t: "Republic Northern Guarantees"
ireland_events.republic_northern_guarantees.d: "Republic Northern Guarantees has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.republic_northern_guarantees.a: "Publish the Northern rights schedule before seeking recognition."
ireland_events.republic_northern_guarantees.b: "Keep recognition separate until local consent can be verified."
ireland_events.un_application.t: "Un Application"
ireland_events.un_application.d: "An application to the United Nations will ask whether Ireland's neutrality and foreign policy can be stated as a contribution rather than a grievance. The file must carry the republic's law, record, and willingness to accept the Charter's obligations."
ireland_events.un_application.a: "Apply with a neutral-service record and a clear Charter commitment."
ireland_events.un_application.b: "Wait for a stronger diplomatic moment and build the record at home."
ireland_events.un_recognition_and_delay.t: "Un Recognition and Delay"
ireland_events.un_recognition_and_delay.d: "Un Recognition and Delay asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.un_recognition_and_delay.a: "Seek recognition through a defined neutral contribution and a complete file."
ireland_events.un_recognition_and_delay.b: "Delay the application and strengthen the record through domestic service."
ireland_events.un_neutral_contribution.t: "Un Neutral Contribution"
ireland_events.un_neutral_contribution.d: "The neutral contribution must be practical: observers, rescue, weather, medical aid, and a record of equal treatment. Ireland can use the United Nations to make neutrality visible without joining a bloc."
ireland_events.un_neutral_contribution.a: "Offer a defined neutral service and publish its rules of engagement."
ireland_events.un_neutral_contribution.b: "Offer humanitarian aid only and avoid a permanent international commitment."
ireland_events.un_admission_14_december_1955.t: "Un Admission 14 December 1955"
ireland_events.un_admission_14_december_1955.d: "Admission on 14 December 1955 closes the long diplomatic wait. The new member must decide how to use the seat: as a neutral witness, a development advocate, or a government that keeps its influence deliberately narrow."
ireland_events.un_admission_14_december_1955.a: "Take the seat and make neutral service the republic's public contribution."
ireland_events.un_admission_14_december_1955.b: "Accept admission quietly and keep foreign policy focused on domestic recovery."
ireland_events.reconstruction_housing_and_transport.t: "Reconstruction Housing and Transport"
ireland_events.reconstruction_housing_and_transport.d: "Housing repair is competing with bridge, rail, and harbour work for timber, cement, labour, and transport. National Provision is [?ireland_provision_display|0]; the ministry must choose whether to finish homes quickly or restore the routes that carry the next building season."
ireland_events.reconstruction_housing_and_transport.a: "Build the housing programme around the damaged transport corridors."
ireland_events.reconstruction_housing_and_transport.b: "Spread materials across counties and accept slower completion."
ireland_events.reconstruction_peat_and_power.t: "Reconstruction Peat and Power"
ireland_events.reconstruction_peat_and_power.d: "Peat stations and rural electrification promise a warmer, more productive country, but they require machinery, rail slots, and trained workers. The energy board must decide whether to centralise generation or let county schemes grow at different speeds."
ireland_events.reconstruction_peat_and_power.a: "Tie peat investment to a national power grid and technical service."
ireland_events.reconstruction_peat_and_power.b: "Back county schemes first and accept an uneven network."
ireland_events.reconstruction_ports_and_veterans.t: "Reconstruction Ports and Veterans"
ireland_events.reconstruction_ports_and_veterans.d: "Returning crews and veterans are asking for work in the ports that carried the emergency. Reconstruction can honour that claim through dock repair and training, but the same materials are needed for homes and merchant ships."
ireland_events.reconstruction_ports_and_veterans.a: "Put veterans into a port repair corps with guaranteed training."
ireland_events.reconstruction_ports_and_veterans.b: "Prioritise civilian housing and let the ports recover more slowly."
ireland_events.reconstruction_regional_balance.t: "Reconstruction Regional Balance"
ireland_events.reconstruction_regional_balance.d: "Dublin's ministries can account for a national recovery while western counties see the workshops and roads pass them by. The balance review must name the regional allocation, the transport cost, and the office that will answer when a county is left behind."
ireland_events.reconstruction_regional_balance.a: "Reserve a regional share before the central projects are approved."
ireland_events.reconstruction_regional_balance.b: "Concentrate on the fastest national return and review the counties later."
ireland_events.confidence_vote_lost.t: "Confidence Vote Lost"
ireland_events.confidence_vote_lost.d: "The government has lost a confidence vote. A caretaker, dissolution, or coalition repair must be chosen before the Dáil treats the defeat as a change of government; the National Settlement is [?ireland_settlement_bop_value|0]."
ireland_events.confidence_vote_lost.a: "Accept the defeat, seek a mandate, and let the Dáil count the replacement."
ireland_events.confidence_vote_lost.b: "Keep a caretaker in place while the parties negotiate a supply agreement."
ireland_events.confidence_presidential_choice.t: "Confidence Presidential Choice"
ireland_events.confidence_presidential_choice.d: "The president must decide whether the defeated ministry still commands enough supply to remain. The office can protect procedure, but cannot manufacture a majority; Dáil support is being measured against a settlement of [?ireland_settlement_bop_value|0]."
ireland_events.confidence_presidential_choice.a: "Recognise the majority's alternative and ask it to form a government."
ireland_events.confidence_presidential_choice.b: "Refuse a premature commission and call for a fresh election."
ireland_events.confidence_caretaker_or_dissolution.t: "Confidence Caretaker Or Dissolution"
ireland_events.confidence_caretaker_or_dissolution.d: "A caretaker can keep salaries, supplies, and ordinary administration moving, but it cannot quietly become a new government. The president and the Dáil must set a date while Social Consent is [?ireland_social_consent|0]."
ireland_events.confidence_caretaker_or_dissolution.a: "Limit the caretaker and publish a fixed election timetable."
ireland_events.confidence_caretaker_or_dissolution.b: "Extend the caretaker under a written confidence-and-supply promise."
ireland_events.fianna_fail_retirement_shadow.t: "Fianna Fail Retirement Shadow"
ireland_events.fianna_fail_retirement_shadow.d: "De Valera's retirement shadow has reached the Fianna Fáil organisation before it has chosen a successor. The party must preserve cabinet authority while the National Settlement is [?ireland_settlement_bop_value|0] and Social Consent is [?ireland_social_consent|0]."
ireland_events.fianna_fail_retirement_shadow.a: "Keep the succession inside the cabinet and the Dáil."
ireland_events.fianna_fail_retirement_shadow.b: "Let the old leader's authority hold until a crisis forces a contest."
ireland_events.fianna_fail_lemass_contest.t: "Fianna Fail Lemass Contest"
ireland_events.fianna_fail_lemass_contest.d: "Lemass can turn Fianna Fáil toward industrial development, but the contest also exposes the party's regional and personal loyalties. The immediate question is whether a developmental programme can survive a divided parliamentary machine."
ireland_events.fianna_fail_lemass_contest.a: "Give Lemass a recorded programme and a parliamentary mandate."
ireland_events.fianna_fail_lemass_contest.b: "Protect the existing coalition and postpone industrial rupture."
ireland_events.fianna_fail_party_split.t: "Fianna Fail Party Split"
ireland_events.fianna_fail_party_split.d: "The Fianna Fáil split is no longer a private quarrel: candidate discipline, local organisation, and cabinet responsibility are pulling in different directions. A settlement that ignores the fracture will leave the next Dáil without a dependable majority."
ireland_events.fianna_fail_party_split.a: "Reconcile the factions under one public party charter."
ireland_events.fianna_fail_party_split.b: "Accept the split and let the electorate decide its price."
ireland_events.fine_gael_cosgrave_retirement.t: "Fine Gael Cosgrave Retirement"
ireland_events.fine_gael_cosgrave_retirement.d: "Cosgrave's retirement leaves Fine Gael with a memory of the Free State and no automatic claim to the next government. The party must decide whether continuity is a platform or an excuse to avoid renewal."
ireland_events.fine_gael_cosgrave_retirement.a: "Open a lawful leadership contest with the old guard present."
ireland_events.fine_gael_cosgrave_retirement.b: "Keep the succession quiet and preserve the existing machine."
ireland_events.fine_gael_mulcahy_or_ohiggins.t: "Fine Gael Mulcahy Or Ohiggins"
ireland_events.fine_gael_mulcahy_or_ohiggins.d: "Mulcahy offers military credibility and O'Higgins offers a different parliamentary voice. Fine Gael's choice will define whether the route speaks through disciplined organisation, constitutional argument, or both."
ireland_events.fine_gael_mulcahy_or_ohiggins.a: "Choose the leader who can command the Dáil and the party."
ireland_events.fine_gael_mulcahy_or_ohiggins.b: "Split the offices and make coalition discipline the safeguard."
ireland_events.fine_gael_costello_compromise.t: "Fine Gael Costello Compromise"
ireland_events.fine_gael_costello_compromise.d: "Costello's compromise can make Fine Gael acceptable to a coalition, but only if party leadership, parliamentary leadership, and the Taoiseach's office are written separately. The bargain must survive a confidence vote rather than merely satisfy a conference."
ireland_events.fine_gael_costello_compromise.a: "Ratify the Costello arrangement and name every office."
ireland_events.fine_gael_costello_compromise.b: "Refuse the compromise and risk another caretaker government."
ireland_events.dillon_intervention_dispute.t: "Dillon Intervention Dispute"
ireland_events.dillon_intervention_dispute.d: "Dillon's intervention now asks whether Ireland can enter a war without surrendering command, finance, customs, withdrawal, Northern, and review safeguards. National Readiness is [?ireland_readiness_display|0]; the material gate is a military plan, not a speech."
ireland_events.dillon_intervention_dispute.a: "Publish the safeguards and demand a counted war mandate."
ireland_events.dillon_intervention_dispute.b: "Keep dissent parliamentary until the armed forces are ready."
ireland_events.dillon_resignation_or_platform.t: "Dillon Resignation Or Platform"
ireland_events.dillon_resignation_or_platform.d: "Dillon can leave the cabinet with a public platform or remain inside it and accept collective responsibility. Either choice changes the route's credibility with the Dáil, the Army, and the British negotiators."
ireland_events.dillon_resignation_or_platform.a: "Resign, publish the platform, and keep the issue constitutional."
ireland_events.dillon_resignation_or_platform.b: "Remain and bind the intervention to cabinet discipline."
ireland_events.dillon_failed_mandate.t: "Dillon Failed Mandate"
ireland_events.dillon_failed_mandate.d: "The intervention has failed to assemble its public, parliamentary, security, labour, Church, rural, and foreign safeguards. The defeat does not create a war or a free alliance; it leaves a record of the terms that must be rebuilt."
ireland_events.dillon_failed_mandate.a: "Return to the Dáil and rebuild the mandate clause by clause."
ireland_events.dillon_failed_mandate.b: "Close the intervention and preserve the neutral defence programme."
ireland_events.dillon_named_dail_vote.t: "The Named Dáil Vote"
ireland_events.dillon_named_dail_vote.d: "The confidence mission has assembled the recorded parliamentary bloc. Dillon's question is now before the Dáil as a named vote: carry the intervention under Irish safeguards, or defer it and rebuild the public mandate. The invasion exception has not erased the chamber's authority."
ireland_events.dillon_named_dail_vote.carry: "Carry the intervention mandate under Irish command."
ireland_events.dillon_named_dail_vote.defer: "Defer the vote and rebuild the parliamentary mandate."
ireland_events.labour_affiliate_dispute.t: "Labour Affiliate Dispute"
ireland_events.labour_affiliate_dispute.d: "Labour's affiliates are arguing over whether parliamentary discipline protects workers or mutes them. The route must choose rules for unions, candidates, and industrial action before it can promise a social republic."
ireland_events.labour_affiliate_dispute.a: "Keep the affiliates inside a written Labour compact."
ireland_events.labour_affiliate_dispute.b: "Let the industrial organisations separate from the party."
ireland_events.labour_anti_communist_line.t: "Labour Anti Communist Line"
ireland_events.labour_anti_communist_line.d: "The anti-communist line can protect Labour from a rival vanguard, but it can also fracture the unions and narrow the social programme. The choice will be heard in the workplaces that the party claims to represent."
ireland_events.labour_anti_communist_line.a: "Draw the line publicly and defend independent union politics."
ireland_events.labour_anti_communist_line.b: "Leave room for the radical affiliates and risk a party split."
ireland_events.labour_reunion_or_split.t: "Labour Reunion Or Split"
ireland_events.labour_reunion_or_split.d: "The reunion conference has to settle leadership, candidate selection, industrial affiliation, and the meaning of social ownership. A reunion without rules will only delay the next split."
ireland_events.labour_reunion_or_split.a: "Ratify one Labour programme and restore the parliamentary bridge."
ireland_events.labour_reunion_or_split.b: "Keep the organisations separate under a non-aggression pact."
ireland_events.clann_athenry_foundation.t: "Clann Athenry Foundation"
ireland_events.clann_athenry_foundation.d: "Athenry's organisers want a national agrarian voice without surrendering county control. Clann na Talmhan must define prices, credit, land, and candidate selection before it asks rural voters for a common slate."
ireland_events.clann_athenry_foundation.a: "Found the Clann on county autonomy and a shared farm programme."
ireland_events.clann_athenry_foundation.b: "Keep the county organisations independent and bargain issue by issue."
ireland_events.clann_1940_test.t: "Clann 1940 Test"
ireland_events.clann_1940_test.d: "War conditions test whether the Clann is a producer movement or merely a rural protest vehicle. Tillage, prices, transport, and rationing now reach the farms that gave the organisation its authority."
ireland_events.clann_1940_test.a: "Accept wartime discipline in exchange for protected producer prices."
ireland_events.clann_1940_test.b: "Defend county discretion even if the national target is smaller."
ireland_events.clann_1943_merger.t: "Clann 1943 Merger"
ireland_events.clann_1943_merger.d: "The 1943 merger can give the agrarian movement a national slate, but it also asks county executives to surrender some of their independence. The bargain must name the leadership, programme, and local vetoes."
ireland_events.clann_1943_merger.a: "Merge under a county charter and one parliamentary slate."
ireland_events.clann_1943_merger.b: "Refuse the merger and preserve a federation of local blocs."
ireland_events.church_school_funding.t: "Church School Funding"
ireland_events.church_school_funding.d: "School grants have made parish structures indispensable to the classroom. The cabinet must decide whether public money buys a service under public standards or leaves the curriculum to the provider."
ireland_events.church_school_funding.a: "Fund the schools under a public curriculum and inspection rule."
ireland_events.church_school_funding.b: "Protect the existing parish arrangement and accept unequal oversight."
ireland_events.church_inspection_language.t: "Church Inspection Language"
ireland_events.church_inspection_language.d: "Inspection language now reaches religion, Irish, English, and the authority of teachers in the same classroom. A clerical service can remain important without becoming immune from a state record of standards and complaints."
ireland_events.church_inspection_language.a: "Inspect every funded school under one language and welfare standard."
ireland_events.church_inspection_language.b: "Leave language practice to the existing boards and audit only expenditure."
ireland_events.health_state_expansion.t: "Health State Expansion"
ireland_events.health_state_expansion.d: "A wider health state must decide whether county boards, hospitals, and the central department share authority. Expansion without staff and transport would turn a promise of care into another regional shortage."
ireland_events.health_state_expansion.a: "Build a national service with county boards and a published staffing plan."
ireland_events.health_state_expansion.b: "Strengthen the county boards first and postpone central consolidation."
ireland_events.health_mixed_board.t: "Health Mixed Board"
ireland_events.health_mixed_board.d: "The mixed health board brings doctors, county officials, religious providers, and labour representatives into one difficult room. Its first task is to set who pays, who inspects, and who receives treatment when supplies run short."
ireland_events.health_mixed_board.a: "Give the board a public mandate and publish its regional allocation rules."
ireland_events.health_mixed_board.b: "Keep the board advisory while departments negotiate the funding split."
ireland_events.emergency_order_expansion.t: "Emergency Order Expansion"
ireland_events.emergency_order_expansion.d: "The emergency office is asking for new powers over movement, requisition, and information. Expansion can close a real security gap, but every order must name its cause, its duration, and the review that can end it."
ireland_events.emergency_order_expansion.a: "Add the powers with a dated warrant and a Dáil review."
ireland_events.emergency_order_expansion.b: "Refuse the expansion and close the gap through ordinary departments."
ireland_events.emergency_dail_review.t: "Emergency Dáil Review"
ireland_events.emergency_dail_review.d: "The emergency review asks the Dáil to distinguish a temporary defence power from a permanent executive habit. The government must name the sunset, the reviewing committee, and the remedy for abuse; the National Settlement is [?ireland_settlement_bop_value|0]."
ireland_events.emergency_dail_review.a: "Publish the review, set the sunset, and return exceptional powers to Parliament."
ireland_events.emergency_dail_review.b: "Renew the order only with a narrower committee and a later review."
ireland_events.command_civil_authority.t: "Command Civil Authority"
ireland_events.command_civil_authority.d: "The command dispute is no longer about personalities alone. Officers, armed organisations, and the cabinet must decide whether operational orders can be issued through one civil chain while National Readiness is [?ireland_readiness_display|0]."
ireland_events.command_civil_authority.a: "Put every armed formation under a written civil command order."
ireland_events.command_civil_authority.b: "Keep the existing commands separate until the cabinet can mediate."
ireland_events.command_compromise_or_purge.t: "Command Compromise Or Purge"
ireland_events.command_compromise_or_purge.d: "The cabinet can reconcile the command dispute through an oath, an audit, and a retirement path, or it can purge the officers it distrusts. A purge may look decisive while leaving the state short of trained leadership."
ireland_events.command_compromise_or_purge.a: "Offer a documented compromise and audit the chain before dismissals."
ireland_events.command_compromise_or_purge.b: "Purge the disloyal commands and accept the readiness shock."
ireland_events.ira_russell_absence.t: "IRA Russell Absence"
ireland_events.ira_russell_absence.d: "Seán Russell's absence has unsettled the IRA Army Council and the local units that depended on its chief of staff. The question is whether the movement can keep a command record while prisoners, exiles, and local organisers pull it in different directions."
ireland_events.ira_russell_absence.a: "Put the succession before a civil review and separate politics from command."
ireland_events.ira_russell_absence.b: "Let the Army Council preserve the operational chain without outside direction."
ireland_events.ira_hayes_command.t: "IRA Hayes Command"
ireland_events.ira_hayes_command.d: "The Hayes command has inherited a movement with competing instructions, uneven local discipline, and a state determined to prevent an underground chain from becoming a rival government. Every order now risks either fragmentation or a crackdown."
ireland_events.ira_hayes_command.a: "Require written orders and civilian accountability for every local operation."
ireland_events.ira_hayes_command.b: "Keep the underground command intact and accept the risk of local refusal."
ireland_events.ira_local_refusal.t: "IRA Local Refusal"
ireland_events.ira_local_refusal.d: "A local unit has refused the Army Council's instruction. The refusal exposes the real boundary of the IRA route: political legitimacy cannot create obedience, and force cannot create a lawful public mandate."
ireland_events.ira_local_refusal.a: "Open a negotiated surrender and put the local grievance on the public record."
ireland_events.ira_local_refusal.b: "Send the command to enforce discipline and risk a wider split."
ireland_events.frank_ryan_survival_inquiry.t: "The Frank Ryan File"
ireland_events.frank_ryan_survival_inquiry.d: "Reports following Russell's fatal return voyage place Frank Ryan back under German control. The civil executive can authorise G2 to verify that he survived and establish the custody record, but every inquiry exposes another Irish channel to Berlin."
ireland_events.frank_ryan_survival_inquiry.a: "Open an Irish verification file and accept the foreign exposure."
ireland_events.frank_ryan_survival_inquiry.b: "Record him as unavailable to the republican settlement."
ireland_events.frank_ryan_return_hearing.t: "A Return Under Irish Warrants"
ireland_events.frank_ryan_return_hearing.d: "Ryan's survival is confirmed, but German custody is not political freedom. A return organised through Irish warrants, neutral intermediaries, and an independent medical review will consume political capacity, increase German leverage, and test neutrality before he can set foot in public life."
ireland_events.frank_ryan_return_hearing.a: "Pay for an Irish-controlled return, medical review, and published custody terms."
ireland_events.frank_ryan_return_hearing.b: "Refuse a return that leaves Berlin holding the conditions."
ireland_events.frank_ryan_axis_break.t: "No Mandate from Berlin"
ireland_events.frank_ryan_axis_break.d: "Return has ended Ryan's physical custody, not the suspicion created by German control. Only a public repudiation of Axis tutelage before the constituent authorities can restore him as an anti-fascist republican actor rather than import him as a foreign-sponsored leader."
ireland_events.frank_ryan_axis_break.a: "Make the break public and submit his role to civil review."
ireland_events.frank_ryan_axis_break.b: "Keep the undertaking private; he will hold no public role."
ireland_events.congress_common_programme.t: "Congress Common Programme"
ireland_events.congress_common_programme.d: "The Republican Congress is trying to write a common programme for workers, smallholders, republicans, and women organisers. Its strength will depend on shared institutions, not on a slogan that leaves every constituent free to interpret the state differently."
ireland_events.congress_common_programme.a: "Open the programme to every organised interest and publish the compromises."
ireland_events.congress_common_programme.b: "Discipline the Congress around one republican economic programme."
ireland_events.congress_armed_wing_dispute.t: "Congress Armed Wing Dispute"
ireland_events.congress_armed_wing_dispute.d: "The Congress has reached its armed-wing question: can a movement that claims to represent the people also tolerate a separate command? The answer will decide whether the route becomes a parliament of interests or another chain of coercion."
ireland_events.congress_armed_wing_dispute.a: "Bind armed supporters to a civilian congress and a public code."
ireland_events.congress_armed_wing_dispute.b: "Keep the armed wing outside the congress and accept the constitutional cost."
ireland_events.congress_constituent_collapse.t: "Congress Constituent Collapse"
ireland_events.congress_constituent_collapse.d: "The constituent groups are leaving the Congress because the programme asks for common discipline without settling who controls nominations, finance, and local action. Collapse is a political failure with a material and organisational memory."
ireland_events.congress_constituent_collapse.a: "Reopen the charter and let each constituent name its protected interest."
ireland_events.congress_constituent_collapse.b: "Keep one disciplined party and accept the departure of the local blocs."
ireland_events.oduffy_veteran_refusal.t: "O'Duffy Veteran Refusal"
ireland_events.oduffy_veteran_refusal.d: "O'Duffy's veterans want the movement to follow the man who led it, while employers and Army officers want a state command that can be audited. Personal authority now has to answer for uniforms, funds, and orders."
ireland_events.oduffy_veteran_refusal.a: "Break personal command from the state and register the veterans as citizens."
ireland_events.oduffy_veteran_refusal.b: "Give the veterans a formal charter and let O'Duffy retain the public command."
ireland_events.oduffy_foreign_patron.t: "O'Duffy Foreign Patron"
ireland_events.oduffy_foreign_patron.d: "A foreign patron is offering money, training, or recognition to the O'Duffy movement. The offer can make a disciplined organisation visible, but it can also turn Irish politics into a client network before the state has chosen its own constitutional form."
ireland_events.oduffy_foreign_patron.a: "Refuse the patron and keep the movement's finances under Irish law."
ireland_events.oduffy_foreign_patron.b: "Accept a limited contact and publish the conditions of the foreign support."
ireland_events.oduffy_death_and_succession.t: "O'Duffy Death and Succession"
ireland_events.oduffy_death_and_succession.d: "O'Duffy's death removes the personal centre of the movement and leaves veterans, employers, and officers asking who can sign its orders. Succession will show whether the route was an institution or a uniform around one man."
ireland_events.oduffy_death_and_succession.a: "Transfer the movement into a chartered committee under state law."
ireland_events.oduffy_death_and_succession.b: "Elect a new personal commander and preserve the old political style."
ireland_events.ailtiri_police_exposure.t: "Ailtirí Police Exposure"
ireland_events.ailtiri_police_exposure.d: "The Ailtirí network has been exposed before it can decide whether its corporatist programme belongs in public politics or in a clandestine apparatus. The Garda must protect witnesses without turning an ideological dispute into collective punishment."
ireland_events.ailtiri_police_exposure.a: "Expose the cells, charge the supported offences, and publish the political record."
ireland_events.ailtiri_police_exposure.b: "Treat the network as a security file and conceal the wider programme."
ireland_events.ailtiri_public_launch.t: "Ailtirí Public Launch"
ireland_events.ailtiri_public_launch.d: "Ailtirí wants to emerge as a dated public movement with a programme for industry, regional representation, and producer authority. The launch will be judged by whether it accepts elections, civilian law, and a visible end to clandestine command."
ireland_events.ailtiri_public_launch.a: "Launch the movement publicly under a dated charter and electoral rules."
ireland_events.ailtiri_public_launch.b: "Keep the cells concealed and build influence through sympathetic offices."
ireland_events.ailtiri_1945_split.t: "Ailtirí 1945 Split"
ireland_events.ailtiri_1945_split.d: "The 1945 Ailtirí split separates public corporatist politics from the organisers who still want a protected network. The movement must choose whether its future is a lawful party, a producer association, or a secret that the postwar state will not tolerate."
ireland_events.ailtiri_1945_split.a: "Register the public wing and end the clandestine chain."
ireland_events.ailtiri_1945_split.b: "Keep the network intact and accept exclusion from ordinary politics."
ireland_events.clerical_service_dependency.t: "Clerical Service Dependency"
ireland_events.clerical_service_dependency.d: "The clerical service system carries schools, hospitals, welfare, and moral authority that the state cannot replace overnight. The crisis is whether public funds can buy a public standard without making the Church an enemy of the settlement."
ireland_events.clerical_service_dependency.a: "Place the services under public audit and protect independent religious practice."
ireland_events.clerical_service_dependency.b: "Preserve the providers and negotiate standards one service at a time."
ireland_events.kingship_candidate_convention.t: "Kingship Candidate Convention"
ireland_events.kingship_candidate_convention.d: "The High Kingship convention must decide whether a claimant can stand above the state without becoming a partisan monarch. Genealogy, provincial consent, the presidency, and the Dáil all have to appear in the constitutional record."
ireland_events.kingship_candidate_convention.a: "Call the convention and define a constitutional crown before naming a claimant."
ireland_events.kingship_candidate_convention.b: "Refuse the crown until a public mandate can be counted."
ireland_events.provinces_mandate_rejection.t: "Provinces Mandate Rejection"
ireland_events.provinces_mandate_rejection.d: "The provincial assemblies have rejected a mandate that would let a fivefold compact rewrite the state by declaration. The rejection preserves the unitary administration while leaving the question open to a better-negotiated federation."
ireland_events.provinces_mandate_rejection.a: "Return with a narrower compact and named provincial vetoes."
ireland_events.provinces_mandate_rejection.b: "Close the federation proposal and keep the state unitary."
ireland_events.five_provinces_stone_review.t: "The Stone of Divisions"
ireland_events.five_provinces_stone_review.d: "At the Uisneach assembly, testimony and site records converge around the Stone of Divisions. The state must decide whether this is a difficult historical record, an impossible sign, or a political story that should end here."
ireland_events.five_provinces_stone_review.examine: "Call independent witnesses and preserve the record."
ireland_events.five_provinces_stone_review.dismiss: "Keep the stone within ordinary provincial law."
ireland_events.five_provinces_standards_sites.t: "Rival Standards at the Centre"
ireland_events.five_provinces_standards_sites.d: "The evidence has survived its first review, but the five standards now carry competing claims to authority. The custodians of the sites ask whether the state will recognise an impossible fivefold order or protect the sites while refusing the claim."
ireland_events.five_provinces_standards_sites.recognise: "Recognise the five standards and guard the sites."
ireland_events.five_provinces_standards_sites.seal: "Secure the sites and seal the interpretation."
ireland_events.five_provinces_standards_sites.reject: "Reject the claim and disperse the assembly."
ireland_events.otherworld_obligation_failure.t: "Otherworld Obligation Failure"
ireland_events.otherworld_obligation_failure.d: "The Otherworld compact has been breached: a promise made at the site now demands a political and supernatural answer. The state must decide whether to seal the evidence, renegotiate the obligation, or let an impossible authority enter public law."
ireland_events.otherworld_obligation_failure.a: "Seal the site, preserve testimony, and keep the breach outside ordinary law."
ireland_events.otherworld_obligation_failure.b: "Accept the obligation under a witnessed compact and proceed under watch."
ireland_events.otherworld_archive_reveal.t: "The Archive Records What Has Not Yet Happened"
ireland_events.otherworld_archive_reveal.d: "The second controlled prediction has occurred exactly as the sealed records described it. The witnesses, collectors, and offices were separated, the custody chains hold, and ordinary explanations no longer account for the record. The cabinet must decide what this contact means for the living state."
ireland_events.otherworld_archive_reveal.recognise_contact: "Recognise contact and seek a compact."
ireland_events.otherworld_archive_reveal.contain_evidence: "Seal the evidence and contain the sites."
ireland_events.otherworld_archive_reveal.exploit_contact: "Exploit contact for state power."
ireland_events.otherworld_archive_reveal.reject_interpretation: "Reject the interpretation and continue human investigation."
ireland_events.aircraft_warning.t: "Aircraft Warning"
ireland_events.aircraft_warning.d: "An unidentified aircraft has entered the warning picture. The air service must distinguish navigation error from reconnaissance without firing first or allowing Irish airspace to become an unmarked corridor."
ireland_events.aircraft_warning.a: "Issue a recorded warning and escort the aircraft out of the neutral zone."
ireland_events.aircraft_warning.b: "Track the aircraft silently and preserve the interception order for a second breach."
ireland_events.aircraft_intercept.t: "Aircraft Intercept"
ireland_events.aircraft_intercept.d: "The aircraft has ignored the warning and the interception order is live. Pilots need a clear rule for force, landing, rescue, and evidence so an airspace incident does not become an undeclared alignment."
ireland_events.aircraft_intercept.a: "Intercept under the standing rule and compel a landing for inspection."
ireland_events.aircraft_intercept.b: "Shadow the aircraft without force and file the violation through diplomacy."
ireland_events.aircrew_status.t: "Aircrew Status"
ireland_events.aircrew_status.d: "A foreign aircrew has crossed into Irish custody. The state must separate rescue, internment, intelligence, and return: humane treatment is required, but neutrality also requires a record that neither side can quietly exploit."
ireland_events.aircrew_status.a: "Intern the crew under equal rules and open a recorded repatriation channel."
ireland_events.aircrew_status.b: "Treat the crossing as a rescue and return the crew without an intelligence interview."
ireland_events.airspace_protest.t: "Airspace Protest"
ireland_events.airspace_protest.d: "The airspace protest must name the route, the warning, and the evidence of the breach. Ireland can defend its neutrality through a precise note, not through a claim that every foreign flight is an act of war."
ireland_events.airspace_protest.a: "Protest with the flight record and demand a written assurance."
ireland_events.airspace_protest.b: "Make a private approach and avoid an escalation in public language."
ireland_events.airspace_concealment.t: "Airspace Concealment"
ireland_events.airspace_concealment.d: "A department has proposed hiding the extent of an airspace breach to protect public calm. Concealment may save a headline, but it weakens the warnings and makes the next foreign response harder to justify."
ireland_events.airspace_concealment.a: "Release the verified facts and protect only operational details."
ireland_events.airspace_concealment.b: "Keep the incident classified and let the diplomatic channel carry the warning."
ireland_events.airspace_escalation.t: "Airspace Escalation"
ireland_events.airspace_escalation.d: "Repeated violations have made the airspace incident a crisis of authority. The cabinet must set a ceiling for force, a route for foreign explanation, and a public test for whether neutrality is still credible."
ireland_events.airspace_escalation.a: "Raise the protest and place the air force under a stricter intercept order."
ireland_events.airspace_escalation.b: "Stand down the escalation and preserve the incident record for later arbitration."
ireland_events.ship_sighting.t: "Ship Sighting"
ireland_events.ship_sighting.d: "A ship sighting in the approaches is not yet a violation. The patrol must identify the vessel, log its course, and avoid turning a neutral observation into an unannounced escort."
ireland_events.ship_sighting.a: "Record the sighting and challenge the vessel under the neutral rule."
ireland_events.ship_sighting.b: "Watch from a distance and preserve fuel for a confirmed incident."
ireland_events.ship_rescue.t: "Ship Rescue"
ireland_events.ship_rescue.d: "A rescue call places Irish crews between a humanitarian duty and the danger of carrying a belligerent operation into Irish waters. The service must save lives while preserving the incident record."
ireland_events.ship_rescue.a: "Launch the rescue and separate survivors from military matériel."
ireland_events.ship_rescue.b: "Coordinate from shore and require the foreign vessel to declare its status first."
ireland_events.ship_investigation.t: "Ship Investigation"
ireland_events.ship_investigation.d: "The wreck report contains conflicting accounts of course, warning, and cargo. An investigation can protect Irish neutrality only if witnesses, charts, and salvage evidence are kept outside the pressure of the nearest belligerent."
ireland_events.ship_investigation.a: "Open an independent inquiry and publish the navigational record."
ireland_events.ship_investigation.b: "Seal the evidence and negotiate a joint report through diplomatic channels."
ireland_events.ship_protest.t: "Ship Protest"
ireland_events.ship_protest.d: "The protest must say exactly which neutral rule was breached, where the breach occurred, and what remedy Ireland seeks. A theatrical note may satisfy the headlines while leaving the next convoy less safe."
ireland_events.ship_protest.a: "File the protest with charts, witnesses, and a specific remedy."
ireland_events.ship_protest.b: "Seek a private assurance and keep the public note deliberately narrow."
ireland_events.ship_reroute.t: "Ship Reroute"
ireland_events.ship_reroute.d: "An essential cargo can still reach Ireland, but only if the reroute does not create a covert escort or leave another port exposed. The shipping office must balance fuel, weather, neutral markings, and the delivery deadline."
ireland_events.ship_reroute.a: "Reroute through the named neutral port and publish the cargo manifest."
ireland_events.ship_reroute.b: "Hold the cargo until a safer route and a foreign assurance are available."
ireland_events.ship_claim.t: "Ship Claim"
ireland_events.ship_claim.d: "The shipping claim asks whether the state will compensate loss, confront the responsible belligerent, or let a private owner carry the risk alone. Neutrality Integrity is [?ireland_neutrality_integrity|0], and credibility has a cost."
ireland_events.ship_claim.a: "Pay the verified claim and demand restitution through the diplomatic record."
ireland_events.ship_claim.b: "Contest the claim until ownership, cargo, and neutral conduct are proven."
ireland_events.camp_nationality.t: "Camp Nationality"
ireland_events.camp_nationality.d: "The camp register is sorting detainees by nationality, legal cause, and diplomatic status. That classification must support equal treatment rather than create a separate standard for whichever government is loudest."
ireland_events.camp_nationality.a: "Publish the nationality register and apply one custody rule."
ireland_events.camp_nationality.b: "Keep the register internal while consular claims are checked."
ireland_events.camp_health.t: "Camp Health"
ireland_events.camp_health.d: "Illness in the camp is both a humanitarian emergency and a security risk. Doctors need access, food, sanitation, and a reporting line that cannot be closed because the case is politically inconvenient."
ireland_events.camp_health.a: "Put the camp under independent medical inspection and emergency supply."
ireland_events.camp_health.b: "Keep medical work inside the Justice Department and limit outside access."
ireland_events.camp_parole.t: "Camp Parole"
ireland_events.camp_parole.d: "Parole is being requested by detainees whose families and consuls can offer a fixed address, employment, and regular reporting. The board must decide whether supervised release serves neutrality better than indefinite custody."
ireland_events.camp_parole.a: "Release eligible detainees under signed reporting conditions."
ireland_events.camp_parole.b: "Keep custody until the foreign exchange channel is formally open."
ireland_events.camp_escape.t: "Camp Escape"
ireland_events.camp_escape.d: "An escape has exposed a weak perimeter and an even weaker custody record. The response must recover the detainee without allowing emergency force to erase the question of whether the camp was lawful and humane."
ireland_events.camp_escape.a: "Recover the detainee and open a public custody review."
ireland_events.camp_escape.b: "Seal the district first and postpone the review until the search ends."
ireland_events.camp_exchange.t: "Camp Exchange"
ireland_events.camp_exchange.d: "A foreign government proposes an exchange. Ireland must identify the detainees, verify that the arrangement is reciprocal, and make sure release is not being used to trade away evidence or a neutral legal principle."
ireland_events.camp_exchange.a: "Accept the verified exchange under a written humanitarian protocol."
ireland_events.camp_exchange.b: "Refuse the exchange and keep every case under Irish custody law."
ireland_events.camp_public_review.t: "Camp Public Review"
ireland_events.camp_public_review.d: "The public review will decide whether the internment system can show a lawful cause, equal treatment, medical care, and a release path. Neutrality Integrity is [?ireland_neutrality_integrity|0], and secrecy will be read as partiality."
ireland_events.camp_public_review.a: "Publish the review and correct the custody rules in Parliament."
ireland_events.camp_public_review.b: "Release a summary while keeping operational names and files sealed."
ireland_events.agent_contact.t: "Agent Contact"
ireland_events.agent_contact.d: "A foreign contact offers information about a network inside Ireland. G2 must decide whether the source is useful, compromised, or trying to purchase access under the cover of cooperation."
ireland_events.agent_contact.a: "Meet the source under an Irish case file and test the first report."
ireland_events.agent_contact.b: "Refuse the meeting and ask the foreign service to use diplomatic channels."
ireland_events.agent_watch.t: "Agent Watch"
ireland_events.agent_watch.d: "The surveillance watch has found meetings, couriers, and false papers but not yet a complete network. The Garda can watch the channel, but only a narrow authority prevents the operation becoming foreign direction on Irish soil."
ireland_events.agent_watch.a: "Continue the watch under a named Irish authority and preserve the evidence."
ireland_events.agent_watch.b: "Close the watch and arrest only the cases already supported by evidence."
ireland_events.agent_turn.t: "Agent Turn"
ireland_events.agent_turn.d: "An agent offers to turn the network from inside. The information may prevent an attack, but a manipulated defection could expose Irish officers and create a false cause for detention."
ireland_events.agent_turn.a: "Run the turn through a controlled file and corroborate every operational claim."
ireland_events.agent_turn.b: "Refuse the turn and protect the intelligence chain from contamination."
ireland_events.agent_intern.t: "Agent Intern"
ireland_events.agent_intern.d: "The arrest report identifies an agent, but internment requires more than a foreign label. Irish officers must record the evidence, the legal cause, and the access granted to counsel and consular staff."
ireland_events.agent_intern.a: "Intern the suspect under the same evidence and review rule as any foreign crew."
ireland_events.agent_intern.b: "Hold the suspect for interview and refuse a formal internment order for now."
ireland_events.agent_prosecute.t: "Agent Prosecute"
ireland_events.agent_prosecute.d: "The prosecution will be judged by evidence, not by the nationality of the accused or the usefulness of the intelligence. A public trial may protect the law while exposing methods the Garda still needs."
ireland_events.agent_prosecute.a: "Prosecute the supported charge and keep sources behind the court's procedure."
ireland_events.agent_prosecute.b: "Use a security order and preserve the intelligence file for a later review."
ireland_events.agent_retaliation.t: "Agent Retaliation"
ireland_events.agent_retaliation.d: "A foreign service threatens retaliation for the arrest. Ireland must protect officers and diplomatic staff without allowing a threat to rewrite the neutrality law or justify an unrecorded counter-operation."
ireland_events.agent_retaliation.a: "Protect the people at risk and answer through the formal diplomatic channel."
ireland_events.agent_retaliation.b: "Keep the response quiet and reduce exposed operations until the pressure passes."
ireland_events.weather_station.t: "Weather Station"
ireland_events.weather_station.d: "Weather Station has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.weather_station.a: "Keep the station staffed and protect its observation chain."
ireland_events.weather_station.b: "Run a reduced weather watch until the equipment arrives."
ireland_events.weather_report.t: "Weather Report"
ireland_events.weather_report.d: "The controlled weather report is being requested by ships, aircraft, and foreign planners at the same time. Irish officials must publish the neutral data rule before one recipient treats a forecast as privileged military access."
ireland_events.weather_report.a: "Share the verified forecast under an equal public weather rule."
ireland_events.weather_report.b: "Restrict the detail and keep sensitive observations within the Irish service."
ireland_events.weather_publication.t: "Weather Publication"
ireland_events.weather_publication.d: "Weather Publication has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.weather_publication.a: "Publish the forecast under an equal access rule for all shipping."
ireland_events.weather_publication.b: "Release only the civilian forecast and withhold sensitive observations."
ireland_events.weather_control.t: "Weather Control"
ireland_events.weather_control.d: "Weather Control has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.weather_control.a: "Place transmission under a civilian weather office and a public log."
ireland_events.weather_control.b: "Keep transmissions within the department until the security review closes."
ireland_events.weather_restriction.t: "Weather Restriction"
ireland_events.weather_restriction.d: "Weather Restriction has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.weather_restriction.a: "Restrict only the operational detail and preserve the public warning."
ireland_events.weather_restriction.b: "Suspend the detailed report until the foreign requests can be compared."
ireland_events.trade_good.t: "Trade Good"
ireland_events.trade_good.d: "A trade partner is offering a useful good in exchange for a cargo Ireland can actually spare. The bargain will be judged by households and workshops, not just by the customs receipt; Provision is [?ireland_provision_display|0]."
ireland_events.trade_good.a: "Take the cargo that protects the essential supply chain."
ireland_events.trade_good.b: "Refuse the bargain and keep the scarce export at home."
ireland_events.trade_supplier.t: "Trade Supplier"
ireland_events.trade_supplier.d: "The supplier wants a long contract, but a fixed source may become a foreign lever if shipping or prices change. The trade office must balance reliability, leverage, and the material reserve."
ireland_events.trade_supplier.a: "Sign the contract with an exit clause and a second supplier."
ireland_events.trade_supplier.b: "Buy short and keep the state free to change the route."
ireland_events.trade_stock.t: "Trade Stock"
ireland_events.trade_stock.d: "The stock ledger shows enough on paper, but the stores are in the wrong counties and the transport office cannot move everything at once. The decision is whether to centralise the reserve or protect local stocks from a national draw."
ireland_events.trade_stock.a: "Consolidate the reserve and schedule the county deliveries."
ireland_events.trade_stock.b: "Keep local stores protected and accept a smaller central reserve."
ireland_events.trade_ration.t: "Trade Ration"
ireland_events.trade_ration.d: "A trade arrangement would improve one ration by reducing another. The cabinet must decide whether the exchange is temporary relief, a permanent dependency, or a price that can be refused without starving the transport system."
ireland_events.trade_ration.a: "Take the relief and bind it to a dated domestic replacement plan."
ireland_events.trade_ration.b: "Refuse the dependency and preserve the harder domestic ration."
ireland_events.trade_bargain.t: "Trade Bargain"
ireland_events.trade_bargain.d: "The final trade bargain is being measured against ports, shipping, finance, and the social cost of scarcity. A good headline will not protect Irish choice if the contract leaves the country unable to refuse the next demand."
ireland_events.trade_bargain.a: "Sign the bargain with supply, finance, and termination clauses visible."
ireland_events.trade_bargain.b: "Walk away and accept the immediate shortage to preserve leverage."
ireland_events.access_facility.t: "Name the Access Facility"
ireland_events.access_facility.d: "A foreign request must name the harbour it seeks to use: Cobh, Berehaven, or Lough Swilly. The answer will bind that facility alone, under Irish law and command, while Neutrality Integrity stands at [?ireland_neutrality_integrity|0]."
ireland_events.access_facility.a: "Name the facility, Irish officer, and exact purpose in the access order."
ireland_events.access_facility.b: "Refuse the facility request until the foreign partner accepts Irish inspection."
ireland_events.access_time_limit.t: "Access Time Limit"
ireland_events.access_time_limit.d: "Access Time Limit has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.access_time_limit.a: "Set a short access window and require a written departure record."
ireland_events.access_time_limit.b: "Keep the window closed until the incident ledger is complete."
ireland_events.access_irish_command.t: "Access Irish Command"
ireland_events.access_irish_command.d: "A foreign request for access is being answered with an Irish command condition. The terms must name the facility, the time limit, the Irish officer in charge, and the rule that access ends if neutrality is breached."
ireland_events.access_irish_command.a: "Grant the limited access under Irish command and an inspection record."
ireland_events.access_irish_command.b: "Refuse access until the foreign government accepts a shorter and more visible protocol."
ireland_events.access_shared_defence.t: "Access Shared Defence"
ireland_events.access_shared_defence.d: "Shared defence is being discussed as a practical arrangement, not a free alliance. Ireland must retain withdrawal, command, finance, and public ratification while deciding whether the danger justifies cooperation."
ireland_events.access_shared_defence.a: "Draft a shared-defence protocol with Irish command and a withdrawal date."
ireland_events.access_shared_defence.b: "Keep defence national and limit cooperation to rescue and information."
ireland_events.access_withdrawal.t: "Access Withdrawal"
ireland_events.access_withdrawal.d: "Access Withdrawal has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.access_withdrawal.a: "Exercise the withdrawal clause and restore the facility to Irish custody."
ireland_events.access_withdrawal.b: "Keep access in place while the diplomatic channel negotiates a remedy."
ireland_events.censorship_subject.t: "Censorship Subject"
ireland_events.censorship_subject.d: "Censorship Subject has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.censorship_subject.a: "Censor the named operational detail and publish the public facts."
ireland_events.censorship_subject.b: "Refuse the order until a court or minister names the lawful subject."
ireland_events.censorship_narrow.t: "Censorship Narrow"
ireland_events.censorship_narrow.d: "Censorship Narrow has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.censorship_narrow.a: "Narrow the order to the exposed method and set a short review date."
ireland_events.censorship_narrow.b: "Leave the publication untouched and accept the security risk."
ireland_events.censorship_publish.t: "Censorship Publish"
ireland_events.censorship_publish.d: "Censorship Publish has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.censorship_publish.a: "Publish the correction with the censor's legal authority attached."
ireland_events.censorship_publish.b: "Keep the correction private and protect the investigation's sources."
ireland_events.censorship_investigate.t: "Censorship Investigate"
ireland_events.censorship_investigate.d: "Censorship Investigate has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.censorship_investigate.a: "Investigate the publication and the order as separate accountable acts."
ireland_events.censorship_investigate.b: "Close the file and avoid a public fight with the newspaper."
ireland_events.censorship_sunset.t: "Censorship Sunset"
ireland_events.censorship_sunset.d: "Censorship Sunset has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.censorship_sunset.a: "Let the censorship order expire unless the review proves a continuing cause."
ireland_events.censorship_sunset.b: "Renew the order for one final interval and publish its scope."
ireland_events.border_corridor.t: "Border Corridor"
ireland_events.border_corridor.d: "Border Corridor has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.border_corridor.a: "Open the named crossing with local police and a recorded humanitarian purpose."
ireland_events.border_corridor.b: "Keep the border closed until the security cause and partner are proven."
ireland_events.border_close.t: "Border Close"
ireland_events.border_close.d: "Border Close has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.border_close.a: "Close the exposed crossing under a dated public order."
ireland_events.border_close.b: "Keep a monitored passage for families and essential trade."
ireland_events.border_regulate.t: "Border Regulate"
ireland_events.border_regulate.d: "Border Regulate has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.border_regulate.a: "Regulate the crossing with permits, escorts, and a joint incident book."
ireland_events.border_regulate.b: "Reduce the crossing to emergency passage and preserve the reserve."
ireland_events.border_cooperate.t: "Border Cooperate"
ireland_events.border_cooperate.d: "Border Cooperate has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.border_cooperate.a: "Cooperate on customs and rescue while keeping political authority separate."
ireland_events.border_cooperate.b: "Refuse joint administration and limit contact to emergency cases."
ireland_events.northern_border_families.t: "Northern Border Families"
ireland_events.northern_border_families.d: "Northern Border Families has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_border_families.a: "Give border families a protected contact and compensation channel."
ireland_events.northern_border_families.b: "Keep the family claims local until security officers can verify them."
ireland_events.northern_local_delegates.t: "Northern Local Delegates"
ireland_events.northern_local_delegates.d: "Northern Local Delegates has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_local_delegates.a: "Seat local delegates with a written mandate and a right to record dissent."
ireland_events.northern_local_delegates.b: "Consult the delegates without giving them administrative authority yet."
ireland_events.northern_confidence_measure.t: "Northern Confidence Measure"
ireland_events.northern_confidence_measure.d: "A Northern confidence measure cannot substitute for unionist consent, nationalist consent, or British implementation. It can show whether the proposed safeguards are credible before any control, occupation, integration, or core question is considered."
ireland_events.northern_confidence_measure.a: "Publish the safeguards and ask both communities for a counted answer."
ireland_events.northern_confidence_measure.b: "Keep the proposal in consultation until local guarantees are enforceable."
ireland_events.northern_representation.t: "Northern Representation"
ireland_events.northern_representation.d: "Northern Representation has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_representation.a: "Design representation with minority safeguards and a counted constituency record."
ireland_events.northern_representation.b: "Delay seats until the local institutions can accept the rules."
ireland_events.northern_shipyard_contract.t: "Northern Shipyard Contract"
ireland_events.northern_shipyard_contract.d: "Northern Shipyard Contract has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_shipyard_contract.a: "Restore the shipyard contract under local labour and finance safeguards."
ireland_events.northern_shipyard_contract.b: "Keep the contract suspended until the authority and payment chain are settled."
ireland_events.northern_linen_workers.t: "Northern Linen Workers"
ireland_events.northern_linen_workers.d: "Northern Linen Workers has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_linen_workers.a: "Protect linen workers through a cross-border labour and wage compact."
ireland_events.northern_linen_workers.b: "Leave the dispute to existing employers and union channels."
ireland_events.northern_labour_dispute.t: "Northern Labour Dispute"
ireland_events.northern_labour_dispute.d: "Northern Labour Dispute has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_labour_dispute.a: "Bring the labour sides into a written Northern social bridge."
ireland_events.northern_labour_dispute.b: "Keep the Southern government out until the local dispute cools."
ireland_events.northern_housing_pressure.t: "Northern Housing Pressure"
ireland_events.northern_housing_pressure.d: "Housing pressure in the North is a settlement question before it is a construction promise. Any relief must name the local authority, the security guarantee, the labour access, and the stage at which the project can be reviewed."
ireland_events.northern_housing_pressure.a: "Open a safeguarded housing channel with local witnesses and a material ledger."
ireland_events.northern_housing_pressure.b: "Hold the programme until consent and security can carry the work."
ireland_events.northern_school_funding.t: "Northern School Funding"
ireland_events.northern_school_funding.d: "Northern School Funding has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_school_funding.a: "Fund schools through a rights-neutral grant and an inspection record."
ireland_events.northern_school_funding.b: "Refuse the grant until the local education authorities accept the safeguards."
ireland_events.northern_religious_access.t: "Northern Religious Access"
ireland_events.northern_religious_access.d: "Northern Religious Access has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.northern_religious_access.a: "Open religious access under equal protection and a named local liaison."
ireland_events.northern_religious_access.b: "Keep the matter local and avoid a foreign-reaction incident."
ireland_events.northern_policing_review.t: "Northern Policing Review"
ireland_events.northern_policing_review.d: "Northern Policing Review has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_policing_review.a: "Review policing with community witnesses, records, and a civilian remedy."
ireland_events.northern_policing_review.b: "Leave the existing police chain in place until the security ledger improves."
ireland_events.northern_finance_services.t: "Northern Finance Services"
ireland_events.northern_finance_services.d: "Northern Finance Services has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_finance_services.a: "Open a finance service with a published grant and audit trail."
ireland_events.northern_finance_services.b: "Keep the accounts separate until liabilities and revenue are agreed."
ireland_events.northern_register_audit.t: "Northern Register Audit"
ireland_events.northern_register_audit.d: "Northern Register Audit has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_register_audit.a: "Audit the register with local observers and a correction process."
ireland_events.northern_register_audit.b: "Freeze the register and repair only the documented errors."
ireland_events.northern_polling_security.t: "Northern Polling Security"
ireland_events.northern_polling_security.d: "Northern Polling Security has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_polling_security.a: "Protect the poll with neutral officers, local monitors, and a complaint route."
ireland_events.northern_polling_security.b: "Postpone the poll until the security threat can be contained."
ireland_events.northern_plebiscite_result.t: "Northern Plebiscite Result"
ireland_events.northern_plebiscite_result.d: "The Northern plebiscite has produced a political instruction, not an instant transfer of land. The cabinet must record turnout, minority safeguards, British acceptance, and the next administrative stage before any settlement can advance."
ireland_events.northern_plebiscite_result.a: "Accept the result as a mandate for the next safeguarded stage."
ireland_events.northern_plebiscite_result.b: "Record the result but suspend implementation until the guarantees are funded."
ireland_events.northern_convention_terms.t: "Northern Convention Terms"
ireland_events.northern_convention_terms.d: "Northern Convention Terms has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_convention_terms.a: "Write the convention terms with defence, finance, policing, and ratification clauses."
ireland_events.northern_convention_terms.b: "Refuse a convention until British implementation and local consent are fixed."
ireland_events.northern_war_plan.t: "Northern War Plan"
ireland_events.northern_war_plan.d: "Northern War Plan has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_war_plan.a: "Prepare the defence plan with Irish command and a civilian war mandate."
ireland_events.northern_war_plan.b: "Keep the plan defensive and refuse an undefined Northern operation."
ireland_events.northern_border_incursion.t: "Northern Border Incursion"
ireland_events.northern_border_incursion.d: "Northern Border Incursion has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_border_incursion.a: "Answer the incursion through a recorded local and diplomatic channel."
ireland_events.northern_border_incursion.b: "Secure the border first and suspend political contact."
ireland_events.northern_occupation_authority.t: "Northern Occupation Authority"
ireland_events.northern_occupation_authority.d: "Northern Occupation Authority has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_occupation_authority.a: "Name a temporary authority with law, relief, and local review powers."
ireland_events.northern_occupation_authority.b: "Keep military administration narrow and refuse a wider political mandate."
ireland_events.northern_disarmament.t: "Northern Disarmament"
ireland_events.northern_disarmament.d: "Northern Disarmament has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_disarmament.a: "Disarm through local witnesses, registration, and a protected surrender route."
ireland_events.northern_disarmament.b: "Keep weapons under military guard until the security situation settles."
ireland_events.northern_provisional_authority.t: "Northern Provisional Authority"
ireland_events.northern_provisional_authority.d: "Northern Provisional Authority has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_provisional_authority.a: "Open the provisional authority with local offices and a dated transition."
ireland_events.northern_provisional_authority.b: "Limit the authority to relief and security until representation is ready."
ireland_events.northern_shared_administration.t: "Northern Shared Administration"
ireland_events.northern_shared_administration.d: "A shared Northern administration would have to divide offices, budgets, policing, and public works before anyone can claim that integration has begun. The current National Provision is [?ireland_provision_display|0], and no office is free."
ireland_events.northern_shared_administration.a: "Open the joint offices under local consent and a published budget."
ireland_events.northern_shared_administration.b: "Keep the administrations separate until the safeguards are enforceable."
ireland_events.northern_integration_stage_review.t: "Northern Integration Stage Review"
ireland_events.northern_integration_stage_review.d: "The integration review is checking housing, labour, policing, courts, representation, and public confidence as separate stages. A successful ledger does not grant control, occupation, settlement, or cores by itself."
ireland_events.northern_integration_stage_review.a: "Advance only the stages whose local safeguards and capacity are proven."
ireland_events.northern_integration_stage_review.b: "Pause integration and publish the gaps before funding another stage."
ireland_events.northern_rights_safeguards.t: "Northern Rights Safeguards"
ireland_events.northern_rights_safeguards.d: "Northern Rights Safeguards has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_rights_safeguards.a: "Enforce the rights schedule through courts, police review, and local witnesses."
ireland_events.northern_rights_safeguards.b: "Promise the safeguards but wait for a stronger administrative base."
ireland_events.northern_final_review.t: "Northern Final Review"
ireland_events.northern_final_review.d: "Northern Final Review has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_final_review.a: "Submit every Northern stage to a final public and administrative review."
ireland_events.northern_final_review.b: "Keep the settlement provisional and refuse the final legal step."
ireland_events.northern_core_eligibility.t: "Northern Core Eligibility"
ireland_events.northern_core_eligibility.d: "Northern Core Eligibility has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_core_eligibility.a: "Open the core review only after integration stage five and final safeguards."
ireland_events.northern_core_eligibility.b: "Keep citizenship and administration separate from any core decision."
ireland_events.northern_postwar_memory.t: "Northern Postwar Memory"
ireland_events.northern_postwar_memory.d: "Northern Postwar Memory has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_postwar_memory.a: "Fund a shared archive and compensation record for the postwar settlement."
ireland_events.northern_postwar_memory.b: "Leave memory work to local institutions until trust has time to grow."
ireland_events.northern_archive_and_compensation.t: "Northern Archive and Compensation"
ireland_events.northern_archive_and_compensation.d: "Northern Archive and Compensation has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_archive_and_compensation.a: "Open the archive with claims officers and a cross-community compensation board."
ireland_events.northern_archive_and_compensation.b: "Seal the files until the security and privacy rules are agreed."
ireland_events.northern_federal_option.t: "Northern Federal Option"
ireland_events.northern_federal_option.d: "Northern Federal Option has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_federal_option.a: "Offer a federal transition with provincial powers and a public ratification."
ireland_events.northern_federal_option.b: "Keep the federal clause in reserve until the unionist safeguards are enforceable."
ireland_events.northern_unitary_option.t: "Northern Unitary Option"
ireland_events.northern_unitary_option.d: "Northern Unitary Option has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_unitary_option.a: "Offer a unitary transition with local offices and protected rights."
ireland_events.northern_unitary_option.b: "Keep the unitary proposal provisional until British implementation is secured."
ireland_events.northern_labour_settlement.t: "Northern Labour Settlement"
ireland_events.northern_labour_settlement.d: "Northern Labour Settlement has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_labour_settlement.a: "Ratify the labour settlement with wages, representation, and social safeguards."
ireland_events.northern_labour_settlement.b: "Leave labour to the existing jurisdictions until the political bargain is stable."
ireland_events.northern_guarantee_expiry.t: "Northern Guarantee Expiry"
ireland_events.northern_guarantee_expiry.d: "Northern Guarantee Expiry has made the Northern question concrete for local authorities and border families. The Northern ledger records integration capacity [?ireland_northern_integration_capacity|0] and security stability [?ireland_northern_security_stability|0]."
ireland_events.northern_guarantee_expiry.a: "Renew the guarantees through a public review and named enforcement office."
ireland_events.northern_guarantee_expiry.b: "Let the guarantees expire and return the question to ordinary diplomacy."
ireland_events.postwar_emergency_expiry.t: "Postwar Emergency Expiry"
ireland_events.postwar_emergency_expiry.d: "Postwar Emergency Expiry asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_emergency_expiry.a: "End the emergency order on the published date and return to ordinary law."
ireland_events.postwar_emergency_expiry.b: "Renew only the security clauses with a new parliamentary warrant."
ireland_events.postwar_supply_controls.t: "Postwar Supply Controls"
ireland_events.postwar_supply_controls.d: "Postwar supply controls are keeping bread, coal, and transport moving while demobilised workers return to civilian life. The government must decide which orders can expire without turning relief into a new shortage."
ireland_events.postwar_supply_controls.a: "Release controls in the sectors whose stocks are visibly secure."
ireland_events.postwar_supply_controls.b: "Keep the national controls until the county ledgers are balanced."
ireland_events.postwar_veteran_pressure.t: "Postwar Veteran Pressure"
ireland_events.postwar_veteran_pressure.d: "Postwar Veteran Pressure asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_veteran_pressure.a: "Answer veterans with pensions, work, and a public review of wartime promises."
ireland_events.postwar_veteran_pressure.b: "Hold the line on expenditure and let local organisations carry the relief."
ireland_events.postwar_civil_service.t: "Postwar Civil Service"
ireland_events.postwar_civil_service.d: "Postwar Civil Service asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_civil_service.a: "Retain experienced officials under a transparent loyalty and merit review."
ireland_events.postwar_civil_service.b: "Replace the wartime offices quickly and accept the administrative gap."
ireland_events.postwar_demobilisation.t: "Postwar Demobilisation"
ireland_events.postwar_demobilisation.d: "Victory abroad does not end Ireland's obligations to veterans, families, ports, and the reserve. The postwar Army must shrink without losing the command audit and emergency capabilities that kept the state secure."
ireland_events.postwar_demobilisation.a: "Demobilise by cohort and fund a trained reserve for the next crisis."
ireland_events.postwar_demobilisation.b: "Return personnel quickly and accept a smaller security establishment."
ireland_events.postwar_repeal_schedule.t: "Postwar Repeal Schedule"
ireland_events.postwar_repeal_schedule.d: "Postwar Repeal Schedule asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_repeal_schedule.a: "Publish the repeal calendar and give each department a sunset test."
ireland_events.postwar_repeal_schedule.b: "Keep the powers until shortages and security files are fully closed."
ireland_events.postwar_housing_programme.t: "Postwar Housing Programme"
ireland_events.postwar_housing_programme.d: "The postwar housing programme will be judged by completed homes, not by a central target. Counties need land, materials, transport, and a way to appeal when the ministry's allocation leaves a district behind."
ireland_events.postwar_housing_programme.a: "Fund a county-by-county build with a public completion ledger."
ireland_events.postwar_housing_programme.b: "Keep a central programme and postpone regional exceptions."
ireland_events.postwar_rural_electrification.t: "Postwar Rural Electrification"
ireland_events.postwar_rural_electrification.d: "Postwar Rural Electrification asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_rural_electrification.a: "Extend the grid through county schemes and a national technical service."
ireland_events.postwar_rural_electrification.b: "Concentrate on the cheapest connections and postpone remote districts."
ireland_events.postwar_merchant_fleet.t: "Postwar Merchant Fleet"
ireland_events.postwar_merchant_fleet.d: "Postwar Merchant Fleet asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_merchant_fleet.a: "Renew the merchant fleet with public insurance and Irish crew training."
ireland_events.postwar_merchant_fleet.b: "Charter foreign tonnage and postpone a costly national fleet."
ireland_events.postwar_regional_balance.t: "Postwar Regional Balance"
ireland_events.postwar_regional_balance.d: "Postwar Regional Balance asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_regional_balance.a: "Set a regional investment floor before allocating the central works."
ireland_events.postwar_regional_balance.b: "Follow the fastest national return and review regional balance later."
ireland_events.postwar_peat_board.t: "Postwar Peat Board"
ireland_events.postwar_peat_board.d: "Postwar Peat Board asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_peat_board.a: "Give the peat board a national mandate and county production targets."
ireland_events.postwar_peat_board.b: "Leave peat with local boards and avoid a central authority."
ireland_events.postwar_transport_repair.t: "Postwar Transport Repair"
ireland_events.postwar_transport_repair.d: "Transport repair competes with housing, peat, and returning crews for the same workshops and fuel. The choice will determine whether postwar neutrality is backed by a functioning coast and rail system or only by a legal declaration."
ireland_events.postwar_transport_repair.a: "Prioritise the ports and rail links that carry essential civilian supply."
ireland_events.postwar_transport_repair.b: "Spread the repairs across counties and accept a slower national recovery."
ireland_events.postwar_republic_status.t: "Postwar Republic Status"
ireland_events.postwar_republic_status.d: "Postwar Republic Status asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_republic_status.a: "State the republic's external status and preserve its neutral law."
ireland_events.postwar_republic_status.b: "Keep the constitutional form settled while external recognition matures."
ireland_events.postwar_commonwealth_choice.t: "Postwar Commonwealth Choice"
ireland_events.postwar_commonwealth_choice.d: "Postwar Commonwealth Choice asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_commonwealth_choice.a: "Choose association on written equality and an Irish right to withdraw."
ireland_events.postwar_commonwealth_choice.b: "Refuse association and keep the republic's diplomacy entirely separate."
ireland_events.postwar_citizenship_law.t: "Postwar Citizenship Law"
ireland_events.postwar_citizenship_law.d: "Postwar Citizenship Law asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_citizenship_law.a: "Set citizenship through residence, equal rights, and a clear Northern transition rule."
ireland_events.postwar_citizenship_law.b: "Keep citizenship narrow until the constitutional settlement is complete."
ireland_events.postwar_northern_guarantee.t: "Postwar Northern Guarantee"
