ireland_party_otherworld_long: "Stewardship of the Two Irelands"
ireland_vote_for_war_vote_for_sovereignty_NAME: "Vote for war, vote for sovereignty"
ireland_vote_for_war_vote_for_sovereignty_DESC: "Choose war by a recorded sovereign decision while retaining home defence and the promised contribution."
ireland_labour_stays_together_NAME: "Labour stays together"
ireland_labour_stays_together_DESC: "Keep Labour united without abandoning the parliamentary route or purging its affiliates."
ireland_councils_under_law_NAME: "Councils under law"
ireland_councils_under_law_DESC: "Bring councils into public law without replacing the Dáil with captured estates or clerical veto."
ireland_president_said_no_NAME: "The President said no"
ireland_president_said_no_DESC: "Let the President reject an unlawful appointment without a coup, unlawful nomination, or executive seizure."
ireland_minority_to_mandate_NAME: "From minority to mandate"
ireland_minority_to_mandate_DESC: "Turn minority support into a mandate without an opportunistic dissolution or caretaker seizure."
ireland_smallholders_decide_NAME: "The smallholders decide"
ireland_smallholders_decide_DESC: "Give smallholders a cohesive agrarian route without silently converting or collapsing its party."
ireland_republic_submits_army_NAME: "The Republic submits the army"
ireland_republic_submits_army_DESC: "Place the Army under the Republic's civil authority without foreign command or a GHQ dictatorship."
ireland_workers_smallholders_congress_NAME: "Congress of workers and smallholders"
ireland_workers_smallholders_congress_DESC: "Build a Congress of workers and smallholders with a durable coalition and no vanguard purge."
ireland_no_second_salamanca_NAME: "No second Salamanca"
ireland_no_second_salamanca_DESC: "Avoid a second Salamanca by keeping foreign leverage and domestic government independent."
ireland_estates_outlive_leader_NAME: "The estates outlive the leader"
ireland_estates_outlive_leader_DESC: "Keep the estates functioning beyond their leader without a personal cult or foreign client."
ireland_constitution_restored_NAME: "The Constitution restored"
ireland_constitution_restored_DESC: "Restore the Constitution through ordinary procedure after the emergency."
ireland_resurrection_without_sponsor_NAME: "Resurrection without a sponsor"
ireland_resurrection_without_sponsor_DESC: "Build a national movement without becoming anyone's client."
ireland_federal_island_consent_NAME: "A federal island by consent"
ireland_federal_island_consent_DESC: "Bring the island into a federal settlement by consent and with rights protected."
ireland_one_state_consent_NAME: "One state by consent"
ireland_one_state_consent_DESC: "Complete one-state integration by consent without coercive war, occupation, or an imposed plebiscite."
ireland_victory_not_integration_NAME: "Victory is not integration"
ireland_victory_not_integration_DESC: "Treat victory as a beginning by preserving rights and refusing blanket cores or military rule."
ireland_atlantic_table_NAME: "A seat at the Atlantic table"
ireland_atlantic_table_DESC: "Reach the Atlantic table with sovereign members rather than paper allies or unpaid obligations."
ireland_crown_without_conquest_NAME: "A crown without conquest"
ireland_crown_without_conquest_DESC: "Find a crown without conquest, captivity, foreign claimant, or offensive annexation."
ireland_five_provinces_compact_NAME: "Five provinces, one compact"
ireland_five_provinces_compact_DESC: "Bind five provinces into one compact without painted borders or rival sovereignties."
ireland_every_geis_kept_NAME: "Every geis kept"
ireland_every_geis_kept_DESC: "Keep every accepted obligation and breach none."
ireland_archive_was_correct_NAME: "The archive was correct"
ireland_archive_was_correct_DESC: "Prove that the archive was correct without fabricating evidence or persecuting witnesses."
ireland_two_irelands_one_law_NAME: "Two Irelands, one law"
ireland_two_irelands_one_law_DESC: "Make two Irelands answer to one law without breaking the compact or sealing it forever."
ireland_fivefold_high_kingdom_two_irelands_NAME: "The Fivefold High Kingdom of Two Irelands"
ireland_fivefold_high_kingdom_two_irelands_DESC: "Complete the Fivefold High Kingdom of Two Irelands with consent, evidence, and a stable compact."
