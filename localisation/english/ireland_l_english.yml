ireland_thekla_beere_advisor: "Thekla Beere"
ireland_thekla_beere_advisor_desc: "A senior civil-service administrator who turns industrial and supply policy into accountable departmental work."
ireland_luke_duffy_advisor: "Luke Duffy"
ireland_luke_duffy_advisor_desc: "A disciplined organiser who brings campaign practice, party machinery, and coalition bargaining into one political office."
ireland_michael_browne_advisor: "Michael Browne"
ireland_michael_browne_advisor_desc: "The bishop appointed to chair the Commission on Vocational Organisation, bringing Catholic social doctrine into the state's institutional design."
ireland_alfred_orahilly_advisor: "Alfred O'Rahilly"
ireland_alfred_orahilly_advisor_desc: "A vocational thinker and university adviser who connects social doctrine to the practical work of government."
ireland_stephen_hayes_advisor: "Stephen Hayes"
ireland_stephen_hayes_advisor_desc: "A staff officer whose clandestine experience can be placed at the centre of a national command crisis."
ireland_hugh_mcateer_advisor: "Hugh McAteer"
ireland_hugh_mcateer_advisor_desc: "A northern commander whose political and military judgement is sharpened by the struggle across the border."
ireland_harry_white_advisor: "Harry White"
ireland_harry_white_advisor_desc: "A hard-edged organiser for a reassembled Republican command, useful where secrecy and initiative matter more than ceremony."
ireland_roddy_connolly_advisor: "Roddy Connolly"
ireland_roddy_connolly_advisor_desc: "A socialist parliamentarian who turns labour politics, republican memory, and international solidarity into an organised programme."
ireland_michael_price_advisor: "Michael Price"
ireland_michael_price_advisor_desc: "A movement veteran whose network of organisers can give a vanguard route its political reach."
ireland_pj_coughlan_advisor: "P. J. Coughlan"
ireland_pj_coughlan_advisor_desc: "A Cork organiser who gives an O'Duffy government a practical bridge from movement politics to administration."
ireland_tomas_o_dochartaigh_advisor: "Tomás Ó Dochartaigh"
ireland_tomas_o_dochartaigh_advisor_desc: "A younger nationalist voice suited to the cultural and civic work of a postwar Ailtirí settlement."
