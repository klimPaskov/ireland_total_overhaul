ireland_events.postwar_eligibility_review.b: "Keep the conclusion concealed until the remaining reviews are closed."
ireland_events.postwar_blocked_surface.t: "Postwar Blocked Surface"
ireland_events.postwar_blocked_surface.d: "Postwar Blocked Surface asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_blocked_surface.a: "Name the blocked requirement and open the recovery process."
ireland_events.postwar_blocked_surface.b: "Keep the route closed until the missing authority is restored."
ireland_events.postwar_institutional_settlement.t: "Postwar Institutional Settlement"
ireland_events.postwar_institutional_settlement.d: "Postwar Institutional Settlement asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_institutional_settlement.a: "Ratify the institutions that the route actually built and fund their offices."
ireland_events.postwar_institutional_settlement.b: "Preserve the provisional arrangement until the public record is stronger."
ireland_events.postwar_domestic_reaction.t: "Postwar Domestic Reaction"
ireland_events.postwar_domestic_reaction.d: "Postwar Domestic Reaction asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_domestic_reaction.a: "Answer the domestic reaction with a recorded concession and public hearing."
ireland_events.postwar_domestic_reaction.b: "Hold the route line and let ordinary party competition absorb the shock."
ireland_events.postwar_foreign_reaction.t: "Postwar Foreign Reaction"
ireland_events.postwar_foreign_reaction.d: "Postwar Foreign Reaction has brought outside pressure to the edge of Irish neutrality. Neutrality Integrity is [?ireland_neutrality_integrity|0], and equal rules matter as much as the immediate result."
ireland_events.postwar_foreign_reaction.a: "Answer foreign pressure with the treaty, neutrality, and material record."
ireland_events.postwar_foreign_reaction.b: "Keep the response private and avoid trading away the route's independence."
ireland_events.postwar_consolidation.t: "Postwar Consolidation"
ireland_events.postwar_consolidation.d: "Postwar Consolidation asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
ireland_events.postwar_consolidation.a: "Consolidate the route through ordinary law and a visible budget."
ireland_events.postwar_consolidation.b: "Keep the exceptional arrangement until every institution can stand alone."
