ireland_action_reassemble_the_national_corporate_party_requirements_tt: "Requirements: Reassemble the National Corporate Party. Category: Radical and Underground Politics. Operate in Dublin Metropolitan Region after O'Duffy's severe crisis and dormant network gates are both open; the action's direct ledger outcome must be admissible, the category must have room, and the current Political Power and Command Power costs must be payable. Named-ledger surcharge: the selected action's cost display names its ledger and shows the current value; it adds +10 Political Power and Command Power below 15, +5 from 15 through 29, or +0 at 30 or above, with burden +2, +1, or +0 on the same bands."
