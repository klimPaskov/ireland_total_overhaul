ireland_events.postwar_northern_guarantee.b: "Keep the postwar guarantee political until an enforceable treaty is ready."
ireland_events.postwar_external_relations.t: "Postwar External Relations"
ireland_events.postwar_external_relations.d: "Postwar External Relations asks what Ireland will carry from the emergency into the peace. The postwar record must show whether exceptional arrangements can give way to ordinary institutions."
