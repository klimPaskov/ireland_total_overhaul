ireland_agency_g2: "G2 Directorate"
ireland_agency_coastwatch: "Coastwatch and Harbour Service"
ireland_agency_neutral_shipping: "Neutral Shipping Intelligence"
ireland_action_convene_a_cabinet_cohesion_review: "Convene a Cabinet Cohesion Review"
ireland_action_convene_a_cabinet_cohesion_review_desc: "Commit to Convene a Cabinet Cohesion Review in Dublin Metropolitan Region. Test ministers, portfolios, collective responsibility, and emergency commitments before Cabinet Cohesion falls below the public settlement; the review names the ministry's next confidence risk."
ireland_action_request_a_confidence_vote: "Request a Confidence Vote"
ireland_action_request_a_confidence_vote_desc: "Commit to Request a Confidence Vote in Dublin Metropolitan Region. Put the ministry's programme, supply terms, and formal Dáil mandate on the record so a majority cannot be inferred from private assurances; the vote decides whether the present cabinet can proceed."
ireland_action_negotiate_confidence_and_supply: "Negotiate Confidence and Supply"
ireland_action_negotiate_confidence_and_supply_desc: "Commit to Negotiate Confidence and Supply in Dublin Metropolitan Region. Name the votes, budget clauses, and concessions that keep the government alive; the National Settlement is [?ireland_settlement_bop_value|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_nominate_an_alternative_taoiseach: "Nominate an Alternative Taoiseach"
ireland_action_nominate_an_alternative_taoiseach_desc: "Commit to Nominate an Alternative Taoiseach in Dublin Metropolitan Region. Name a candidate who can command the Dáil, assign a cabinet, and accept the existing constitutional and emergency limits; the nomination remains answerable to the formal mandate."
ireland_action_ask_the_president_for_dissolution: "Ask the President for Dissolution"
ireland_action_ask_the_president_for_dissolution_desc: "Commit to Ask the President for Dissolution in Dublin Metropolitan Region. Present written cabinet advice, a lawful timetable, and campaign safeguards before asking the electorate to resolve the parliamentary deadlock; no emergency power is left without an expiry date."
ireland_action_invoke_the_council_of_state: "Invoke the Council of State"
ireland_action_invoke_the_council_of_state_desc: "Commit to Invoke the Council of State in Dublin Metropolitan Region. Use the advisory office to test constitutional procedure, not to replace a Dáil mandate; Social Consent is [?ireland_social_consent|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_publish_a_government_programme: "Publish a Government Programme"
ireland_action_publish_a_government_programme_desc: "Commit to Publish a Government Programme in Dublin Metropolitan Region. Convert coalition promises into dated department, budget, labour, and security obligations that the Dáil can review; each partner receives a recorded obligation rather than a private concession."
ireland_action_establish_a_caretaker_cabinet: "Establish a Caretaker Cabinet"
ireland_action_establish_a_caretaker_cabinet_desc: "Commit to Establish a Caretaker Cabinet in Eastern Administrative Corridor. Limit appointments, emergency escalation, and irreversible agreements while a dissolution or convention is pending; its authority ends with the recorded constitutional timetable."
ireland_action_review_the_six_month_settlement: "Review the Six-Month Settlement"
ireland_action_review_the_six_month_settlement_desc: "Commit to Review the Six-Month Settlement in Dublin Metropolitan Region. Recheck government, law, public authority, Provision, Readiness, and route obligations before the settlement renews; the current display is [?ireland_settlement_bop_value|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_restore_ordinary_constitutional_procedure: "Restore Ordinary Constitutional Procedure"
ireland_action_restore_ordinary_constitutional_procedure_desc: "Commit to Restore Ordinary Constitutional Procedure in Dublin Metropolitan Region. Return appointments, debate, courts, and review to ordinary rules only after the security and supply risks have a lawful answer; exceptional powers are reviewed one by one."
ireland_mission_maintain_cabinet_discipline: "Maintain Cabinet Discipline"
ireland_mission_maintain_cabinet_discipline_desc: "In Dublin Metropolitan Region, keep Cabinet Cohesion at 60 or above and close each dissenting portfolio within 90 days. Full success stabilises the cabinet and advances the settlement review; partial success leaves one minister conditional; failure creates a caretaker crisis, and a pressure-timeout failure escalates."
ireland_mission_assemble_seventy_routine_votes: "Assemble Seventy Routine Votes"
ireland_mission_assemble_seventy_routine_votes_desc: "Secure 70 routine confidence votes in the Dáil through named party and independent agreements within 45 days. Full success installs a lawful majority; partial success leaves a confidence-and-supply cabinet with a short deadline; failure forces dissolution or caretaker rule; escalation follows an unresolved vote crisis."
ireland_mission_complete_six_month_settlement_review: "Complete the Six-Month Settlement Review"
ireland_mission_complete_six_month_settlement_review_desc: "Complete the six-month review within 180 days by auditing the National Settlement's authority, consent, law, offices, security, Provision, and Readiness rather than merely waiting for a date. Full success confirms the route; partial success opens one recovery mission; failure archives the settlement and opens its restoration branch."
ireland_action_update_the_electoral_register: "Update the Electoral Register"
ireland_action_update_the_electoral_register_desc: "Commit to Update the Electoral Register in Dublin Metropolitan Region. Audit duplicate, displaced, and contested voters before the next poll so a later result cannot be dismissed as an administrative fiction. The current burden and political or command cost are shown in the confirmation text."
ireland_action_protect_campaign_freedom: "Protect Campaign Freedom"
ireland_action_protect_campaign_freedom_desc: "Commit to Protect Campaign Freedom in Eastern Administrative Corridor. Protect meetings, printing, candidates, and opposition access while keeping security deployment neutral; public confidence is [?ireland_social_consent|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_organise_county_candidates: "Organise County Candidates"
ireland_action_organise_county_candidates_desc: "Commit to Organise County Candidates in South and Southeast. Balance local organisation, leadership loyalty, rural interests, and transfer strategy without creating a second party machine inside the route. The current burden and political or command cost are shown in the confirmation text."
ireland_action_negotiate_transfer_pacts: "Negotiate Transfer Pacts"
ireland_action_negotiate_transfer_pacts_desc: "Commit to Negotiate Transfer Pacts in Dublin Metropolitan Region. Coordinate lower preferences for a named poll while keeping each party's programme and candidate responsibility visible. The current burden and political or command cost are shown in the confirmation text."
ireland_action_secure_polling_stations: "Secure Polling Stations"
ireland_action_secure_polling_stations_desc: "Commit to Secure Polling Stations in Border Belt. Deploy trained civil police and observers against intimidation without turning the poll into a security occupation; the Northern ledger remains separate from the vote. The current burden and political or command cost are shown in the confirmation text."
ireland_action_count_formal_and_routine_votes: "Count Formal and Routine Votes"
ireland_action_count_formal_and_routine_votes_desc: "Commit to Count Formal and Routine Votes in Dublin Metropolitan Region. Distinguish the 153-seat formal mandate from the 152-seat routine working majority so a route cannot spend ordinary business as if it were a constitutional vote; the ledger records which threshold each decision needs."
ireland_action_open_coalition_negotiations: "Open Coalition Negotiations"
ireland_action_open_coalition_negotiations_desc: "Commit to Open Coalition Negotiations in Dublin Metropolitan Region. Separate offices, programme promises, confidence-and-supply terms, and local concessions before the coalition is treated as a government; unresolved clauses remain visible to every partner."
ireland_action_assign_cabinet_portfolios: "Assign Cabinet Portfolios"
ireland_action_assign_cabinet_portfolios_desc: "Commit to Assign Cabinet Portfolios in Dublin Metropolitan Region. Give named offices responsibility for finance, defence, justice, welfare, foreign affairs, and Northern questions without granting free offices through a political victory; each portfolio carries its own scrutiny."
ireland_action_ratify_the_coalition_charter: "Ratify the Coalition Charter"
ireland_action_ratify_the_coalition_charter_desc: "Commit to Ratify the Coalition Charter in Dublin Metropolitan Region. Record the parties, offices, programme, vote discipline, dispute procedure, and expiry terms so a coalition can fail cleanly instead of leaving duplicate authority; the charter names its renewal test."
ireland_action_prepare_a_by_election: "Prepare a By-Election"
ireland_action_prepare_a_by_election_desc: "Commit to Prepare a By-Election in Dublin Metropolitan Region. Audit the vacancy, register, candidates, polling security, and transfer procedure before the constituency is asked to repair the government's majority; the result can restore a mandate but cannot erase a constitutional deficit."
ireland_mission_conduct_a_free_general_election: "Conduct a Free General Election"
ireland_mission_conduct_a_free_general_election_desc: "The live mode is either a national poll or the named by-election. Complete the register, free campaign, polling security, candidate slate, and count in the named regions within the active 105- or 100-day deadline. Full success records a valid mandate; partial success records disputed regions and recounts; failure invalidates the poll or leaves the vacancy, then clears temporary campaign state."
ireland_mission_form_a_government_after_the_poll: "Form a Government After the Poll"
ireland_mission_form_a_government_after_the_poll_desc: "In the Dáil, nominate the Taoiseach, assign portfolios, ratify the coalition charter, and reach 70 routine votes within 60 days. Full success installs the government; partial success creates a caretaker or confidence-and-supply cabinet; failure opens a presidential crisis or new election."
ireland_mission_consolidate_the_movement_network: "Consolidate the Movement Network"
ireland_mission_consolidate_the_movement_network_desc: "The active mode is an IRA, Republican Congress, corporate, or Ailtirí underground programme. Consolidate the named platform in Leinster, Munster, or the Western Seaboard within 150 days. Full success establishes the network; partial success preserves a fractured cell structure; failure or escalation exposes the organisation, then clears temporary command state."
ireland_action_negotiate_an_education_compact: "Negotiate an Education Compact"
ireland_action_negotiate_an_education_compact_desc: "Commit to Negotiate an Education Compact in Connacht and Western Seaboard. Settle funding, language, denominational management, inspection, and minority safeguards while the public and concealed cultural ledgers remain separate. The current burden and political or command cost are shown in the confirmation text."
ireland_action_contract_parish_welfare_services: "Contract Parish Welfare Services"
ireland_action_contract_parish_welfare_services_desc: "Commit to Contract Parish Welfare Services in Dublin Metropolitan Region. Put funding, access, inspection, and appeal rights into a service contract so welfare capacity does not become an unreviewed political dependency. The current burden and political or command cost are shown in the confirmation text."
ireland_action_create_a_public_health_board: "Create a Public Health Board"
ireland_action_create_a_public_health_board_desc: "Commit to Create a Public Health Board in Dublin Metropolitan Region. Build a mixed or state administration with trained staff, county access, and a funding rule; the board cannot create hospitals or supplies for free. The current burden and political or command cost are shown in the confirmation text."
ireland_action_charter_collective_bargaining: "Charter Collective Bargaining"
ireland_action_charter_collective_bargaining_desc: "Commit to Charter Collective Bargaining in Dublin Metropolitan Region. Define unions, wages, arbitration, essential services, and strike rights before a dispute becomes a lockout or coercive labour law. The current burden and political or command cost are shown in the confirmation text."
ireland_action_set_agricultural_prices: "Set Agricultural Prices"
ireland_action_set_agricultural_prices_desc: "Commit to Set Agricultural Prices in Munster. Balance producer income, consumer prices, exports, and state purchasing while National Provision is [?ireland_provision_display|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_recognise_an_agrarian_support_bloc: "Recognise an Agrarian Support Bloc"
ireland_action_recognise_an_agrarian_support_bloc_desc: "Commit to Recognise an Agrarian Support Bloc in Dublin Metropolitan Region. Record a dated issue caucus without falsifying party membership or promising a permanent office. The current burden and political or command cost are shown in the confirmation text."
ireland_action_convene_a_vocational_council: "Convene a Vocational Council"
ireland_action_convene_a_vocational_council_desc: "Commit to Convene a Vocational Council in Dublin Metropolitan Region. Bring employers, labour, farmers, professionals, Church, and minority delegates into a bounded advisory body without bypassing the Dáil. The current burden and political or command cost are shown in the confirmation text."
ireland_action_audit_church_service_dependency: "Audit Church Service Dependency"
ireland_action_audit_church_service_dependency_desc: "Commit to Audit Church Service Dependency in Dublin Metropolitan Region. Measure capacity, access, finance, exclusion, and replacement options before choosing between a public standard and a renewed contract. The current burden and political or command cost are shown in the confirmation text."
ireland_action_protect_minority_institutions: "Protect Minority Institutions"
ireland_action_protect_minority_institutions_desc: "Commit to Protect Minority Institutions in Dublin Metropolitan Region. Fund schools, worship, associations, and civil access with safeguards that survive both majority backlash and emergency law. The current burden and political or command cost are shown in the confirmation text."
ireland_action_mediate_an_essential_service_dispute: "Mediate an Essential-Service Dispute"
ireland_action_mediate_an_essential_service_dispute_desc: "Commit to Mediate an Essential-Service Dispute in Dublin Metropolitan Region. Choose arbitration, wage concessions, emergency staffing, or coercion for the named service and record what each side gives up. The current burden and political or command cost are shown in the confirmation text."
ireland_mission_deliver_the_education_settlement: "Deliver the Education Settlement"
ireland_mission_deliver_the_education_settlement_desc: "Open schools in the two named regions, appoint staff, fund management, and preserve minority access within 150 days. Full success stabilises the education law; partial success leaves one region under review; failure produces boycott, closure, or forced-assimilation pressure."
ireland_mission_keep_essential_services_running: "Keep Essential Services Running"
ireland_mission_keep_essential_services_running_desc: "The live mode is either capital service restoration or a parish contract audit. Restore the named service within 60 days, or audit access, finance, staffing, and oversight across the named networks within the active 120-day audit deadline. Full success preserves the service ledger; partial success leaves a conditional arrangement; failure exposes a stoppage or dependency, then clears temporary service state."
ireland_mission_secure_constituent_authority: "Secure Constituent Authority"
ireland_mission_secure_constituent_authority_desc: "The active mode is an IRA, Republican Congress, corporate, or Ailtirí constituent programme. Secure the named Dublin or regional authority objective within 180 days. Full success establishes a recognised constituent authority; partial success leaves conditional authority; failure or escalation exposes the claim, then clears temporary constitutional state."
ireland_action_fund_gaeltacht_administration: "Fund Gaeltacht Administration"
ireland_action_fund_gaeltacht_administration_desc: "Commit to Fund Gaeltacht Administration in Gaeltacht and Atlantic Islands. Pay for language staff, roads, schools, broadcasting, and public-service delivery while National Provision is [?ireland_provision_display|0]; symbolic culture is not a substitute for capacity. The current burden and political or command cost are shown in the confirmation text."
ireland_action_expand_folklore_collection: "Expand Folklore Collection"
ireland_action_expand_folklore_collection_desc: "Commit to Expand Folklore Collection in Connacht and Western Seaboard. Collect named testimonies, sites, and provenance without presenting uncertain folklore as proof of a crown, province, or supernatural obligation. The current burden and political or command cost are shown in the confirmation text."
ireland_action_survey_provincial_archives: "Survey Provincial Archives"
ireland_action_survey_provincial_archives_desc: "Commit to Survey Provincial Archives in Dublin Metropolitan Region. Catalogue charters, legal records, genealogies, maps, and local claims with provenance before a cultural route can call them evidence. The current burden and political or command cost are shown in the confirmation text."
ireland_action_hold_a_provincial_cultural_congress: "Hold a Provincial Cultural Congress"
ireland_action_hold_a_provincial_cultural_congress_desc: "Commit 5 Trucks to Hold a Provincial Cultural Congress in Dublin Metropolitan Region. Bring county, language, labour, Church, artistic, and historical delegates into a recorded cultural mandate; a cancelled launch returns 3 Trucks and does not reveal sealed evidence. The current burden and political or command cost are shown in the confirmation text."
ireland_action_protect_a_historic_site: "Protect a Historic Site"
ireland_action_protect_a_historic_site_desc: "Commit 250 manpower, 5 Trucks, and 10 Support Equipment maintenance kits to Protect a Historic Site in Cork and Southwest. Staff, secure, document, and maintain the named site with a local constituency behind the work, without converting stewardship into a military occupation or a political claim. The current burden and political or command cost are shown in the confirmation text."
ireland_action_standardise_irish_language_services: "Standardise Irish-Language Services"
ireland_action_standardise_irish_language_services_desc: "Commit to Standardise Irish-Language Services in Gaeltacht and Atlantic Islands. Phase bilingual administration through trained staff, documents, and public access rather than imposing a deadline that closes a service. The current burden and political or command cost are shown in the confirmation text."
ireland_action_test_a_restoration_claim: "Test a Restoration Claim"
ireland_action_test_a_restoration_claim_desc: "Commit to Test a Restoration Claim in Dublin Metropolitan Region. Submit the crown, provincial, legal, or folklore claim to independent review and keep the concealed evidence ledger sealed until provenance and witnesses are credible. The current burden and political or command cost are shown in the confirmation text."
ireland_action_contain_a_public_folklore_panic: "Contain a Public Folklore Panic"
ireland_action_contain_a_public_folklore_panic_desc: "Commit to Contain a Public Folklore Panic in Dublin Metropolitan Region. Use local authorities, clergy, scholars, police, or route institutions to reduce panic while preserving the evidence record and keeping sealed content concealed. The current burden and political or command cost are shown in the confirmation text."
ireland_action_convene_a_hidden_evidence_council: "Convene a Hidden Evidence Council"
ireland_action_convene_a_hidden_evidence_council_desc: "Commit to Convene a Hidden Evidence Council in Dublin Metropolitan Region. Convene it only after Verify the Restoration Evidence has fully succeeded, independent review is recorded, and hidden-content permission is active. Choose secrecy, public inquiry, royal, provincial, or stewardship authority; the council authorises a concealed transition but does not manufacture evidence. The current burden and political or command cost are shown in the confirmation text."
ireland_action_archive_the_failed_restoration: "Archive the Failed Restoration"
ireland_action_archive_the_failed_restoration_desc: "Commit to Archive the Failed Restoration in Dublin Metropolitan Region. Preserve records, compensate affected institutions, and restore ordinary ownership so a disproved claim does not keep a route or site captive. The current burden and political or command cost are shown in the confirmation text."
ireland_mission_collect_a_national_folklore_cycle: "Collect a National Folklore Cycle"
ireland_mission_collect_a_national_folklore_cycle_desc: "Complete collector, school, archive, custody, and provenance work across the Gaeltacht and three provincial regions within 180 days. Full success verifies the records and raises cultural capacity; partial success preserves a regional collection with warnings; failure records fabrication, loss, or politicisation."
ireland_mission_hold_a_five_region_cultural_congress: "Hold a Five-Region Cultural Congress"
ireland_mission_hold_a_five_region_cultural_congress_desc: "Bring delegates from Dublin and four provincial centres together with transport, rights, programme, and regional participation within 210 days. Full success matures provincial cultural institutions; partial success holds a congress with one boycott; failure records central capture or regional collapse."
ireland_mission_verify_the_restoration_evidence: "Verify the Restoration Evidence"
ireland_mission_verify_the_restoration_evidence_desc: "Test provenance, independent review, site custody, and unusual-condition evidence at the named archives and sites within 270 days. Full success validates the H-to-P or P-to-A transition; partial success delays the reveal; failure resolves the false lead, fraud, panic, or route closure and cleans its evidence flags."
ireland_action_audit_the_republican_commands: "Audit the Republican Commands"
ireland_action_audit_the_republican_commands_desc: "Commit to Audit the Republican Commands in Dublin Metropolitan Region. Compare armed orders, civilian authority, local compliance, equipment, and warning capacity before a route can claim a command structure; Readiness is [?ireland_readiness_display|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_convene_the_convention_of_commands: "Convene the Convention of Commands"
ireland_action_convene_the_convention_of_commands_desc: "Commit to Convene the Convention of Commands in Dublin Metropolitan Region. Bring the Army, Garda, LDF, and recognised armed organisations under a written civil chain with named limits and a review date. The current burden and political or command cost are shown in the confirmation text."
ireland_action_create_a_civil_republican_directorate: "Create a Civil Republican Directorate"
ireland_action_create_a_civil_republican_directorate_desc: "Commit to Create a Civil Republican Directorate in Dublin Metropolitan Region. Build a lawful civilian organisation with public offices, local organisers, and a record that can compete with underground claims without inheriting an armed chain. The current burden and political or command cost are shown in the confirmation text."
ireland_action_rebuild_the_republican_congress: "Rebuild the Republican Congress"
ireland_action_rebuild_the_republican_congress_desc: "Commit to Rebuild the Republican Congress in Dublin Metropolitan Region. Reassemble unions, republicans, smallholders, and women organisers around a programme whose constituent rights and armed-wing boundary are written down. The current burden and political or command cost are shown in the confirmation text."
ireland_action_ratify_the_common_programme: "Ratify the Common Programme"
ireland_action_ratify_the_common_programme_desc: "Commit to Ratify the Common Programme in Dublin Metropolitan Region. Convert the coalition's promises into dated obligations for departments, votes, and local organisations rather than a slogan without a budget. The current burden and political or command cost are shown in the confirmation text."
ireland_action_reassemble_the_national_corporate_party: "Reassemble the National Corporate Party"
ireland_action_reassemble_the_national_corporate_party_desc: "Commit to Reassemble the National Corporate Party in Dublin Metropolitan Region. Rebuild the producer, employer, labour, and regional representation without allowing the party to replace the Dáil or hide its foreign and financial dependencies. The current burden and political or command cost are shown in the confirmation text."
ireland_action_impose_compulsory_estates: "Impose Compulsory Estates"
ireland_action_impose_compulsory_estates_desc: "Commit to Impose Compulsory Estates in Dublin Metropolitan Region. A compulsory producer structure must name representation, prices, labour, and the limits of state direction before it can claim constitutional authority. The current burden and political or command cost are shown in the confirmation text."
ireland_action_organise_ailtiri_cells: "Organise Ailtirí Cells"
ireland_action_organise_ailtiri_cells_desc: "Commit to Organise Ailtirí Cells in Connacht and Western Seaboard. Build the dated language, producer, and regional network with a clear boundary between public politics and clandestine security activity. The current burden and political or command cost are shown in the confirmation text."
ireland_action_launch_the_ailtiri_party_state: "Launch the Ailtirí Party State"
ireland_action_launch_the_ailtiri_party_state_desc: "Commit to Launch the Ailtirí Party State in Dublin Metropolitan Region. Name the offices, producer estates, regional representation, and electoral boundary before the party-state can claim authority; it cannot create free industry, equipment, or alignment. The current burden and political or command cost are shown in the confirmation text."
ireland_action_dissolve_the_failed_underground: "Dissolve the Failed Underground"
ireland_action_dissolve_the_failed_underground_desc: "Commit to Dissolve the Failed Underground in Dublin Metropolitan Region. Close cells, account for weapons and funds, protect civilians, and give members a lawful exit so an underground failure does not become a second armed authority. The current burden and political or command cost are shown in the confirmation text."
ireland_action_set_county_tillage_quotas: "Set County Tillage Quotas"
ireland_action_set_county_tillage_quotas_desc: "Commit to Set County Tillage Quotas in Midlands and Central Plain. Set acreage by soil, planting window, seed, fertiliser, transport, and producer price so the quota changes food security rather than only the paperwork. The current burden and political or command cost are shown in the confirmation text."
ireland_action_distribute_seed_and_fertiliser: "Distribute Seed and Fertiliser"
ireland_action_distribute_seed_and_fertiliser_desc: "Commit to Distribute Seed and Fertiliser in Midlands and Central Plain. Allocate the scarce inputs by soil, planting window, and transport access so the tillage quota is materially possible. The current burden and political or command cost are shown in the confirmation text."
ireland_action_repair_mills_and_storage: "Repair Mills and Storage"
ireland_action_repair_mills_and_storage_desc: "Commit to Repair Mills and Storage in Munster. Restore milling, dry storage, county reserves, and the route to households before the harvest becomes a shortage through spoilage or transport failure. The current burden and political or command cost are shown in the confirmation text."
ireland_action_purchase_emergency_livestock: "Purchase Emergency Livestock"
ireland_action_purchase_emergency_livestock_desc: "Commit to Purchase Emergency Livestock in Dublin Metropolitan Region. Replace lost animals through a recorded buying programme with feed, transport, veterinary capacity, and county distribution rather than a one-time headline. The current burden and political or command cost are shown in the confirmation text."
ireland_action_license_protected_workshops: "License Protected Workshops"
ireland_action_license_protected_workshops_desc: "Commit to License Protected Workshops in Dublin Metropolitan Region. Protect the named workshops from disruption while recording orders, labour, inputs, and civilian supply so emergency production does not become an unreviewed office. The current burden and political or command cost are shown in the confirmation text."
ireland_action_commission_a_developmental_plant: "Commission a Developmental Plant"
ireland_action_commission_a_developmental_plant_desc: "Commit to Commission a Developmental Plant in Shannon and Mid-West. This commits Support Equipment and convoy capacity for imported machinery. Name the workforce, power, inputs, and delivery deadline; National Provision records the plant's real burden rather than granting instant industry."
ireland_action_issue_ration_books: "Issue Ration Books"
ireland_action_issue_ration_books_desc: "Commit to Issue Ration Books in Dublin Metropolitan Region. Register households, displaced people, seasonal workers, appeals, and county distribution so a ration reaches the public it names. The current burden and political or command cost are shown in the confirmation text."
ireland_action_rebalance_fuel_allocation: "Rebalance Fuel Allocation"
ireland_action_rebalance_fuel_allocation_desc: "Commit to Rebalance Fuel Allocation in Midlands and Central Plain. Move fuel among hospitals, farms, rail, fishing, and workshops by a published priority while the live Provision display is [?ireland_provision_display|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_mobilise_emergency_turf: "Mobilise Emergency Turf"
ireland_action_mobilise_emergency_turf_desc: "Commit to Mobilise Emergency Turf in Midlands and Central Plain. Organise peat cutting, drying, transport, labour, and fuel allocation for the emergency without pretending that raw turf becomes energy before it reaches a depot. The current burden and political or command cost are shown in the confirmation text."
ireland_action_repair_a_named_rail_corridor: "Repair a Named Rail Corridor"
ireland_action_repair_a_named_rail_corridor_desc: "Commit to Repair a Named Rail Corridor in Dublin to Cork Corridor. Restore the named line's track, signals, rolling stock, and seasonal capacity so food, fuel, and troops are not promised a route that cannot carry them. The current burden and political or command cost are shown in the confirmation text."
ireland_action_establish_a_strategic_depot: "Establish a Strategic Depot"
ireland_action_establish_a_strategic_depot_desc: "Commit to Establish a Strategic Depot in Midlands and Central Plain. Build a stocked, guarded, and connected reserve with a named command and civilian inventory rather than a paper warehouse. The current burden and political or command cost are shown in the confirmation text."
ireland_action_charter_foreign_tonnage: "Charter Foreign Tonnage"
ireland_action_charter_foreign_tonnage_desc: "Commit to Charter Foreign Tonnage in Cork and Southwest. Name the carrier, cargo, route, insurance, and exit clause so foreign capacity remains a bounded contract under Irish control."
ireland_action_purchase_a_merchant_vessel: "Purchase a Merchant Vessel"
ireland_action_purchase_a_merchant_vessel_desc: "Commit to Purchase a Merchant Vessel in Cork and Southwest. Buy a named vessel with crew, insurance, route, and cargo rules; the purchase creates shipping capacity but not a free convoy or a permanent supply guarantee. The current burden and political or command cost are shown in the confirmation text."
ireland_action_reroute_an_essential_cargo: "Reroute an Essential Cargo"
ireland_action_reroute_an_essential_cargo_desc: "Commit to Reroute an Essential Cargo in Shannon and Western Port Network. Select a named port, carrier, escort rule, and delivery deadline while keeping the route neutral and the cargo traceable. The current burden and political or command cost are shown in the confirmation text."
ireland_action_launch_an_emergency_housing_scheme: "Launch an Emergency Housing Scheme"
ireland_action_launch_an_emergency_housing_scheme_desc: "Commit to Launch an Emergency Housing Scheme in Dublin Metropolitan Region. Fund land, materials, labour, transport, and completion checks for named households; the scheme must deliver homes rather than free industry or equipment. The current burden and political or command cost are shown in the confirmation text."
ireland_action_fund_a_western_regional_portfolio: "Fund a Western Regional Portfolio"
ireland_action_fund_a_western_regional_portfolio_desc: "Commit 5 Trucks to Fund a Western Regional Portfolio in Connacht and Western Seaboard. Tie the delivery to named roads, fisheries, language services, or power works; a cancelled launch returns 3 Trucks, while completed work remains a real regional commitment. The current burden and political or command cost are shown in the confirmation text."
ireland_mission_meet_the_county_tillage_schedule: "Meet the County Tillage Schedule"
ireland_mission_meet_the_county_tillage_schedule_desc: "Deliver seed, fertiliser, labour, and machinery to the selected rural counties and meet their acreage targets within 150 days. Full success raises Food Security and Rural Organisation; partial success reaches acreage with yield or consent loss; failure records quota failure, farm resistance, or urban shortage."
ireland_mission_bring_the_harvest_to_market: "Bring the Harvest to Market"
ireland_mission_bring_the_harvest_to_market_desc: "Keep the road or rail route open from the named rural region to its city or port, then provide fuel, storage, milling, and fair purchasing within 120 days. Full success delivers usable food stocks; partial success delivers part with spoilage or price dispute; failure collapses transport or storage."
ireland_mission_commission_the_protected_workshop_network: "Commission the Protected Workshop Network"
ireland_mission_commission_the_protected_workshop_network_desc: "Install machines, power, inputs, labour, and orders at both named industrial regions within 180 days. Full success creates durable industrial capacity; partial success puts one site into operation while the other remains dependent; failure closes idle licences and records patronage or power loss."
ireland_mission_complete_a_developmental_plant: "Complete a Developmental Plant"
ireland_mission_complete_a_developmental_plant_desc: "Finish construction at the named industrial site, import machines, train workers, secure power, and secure a market within 270 days. Full success opens the plant; partial success opens it below capacity with follow-up work; failure records unfinished debt, labour, or input failure and releases the reserved factories."
ireland_mission_supply_the_capital_through_winter: "Supply the Capital Through Winter"
ireland_mission_supply_the_capital_through_winter_desc: "Keep food, fuel, transport, and ration distribution in Dublin Metropolitan Region above their minimum floors for 120 days. Full success protects consent and Provision; partial success leaves one good scarce; failure produces an urban stoppage, cold crisis, riot, or black market."
ireland_mission_cut_and_dry_the_turf: "Cut and Dry the Turf"
ireland_mission_cut_and_dry_the_turf_desc: "Recruit labour, meet dry-tonnage, and move the turf from the Midlands and one western region within 120 days. Full success creates the seasonal energy reserve; partial success loses transport capacity or quality; failure records a wet-season or labour crisis and releases seasonal teams."
ireland_mission_restore_the_dublin_to_cork_corridor: "Restore the Dublin to Cork Corridor"
ireland_mission_restore_the_dublin_to_cork_corridor_desc: "Repair bridges and track on the Dublin-to-Cork Corridor, assign trains and fuel, and protect depots within 180 days. Full success raises Transport Serviceability; partial success opens reduced capacity; failure leaves the corridor broken or sabotaged and removes temporary engineering priority."
ireland_mission_keep_an_essential_cargo_route_open: "Keep an Essential Cargo Route Open"
ireland_mission_keep_an_essential_cargo_route_open_desc: "Keep the Cork and Southwest receiving port and overseas route supplied with a vessel, crew, port access, intelligence, railway, and inland distribution for 120 days. Full success requires Maritime Access 50 and the named port-capacity tier; partial success requires Maritime Access 35 with a live route or railway; failure records sinking, seizure, closure, capacity loss, or crew refusal."
ireland_mission_replace_a_lost_merchant_vessel: "Replace a Lost Merchant Vessel"
ireland_mission_replace_a_lost_merchant_vessel_desc: "Secure finance, a replacement vessel, repairs, crew, and route certification for the Irish Shipping fleet within 270 days. Full success restores tonnage; partial success uses a temporary charter; failure closes procurement offers while retaining the debt or market obligation."
ireland_mission_deliver_a_western_regional_portfolio: "Deliver a Western Regional Portfolio"
ireland_mission_deliver_a_western_regional_portfolio_desc: "Complete at least three linked road, power, fishery, school, workshop, or housing projects in Connacht and the Western Seaboard within 300 days. Full success raises regional capacity and consent; partial success completes two projects and defers one; failure archives fragmentation, patronage, or migration pressure."
ireland_action_run_a_command_district_exercise: "Run a Command District Exercise"
ireland_action_run_a_command_district_exercise_desc: "Commit to Run a Command District Exercise in Eastern Administrative Corridor. Test mobilisation notices, rail movement, civilian liaison, supply, warning, and the handoff between named command offices. The current burden and political or command cost are shown in the confirmation text."
ireland_action_standardise_infantry_equipment: "Standardise Infantry Equipment"
ireland_action_standardise_infantry_equipment_desc: "Commit to Standardise Infantry Equipment in Dublin Metropolitan Region. Set the formation floor, inspection rule, repair reserve, and distribution priority so equipment readiness measures usable units rather than a central stockpile. The current burden and political or command cost are shown in the confirmation text."
ireland_action_procure_rifles_and_support_equipment: "Procure Rifles and Support Equipment"
ireland_action_procure_rifles_and_support_equipment_desc: "Commit to Procure Rifles and Support Equipment in Cork and Southwest. Match the named procurement to a trained receiving formation, convoy route, inspection, and storage record; Readiness cannot be bought as free units. The current burden and political or command cost are shown in the confirmation text."
ireland_action_activate_a_cadre_reserve: "Activate a Cadre Reserve"
ireland_action_activate_a_cadre_reserve_desc: "Commit to Activate a Cadre Reserve in Dublin Metropolitan Region. Preserve officers, instructors, equipment records, pay, and a call-up schedule so demobilisation can reduce burden without erasing command capacity. The current burden and political or command cost are shown in the confirmation text."
ireland_action_expand_the_local_security_force: "Expand the Local Security Force"
ireland_action_expand_the_local_security_force_desc: "Commit to Expand the Local Security Force in Border Belt. Recruit, train, equip, and supervise a named local force for border observation and civil protection without creating a second army. The current burden and political or command cost are shown in the confirmation text."
ireland_action_expand_the_local_defence_force: "Expand the Local Defence Force"
ireland_action_expand_the_local_defence_force_desc: "Commit to Expand the Local Defence Force in Donegal and Northwest. Put volunteers under written orders, supply the exposed coast, and keep local knowledge accountable to the national command audit. The current burden and political or command cost are shown in the confirmation text."
ireland_action_motorise_a_strategic_route: "Motorise a Strategic Route"
ireland_action_motorise_a_strategic_route_desc: "Commit 50 Trucks and 300 Fuel, with a supplied division in the named corridor, to Motorise a Strategic Route in Dublin to Belfast Corridor. The route creates mobility only while fuel, supply, command, and the named corridor remain available; it does not create control or a Northern claim. The current burden and political or command cost are shown in the confirmation text."
ireland_action_build_a_coastwatch_sector_network: "Build a Coastwatch Sector Network"
ireland_action_build_a_coastwatch_sector_network_desc: "Commit to Build a Coastwatch Sector Network in the next unfilled named sector. The Marine and Coast Watching Service must already be active, with the sector's named regional platform and a connected post site. The action consumes 20 Support Equipment and 250 manpower; the current burden and political or command cost are shown in the confirmation text."
ireland_action_install_harbour_defences: "Install Harbour Defences"
ireland_action_install_harbour_defences_desc: "Commit to Install Harbour Defences in Cork and Southwest. A valid port authority and full control of the transferred harbour must be in force before the guns, magazines, searchlights, and communications are committed. The action consumes 50 Artillery, 25 Support Equipment, and 500 manpower; the current burden and political or command cost are shown in the confirmation text."
ireland_action_organise_marine_patrols: "Organise Marine Patrols"
ireland_action_organise_marine_patrols_desc: "Commit to Organise Marine Patrols in Cork and Southwest. The Marine Service or an active Irish, chartered, purchased, or renewed shipping route must provide the patrol authority, with full control of a port containing an industrial complex and naval base for repair and dispatch. The 3 Convoys are bound as one dedicated coastal patrol-craft coverage allocation, not ordinary merchant shipping. The action also consumes 250 Fuel, 250 manpower, and 10 Naval Experience; the current burden and political or command cost are shown in the confirmation text."
ireland_action_open_a_g2_liaison_channel: "Open a G2 Liaison Channel"
ireland_action_open_a_g2_liaison_channel_desc: "Commit to Open a G2 Liaison Channel in Dublin Metropolitan Region. A valid foreign partner or Northern war plan, Irish sovereignty and review safeguards or Security Under Law, and the secure communications commitment must exist before the information class and Irish control rules are recorded."
ireland_action_turn_or_intern_a_foreign_agent: "Turn or Intern a Foreign Agent"
ireland_action_turn_or_intern_a_foreign_agent_desc: "Commit to Turn or Intern a Foreign Agent in Dublin Metropolitan Region. An active intelligence incident and a Security Under Law or National Emergency legal order are required; the incident record preserves evidence, equal rules, and the limits of Irish neutrality. The current burden and political or command cost are shown in the confirmation text."
ireland_action_protect_an_operational_plan: "Protect an Operational Plan"
ireland_action_protect_an_operational_plan_desc: "Commit to Protect an Operational Plan in Border Belt. An authored Plan W, Northern, invasion, or occupation plan must exist; a deployed operational formation, strategic depot, command record, and the named communications or liaison authority must support the work. The action creates no free unit, route, or foreign commitment. The current burden and political or command cost are shown in the confirmation text."
ireland_action_demobilise_a_force_tier: "Demobilise a Force Tier"
ireland_action_demobilise_a_force_tier_desc: "Commit to Demobilise a Force Tier in Dublin Metropolitan Region. A selected cadre, Local Security Force, or Local Defence Force tier must have a real formation, depot, and command record. Release personnel, recover equipment, settle pay, and preserve the named cadre after wartime danger falls or the postwar review opens; demobilisation is not deletion of the readiness ledger. The current burden and political or command cost are shown in the confirmation text."
ireland_mission_prove_the_command_district: "Prove the Command District"
ireland_mission_prove_the_command_district_desc: "Maintain one or two existing divisions in Ireland, keep the arms-and-infrastructure platform supplied, preserve communications, and complete movement and defence tasks within 105 days. Full success requires two divisions, Command 50, and Supply 35; partial success requires one division, Command 35, and Supply 20; failure records accident, breakdown, or command refusal without mutating unit placement."
ireland_mission_equip_a_reserve_brigade: "Equip a Reserve Brigade"
ireland_mission_equip_a_reserve_brigade_desc: "Provide manpower, rifles, support equipment, officers, and training to the named mobilisation district within 150 days. Full success creates a deployable formation; partial success leaves an understrength cadre; failure records an equipment and consent drain and removes the provisional template."
ireland_mission_secure_the_dublin_to_belfast_corridor: "Secure the Dublin to Belfast Corridor"
ireland_mission_secure_the_dublin_to_belfast_corridor_desc: "Place supplied formations along the Dublin-to-Belfast Corridor, protect bridges and depots, and keep civilian passage open within 120 days. Full success improves mobility and Northern planning; partial success secures the military route with civilian disruption; failure records blockage, sabotage, or political inflammation and stands down the units."
ireland_mission_complete_a_coastwatch_sector: "Complete a Coastwatch Sector"
ireland_mission_complete_a_coastwatch_sector_desc: "Staff [GetIrelandCoastwatchActiveSector], train recognition, connect communications, supply relief, and test reporting within 120 days. Full success records the sector as operational; partial success leaves a staffing or communications gap that can be retried; failure leaves the sector blind or compromised."
ireland_mission_defend_a_treaty_port: "Defend a Treaty Port"
ireland_mission_defend_a_treaty_port_desc: "Repair guns at Cobh, Berehaven, or Lough Swilly, train crews, stock magazines, connect warning, and define command within 210 days. Full success raises Maritime Protection; partial success makes the port usable only under limits; failure records unsafe defence, access crisis, or foreign demand."
ireland_mission_patrol_the_neutral_approaches: "Patrol the Neutral Approaches"
ireland_mission_patrol_the_neutral_approaches_desc: "Maintain the committed patrol craft, fuel, crews, rescue, repair, and inspection coverage across the named coastal sector and port for 105 days. Full success improves detection and rescue; partial success keeps coverage with maintenance cost; failure records craft loss, confrontation, or an uncovered route before releasing crews. The craft commitment is released on every terminal result."
ireland_mission_protect_plan_w: "Protect Plan W"
ireland_mission_protect_plan_w_desc: "Vet the liaison, secure Plan W maps, test communications, and protect the named border depots and command centres within 120 days. Full success improves Intelligence Coordination and plan reliability; partial success preserves the plan with exposure; failure archives compromised documents or contacts."
ireland_mission_demobilise_without_losing_the_cadre: "Demobilise Without Losing the Cadre"
ireland_mission_demobilise_without_losing_the_cadre_desc: "Release personnel while preserving officers, equipment, depots, and records across the national force within 210 days. Full success lowers the burden while retaining a readiness floor; partial success preserves the cadre with unemployment or equipment loss; failure records arms leakage, mutiny, or capability collapse."
ireland_action_intercept_an_airspace_violation: "Intercept an Airspace Violation"
ireland_action_intercept_an_airspace_violation_desc: "Intercept the active airspace incident in South and Southeast with the Air Corps response. An operational air-warning network or command authority with an air base in Dublin must be available. Commit 5 Fighters and 100 Fuel; the action improves the intelligence ledger, records a possible forced landing for the internment case, and opens the foreign-reaction window."
ireland_action_intern_a_belligerent_crew: "Intern a Belligerent Crew"
ireland_action_intern_a_belligerent_crew_desc: "Commit 250 manpower for guards to intern the named belligerent crew in Cork and Southwest while an internment incident or intercepted forced landing is active under the current law. Apply equal custody, medical, consular, parole, and exchange rules; a cancelled launch returns 175 manpower. The current burden and political or command cost are shown in the confirmation text."
ireland_action_release_or_exchange_internees: "Release or Exchange Internees"
ireland_action_release_or_exchange_internees_desc: "Release or exchange the named internees only while an internment incident is active under the current internment law. The case closes only after the legal and diplomatic decision is recorded; the response adds Foreign Exposure and leverage to the live named channel when one carries the case, while a neutral-states channel records exposure only."
ireland_action_investigate_a_neutral_shipping_loss: "Investigate a Neutral Shipping Loss"
ireland_action_investigate_a_neutral_shipping_loss_desc: "Investigate the active neutral-shipping incident in Cork and Southwest under the trade and shipping law. Marine Service and intelligence readiness, a controlled Munster port-industry proof, and the named merchant-sinking mission determine whether Ireland can recover evidence and present a protest or rerouting case."
ireland_action_mark_and_publicise_neutral_shipping: "Mark and Publicise Neutral Shipping"
ireland_action_mark_and_publicise_neutral_shipping_desc: "Maintain the markings, lights, route notices, and diplomatic notification for an existing Irish or chartered merchant route in Dublin Metropolitan Region. The linked equal-rules mission measures whether the service can reduce misidentification without pretending that deliberate loss has been prevented."
ireland_action_share_a_controlled_weather_report: "Share a Controlled Weather Report"
ireland_action_share_a_controlled_weather_report_desc: "Commit 250 manpower and 10 Support Equipment to Share a Controlled Weather Report in Connacht and Western Seaboard. Choose public, equal, controlled, Allied, restricted, or deceptive release under a named incident rule; the operation records Foreign Exposure and leverage to the live named channel when one carries the report. A cancelled launch returns 175 manpower and 7 Support Equipment."
ireland_action_answer_a_foreign_access_request: "Answer a Foreign Access Request"
ireland_action_answer_a_foreign_access_request_desc: "Answer the named foreign-access incident at the Treaty Port Complexes under the current foreign-access law. A live British, American, German, Vatican, or neutral channel must identify a requesting partner; refusal, time-limited access, Irish command, sharing, and concession remain distinct diplomatic outcomes. The response records Foreign Exposure and leverage to the live named channel when one carries the request, while a neutral-states answer preserves exposure without sponsor leverage."
ireland_action_tighten_or_narrow_censorship: "Tighten or Narrow Censorship"
ireland_action_tighten_or_narrow_censorship_desc: "Commit to Tighten or Narrow Censorship in Dublin Metropolitan Region. Define the subject, duration, appeal, and review so an incident rule protects neutrality without becoming a permanent emergency."
ireland_action_open_a_border_corridor: "Open a Border Corridor"
ireland_action_open_a_border_corridor_desc: "Open a Border Corridor in Border Belt only for a named border, spillover, relief, Plan W, trade, or Northern settlement pressure. A controlled division, local security or policing preparation, 250 manpower, and 5 Trucks are committed; the operation improves security and Neutrality Integrity while increasing British leverage."
ireland_action_restore_neutrality_integrity: "Restore Neutrality Integrity"
ireland_action_restore_neutrality_integrity_desc: "Commit to Restore Neutrality Integrity in Dublin Metropolitan Region. Review access, internment, liaison, trade, censorship, and public law together, then record the resulting Neutrality Integrity and its next incident test."
ireland_mission_resolve_an_aircrew_internment_case: "Resolve an Aircrew Internment Case"
ireland_mission_resolve_an_aircrew_internment_case_desc: "Apply the internment law at the named landing site and camp, secure the crew, handle diplomacy, and prevent escape within 90 days. Full success protects Neutrality Integrity; partial success resolves the case with sponsor resentment; failure records escape, unequal treatment, or violence and clears camp state."
ireland_mission_investigate_a_merchant_sinking: "Investigate a Merchant Sinking"
ireland_mission_investigate_a_merchant_sinking_desc: "Recover survivors from the named loss location, identify the cause, preserve evidence, and decide the protest through the home port and foreign channel within 120 days. Full success updates the route, claims, and reaction; partial success leaves the cause uncertain and adjusts the route; failure records false accusation or failed rescue."
ireland_mission_maintain_equal_belligerent_rules: "Maintain Equal Belligerent Rules"
ireland_mission_maintain_equal_belligerent_rules_desc: "Apply internment, access, censorship, and rescue law consistently across the named national incident set within 150 days. Full success raises Integrity and consent; partial success defends one exception publicly; failure creates Selective Neutrality and stores the comparison history."
ireland_mission_keep_the_blacksod_station_reporting: "Keep the Blacksod Station Reporting"
ireland_mission_keep_the_blacksod_station_reporting_desc: "Staff Blacksod, maintain equipment, protect communications, and choose the report policy in Mayo within 105 days. Full success improves weather capability and liaison; partial success keeps reports running at exposure or equipment cost; failure records station failure, accident, or exposed bias."
ireland_action_renegotiate_a_british_supply_contract: "Renegotiate a British Supply Contract"
ireland_action_renegotiate_a_british_supply_contract_desc: "Commit to Renegotiate a British Supply Contract in Dublin to Belfast Corridor. Bargain price, cargo, route, credit, access, and Northern terms separately so one concession cannot silently become a sovereign obligation."
ireland_action_formalise_plan_w_liaison: "Formalise Plan W Liaison"
ireland_action_formalise_plan_w_liaison_desc: "Formalise Plan W in Border Belt only when invasion danger or war makes the liaison necessary. Command, intelligence, supply, Provision, Irish safeguards, the foreign-access law, and the British bargain must all be credible before contacts, maps, entry rules, withdrawal, and secrecy are committed. The liaison records +5 Foreign Exposure beside the British bargain."
ireland_action_send_an_american_procurement_mission: "Send an American Procurement Mission"
ireland_action_send_an_american_procurement_mission_desc: "Commit to Send an American Procurement Mission in Dublin Metropolitan Region. This commits convoy capacity to the acquisition route while foreign leverage and Irish control are recorded together."
ireland_action_mobilise_diaspora_relief: "Mobilise Diaspora Relief"
ireland_action_mobilise_diaspora_relief_desc: "Commit to Mobilise Diaspora Relief in Dublin Metropolitan Region. Coordinate competing organisations, funds, shipping, labour, and public claims so relief reaches households without becoming a foreign veto over Irish policy. The action records +3 American Leverage and +5 Foreign Exposure; the current burden and political or command cost are shown in the confirmation text."
ireland_action_receive_a_german_emissary: "Receive a German Emissary"
ireland_action_receive_a_german_emissary_desc: "Commit to Receive a German Emissary in Dublin Metropolitan Region. Hear arms, intelligence, recognition, and ideological proposals under Irish diplomatic and security control; the meeting records +5 Foreign Exposure beside the German bargain and grants no automatic aid or alignment."
ireland_action_demand_proof_of_german_delivery: "Demand Proof of German Delivery"
ireland_action_demand_proof_of_german_delivery_desc: "Commit to Demand Proof of German Delivery in Shannon and Western Port Network. Require route, cargo, date, liaison, and independence safeguards before a promised shipment can count as a usable channel."
ireland_action_seek_vatican_humanitarian_mediation: "Seek Vatican Humanitarian Mediation"
ireland_action_seek_vatican_humanitarian_mediation_desc: "Commit to Seek Vatican Humanitarian Mediation in Dublin Metropolitan Region. Request prisoner, refugee, and relief assistance without granting a domestic veto or converting humanitarian contact into political alignment. The case records +3 Vatican Leverage and +5 Foreign Exposure before mediation begins."
ireland_action_convene_a_neutral_states_consultation: "Convene a Neutral States Consultation"
ireland_action_convene_a_neutral_states_consultation_desc: "Convene a Neutral States Consultation in Dublin Metropolitan Region only when the Holy See channel and the neutral-state forum are both live and valid. Share law, shipping, internment, and postwar positions without creating alignment, recognition, sponsor leverage, or free material support. The consultation records +5 Foreign Exposure; the current burden and political or command cost are shown in the confirmation text."
ireland_action_write_anti_dependency_clauses: "Write Anti-Dependency Clauses"
ireland_action_write_anti_dependency_clauses_desc: "Commit to Write Anti-Dependency Clauses in Dublin Metropolitan Region. Separate command, customs, debt, access, ownership, duration, withdrawal, and review so a foreign agreement cannot quietly become an alignment. The current burden and political or command cost are shown in the confirmation text."
ireland_action_terminate_a_failed_sponsor_agreement: "Terminate a Failed Sponsor Agreement"
ireland_action_terminate_a_failed_sponsor_agreement_desc: "Terminate a named British, American, German, or Vatican sponsor agreement after defeat, channel invalidation, delivery default, recorded collapse, or dependency failure. The action closes only the affected channel, reduces its leverage, and absorbs a short-term Provision and Readiness shock while the foreign-reaction record handles replacement and diplomatic risk."
ireland_foreign_sponsor_termination_outcome_tt: "The failed sponsor channel is closed where its recorded agreement evidence permits. Source-specific leverage falls, and the replacement burden reduces Transport and Maritime Provision plus Supply and Equipment Readiness. No replacement aid, equipment, unit, fuel, shipping, territory, core, alignment, office, or recognition is granted for free."
ireland_mission_deliver_a_british_supply_agreement: "Deliver a British Supply Agreement"
ireland_mission_deliver_a_british_supply_agreement_desc: "Load, sail, unload, and distribute the contracted goods between the named British port, Irish port, and inland corridor while the British channel remains open within 150 days. Full success changes goods and leverage after delivery; partial success records a delayed or partial cargo; failure closes the contract with obligations or dispute."
ireland_mission_complete_an_american_procurement_mission: "Complete an American Procurement Mission"
ireland_mission_complete_an_american_procurement_mission_desc: "Secure an American licence, credit, cargo, shipping, and compatible standards between Washington, the Atlantic route, and the named Irish receiving port within 240 days. Full success delivers aid and changes the relationship; partial success secures credit or political support without full delivery; failure records embargo, debt, or access pressure."
ireland_mission_test_a_german_arms_promise: "Test a German Arms Promise"
ireland_mission_test_a_german_arms_promise_desc: "Test the German arms promise through the named contact route, landing or transfer point, cargo proof, and Irish security conditions within 150 days. Full success records delivery only after every step succeeds; partial success retains intelligence or propaganda value without arms; failure records capture, betrayal, client demand, or non-delivery."
ireland_mission_conclude_a_vatican_relief_mediation: "Conclude a Vatican Relief Mediation"
ireland_mission_conclude_a_vatican_relief_mediation_desc: "Secure the parties, passage, funds, and domestic service delivery for the named humanitarian case through the Vatican channel within 120 days. Full success improves relief and diplomatic standing; partial success records limited mediation; failure records a domestic veto claim or foreign criticism and closes the delegation."
ireland_action_open_cross_border_confidence_measures: "Open Cross-Border Confidence Measures"
ireland_action_open_cross_border_confidence_measures_desc: "Open Cross-Border Confidence Measures in Border Belt only with a named local partner or mandate. The operation commits staff to a concrete health, trade, rail, policing, prisoner, or relief competence; the Northern Settlement Ledger records the regional cost and consent result."
ireland_action_invite_northern_delegations: "Invite Northern Delegations"
ireland_action_invite_northern_delegations_desc: "Invite Northern Delegations in Belfast Urban and Harbour after local contacts or mandates are recorded. Separate unionist, nationalist, Labour, Church, civic, industry, and local-government voices are represented through the named convention mission rather than a Dublin-selected shell."
ireland_action_negotiate_british_flexibility: "Negotiate British Flexibility"
ireland_action_negotiate_british_flexibility_desc: "Commit to Negotiate British Flexibility in Dublin to Belfast Corridor. Link sovereignty, defence, finance, guarantees, timing, and local consent; the negotiation records Foreign Exposure and British Leverage alongside the flexibility movement. British agreement alone never moves Unionist Consent."
ireland_action_protect_northern_campaign_freedom: "Protect Northern Campaign Freedom"
ireland_action_protect_northern_campaign_freedom_desc: "Commit to Protect Northern Campaign Freedom in Armagh and Newry Border. The Northern Settlement Ledger records the regional cost and the consent required. The current burden and political or command cost are shown in the confirmation text."
ireland_action_convene_a_federal_powers_conference: "Convene a Federal Powers Conference"
ireland_action_convene_a_federal_powers_conference_desc: "Commit to Convene a Federal Powers Conference in Belfast Urban and Harbour. Settle executive, legislature, finance, policing, education, religion, language, defence, and review powers with every required Northern actor present. The current burden and political or command cost are shown in the confirmation text."
ireland_action_draft_a_unitary_safeguards_charter: "Draft a Unitary Safeguards Charter"
ireland_action_draft_a_unitary_safeguards_charter_desc: "Commit to Draft a Unitary Safeguards Charter in Belfast Urban and Harbour. Write local government, representation, policing, courts, schools, religion, language, finance, and guarantees before a unitary proposal can be ratified. The current burden and political or command cost are shown in the confirmation text."
ireland_action_build_a_labour_industrial_settlement: "Build a Labour Industrial Settlement"
ireland_action_build_a_labour_industrial_settlement_desc: "Commit to Build a Labour Industrial Settlement in Belfast Urban and Harbour. Link wages, discrimination, housing, welfare, shipbuilding, linen, and public works to a funded agreement that employers and unions can enforce. The current burden and political or command cost are shown in the confirmation text."
ireland_action_prepare_a_wartime_unity_bargain: "Prepare a Wartime Unity Bargain"
ireland_action_prepare_a_wartime_unity_bargain_desc: "Commit 50 Infantry Equipment and 25 Trucks once to a defined Irish-command defence scope in the Dublin to Belfast Corridor. The June 1940 crisis or a comparable war must be active, with British agreement, Readiness [?ireland_readiness_display|0] / 35, British Flexibility [?ireland_northern_british_flexibility|0] / 45, Nationalist Consent [?ireland_northern_nationalist_consent|0] / 50, and Unionist Consent [?ireland_northern_unionist_consent|0] / 20 or enforceable guarantees. The dated H14 chain then records defence-only, pledge, federal, unitary, refusal, delay, rejection, or crisis-collapse results; only a full-unity result opens the route focus. It transfers no Northern control, occupation, integration, or cores."
ireland_action_plan_a_coercive_northern_campaign: "Plan a Coercive Northern Campaign"
ireland_action_plan_a_coercive_northern_campaign_desc: "Commit to Plan a Coercive Northern Campaign in Belfast Urban and Harbour. Readiness 60, Mobility 45, Provision 55, route-valid command authority, a recorded Northern cause, border support, and an occupation plan are mandatory. The campaign does not grant control or cores: Take and Hold Belfast must meet its named map objective. The current burden and political or command cost are shown in the confirmation text."
ireland_action_defer_the_constitutional_claim_lawfully: "Defer the Constitutional Claim Lawfully"
ireland_action_defer_the_constitutional_claim_lawfully_desc: "Commit to Defer the Constitutional Claim Lawfully in Dublin Metropolitan Region. Retain the policy while setting review, contact, rights, and no-war rules so non-escalation preserves a future route instead of becoming permanent neglect."
ireland_mission_open_the_cross_border_health_service: "Open the Cross-Border Health Service"
ireland_mission_open_the_cross_border_health_service_desc: "Open the cross-border service across the Border Belt and matched Northern districts within 150 days by securing jurisdiction, staff, funding, transport, and patient access. Full success raises cooperation and Integration Capacity; partial success runs a limited pilot; failure records boycott, funding dispute, or security closure."
ireland_mission_secure_a_representative_northern_convention: "Secure a Representative Northern Convention"
ireland_mission_secure_a_representative_northern_convention_desc: "Seat unionist, nationalist, labour, local, industrial, and religious delegates from Belfast, Derry, the border, and local authorities under valid rules within 210 days. Full success permits a settlement proposal; partial success proceeds with one conditional bloc; failure records a shell convention or boycott and archives its delegates."
ireland_mission_conduct_a_supervised_plebiscite: "Conduct a Supervised Plebiscite"
ireland_mission_conduct_a_supervised_plebiscite_desc: "Complete the registers, boundaries, security, observers, campaign freedom, count, and dispute process in the defined Northern districts within 240 days. Full success records valid district results; partial success validates some districts and schedules reruns; failure invalidates the vote through occupation, intimidation, or register failure."
ireland_mission_ratify_the_federal_settlement: "Ratify the Federal Settlement"
ireland_mission_ratify_the_federal_settlement_desc: "Ratify federal powers, finance, rights, policing, defence, guarantees, and transition through the Dáil, Northern bodies, and British process within 300 days. Full success begins integration stage 2; partial success records conditional ratification; failure records rejection and removes proposal bodies."
ireland_action_establish_a_transitional_authority: "Establish a Transitional Authority"
ireland_action_establish_a_transitional_authority_desc: "Commit to Establish a Transitional Authority in Belfast Urban and Harbour. Separate military command, civil administration, courts, finance, and local representation into a dated stage-two authority; control is not integration and neither is a core. The current burden and political or command cost are shown in the confirmation text."
ireland_action_vet_and_rebuild_policing: "Vet and Rebuild Policing"
ireland_action_vet_and_rebuild_policing_desc: "Commit to Vet and Rebuild Policing in Lower Lagan and Lisburn. Review personnel, records, local consent, command, and complaint remedies so security stability rises through lawful service rather than purge. The current burden and political or command cost are shown in the confirmation text."
ireland_action_disarm_paramilitary_organisations: "Disarm Paramilitary Organisations"
ireland_action_disarm_paramilitary_organisations_desc: "Commit to Disarm Paramilitary Organisations in Derry and Foyle. A controlled Northern Ireland security sector, an Irish division in Northern Ireland, intelligence readiness, and a lawful policing authority are required before manpower and command power can be committed. The action records a real disarmament outcome rather than granting territory or cores."
ireland_action_maintain_welfare_and_pensions: "Maintain Welfare and Pensions"
ireland_action_maintain_welfare_and_pensions_desc: "Commit to Maintain Welfare and Pensions in Belfast Urban and Harbour. Keep payments, records, staff, and appeals running through the transfer so Integration Capacity is earned by institutions rather than announced by the victor. The current burden and political or command cost are shown in the confirmation text."
ireland_action_restore_belfast_industrial_contracts: "Restore Belfast Industrial Contracts"
ireland_action_restore_belfast_industrial_contracts_desc: "Commit to Restore Belfast Industrial Contracts in Belfast Urban and Harbour. This commits repair equipment and transport before the Northern Settlement Ledger records regional cost and consent."
ireland_action_settle_education_and_religious_safeguards: "Settle Education and Religious Safeguards"
ireland_action_settle_education_and_religious_safeguards_desc: "Commit to Settle Education and Religious Safeguards in Belfast Urban and Harbour. Protect schools, worship, curricula, funding, language, inspection, and minority access through a funded stage-two settlement. The current burden and political or command cost are shown in the confirmation text."
ireland_action_merge_tax_and_debt_administration: "Merge Tax and Debt Administration"
ireland_action_merge_tax_and_debt_administration_desc: "Commit to Merge Tax and Debt Administration in Lower Lagan and Lisburn. Allocate liabilities, pensions, tax, transfers, guarantees, and audits through staffed offices; Integration Capacity is [?ireland_northern_integration_capacity|0]. The current burden and political or command cost are shown in the confirmation text."
ireland_action_integrate_or_devolve_military_command: "Integrate or Devolve Military Command"
ireland_action_integrate_or_devolve_military_command_desc: "Commit to Integrate or Devolve Military Command in Belfast Urban and Harbour. A controlled Northern Ireland command site, an Irish division in the theatre, support equipment, and Army experience are consumed while the National Readiness ledger records the command settlement. This does not create free units, territory, or cores."
ireland_action_review_foreign_guarantees: "Review Foreign Guarantees"
ireland_action_review_foreign_guarantees_desc: "Commit to Review Foreign Guarantees in Dublin to Belfast Corridor. A live foreign-guarantee law must be under review alongside the British partner; renew, narrow, replace, or end monitoring and veto rights while preserving a dated Irish review of every external commitment."
ireland_action_conduct_the_core_eligibility_review: "Conduct the Core Eligibility Review"
ireland_action_conduct_the_core_eligibility_review_desc: "Commit to Conduct the Core Eligibility Review in Belfast Urban and Harbour. Check rights, representation, services, policing, resistance, finance, guarantees, demobilisation, integration stage five, and final review before any core can be permitted. The current burden and political or command cost are shown in the confirmation text."
ireland_mission_take_and_hold_belfast: "Take and Hold Belfast"
ireland_mission_take_and_hold_belfast_desc: "Control Belfast's city, docks, power, rail, depots, and supply while limiting civilian harm within 150 days. Full success begins occupation; partial success holds the city with damage or isolation; failure records campaign, intervention, or supply collapse and opens occupation cleanup."
ireland_mission_restore_ordinary_policing: "Restore Ordinary Policing"
ireland_mission_restore_ordinary_policing_desc: "Recruit, vet, train, oversee, and transfer duties from military units in three named Northern policing districts within 240 days. Full success raises Security Stability and integration stage; partial success keeps mixed policing under review; failure records sectarian force, purge, or insurgency."
ireland_mission_reopen_belfast_industry: "Reopen Belfast Industry"
ireland_mission_reopen_belfast_industry_desc: "Restore power, workers, contracts, inputs, transport, management, and security at Northern Ireland's named industrial sites within 300 days while the two-factory contract reservation remains active. Full success requires Labour Cooperation 45 and Industrial Capacity 55; partial success requires Labour Cooperation 30 and Industrial Capacity 40; failure records requisition collapse, sabotage, low labour, or absent market and releases the reservation."
ireland_mission_complete_the_stage_five_integration_review: "Complete the Stage Five Integration Review"
ireland_mission_complete_the_stage_five_integration_review_desc: "Meet the rights, representation, services, policing, resistance, finance, guarantees, and demobilisation tests across all Northern regions within 365 days. Full success records stable constitutional integration and opens final core review; partial success retains integrated non-core status with remediation; failure reopens the settlement and archives transitional bodies."
ireland_action_invite_a_celtic_cultural_partner: "Invite a Celtic Cultural Partner"
ireland_action_invite_a_celtic_cultural_partner_desc: "Commit to Invite a Celtic Cultural Partner in Dublin Metropolitan Region. Offer language, archives, universities, festivals, and broadcasting under a voluntary cultural charter with no territorial or alignment consequence."
ireland_action_draft_an_atlantic_consultation_charter: "Draft an Atlantic Consultation Charter"
ireland_action_draft_an_atlantic_consultation_charter_desc: "Draft an Atlantic Consultation Charter in Dublin Metropolitan Region only when two separate state-level channels are willing and valid. Define shipping, intelligence, rescue, trade, and exit rules without creating a faction or free defence guarantee. Foreign leverage and Irish control remain separate; the current burden and political or command cost are shown in the confirmation text."
ireland_action_propose_a_regional_defence_league: "Propose a Regional Defence League"
ireland_action_propose_a_regional_defence_league_desc: "Put a real regional defence league before its members. Readiness must be 75 or higher, Provision must be 65 or higher, and Warning, Maritime Protection, Command, and Intelligence must each be at least 45. The charter must have produced valid members, command and sovereignty safeguards must be defined, a division must stand in Dublin, the Western Seaboard, or Cork, and a common threat must be present."
ireland_action_recognise_a_liberated_authority: "Recognise a Liberated Authority"
ireland_action_recognise_a_liberated_authority_desc: "Recognise a Liberated Authority only after war, collapse, a Northern local-authority mandate, or a wartime bargain has produced a concrete political opening. The action sends a bounded aid package, records Foreign Exposure and any live named-channel leverage, and opens legitimacy work; it does not create a puppet, territory, core, or free recognition."
ireland_action_offer_a_protectorate_treaty: "Offer a Protectorate Treaty"
ireland_action_offer_a_protectorate_treaty_desc: "Offer a Protectorate Treaty from a recognised liberated authority or a proven Northern war, conquest, or wartime-bargain authority. The proposal opens a foreign-reaction window and records obligations; it grants no automatic subject status, territory, cores, industry, equipment, units, or recognition."
ireland_action_convene_a_crown_association: "Convene a Crown Association"
ireland_action_convene_a_crown_association_desc: "Commit to Convene a Crown Association in Dublin Metropolitan Region. Offer ceremonial, arbitration, defence, or cultural association under public law and partner ratification rather than treating a crown as automatic recognition. The current burden and political or command cost are shown in the confirmation text."
ireland_action_renew_the_fivefold_compact: "Renew the Fivefold Compact"
ireland_action_renew_the_fivefold_compact_desc: "Commit to Renew the Fivefold Compact in Dublin Metropolitan Region. Review provincial powers, finance, vetoes, services, command, and the middle province's capacity before renewal; the compact does not bypass ordinary administration. The current burden and political or command cost are shown in the confirmation text."
ireland_action_fulfil_a_compact_obligation: "Fulfil a Compact Obligation"
ireland_action_fulfil_a_compact_obligation_desc: "Commit to Fulfil a Compact Obligation in Gaeltacht and Atlantic Islands. With the Compact Steward in office, a real division on the detail ground, and the cultural network intact, deliver the named site, season, stewardship, restraint, or public-law duty before an Otherworld promise becomes a breach. The current burden and political or command cost are shown in the confirmation text."
ireland_action_dissolve_a_failed_regional_order: "Dissolve a Failed Regional Order"
ireland_action_dissolve_a_failed_regional_order_desc: "Commit to Dissolve a Failed Regional Order in Dublin Metropolitan Region. Settle forces, property, debts, guarantees, subjects, and claims so a collapsed league or compact does not leave orphaned factions or obligations. The current burden and political or command cost are shown in the confirmation text."
ireland_action_integrate_a_voluntary_member_contribution: "Integrate a Voluntary Member Contribution"
ireland_action_integrate_a_voluntary_member_contribution_desc: "Open a ratified member-contribution schedule under agreed command. The selection records one paid payload: troops, ships, finance, intelligence, or infrastructure; the linked 180-day mission measures whether that chosen contribution reaches its full or partial operating standard."
ireland_mission_ratify_a_regional_charter: "Ratify a Regional Charter"
ireland_mission_ratify_a_regional_charter_desc: "Secure members, contributions, command, goals, exit, and dispute rules at all named member capitals within 240 days. Full success forms the regional organisation; partial success creates a consultative body; failure records insufficient membership or sponsor capture and clears invitations."
ireland_mission_meet_the_member_contribution_schedule: "Meet the Member Contribution Schedule"
ireland_mission_meet_the_member_contribution_schedule_desc: "Complete the named member's finance, units, shipping, intelligence, or infrastructure contribution within 180 days under the ratified charter, safeguards, and valid command. Full success raises cohesion and capability; partial success renegotiates a shortfall; failure records free-riding, refusal, or command dispute and expires the contribution."
ireland_mission_fulfil_the_compact_at_five_sites: "Fulfil the Compact at Five Sites"
ireland_mission_fulfil_the_compact_at_five_sites_desc: "Hold, service, and obey the five named sites while human administration remains intact within 300 days. Full success keeps the compact stable; partial success fulfils four sites and opens penance; failure records breach, site loss, or supernatural dominion and clears due obligations."
ireland_action_review_the_emergency_declaration: "Review the Emergency Declaration"
ireland_action_review_the_emergency_declaration_desc: "Commit to Review the Emergency Declaration in Dublin Metropolitan Region. Decide whether emergency authority continues, narrows, is replaced, or expires using cabinet, Dáil, court, security, and supply evidence. The current burden and political or command cost are shown in the confirmation text."
ireland_action_replace_emergency_supply_orders: "Replace Emergency Supply Orders"
ireland_action_replace_emergency_supply_orders_desc: "Commit to Replace Emergency Supply Orders in Dublin Metropolitan Region. Move rationing, price, import, transport, and service powers to temporary postwar law with dates, appeals, and expiry rather than preserving emergency authority by habit."
ireland_action_demobilise_and_settle_veterans: "Demobilise and Settle Veterans"
ireland_action_demobilise_and_settle_veterans_desc: "Commit to Demobilise and Settle Veterans in Dublin Metropolitan Region. Release forces while funding pay, housing, land, employment, training, equipment recovery, and a loyal reserve so veterans are not left as a separate armed constituency. The current burden and political or command cost are shown in the confirmation text."
ireland_action_renew_the_merchant_fleet: "Renew the Merchant Fleet"
ireland_action_renew_the_merchant_fleet_desc: "Commit to Renew the Merchant Fleet in Cork and Southwest. Decide debt, ownership, dockyard access, crews, commercial purpose, and routes; renewal creates an institution only through real capital and shipping work. The current burden and political or command cost are shown in the confirmation text."
ireland_action_launch_a_reconstruction_portfolio: "Launch a Reconstruction Portfolio"
ireland_action_launch_a_reconstruction_portfolio_desc: "Commit to Launch a Reconstruction Portfolio in Dublin to Galway Corridor. This commits repair equipment and transport before the national review records whether exceptional power can give way to ordinary institutions."
ireland_action_settle_the_republic_question: "Settle the Republic Question"
ireland_action_settle_the_republic_question_desc: "Commit to Settle the Republic Question in Dublin Metropolitan Region. Define constitutional form, external relations, Commonwealth status, neutrality, and the offices that must implement the answer. The current burden and political or command cost are shown in the confirmation text."
ireland_action_review_commonwealth_relations: "Review Commonwealth Relations"
ireland_action_review_commonwealth_relations_desc: "Commit to Review Commonwealth Relations in Dublin Metropolitan Region. Separate voluntary association, diplomatic habit, legal equality, defence access, and the right to withdraw before the relationship is renewed. The current burden and political or command cost are shown in the confirmation text."
ireland_action_apply_for_united_nations_membership: "Apply for United Nations Membership"
ireland_action_apply_for_united_nations_membership_desc: "Commit to Apply for United Nations Membership in Dublin Metropolitan Region. Submit the neutrality record and Charter obligations without treating membership as automatic recognition of territorial claims or a substitute for consent."
ireland_action_accept_or_refuse_reconstruction_aid: "Accept or Refuse Reconstruction Aid"
ireland_action_accept_or_refuse_reconstruction_aid_desc: "Commit to Accept or Refuse Reconstruction Aid in Dublin to Galway Corridor. Separate grant, loan, ownership, access, labour, and withdrawal terms before aid can alter the postwar settlement."
ireland_action_complete_the_route_conclusion_review: "Complete the Route Conclusion Review"
ireland_action_complete_the_route_conclusion_review_desc: "Resolve the 180-day Route Conclusion Review in Dublin Metropolitan Region. The review records a full, partial, blocked, or failed settlement and closes temporary objectives without granting free territory, cores, industry, equipment, units, fuel, shipping, offices, alignment, or recognition."
ireland_route_conclusion_full_tt: "Route conclusion: full settlement recorded. The three persistent route spirits and all durable obligations remain in force."
ireland_route_conclusion_partial_tt: "Route conclusion: partial settlement recorded. Damaged consent, recovery history, or partial work remains in the permanent record."
ireland_route_conclusion_failed_tt: "Route conclusion: failed settlement recorded. Recovery is required before a replacement constitutional order can be established."
ireland_route_conclusion_blocked_tt: "Route conclusion: blocked. The review records the unresolved surfaces below and opens the recovery record."
ireland_route_conclusion_blocked_government_tt: "Blocked surface — government: office, succession, or route leadership remains unresolved."
ireland_route_conclusion_blocked_law_tt: "Blocked surface — law: the institutional or material proof required for conclusion is incomplete."
ireland_route_conclusion_blocked_economy_tt: "Blocked surface — economy: National Provision conclusion proof is incomplete."
ireland_route_conclusion_blocked_defence_tt: "Blocked surface — defence: National Readiness conclusion proof is incomplete."
ireland_route_conclusion_blocked_foreign_tt: "Blocked surface — foreign and neutrality: posture, reaction, or incident review remains unresolved."
ireland_route_conclusion_blocked_northern_tt: "Blocked surface — Northern Ireland: policy or lawful deferment has not been recorded."
ireland_route_conclusion_blocked_identity_tt: "Blocked surface — identity: the route identity transition has not finished."
ireland_route_conclusion_blocked_objectives_tt: "Blocked surface — objectives: active missions still require named regional cleanup."
ireland_mission_end_wartime_rationing_safely: "End Wartime Rationing Safely"
ireland_mission_end_wartime_rationing_safely_desc: "Replace wartime controls in the nation and two vulnerable urban regions only after stocks, imports, prices, and transport meet their floors within 240 days. Full success narrows or ends ration law; partial success keeps some goods controlled; failure records inflation, shortage, black market, or political crisis."
ireland_mission_settle_the_demobilised_forces: "Settle the Demobilised Forces"
ireland_mission_settle_the_demobilised_forces_desc: "Complete pay, employment, housing, training, land, and equipment recovery in the nation and veteran concentration regions within 300 days. Full success stabilises the veteran settlement; partial success settles cadres while unemployment persists; failure records militant veterans, arms leakage, or government fall."
ireland_mission_bring_the_republic_settlement_into_force: "Bring the Republic Settlement into Force"
ireland_mission_bring_the_republic_settlement_into_force_desc: "Pass the Republic law through the Dáil, set its commencement, update external relations, offices, and identity through the President and legal channels within 150 days. Full success changes the legal identity on the valid date; partial success passes the law with delayed external settlement; failure records constitutional or coalition collapse."
ireland_mission_build_support_for_united_nations_admission: "Build Support for United Nations Admission"
ireland_mission_build_support_for_united_nations_admission_desc: "Secure recognition, answer objections, and define the contribution with eligible member states and Security Council actors within 300 days. Full success advances the application or admits Ireland when the world state permits; partial success leaves a supported pending application; failure records rejection or veto and retains the later campaign."
ireland_mission_complete_national_reconstruction: "Complete National Reconstruction"
ireland_mission_complete_national_reconstruction_desc: "Finish housing, transport, power, ports, schools, or hospitals in three named project regions under balanced finance within 365 days. Full success satisfies the route's material conclusion gate; partial success completes two regions and carries one programme forward; failure records debt, labour, import, or regional failure and retains unfinished works."
