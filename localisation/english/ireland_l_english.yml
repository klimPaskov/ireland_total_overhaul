# FOCUS_SECTION
ireland_state_still_defined: "State Still Defined"
ireland_state_still_defined_desc: "Begin with the question the opening cannot avoid: who may speak for Ireland, which offices remain lawful, and how consent can be audited. The National Settlement will keep formal seats, routine confidence, and public authority distinct."
ireland_institutional_survey: "Institutional Survey"
ireland_institutional_survey_desc: "Ask departments, courts, counties, and civic organisations what still works before the first crisis chooses for them. Their reports establish the opening map of consent, Provision, Readiness, and institutional reach."
ireland_national_settlement: "National Settlement"
ireland_national_settlement_desc: "Set the National Settlement at its opening bargain and expose the terms that can move it: Social Consent, stakeholder pressure, leverage, law, and the six-month review. A political victory cannot substitute for the material or constitutional work."
ireland_civil_war_memory: "Civil War Memory"
ireland_civil_war_memory_desc: "Put the Civil War record before the living institutions that inherited it. The route can distinguish prisoners, veterans, courts, and political memory without turning a buried grievance into a second chain of command."
ireland_republican_veterans: "Republican Veterans"
ireland_republican_veterans_desc: "Give republican veterans a lawful place in public life, with offices and service defined by the Dáil rather than by old commands. Recognition will cost political room if it is not matched by discipline and public trust."
ireland_public_order_review: "Public Order Review"
ireland_public_order_review_desc: "Review public order through courts, police, and the responsible minister before an incident becomes a permanent emergency. Every power must name its duration, appeal, and public cost."
ireland_economic_war_review: "Economic War Review"
ireland_economic_war_review_desc: "Measure the Economic War in cargoes, credit, rural prices, and industrial contracts rather than in speeches alone. The review sets the trade-offs that later development and neutrality decisions will inherit."
ireland_rural_price_board: "Rural Price Board"
ireland_rural_price_board_desc: "Give farmers and households a price board that can publish its rule, pay its suppliers, and survive a bad harvest. Rural consent rises only when the board can deliver without hiding the transport and treasury burden."
ireland_domestic_industry_review: "Domestic Industry Review"
ireland_domestic_industry_review_desc: "Audit the factories, power, labour, and imported inputs that make domestic industry possible. The review turns Lemass's later development promise into a measurable choice about capacity and dependence."
ireland_defence_estimates: "Defence Estimates"
ireland_defence_estimates_desc: "Place defence estimates before the Dáil with their equipment, training, fuel, shipping, and command demands visible. A larger force is not readiness if the state cannot maintain or direct it."
ireland_command_audit: "Command Audit"
ireland_command_audit_desc: "Audit command as a relationship between officers, formations, supply, communications, and civilian authority. National Readiness will reward a force that can obey a lawful plan, not a paper establishment."
ireland_port_and_coast_audit: "Port and Coast Audit"
ireland_port_and_coast_audit_desc: "Walk the ports and coast stations from Cobh to Lough Swilly: record naval bases, crews, repair, warning, rescue, and neutral shipping access. The Atlantic cannot be defended by a map label alone."
ireland_church_labour_consultation: "Church Labour Consultation"
ireland_church_labour_consultation_desc: "Bring Church service networks and organised labour into the same public conversation without merging their authority. The result tests whether welfare, wages, and conscience can support a parliamentary settlement."
ireland_minority_guarantees: "Minority Guarantees"
ireland_minority_guarantees_desc: "Write minority guarantees into the settlement before emergency law or a vocational experiment can narrow them. Schools, courts, worship, language, and local administration must have a remedy that is more than a promise."
ireland_language_service: "Language Service"
ireland_language_service_desc: "Build a language service that teaches, archives, and measures Irish use across schools and counties. Serious culture begins with institutions that can preserve a record without claiming that folklore itself grants political authority."
ireland_border_observation: "Border Observation"
ireland_border_observation_desc: "Observe the Border Belt through named crossings, local officials, patrol reports, and civilian complaints. The ledger must distinguish pressure, control, contact, and consent before any Northern policy is called a settlement."
ireland_northern_contacts: "Northern Contacts"
ireland_northern_contacts_desc: "Open Northern contacts through accountable local partners rather than a single nationalist or British channel. Health, trade, labour, policing, and religion will each carry their own consent and security consequences."
ireland_election_timetable: "Election Timetable"
ireland_election_timetable_desc: "Publish the election timetable early enough for parties, courts, and local returning officers to prepare. The plebiscite and general election remain separate tests, even when they share one constitutional season."
ireland_constitutional_draft: "Constitutional Draft"
ireland_constitutional_draft_desc: "Draft a constitution that can be read line by line: executive power, courts, rights, emergency limits, and the place of the Dáil. Its Article 1 promise is to develop Ireland's life, political, economic and cultural, in accordance with its own genius and traditions; its authority must still remain reviewable."
ireland_presidential_settlement: "Presidential Settlement"
ireland_presidential_settlement_desc: "Define the President's discretion, the Taoiseach's mandate, and the circumstances in which dissolution may be refused. A constitutional office becomes credible when it can say no without becoming a rival government."
ireland_seanad_panels: "Seanad Panels"
ireland_seanad_panels_desc: "Use the Seanad panels to represent vocational and cultural experience without allowing them to replace the elected chamber. Their advice can broaden the settlement only when the Dáil remains supreme in law."
ireland_plebiscite_campaign: "Plebiscite Campaign"
ireland_plebiscite_campaign_desc: "Take the constitutional question to the country with a campaign that records the arguments, the safeguards, and the cost of rejection. The plebiscite supplies a mandate; it does not erase parliamentary arithmetic."
ireland_general_election_campaign: "General Election Campaign"
ireland_general_election_campaign_desc: "Fight the general election on seats, programmes, and named coalition terms rather than on popularity alone. The next ministry must be able to survive a counted routine confidence vote."
ireland_plebiscite_mandate: "Plebiscite Mandate"
ireland_plebiscite_mandate_desc: "Translate a successful plebiscite into an enforceable constitutional mandate. Courts, offices, laws, and the Dáil must receive the same instruction before the victory can change the route."
ireland_election_mandate: "Election Mandate"
ireland_election_mandate_desc: "Turn the returned seats into a government programme with named partners and a confidence plan. A mandate is a beginning of administration, not a free grant of factories, units, or foreign recognition."
ireland_government_formation: "Government Formation"
ireland_government_formation_desc: "Form a cabinet that separates party leadership, parliamentary leadership, Taoiseach, President, and ministerial office. Every coalition bargain must be recorded so its later collapse has a lawful remedy."
ireland_replacement_charter: "Replacement Charter"
ireland_replacement_charter_desc: "Write the charter for the government that follows a failed ministry. It must explain succession, confidence, emergency authority, and the limits of caretaker power before the next crisis arrives."
ireland_1938_trade_settlement: "1938 Trade Settlement"
ireland_1938_trade_settlement_desc: "Close the 1938 trade settlement with the ports, debt, access, and sovereignty clauses visible. The Anglo-Irish bargain changes diplomatic room; it does not conjure shipping, fuel, or industry."
ireland_treaty_port_transfer: "Treaty Port Transfer"
ireland_treaty_port_transfer_desc: "Receive the Treaty Ports as a sovereignty test: Cobh, Berehaven, and Lough Swilly must be secured, maintained, and governed under Irish law. Neutrality becomes credible only when access can be refused and defended."
ireland_sovereignty_mandate: "Sovereignty Mandate"
ireland_sovereignty_mandate_desc: "State sovereignty as a set of duties: control of ports, airspace, trade, law, and diplomatic commitments. The mandate opens choices, but every choice still carries a material and foreign-policy bill."
ireland_emergency_opening: "Emergency Opening"
ireland_emergency_opening_desc: "Prepare emergency government as a dated, reviewable instrument rather than a blank cheque. The state may act faster in danger, but the Dáil, courts, and public ledger must retain a route back to ordinary law."
ireland_active_neutrality: "Active Neutrality"
ireland_active_neutrality_desc: "Make neutrality an active service of airspace, shipping, rescue, internment, intelligence, weather, trade, access, censorship, and public legitimacy. Ireland will have to spend capacity to keep the policy credible."
ireland_republican_government: "Republican Government"
ireland_republican_government_desc: "Build a republican government that can command the Dáil without pretending that party discipline is the same as public consent. De Valera's route begins with offices, counted votes, and a temporary emergency power."
ireland_party_of_government: "Party Of Government"
ireland_party_of_government_desc: "Turn Fianna Fáil from a movement of opposition into a party of government with a real programme, parliamentary leader, and cabinet burden. Its electoral strength will still be tested in routine confidence votes."
ireland_republican_legitimacy: "Republican Legitimacy"
ireland_republican_legitimacy_desc: "Make republican legitimacy answerable to the courts, the Dáil, and the institutions that citizens actually use. Victory in the constitutional argument is not permission to ignore dissent, services, or material limits."
ireland_neutrality_by_irish_decision: "Neutrality By Irish Decision"
ireland_neutrality_by_irish_decision_desc: "Declare neutrality as an Irish decision, then defend it through equal rules, warning, rescue, shipping, and the public record of every exception. De Valera's route accepts the cost of refusing both patrons."
ireland_de_valera_stewardship: "De Valera Stewardship"
ireland_de_valera_stewardship_desc: "Place De Valera's stewardship inside offices that can outlast the man: a cabinet, a Dáil majority, a President, and a reviewable emergency law. Personal authority is useful only while institutions remain visible."
ireland_secure_plebiscite_mandate: "Secure Plebiscite Mandate"
ireland_secure_plebiscite_mandate_desc: "Secure the plebiscite mandate with registers, campaign law, and a clear commencement path. The Constitution may pass by popular vote only if the ordinary institutions can carry its consequences."
ireland_govern_through_dail: "Govern Through Dáil"
ireland_govern_through_dail_desc: "Put daily government back through the Dáil: questions, supply, appointments, confidence, and review. The route's authority comes from a chamber that can withdraw support, not from a permanent acclamation."
ireland_constitutional_stewardship: "Constitutional Stewardship"
ireland_constitutional_stewardship_desc: "Steward the constitutional settlement through written limits, responsible offices, and a public chain from law to administration. De Valera's route can be patient, but it cannot let exceptional power become the only habit of government."
ireland_de_valera_reconciliation: "De Valera Reconciliation"
ireland_de_valera_reconciliation_desc: "Offer reconciliation from the centre without confusing amnesty with amnesia. Prisoners, veterans, courts, and families receive distinct treatment, and the Dáil records what the state is willing to repair."
ireland_distinguish_prisoners: "Distinguish Prisoners"
ireland_distinguish_prisoners_desc: "Separate political cases, criminal offences, and security risks instead of treating every prisoner as one category. A lawful distinction can lower the pressure on the state without excusing violence."
ireland_amnesty_under_law: "Amnesty Under Law"
ireland_amnesty_under_law_desc: "Write amnesty as a law with conditions, exclusions, appeals, and a record of compliance. Release can heal the republic only when victims, courts, and the security services know where the boundary lies."
ireland_reconciliation_mandate: "Reconciliation Mandate"
ireland_reconciliation_mandate_desc: "Turn the reconciliation programme into a mandate with a timetable for prisoners, veterans, local security, and ordinary law. The route advances only when repair and state capacity move together."
ireland_de_valera_reconciliation_capstone: "De Valera Reconciliation Capstone"
ireland_de_valera_reconciliation_capstone_desc: "Submit De Valera's reconciliation route to the final public test: authority, consent, law, offices, security, Provision, Readiness, and foreign obligations must all be settled before the capstone can stand."
ireland_emergency_direction: "Emergency Direction"
ireland_emergency_direction_desc: "Give emergency direction a named minister, a defined objective, and a review date. Speed may save the state in a crisis, but an order without an accountable chain becomes a new political authority."
ireland_statutory_emergency: "Statutory Emergency"
ireland_statutory_emergency_desc: "Place emergency powers in statute with sunset, appeal, and parliamentary review. The Emergency route gains reach by admitting what it has suspended and by preserving a route back to ordinary law."
ireland_emergency_review: "Emergency Review"
ireland_emergency_review_desc: "Make officials account for every exceptional order: its security result, its material burden, its public-law cost, and the date on which it must end. A review can narrow the emergency without pretending the danger was imaginary."
ireland_emergency_repeal: "Emergency Repeal"
ireland_emergency_repeal_desc: "Repeal emergency powers through the Dáil, the President, and the courts, then transfer their duties to ordinary departments. The recovery is real only if food, policing, defence, and public confidence survive the handover."
ireland_de_valera_emergency_capstone: "De Valera Emergency Capstone"
ireland_de_valera_emergency_capstone_desc: "Submit De Valera's emergency route to a final review of command, consent, law, offices, Provision, Readiness, neutrality, and recovery. Exceptional government concludes only when it can explain how it will end."
ireland_lemass_developmental: "Lemass Developmental"
ireland_lemass_developmental_desc: "Let Seán Lemass measure sovereignty in plants, power, skilled labour, export discipline, and the compromises that keep them running. Development is a route of capacity building, not a free industrial reward."
ireland_cabinet_compact: "Cabinet Compact"
ireland_cabinet_compact_desc: "Bind the cabinet to a compact that names delivery, finance, labour, and security obligations. The ministry gains coherence only when each portfolio can be questioned by its partners and the Dáil."
ireland_party_conference: "Party Conference"
ireland_party_conference_desc: "Take the development programme to the party conference and let county delegates set its limits. Lemass can build a disciplined machine, but local consent will decide whether the programme is durable."
ireland_dail_nomination: "Dáil Nomination"
ireland_dail_nomination_desc: "Nominate the Taoiseach through the Dáil and record the routine votes that make the appointment more than a party announcement. A cabinet may be efficient, but it must still be answerable to the chamber."
ireland_cabinet_of_production: "Cabinet Of Production"
ireland_cabinet_of_production_desc: "Create a Cabinet of Production that coordinates factories, transport, labour, energy, and rural supply without swallowing their separate authorities. Every new project must name its workers, inputs, and maintenance."
ireland_labour_industrial_discipline: "Labour Industrial Discipline"
ireland_labour_industrial_discipline_desc: "Set Lemass's industrial drive against a labour bargain: organised work, lawful bargaining, training, and output that does not become coercion. The factories will expose whether development and social consent can coexist."
ireland_rural_compensation: "Rural Compensation"
ireland_rural_compensation_desc: "Compensate the counties that pay for development through land, prices, transport, and labour. A modernising state that extracts from the countryside without returning service will create the rural opposition that undoes it."
ireland_lemass_developmental_capstone: "Lemass Developmental Capstone"
ireland_lemass_developmental_capstone_desc: "Submit Lemass's developmental government to the full test of factories, labour, rural consent, Provision, Readiness, neutrality, Northern policy, and foreign debt. The plant that cannot be supplied is not a victory."
ireland_constitutional_opposition: "Constitutional Opposition"
ireland_constitutional_opposition_desc: "Build Fine Gael's opposition around constitutional continuity, competent administration, and a refusal to make every disagreement an existential rupture. Cosgrave's inheritance becomes a programme only when it can win seats and govern."
ireland_close_oduffy_chapter: "Close O'Duffy Chapter"
ireland_close_oduffy_chapter_desc: "Close the O'Duffy chapter through law, party organisation, and a succession record that separates veterans from personal command. Fine Gael can defeat a rival movement without pretending that its social grievances never existed."
ireland_government_from_opposition: "Government From Opposition"
ireland_government_from_opposition_desc: "Move from opposition benches into government with a cabinet that can command the Dáil and keep the civil service working. The transfer tests whether Fine Gael can offer more than a veto on Fianna Fáil."
ireland_state_we_built: "State We Built"
ireland_state_we_built_desc: "Claim the state that constitutionalists built: courts, offices, local administration, and the memory of lawful transfer. This route values continuity, but must still pay for services, defence, and Northern policy."
ireland_cosgrave_institutional: "Cosgrave Institutional"
ireland_cosgrave_institutional_desc: "Make Cosgrave's institutional politics a living route rather than a museum of the Free State. Fine Gael strengthens the courts and civil service while accepting that public confidence, not nostalgia, decides its reach."
ireland_restore_parliamentary_confidence: "Restore Parliamentary Confidence"
ireland_restore_parliamentary_confidence_desc: "Restore parliamentary confidence by giving the opposition a credible programme, the cabinet a counted mandate, and the President a lawful choice. The repair ends a crisis through procedure rather than a personal settlement."
ireland_civil_service_and_courts: "Civil Service and Courts"
ireland_civil_service_and_courts_desc: "Protect the civil service and courts from party seizure while making both answerable to elected government. Institutional continuity is a resource that can be spent, but not replaced by a leader's promise."
ireland_security_under_law: "Security Under Law"
ireland_security_under_law_desc: "Put security under law with warrants, oversight, professional command, and a record of misconduct. Fine Gael's strength is the claim that public order can be firm without becoming a permanent exception."
ireland_cosgrave_capstone: "Cosgrave Capstone"
ireland_cosgrave_capstone_desc: "Submit the Fine Gael institutional route to its full public test: Dáil authority, courts, offices, security, Provision, Readiness, Northern safeguards, and foreign independence must all survive together."
ireland_mulcahy_succession: "Mulcahy Succession"
ireland_mulcahy_succession_desc: "Set Richard Mulcahy's succession inside a professional Army that can accept civilian direction and remember the Civil War without reliving it. The office, the party, and the command are separate ledgers."
ireland_professional_defence_council: "Professional Defence Council"
ireland_professional_defence_council_desc: "Seat the Army, civil government, finance, and local defence in a professional council with a written remit. It can coordinate readiness, but it cannot become a second cabinet or an armed veto."
ireland_army_serves_dail: "Army Serves Dáil"
ireland_army_serves_dail_desc: "Make the Army serve the Dáil through budgets, appointments, operational plans, and a chain of command that ends in civilian authority. Professionalism is measured by obedience to lawful orders as well as battlefield skill."
ireland_face_civil_war_record: "Face Civil War Record"
ireland_face_civil_war_record_desc: "Face the Civil War record inside the Army's own institutions. Veterans, prisoners, missing files, and remembered atrocities must be acknowledged without giving the command a licence to punish by history."
ireland_mulcahy_capstone: "Mulcahy Capstone"
ireland_mulcahy_capstone_desc: "Submit the Mulcahy defence settlement to review of command, equipment, warning, mobilisation, civilian oversight, public consent, and foreign pressure. A professional Army must leave room for a living republic."
ireland_costello_coalition: "Costello Coalition"
ireland_costello_coalition_desc: "Let John A. Costello's coalition answer the emergency state with written constitutionalism, a real parliamentary alternative, and ministers who accept collective responsibility. The coalition survives only by bargaining in public."
ireland_written_coalition_charter: "Written Coalition Charter"
ireland_written_coalition_charter_desc: "Write the coalition charter in clauses the Dáil can enforce: portfolios, supply, rights, emergency limits, and the treatment of dissenting partners. A coalition without terms is only a temporary arithmetic trick."
ireland_unwind_exceptional_state: "Unwind Exceptional State"
ireland_unwind_exceptional_state_desc: "Unwind the exceptional state by reviewing censorship, security, internment, and emergency offices one by one. Costello's coalition earns legitimacy by accepting that the end of an emergency is an administrative task."
ireland_costello_capstone: "Costello Capstone"
ireland_costello_capstone_desc: "Submit Costello's coalition constitutionalism to the full test of confidence, law, security, Provision, Readiness, neutrality, Northern policy, and foreign recognition. A written alternative must also be a working government."
ireland_dillon_public_dissent: "Dillon Public Dissent"
ireland_dillon_public_dissent_desc: "Give James Dillon's dissent a public platform and let it test the government's sovereignty rather than remain a private party quarrel. Criticism can harden the route, but it can also expose its contradictions."
ireland_dillon_intervention_caucus: "Dillon Intervention Caucus"
ireland_dillon_intervention_caucus_desc: "Organise Dillon's intervention caucus around the questions that quiet coalition politics avoids: security, foreign leverage, industry, and the national interest. The caucus must choose when dissent becomes a mandate."
ireland_dillon_war_assent: "Dillon War Assent"
ireland_dillon_war_assent_desc: "Ask Dillon to define war assent without confusing strategic urgency with surrender. Any cooperation must specify command, ports, supply, sovereignty, and the moment at which Ireland can refuse."
ireland_norton_parliamentary: "Norton Parliamentary"
ireland_norton_parliamentary_desc: "Build William Norton's Labour route through the Dáil, trade unions, education, and social law. Parliamentary Labour begins by making workers' interests legible inside government rather than by abolishing the chamber."
ireland_labour_as_conscience: "Labour As Conscience"
ireland_labour_as_conscience_desc: "Let Labour act as the conscience of the ministry: defend wages, housing, education, and minority access while keeping a government alive. Its leverage comes from organised work and counted votes."
ireland_support_without_surrender: "Support Without Surrender"
ireland_support_without_surrender_desc: "Support a ministry without surrendering Labour's programme, union freedom, or right to withdraw confidence. The bargain protects parliamentary leverage, but every concession must be delivered and paid for."
ireland_labour_social_law: "Labour Social Law"
ireland_labour_social_law_desc: "Turn Labour's social law into schools, services, bargaining rights, and an enforceable standard for employers. The route must show who administers each promise and what happens when the treasury cannot meet it."
ireland_norton_parliamentary_capstone: "Norton Parliamentary Capstone"
ireland_norton_parliamentary_capstone_desc: "Submit Norton's parliamentary Labour settlement to the full test of seats, unions, rural consent, services, Provision, Readiness, neutrality, and foreign independence. Social law becomes durable only when the state can administer it."
ireland_clann_founding: "Clann Founding"
ireland_clann_founding_desc: "Found Clann na Talmhan as a county producers' movement with a real electoral machine. It can challenge urban parties through land, prices, credit, and transport without dissolving the Dáil."
ireland_agrarian_support_bloc: "Agrarian Support Bloc"
ireland_agrarian_support_bloc_desc: "Assemble an agrarian support bloc from smallholders, cooperative organisers, and rural independents. Its strength will depend on delivery to named counties, not on a generic promise to farmers."
ireland_clann_by_election: "Clann By Election"
ireland_clann_by_election_desc: "Use a by-election to prove that Clann can turn county organisation into a Dáil seat. A win creates a parliamentary voice; it does not automatically create a cabinet or a rural mandate everywhere."
ireland_rural_producer_compact: "Rural Producer Compact"
ireland_rural_producer_compact_desc: "Set a rural producer compact for prices, seed, credit, transport, and representation. Clann's bargain succeeds when smallholders receive a service they can verify and the state records the cost."
ireland_vocational_constitution: "Vocational Constitution"
ireland_vocational_constitution_desc: "Test a vocational constitution as an advisory architecture for labour, agriculture, professions, and services. Its councils can inform government, but elected authority, courts, and minority rights remain superior."
ireland_dail_supremacy_clause: "Dáil Supremacy Clause"
ireland_dail_supremacy_clause_desc: "Write Dáil supremacy into the vocational experiment before the councils acquire a life of their own. The clause preserves elections, judicial review, free association, and the right to reject a captured panel."
ireland_council_government_rejected: "Council Government Rejected"
ireland_council_government_rejected_desc: "Reject council government when its panels claim the authority to replace elections, courts, or free associations. The failure still leaves useful producer institutions behind, but not a state above the Dáil."
ireland_vocational_constitution_capstone: "Vocational Constitution Capstone"
ireland_vocational_constitution_capstone_desc: "Submit the vocational constitution to a final review of Dáil supremacy, courts, labour freedom, minority safeguards, delivery, and institutional capture. The councils may advise the republic; they cannot quietly replace it."
ireland_cultural_survey: "Cultural Survey"
ireland_cultural_survey_desc: "Begin the cultural survey in the archive and in the counties, naming collectors, institutions, sites, and standards of proof. The Celtic Twilight is a historical title, not a mandate from the unseen."
ireland_language_institutions: "Language Institutions"
ireland_language_institutions_desc: "Give language institutions teachers, local sponsors, and a chain of custody for the material they preserve. Irish can become a public service without becoming a test of political loyalty."
ireland_archival_record: "Archival Record"
ireland_archival_record_desc: "Build an archival record that distinguishes testimony, copy, invention, and later interpretation. Its findings may inform later constitutional or cultural decisions, but no extraordinary path is presumed."
ireland_regional_participation: "Regional Participation"
ireland_regional_participation_desc: "Bring Connacht, Munster, Leinster, Ulster, and the border communities into cultural work as participants with their own rights. Dublin may coordinate the record, but it cannot own every voice."
ireland_site_stewardship: "Site Stewardship"
ireland_site_stewardship_desc: "Place historic sites under named custodians, local support, maintenance, and public review. A site can hold cultural significance without becoming a free claim on land, law, or sovereignty."
ireland_diaspora_exchange: "Diaspora Exchange"
ireland_diaspora_exchange_desc: "Use the diaspora as a source of records, funds, and criticism rather than as a foreign ministry. Exchange can strengthen language and culture, but it also exposes the state to outside claims and expectations."
ireland_serious_cultural_stewardship: "Serious Cultural Stewardship"
ireland_serious_cultural_stewardship_desc: "Make serious culture a durable public service: schools, archives, sites, scholars, regional delegates, and a ledger of provenance. It remains a meaningful institution even when disputed claims do not survive review."
ireland_cultural_service: "Cultural Service"
ireland_cultural_service_desc: "Staff the Cultural Service with people who can teach, collect, preserve, and challenge official conclusions. Its institutional value comes from keeping evidence legible when parties, churches, or ministries want a simpler story."
ireland_cultural_evidence_ledger: "Cultural Evidence Ledger"
ireland_cultural_evidence_ledger_desc: "Open the cultural evidence ledger to provenance, witness confidence, site custody, independent review, and public-knowledge boundaries. A route transition must be earned by the record rather than announced by a focus."
ireland_culture_completion: "Culture Completion"
ireland_culture_completion_desc: "Complete the serious cultural lane by funding its institutions, regional participation, archive standards, and historic-site obligations. Its reward is capacity and credibility, not a premature political conclusion."
ireland_provision_baseline: "Provision Baseline"
ireland_provision_baseline_desc: "Measure the opening National Provision in food, energy, transport, and maritime access before a shortage becomes a crisis. The ledger exposes bottlenecks that political rhetoric cannot remove."
ireland_food_ledger: "Food Ledger"
ireland_food_ledger_desc: "Turn the food ledger into named stocks, harvest routes, milling, storage, and fair purchasing. Food security depends on roads, labour, fuel, and consent as much as on acreage."
ireland_energy_board: "Energy Board"
ireland_energy_board_desc: "Give the Energy Board a real choice between homes, agriculture, rail, industry, and defence. Every allocation protects one service while exposing another, especially when coal and fuel are scarce."
ireland_transport_priority: "Transport Priority"
ireland_transport_priority_desc: "Set transport priorities for the corridors that carry food, fuel, workers, troops, and neutral cargo. A priority order is only as strong as the trains, trucks, bridges, and crews assigned to it."
ireland_maritime_reserve: "Maritime Reserve"
ireland_maritime_reserve_desc: "Build a maritime reserve from ships, crews, ports, repairs, and route discipline. Tonnage exists on paper until it can sail, return, and carry a cargo without turning neutrality into a fiction."
ireland_rebuild_marine_service: "Rebuild the Marine Service"
ireland_rebuild_marine_service_desc: "Turn maritime readiness into a permanent public service. Its workshops improve factory efficiency, while patrol authority protects neutral trade and feeds the national provision and warning ledgers."
ireland_requisition_trawler_hulls: "Requisition Trawler Hulls"
ireland_requisition_trawler_hulls_desc: "Register suitable fishing and harbour craft for conversion through Irish workshops. The contracts provide convoys and support equipment, strengthen transport provision, and raise civilian factory output."
ireland_coastal_patrol_flotilla: "Form the Coastal Patrol Flotilla"
ireland_coastal_patrol_flotilla_desc: "Concentrate patrol crews at Cork for observation, rescue, and convoy protection. Reliable coastal policing improves public confidence, early warning, and the security of every imported military or civilian cargo."
ireland_marine_service_reserve: "Raise the Marine Service Reserve"
ireland_marine_service_reserve_desc: "Join the patrol service to emergency mobilisation through a Cobh-based reserve. Joint logistics reduce Army supply consumption and improve national defence, command, equipment handling, and harbour security."
ireland_establish_naval_staff: "Establish a Naval Staff"
ireland_establish_naval_staff_desc: "Create a staff for signals, hydrography, repairs, convoy planning, and Coastwatch liaison. Its technical office accelerates national research and anchors Ireland's first independent intelligence agency."
ireland_harbour_defence_board: "Create the Harbour Defence Board"
ireland_harbour_defence_board_desc: "Join the Army, Marine Service, engineers, and harbour authorities around Cobh and Dublin. Shared works improve Army defence, repair speed, warning, and supply as well as hardening the ports themselves."
ireland_cobh_dockyard_programme: "Cobh Dockyard Programme"
ireland_cobh_dockyard_programme_desc: "Build a dockyard and civilian engineering works at Cobh. The programme improves both factory and dockyard output and connects maritime repair capacity to the national transport and provision systems."
ireland_lough_swilly_watch: "Watch Lough Swilly"
ireland_lough_swilly_watch_desc: "Bind armed neutrality to the warning chain at Lough Swilly. Radar, observers, and signals strengthen intelligence and air readiness while improving research and confidence in the state's neutral posture."
ireland_atlantic_convoy_office: "Open the Atlantic Convoy Office"
ireland_atlantic_convoy_office_desc: "Merge patrol reports and Lough Swilly intelligence into one merchant-routing office. Fifteen reserve convoys, lower national supply use, and stronger escort efficiency reward every strategy dependent on imported goods."
ireland_regional_maritime_defence_pact: "Sign a Regional Maritime Defence Pact"
ireland_regional_maritime_defence_pact_desc: "Join the maritime system to interoperability without surrendering Irish neutrality. The completed network improves factories, Army defence, repairs, all three service staffs, political authority, and national readiness."
ireland_integrated_maritime_service: "Integrated Maritime Service"
ireland_integrated_maritime_service_desc: "Ireland's ports, workshops, patrol craft, Coastwatch reports, reserve formations, and convoy offices now operate as one national system. Each maritime focus expands benefits shared by civilian industry and every armed service."
ireland_serious_focus_reward: "Administrative and Technical Programme"
ireland_domestic_manufacturing: "Domestic Manufacturing"
ireland_domestic_manufacturing_desc: "Expand domestic manufacturing where power, inputs, workers, transport, and orders can support it. Lemass's industrial state must choose which dependency to reduce and which cost to admit."
ireland_rural_credit: "Rural Credit"
ireland_rural_credit_desc: "Make rural credit answer to harvest risk, land improvement, cooperative discipline, and the treasury. Cheap money without storage, transport, or a fair market only postpones the rural crisis."
ireland_emergency_stockpiles: "Emergency Stockpiles"
ireland_emergency_stockpiles_desc: "Stock food, fuel, medical supplies, and essential equipment under a traceable authority. Emergency stores protect the public only when the state can rotate them, guard them, and admit what was spent."
ireland_development_authority: "Development Authority"
ireland_development_authority_desc: "Give the development authority a mandate to select plants and regions, then make it answer for factories, finance, labour, power, and markets. Its reach grows with delivery and collapses with patronage."
ireland_social_cooperatives: "Social Cooperatives"
ireland_social_cooperatives_desc: "Use social cooperatives to join housing, services, food, and local work without replacing unions or councils. Their public value is measured in reliable delivery, not in a new layer of slogans."
ireland_producer_accounting: "Producer Accounting"
ireland_producer_accounting_desc: "Count what each producer institution can actually deliver: grain, power, ships, labour, tools, and service. Producer politics becomes credible only when shortages and obligations appear in the same ledger."
ireland_provision_conclusion: "Provision Conclusion"
ireland_provision_conclusion_desc: "Bring National Provision to a conclusion review with every component, bottleneck, project, maintenance burden, and regional promise visible. A high average cannot hide a failed critical service."
ireland_readiness_baseline: "Readiness Baseline"
ireland_readiness_baseline_desc: "Measure the opening National Readiness in command, equipment, warning, mobilisation, mobility, supply, and maritime protection. The baseline shows where a real emergency would break first."
ireland_readiness_command: "Readiness Command"
ireland_readiness_command_desc: "Build a command system that can turn a lawful plan into movement, supply, and defence without inventing formations. Officers, depots, communications, and civilian oversight remain separate requirements."
ireland_territorial_reserve: "Territorial Reserve"
ireland_territorial_reserve_desc: "Organise territorial reserves around named districts, real cadres, local officers, depots, and equipment. A reserve protects the state only if its people can be called, supplied, and released lawfully."
ireland_coastwatch: "Coastwatch"
ireland_coastwatch_desc: "Staff the 83 historical lookout posts through six Coastwatch sectors. Each sector tracks post coverage, observer training, communications reliability, aircraft and vessel recognition, weather reporting, rescue access, and security exposure; reporting is a public service rather than a rumour network. Warning coverage has a maintenance cost and a human limit."
ireland_air_warning: "Air Warning"
ireland_air_warning_desc: "Build air warning from observers, reports, bases, fighters, and a response authority that knows when to intercept, escort, or document. A radar-like promise without crews and fuel is no warning system."
ireland_port_defence_project: "Port Defence Project"
ireland_port_defence_project_desc: "Turn Cobh, Berehaven, and Lough Swilly into defended platforms with guns, crews, magazines, repair, warning, and command. A port is a strategic objective only when it can be maintained under pressure."
ireland_maritime_protection: "Maritime Protection"
ireland_maritime_protection_desc: "Make maritime protection a service of patrol craft, fuel, rescue, repairs, inspections, and neutral route discipline. The coast must be watched without turning every incident into a declaration of war."
ireland_professional_army: "Professional Army"
ireland_professional_army_desc: "Professionalise the Army through training, equipment, staff work, and a command oath to the elected state. The route gains reliability by accepting that a professional force is not a political faction."
ireland_civilian_oversight: "Civilian Oversight"
ireland_civilian_oversight_desc: "Give civilian officials the information to challenge a plan, a requisition, or an officer without paralysing command. Oversight protects the republic when it can see the real burden of readiness."
ireland_interoperability: "Interoperability"
ireland_interoperability_desc: "Connect Army, Air Corps, Coastwatch, ports, rail, and intelligence through common procedures and communications. Interoperability is earned by exercises that expose shortages before a crisis does."
ireland_emergency_mobilisation: "Emergency Mobilisation"
ireland_emergency_mobilisation_desc: "Mobilise only the force tier that the state can supply and command, with a named plan, real formations, and a release condition. Emergency manpower is a burden and a political choice, not a free unit reward."
ireland_readiness_conclusion: "Readiness Conclusion"
ireland_readiness_conclusion_desc: "Bring readiness to a review of formations, equipment, command, warning, mobility, supply, maritime protection, and civilian control. The conclusion records what Ireland can defend and what it must still refuse."
ireland_strict_neutrality: "Strict Neutrality"
ireland_strict_neutrality_desc: "Practice strict neutrality through equal belligerent rules, controlled access, rescue, internment, and a public record of refusals. The policy protects sovereignty by accepting that every incident consumes capacity."
ireland_armed_neutrality: "Armed Neutrality"
ireland_armed_neutrality_desc: "Choose armed neutrality when warning, command, ports, and supply can back the declaration. Ireland will deter violations without promising that a thinly supplied force can control every approach."
ireland_treaty_port_diplomacy: "Treaty Port Diplomacy"
ireland_treaty_port_diplomacy_desc: "Use the returned Treaty Ports as diplomatic proof of sovereignty: maintain them, defend them, and state the access rules in advance. Their value lies in enforceable choice, not in a symbolic handover."
ireland_british_leverage_management: "British Leverage Management"
ireland_british_leverage_management_desc: "Manage British Leverage by separating supply, finance, defence, access, guarantees, and Northern terms. One bargain may relieve a shortage while quietly creating another obligation, so each clause must remain visible."
ireland_american_diaspora_mission: "American Diaspora Mission"
ireland_american_diaspora_mission_desc: "Send an American diaspora mission for relief, credit, machinery, and cultural exchange under Irish law. The route can use overseas sympathy without allowing a donor network to appoint the government."
ireland_vatican_small_state_mediation: "Vatican Small State Mediation"
ireland_vatican_small_state_mediation_desc: "Open Vatican and small-state mediation for prisoners, refugees, relief, and international isolation while keeping domestic Church domains separate. Humanitarian contact can ease pressure without becoming a clerical veto."
ireland_foreign_safeguards: "Foreign Safeguards"
ireland_foreign_safeguards_desc: "Write safeguards for command, customs, debt, access, ownership, withdrawal, and review before foreign aid becomes a habit. A channel is useful only while Ireland can still close it lawfully."
ireland_neutrality_posture: "Neutrality Posture"
ireland_neutrality_posture_desc: "Set the posture that links airspace, shipping, rescue, intelligence, weather, trade, censorship, and public legitimacy. Neutrality is a series of decisions, not a passive absence of war."
ireland_northern_settlement_ledger: "Northern Settlement Ledger"
ireland_northern_settlement_ledger_desc: "Record Ireland's legal claim to Northern Ireland and open the settlement ledger. The claim grants no control, occupation, settlement, integration, or core: Unionist Consent, Nationalist Consent, Labour Cooperation, British Flexibility, Security Stability, and Integration Capacity remain separate tests."
ireland_northern_local_authorities: "Northern Local Authorities"
ireland_northern_local_authorities_desc: "Give Northern local authorities real roles in health, schooling, policing, finance, and administration. Dublin, Belfast, Britain, and local communities must all be able to see what authority was actually transferred."
ireland_northern_trade_corridor: "Northern Trade Corridor"
ireland_northern_trade_corridor_desc: "Build a Northern trade corridor with named crossings, carriers, inspections, labour terms, and British notification. Commerce can create confidence, but it cannot silently become control, occupation, or a core."
ireland_northern_labour_social_bridge: "Northern Labour Social Bridge"
ireland_northern_labour_social_bridge_desc: "Use labour, housing, shipbuilding, linen, and welfare to bridge the Northern divide without asking workers to surrender their organisations. The social route succeeds only when both communities can name its benefit."
ireland_northern_federal_preparation: "Northern Federal Preparation"
ireland_northern_federal_preparation_desc: "Prepare a federal Northern settlement by defining powers, finance, policing, education, language, religion, defence, and review. Provincial and Northern mandates must be authored before the convention can ratify them."
ireland_northern_unitary_preparation: "Northern Unitary Preparation"
ireland_northern_unitary_preparation_desc: "Prepare a unitary settlement with local government, representation, courts, schools, policing, religion, language, finance, and enforceable guarantees. Majority rule without safeguards would only rename the conflict."
ireland_northern_wartime_bargain: "Northern Wartime Bargain"
ireland_northern_wartime_bargain_desc: "Carry a recorded H14 unity result into the Northern route. Only a postwar pledge, federal transition, or negotiated unitary transition can open this focus; defence cooperation, refusal, delay, rejection, and crisis collapse remain distinct outcomes. The focus sets a war-plan record, not Northern control, occupation, integration, or cores."
ireland_northern_recovery_bridge: "Northern Recovery Bridge"
ireland_northern_recovery_bridge_desc: "Create a recovery bridge for damaged services, returning families, local finance, and public security. The route keeps settlement and integration separate while building the capacity needed for either."
ireland_northern_regional_review: "Northern Regional Review"
ireland_northern_regional_review_desc: "Review each Northern region on its own rights, representation, services, policing, resistance, finance, guarantees, and demobilisation record. A national victory cannot wash away a failed district."
ireland_northern_policy_proof: "Northern Policy Proof"
ireland_northern_policy_proof_desc: "Prove the Northern policy with signed local mandates, a lawful authority, real service delivery, and a reviewable security plan. The ledger records evidence before it permits a transition to the next stage."
ireland_recovery_bridge: "Recovery Bridge"
ireland_recovery_bridge_desc: "Build the bridge from crisis to ordinary government through repaired services, restored Provision, accountable offices, and a public explanation of what failed. Recovery must leave a usable state behind."
ireland_restore_constitutional_calendar: "Restore Constitutional Calendar"
ireland_restore_constitutional_calendar_desc: "Restore the constitutional calendar with elections, office terms, court review, and the expiry of emergency instruments. The recovery closes an exceptional timetable without erasing the events that created it."
ireland_emergency_accounting: "Emergency Accounting"
ireland_emergency_accounting_desc: "Account for the emergency's stocks, debts, arrests, offices, contracts, and damage before ordinary government resumes. The record protects the public from both denial and a permanent state of exception."
ireland_demobilisation_charter: "Demobilisation Charter"
ireland_demobilisation_charter_desc: "Write a demobilisation charter that preserves cadres, pays veterans, recovers equipment, and sets a lawful place for officers after danger falls. Readiness release is not the deletion of the people who carried it."
ireland_reconstruction_mandate: "Reconstruction Mandate"
ireland_reconstruction_mandate_desc: "Give reconstruction a mandate that names regions, finance, labour, imports, factories, and the order of works. Housing, power, roads, ports, schools, and hospitals must compete in a visible programme."
ireland_foreign_postwar_review: "Foreign Postwar Review"
ireland_foreign_postwar_review_desc: "Review every foreign channel after the war: aid, debt, guarantees, recognition, access, leverage, and exposure. Postwar independence is maintained by closing obligations deliberately, not by pretending they never existed."
ireland_material_conclusion_proof: "Material Conclusion Proof"
ireland_material_conclusion_proof_desc: "Prove the route's material conclusion with delivered projects, funded offices, maintained services, labour absorption, and a debt record. No constitutional or political conclusion can waive the bill for rebuilding the state."
ireland_ira_republican_bridge: "IRA Republican Bridge"
ireland_ira_republican_bridge_desc: "Open the IRA republican bridge only when the crisis has created a real organisation, a civil contact, and a reason to cross from underground legitimacy into public authority. The Army Council must still answer the question of civilian rule."
ireland_reassemble_ghq: "Reassemble Ghq"
ireland_reassemble_ghq_desc: "Reassemble GHQ from surviving commands, records, prisoners, arms, and local trust after suppression. Rebuilding the network creates capacity and exposure at once; it does not create a free army."
ireland_convention_of_commands: "Convention Of Commands"
ireland_convention_of_commands_desc: "Call the commands into convention and make GHQ, local units, civil organisers, and political representatives state who may issue orders. The convention can produce discipline or expose a second government waiting inside the first."
ireland_republic_in_districts: "Republic In Districts"
ireland_republic_in_districts_desc: "Test republican authority in the districts through courts, services, local consent, and a command record. A republic proclaimed by armed presence is not yet a state, and every district can refuse the claim."
ireland_arms_before_authority: "Arms Before Authority"
ireland_arms_before_authority_desc: "Let the arms lead and accept the consequence: rapid command, weak civilian oversight, greater exposure, and a route where the Army Council can become the real government. This is a choice, not a neutral shortcut."
ireland_authority_before_arms: "Authority Before Arms"
ireland_authority_before_arms_desc: "Put civil authority before arms through a public mandate, named offices, and a command oath. The republican bridge remains difficult because the network must surrender the power to decide by itself."
ireland_german_channel: "German Channel"
ireland_german_channel_desc: "Open a German channel only as a dangerous, recorded bargain over arms, intelligence, recognition, and independence. Any promise must survive proof of delivery and the refusal of client status."
ireland_northern_question_in_arms: "Northern Question In Arms"
ireland_northern_question_in_arms_desc: "Bring the Northern question into the Army Council's debate without letting a military plan erase consent, labour, local government, or British reaction. Armed legitimacy carries a Northern ledger it cannot command by decree."
ireland_ira_civil_authority: "IRA Civil Authority"
ireland_ira_civil_authority_desc: "Create a civil authority beside the IRA's commands with responsibility for courts, money, services, and public explanation. The route only becomes republican when civilians can veto an armed convenience."
ireland_ira_army_council: "IRA Army Council"
ireland_ira_army_council_desc: "Make the IRA Army Council a recorded institution with succession, discipline, finance, and a defined relation to civil government. Its cohesion is useful only when it can be reviewed and replaced."
ireland_ira_route_capstone: "IRA Route Capstone"
ireland_ira_route_capstone_desc: "Submit the IRA route to a final test of civil authority, command, local consent, material provision, Northern policy, foreign exposure, and public law. A revolutionary victory that cannot demobilise is an unresolved crisis."
ireland_congress_reform_bridge: "Congress Reform Bridge"
ireland_congress_reform_bridge_desc: "Build the Congress reform bridge from trade unionists, smallholders, women organisers, and republican militants. Its plural promise depends on a constitution that can survive disagreement without inventing a vanguard."
ireland_organise_congress: "Organise Congress"
ireland_organise_congress_desc: "Organise the Republican Congress across workplaces, farms, districts, and local committees. A movement that claims to speak for the people must show how delegates are chosen, funded, and removed."
ireland_union_local_mandate: "Union Local Mandate"
ireland_union_local_mandate_desc: "Give union locals a mandate they can carry into the Congress without turning every shop floor into a command post. Organised workers gain authority through participation, not through a secret substitute for elections."
ireland_congress_plural_republic: "Congress Plural Republic"
ireland_congress_plural_republic_desc: "Choose a plural republic in which the Congress can organise social power while the Dáil, courts, minorities, and local bodies retain independent authority. The route refuses both party monopoly and military government."
ireland_congress_vanguard_cell: "Congress Vanguard Cell"
ireland_congress_vanguard_cell_desc: "Build a vanguard cell and accept that discipline will narrow the Congress's coalition. The cell can coordinate a transition, but it will face the cost of secrecy, purges, and the loss of plural consent."
ireland_extra_parliamentary_transition: "Extra Parliamentary Transition"
ireland_extra_parliamentary_transition_desc: "Move beyond parliamentary government only through a visible Congress mandate, organised labour, local participation, and a defined relation to the Army. The route may be revolutionary, but it cannot be shapeless."
ireland_congress_plural_capstone: "Congress Plural Capstone"
ireland_congress_plural_capstone_desc: "Submit the plural Congress republic to review of workers' rights, smallholder consent, women organisers, Dáil relations, civil authority, Provision, Readiness, and Northern policy. Pluralism must have institutions, not just enemies."
ireland_congress_vanguard_capstone: "Congress Vanguard Capstone"
ireland_congress_vanguard_capstone_desc: "Submit the vanguard Congress route to a final accounting of its cells, coercion, labour, command, foreign exposure, material capacity, and recovery path. A disciplined transition is still judged by what it permits after victory."
ireland_oduffy_network_revival: "O'Duffy Network Revival"
ireland_oduffy_network_revival_desc: "Revive O'Duffy's network through veterans, employers, donors, and public organisers while recording who owns its offices and funds. The revival can become a personal movement or an institution that outlives him."
ireland_oduffy_personal_command: "O'Duffy Personal Command"
ireland_oduffy_personal_command_desc: "Place O'Duffy's personal command at the centre and make the consequences explicit: speed, charisma, veteran loyalty, foreign temptation, and succession danger. Personal authority cannot be disguised as corporate law."
ireland_veteran_employer_league: "Veteran Employer League"
ireland_veteran_employer_league_desc: "Join veterans and employers in a league that must bargain over wages, uniforms, funds, and public order. Its corporate promise is credible only when workers, officers, and the Army can reject its demands."
ireland_corporate_estates: "Corporate Estates"
ireland_corporate_estates_desc: "Give estates a constitutional place without allowing property, Church influence, or veteran force to swallow elected government. The producer state must account for who speaks, who pays, and who is excluded."
ireland_army_acceptance: "Army Acceptance"
ireland_army_acceptance_desc: "Ask the Army whether it will recognise the movement's offices, funding, and orders. Acceptance is not a free military guarantee: it creates a test of civil authority, professional loyalty, and future succession."
ireland_corporate_order: "Corporate Order"
ireland_corporate_order_desc: "Translate O'Duffy's movement into a corporate order of estates, labour, services, and offices. The route trades parliamentary flexibility for coordination and must record the institutional cost of that bargain."
ireland_oduffy_personal_capstone: "O'Duffy Personal Capstone"
ireland_oduffy_personal_capstone_desc: "Make O'Duffy's personal command answer to the veteran league, named offices, and a succession record. The conclusion rests on the founder's authority rather than an impersonal corporate directorate."
ireland_oduffy_corporate_capstone: "O'Duffy Corporate Capstone"
ireland_oduffy_corporate_capstone_desc: "Make the corporate order answer to estates, Army acceptance, and institutional succession. O'Duffy may found the movement, but the conclusion must be able to outlive his office."
ireland_clerical_failure_bridge: "Clerical Failure Bridge"
ireland_clerical_failure_bridge_desc: "Open the service-state recovery path after institutional failure. Parish services and producer councils promise order, but the state must name who guards public life and who remains accountable."
ireland_service_state: "Service State"
ireland_service_state_desc: "Place parish schools, hospitals, and relief under a dated service authority with labour, minority, and public review. Continuity is a duty, not a clerical blank cheque."
ireland_producer_councils: "Producer Councils"
ireland_producer_councils_desc: "Convene industrial, agrarian, service, and professional delegates around producer councils. Their authority must be measured in delivery, bargaining, and recorded attendance."
ireland_clerical_guardianship: "Clerical Guardianship"
ireland_clerical_guardianship_desc: "Give clerical guardianship a lawful boundary and the means to hold it. Evidence, testimony, and public consequence decide whether this concealed compact is contained or entrusted."
ireland_producer_constitution: "Producer Constitution"
ireland_producer_constitution_desc: "Bind the councils to a producer constitution with Dáil supremacy, judicial review, minority safeguards, and a material account of what each estate can provide."
ireland_clerical_route_capstone: "Clerical Route Capstone"
ireland_clerical_route_capstone_desc: "Test whether guardianship and producer constitutionalism can survive the full provision, readiness, Northern, foreign, and public-law review. A service order concludes only when its obligations are funded."
ireland_ailtiri_cell_network: "Ailtirí Cell Network"
ireland_ailtiri_cell_network_desc: "Build Ailtirí na hAiséirghe through language circles, youth organisers, and county registers. The network's first test is whether clandestine discipline can be made visible before it becomes a state within the state."
ireland_language_cells: "Language Cells"
ireland_language_cells_desc: "Give Irish-language cells a disciplined curriculum, local treasurers, and a record of who is being recruited. Cultural work can widen participation, but the same network can also narrow the space for dissent."
ireland_june_1942_public_launch: "June 1942 Public Launch"
ireland_june_1942_public_launch_desc: "After the June 1942 public launch, turn the concealed language cells into an open political organisation. The wartime date, public phase, and capture record must all be visible before the state can proceed."
ireland_ceannaire_state: "Ceannaire State"
ireland_ceannaire_state_desc: "Put a ceannaire at the centre of a Gaelic executive and make every ministry answer to that office. The route gains speed by concentrating authority, while the public-law ledger records what has been surrendered."
ireland_corporate_gaelic_nation: "Corporate Gaelic Nation"
ireland_corporate_gaelic_nation_desc: "Bind producers, language authorities, and youth organisations into a Corporate Gaelic Nation. Its promise is coordinated work and cultural renewal; its danger is that the chambers become instruments of command."
ireland_ailtiri_total_state_capstone: "Ailtirí Total State Capstone"
ireland_ailtiri_total_state_capstone_desc: "Submit the Ailtirí total state to the final public-law review. The dated organisation, the producer order, the language programme, and the coercive record must all be accounted for before the state can call itself complete."
ireland_high_king_evidence_gate: "High King Evidence Gate"
ireland_high_king_evidence_gate_desc: "Open the High King evidence gate only after provenance, witness testimony, and the constitutional chain of custody have been recorded. A crown begins as a question for the archive, not as a licence to rule."
ireland_high_king_convention: "High King Convention"
ireland_high_king_convention_desc: "Call a convention of the Dáil, counties, churches, and civic authorities to decide whether a crown can be made answerable to Irish law. The convention itself becomes part of the claim."
ireland_elective_crown: "Elective Crown"
ireland_elective_crown_desc: "Make the crown elective and term-bound, with the assembly and provincial delegates retaining the power to refuse a claimant. The route trades hereditary certainty for a continuing political test."
ireland_guardian_crown: "Guardian Crown"
ireland_guardian_crown_desc: "Set a guardian crown over a restricted office whose duty is to preserve the settlement rather than direct daily government. Its limits must survive an emergency, a succession, and a hostile Dáil."
ireland_crown_powers_charter: "Crown Powers Charter"
ireland_crown_powers_charter_desc: "Write the Crown Powers Charter line by line: appointment, veto, emergency authority, and removal. A power that cannot be audited by the legislature cannot be granted by this route."
ireland_high_king_capstone: "High King Capstone"
ireland_high_king_capstone_desc: "Present the High King settlement for its final consent review. The crown, its charter, its evidence, and the Northern obligations must fit inside one constitutional order before the route can conclude."
ireland_five_province_mandates: "Five Provinces Mandates"
ireland_five_province_mandates_desc: "Ask the five provincial traditions to issue written mandates: Leinster, Munster, Connacht, Ulster, and the border communities that cannot be reduced to a map colour. Their terms become the federal convention's working papers."
ireland_federal_convention: "Federal Convention"
ireland_federal_convention_desc: "Seat provincial delegates beside the Dáil and make finance, policing, language, and minority rights negotiable in public. A federal constitution must explain who pays, who decides, and who can appeal."
ireland_federal_republic: "Federal Republic"
ireland_federal_republic_desc: "Turn the provincial bargain into a Federal Republic with defined competences and a common treasury. The centre keeps the settlement together by rule, not by making every county wait on Dublin."
ireland_ulster_rule: "Ulster Rule"
ireland_ulster_rule_desc: "Give Ulster a rulebook that protects representation, local administration, and the rights of communities that fear absorption. The federal route is tested here, where a promise must survive distrust on both sides of the border."
ireland_pentarchy_guardians: "Pentarchy Guardians"
ireland_pentarchy_guardians_desc: "Give pentarchy guardians a lawful boundary and the means to hold it. Evidence, testimony, and public consequence decide whether this concealed compact is contained or entrusted."
ireland_five_provinces_capstone: "Five Provinces Capstone"
ireland_five_provinces_capstone_desc: "Submit the Five Provinces compact to a full public test. The treasury, provincial mandates, Ulster safeguards, and Northern review must all remain legible when the federation claims to speak for Ireland."
ireland_otherworld_investigation: "Otherworld Investigation"
ireland_otherworld_investigation_desc: "Begin the Otherworld investigation with named places, witnesses, and dates. The state records what can be corroborated and keeps the extraordinary claim separate from the ordinary needs of the people who report it."
ireland_otherworld_witnesses: "Otherworld Witnesses"
ireland_otherworld_witnesses_desc: "Take witness statements from the western seaboard and compare them across counties. Contradictions are not erased; they determine whether the investigation becomes folklore, intelligence, or a dangerous public panic."
ireland_otherworld_evidence_ledger: "Otherworld Evidence Ledger"
ireland_otherworld_evidence_ledger_desc: "Catalogue the Otherworld evidence ledger by source confidence, location, and consequence. A testimony with no chain of custody cannot justify a policy, while a pattern that survives scrutiny cannot simply be dismissed."
ireland_compact_with_otherworld: "Compact With Otherworld"
ireland_compact_with_otherworld_desc: "Draft a compact with the Otherworld that names obligations, boundaries, and the human officials who must answer for contact. The bargain is meaningful only if the public can withdraw from it."
ireland_containment_protocol: "Containment Protocol"
ireland_containment_protocol_desc: "Build a containment protocol for sites, rumours, and officials who have seen too much. It protects the public by limiting access and protects the evidence by preventing a frightened ministry from destroying it."
ireland_dominion_claim: "Dominion Claim"
ireland_dominion_claim_desc: "Let the Otherworld claim become a question of dominion only after the evidence ledger and regional consent can bear it. A supernatural title without enforceable limits is another name for panic."
ireland_otherworld_guardians: "Otherworld Guardians"
ireland_otherworld_guardians_desc: "Appoint guardians who can protect witnesses, audit contact, and refuse an unsafe bargain. Their mandate binds the concealed route to public consequence instead of granting an unexamined priesthood."
ireland_regional_thresholds: "Regional Thresholds"
ireland_regional_thresholds_desc: "Set the regional thresholds that decide whether the hidden route is a cultural record, a political transition, or an impossible claim. Each region must contribute consent, capacity, and evidence before the next door opens."
ireland_otherworld_statecraft: "Otherworld Statecraft"
ireland_otherworld_statecraft_desc: "Turn the hidden record into statecraft: weather, food, borders, and public confidence must still be governed by measurable institutions. The extraordinary route survives only when ordinary services do not collapse."
ireland_otherworld_capstone: "Otherworld Capstone"
ireland_otherworld_capstone_desc: "Bring the Otherworld route to its final review. Evidence, witnesses, containment, and the public ledger must support one conclusion without exposing sealed material before the route has earned the right to speak."
ireland_crown_province_convergence: "Crown Province Convergence"
ireland_crown_province_convergence_desc: "Reconcile the Crown's limited authority with the Five Provinces' mandates and the Northern ledger. Convergence starts by naming which institution may decide when two lawful routes disagree."
ireland_fivefold_obligation: "Fivefold Obligation"
ireland_fivefold_obligation_desc: "Record the Fivefold Obligation as a schedule of provincial, constitutional, Northern, material, and public-law duties. No conclusion is valid while one route can quietly externalise its cost onto another."
ireland_otherworld_convergence: "Otherworld Convergence"
ireland_otherworld_convergence_desc: "Bring the sealed Otherworld record into convergence without allowing it to overrule consent, service, or law. The route must decide what can be published, what must remain protected, and who reviews the distinction."
ireland_convergence_order_capstone: "Convergence Order Capstone"
ireland_convergence_order_capstone_desc: "Submit the Convergence Order to the final settlement review. Crown, province, Otherworld, Northern, economic, and neutrality obligations must meet in one accountable conclusion with no free territory, power, or recognition."
# DECISION_SECTION
ireland_settlement_government: "The National Settlement"
ireland_settlement_government_desc: "Manage cabinet confidence, constitutional procedure, and the balance between public authority and competing claims."
ireland_elections: "Elections and Mandates"
ireland_elections_desc: "Open, protect, and conclude elections, plebiscites, and government formation through counted procedures."
ireland_organised_society: "Organised Society"
ireland_organised_society_desc: "Negotiate with labour, farmers, churches, educators, and local organisations as social consent changes."
ireland_cultural_archival: "Cultural and Archival Work"
ireland_cultural_archival_desc: "Build a tested cultural record while keeping sealed evidence and public knowledge separate."
ireland_radical_underground: "Radical and Underground Politics"
ireland_radical_underground_desc: "Handle armed, republican, corporate, and clandestine networks without mistaking pressure for lawful authority."
ireland_provision: "National Provision"
ireland_provision_desc: "Keep food, energy, transport, and maritime access above the thresholds required by the national programme."
ireland_readiness: "National Readiness"
ireland_readiness_desc: "Build command, equipment, mobilisation, warning, supply, and maritime protection under civilian oversight."
ireland_marine_service: "Marine Service"
ireland_marine_service_desc: "Commission patrol craft, train the Cobh reserve, repair the dockyard, and protect an Atlantic route when Ireland's maritime institutions are ready."
ireland_neutrality_incidents: "Neutrality Incidents"
ireland_neutrality_incidents_desc: "Resolve airspace, shipping, internment, intelligence, weather, trade, access, censorship, and border incidents."
ireland_foreign: "Foreign Channels"
ireland_foreign_desc: "Answer foreign offers and pressure while preserving Irish control of agreements, channels, and records."
ireland_northern: "Northern Settlement"
ireland_northern_desc: "Advance Northern contacts, rights, industry, security, and settlement models through the live regional ledger."
ireland_occupation_integration: "Occupation and Integration"
ireland_occupation_integration_desc: "Administer any Northern occupation or transition with rights, services, policing, and a defined review."
ireland_regional_external: "Regional and External Projects"
ireland_regional_external_desc: "Pursue Celtic, Atlantic, federal, and concealed regional projects when their gates are open."
ireland_postwar: "Postwar Statecraft"
ireland_postwar_desc: "Close or renew exceptional arrangements, restore ordinary procedure, and complete the route review."
ireland_commission_patrol_craft: "Commission Patrol Craft"
ireland_commission_patrol_craft_desc: "Commit a small batch of converted craft to the Marine Service. The action consumes convoys and support equipment, then raises the maritime Provision and Readiness ledgers."
ireland_train_marine_service_reserve: "Train the Marine Service Reserve"
ireland_train_marine_service_reserve_desc: "Spend rifles, support equipment, manpower, and command time to field the Cobh Marine Service Company. It is a real reserve formation, not a paper bonus."
ireland_repair_cobh_dockyard: "Repair Cobh Dockyard"
ireland_repair_cobh_dockyard_desc: "Commit support equipment to another Cobh dockyard project. The repair adds shared works capacity and improves the maritime ledgers once completed."
ireland_protect_atlantic_route: "Protect an Atlantic Route"
ireland_protect_atlantic_route_desc: "During war, bind convoys and fuel to a 120-day Atlantic protection detail. The route improves maritime readiness and expires when the detail is released."
ireland_commission_patrol_craft_requirements_tt: "Control Cork and hold 5 Convoys, 25 Support Equipment, 15 Political Power, and 5 Command Power."
ireland_train_marine_service_reserve_requirements_tt: "Control Cork and hold 1,000 Manpower, 500 Infantry Equipment, 50 Support Equipment, 10 Political Power, and 10 Command Power."
ireland_repair_cobh_dockyard_requirements_tt: "Control Cork and hold 25 Support Equipment and 12 Political Power."
ireland_protect_atlantic_route_requirements_tt: "Be at war, then commit 10 Convoys, 100 Fuel, 18 Political Power, and 15 Command Power."
ireland_commission_patrol_craft_effect_tt: "The Marine Service receives a commissioned patrol allocation; maritime Provision and Maritime Protection Readiness rise."
ireland_train_marine_service_reserve_effect_tt: "The Cobh Marine Service Company is raised in Munster and assigned its historical route-specific name pool."
ireland_repair_cobh_dockyard_effect_tt: "Cobh gains one immediate dockyard and one shared works slot; maritime access and protection improve."
ireland_protect_atlantic_route_effect_tt: "A 120-day Atlantic route protection detail consumes the committed convoy and fuel reserve and raises maritime readiness."
